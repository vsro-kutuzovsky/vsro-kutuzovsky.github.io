и и слова\n\n1. Каждому гарантируются свобода мысли и слова.\n\n2. Осуществление свободы слова не освобождает от ответственности за угрозы, клевету, разглашение охраняемой законом тайны, воспрепятствование правосудию и иные противоправные деяния."],[0,"Конституция ст. 27","Конституция РО · Глава II. Права, свободы и обязанности человека и гражданина","Статья 27. Свобода собраний и обращений\n\n1. Граждане вправе мирно собираться, проводить публичные мероприятия и направлять индивидуальные или коллективные обращения в государственные органы в порядке, установленном законом."],[0,"Конституция ст. 28","Конституция РО · Глава II. Права, свободы и обязанности человека и гражданина","Статья 28. Право собственности\n\n1. Право частной собственности охраняется законом.\n\n2. Изъятие имущества допускается только на законном основании. Незаконное или беспричинное изъятие имущества государственным служащим запрещается."],[0,"Конституция ст. 29","Конституция РО · Глава II. Права, свободы и обязанности человека и гражданина","Статья 29. Право на медицинскую помощь\n\n1. Каждый имеет право на получение медицинской помощи в порядке, установленном федеральным законодательством.\n\n2. Экстренная медицинская помощь не может быть произвольно ограничена."],[0,"Конституция ст. 30","Конституция РО · Глава II. Права, свободы и обязанности человека и гражданина","Статья 30. Труд и государственная служба\n\n1. Труд свободен. Каждый вправе выбирать род деятельности в пределах закона.\n\n2. Граждане имеют право на равный доступ к государственной службе при соблюдении установленных требований.\n\n3. Порядок назначения, повышения, перевода, понижения и увольнения государственных служащих определяется федеральным законодательством и утвержденными в соответствии с ним кадровыми регламентами."],[0,"Конституция ст. 31","Конституция РО · Глава II. Права, свободы и обязанности человека и гражданина","Статья 31. Оружие и специальные средства\n\n1. Право приобретения, хранения, ношения и использования оружия осуществляется в порядке, установленном федеральным законодательством.\n\n2. Лицензия или иное разрешение может быть ограничено, приостановлено или отозвано только на законном основании."],[0,"Конституция ст. 32","Конституция РО · Глава II. Права, свободы и обязанности человека и гражданина","Статья 32. Судебная защита\n\n1. Каждому гарантируется судебная защита его прав и свобод.\n\n2. Решения, действия и бездействие государственных органов и должностных лиц могут быть обжалованы в суд, прокуратуру либо иной уполномоченный орган в порядке, установленном законом."],[0,"Конституция ст. 33","Конституция РО · Глава II. Права, свободы и обязанности человека и гражданина","Статья 33. Ограничение прав и обязанности граждан\n\n1. Права и свободы могут быть ограничены федеральным законом только в объёме, необходимом для защиты прав других лиц, общественного порядка, государственной безопасности, обороны и осуществления правосудия.\n\n2. Каждый обязан соблюдать законные требования государственных служащих, предъявленные в пределах их компетенции.\n\n3. Каждый обязан соблюдать Конституцию и федеральное законодательство."],[0,"Конституция ст. 34","Конституция РО · Глава III. Премьер-министр РО","Статья 34. Статус Премьер-министра РО\n\n1. Премьер-министр РО является главой государства, высшим должностным лицом РО и гарантом Конституции, прав и свобод человека и гражданина.\n\n2. Премьер-министр обеспечивает согласованное функционирование государственных органов и определяет основные направления государственной политики."],[0,"Конституция ст. 35","Конституция РО · Глава III. Премьер-министр РО","Статья 35. Полномочия Премьер-министра\n\n1. Премьер-министр осуществляет общее руководство исполнительной властью в пределах, установленных Конституцией и федеральными законами.\n\n2. Премьер-министр формирует Правительство, назначает и освобождает от должности членов Правительства и руководителей государственных органов в случаях, предусмотренных законом.\n\n3. Премьер-министр вправе давать обязательные распоряжения подчиненным ему органам, если такие распоряжения не означают незаконного вмешательства в конкретное уголовное дело, судебное разбирательство или оперативно-розыскное мероприятие.\n\n4. Премьер-министр осуществляет иные полномочия, предусмотренные Конституцией и федеральным законодательством."],[0,"Конституция ст. 35.1","Конституция РО · Глава III. Премьер-министр РО","Статья 35.1 Вице Премьер-министр\nВице премьер министр обладает всеми правами, обязанностями и полномочиями Премьер-министра как во время его присутствия, так и во время его отсутствия."],[0,"Конституция ст. 36","Конституция РО · Глава III. Премьер-министр РО","Статья 36. Акты Премьер-министра\n\n1. Премьер-министр издаёт указы и распоряжения.\n\n2. Акты Премьер-министра обязательны к исполнению на всей территории РО и не могут противоречить Конституции, кодексам и федеральным законам.\n\n3. Нормативные акты Премьер-министра подлежат официальному опубликованию."],[0,"Конституция ст. 37","Конституция РО · Глава III. Премьер-министр РО","Статья 37. Премьер-министр и Правительство\n\n1. Премьер-министр определяет основные направления деятельности Правительства и вправе председательствовать на его заседаниях.\n\n2. Правительство подотчетно Премьер-министру по вопросам исполнения государственной политики, но самостоятельно осуществляет коллегиальные полномочия в пределах своей компетенции."],[0,"Конституция ст. 38","Конституция РО · Глава III. Премьер-министр РО","Статья 38. Премьер-министр и силовые органы\n\n1. Федеральная служба безопасности подчиняется Премьер-министру РО и Министру юстиции в пределах их компетенции.\n\n2. Органы внутренних дел подчиняются Премьер-министру РО и руководству системы Министерства внутренних дел.\n\n3. Вооруженные Силы подчиняются Премьер-министру РО, Министерству внутренних дел и своему командованию в установленной законом иерархии."],[0,"Конституция ст. 39","Конституция РО · Глава III. Премьер-министр РО","Статья 39. Недопустимость вмешательства\n\n1. Премьер-министр не вправе требовать вынесения конкретного судебного решения, фабрикации доказательств, прекращения или возбуждения уголовного дела без законного основания либо совершения иных действий, нарушающих процессуальную самостоятельность суда, прокуратуры или следственного органа.\n\n2. Законные формы координации, контроля и поручений определяются федеральным законодательством."],[0,"Конституция ст. 40","Конституция РО · Глава III. Премьер-министр РО","Статья 40. Неприкосновенность Премьер-министра\n\n1. Премьер-министр обладает процессуальной неприкосновенностью в объёме, установленном федеральным законом.\n\n2. Неприкосновенность является процессуальной гарантией и не означает освобождение от ответственности за совершённое правонарушение."],[0,"Конституция ст. 41","Конституция РО · Глава III. Премьер-министр РО","Статья 41. Срок и прекращение полномочий\n\n1. Срок полномочий Премьер-министра, порядок вступления в должность и порядок досрочного прекращения полномочий устанавливаются федеральным конституционным законом.\n\n2. Премьер-министр может быть отрешен от должности в случае совершения тяжкого нарушения Конституции или преступления в порядке, установленном федеральным конституционным законом."],[0,"Конституция ст. 42","Конституция РО · Глава III. Премьер-министр РО","Статья 42. Временное исполнение обязанностей\n\n1. При временной невозможности исполнения Премьер-министром своих полномочий их осуществляет должностное лицо, определенное федеральным конституционным законом.\n\n2. Исполняющий обязанности Премьер-министра не вправе изменять Конституцию или использовать временное положение для незаконного перераспределения полномочий."],[0,"Конституция ст. 43","Конституция РО · Глава IV. Государственная Дума РО","Статья 43. Статус Государственной Думы РО\n\n1. Государственная Дума РО является представительным и законодательным коллегиальным органом государственной власти.\n\n2. Государственная Дума осуществляет законодательную власть посредством принятия, изменения и отмены кодексов, федеральных законов и иных актов в пределах своей компетенции.\n\n3. Государственная Дума осуществляет свои полномочия самостоятельно и не вправе вмешиваться в рассмотрение конкретных судебных дел, расследование конкретных уголовных дел или оперативно-розыскную деятельность государственных органов."],[0,"Конституция ст. 44","Конституция РО · Глава IV. Государственная Дума РО","Статья 44. Состав Государственной Думы\n\n1. Государственная Дума РО формируется исключительно из представителей государственных организаций, а также представителей политических партий обладающих правом постоянного представительства в соответствии с федеральным конституционным законом.\n\n2. Перечень государственных организаций, имеющих право постоянного представительства в Государственной Думе, а также количество закрепленных за ними депутатских мандатов устанавливаются федеральным конституционным законом.\n\n3. Государственную организацию представляет ее руководитель либо иной сотрудник, письменно уполномоченный руководителем. Руководитель вправе отозвать или заменить представителя в установленном законом порядке.\n\n4. Депутатский мандат возникает исключительно в связи с представительством государственной организации и прекращается при отзыве или замене ее представителя либо в иных случаях, установленных федеральным конституционным законом.\n\n5. Каждый депутат Государственной Думы обладает одним голосом. Одно лицо не может одновременно занимать два или более депутатских мандата.\n\n6. Председателем Государственной Думы является Вице Премьер-министр РО, это исключительный случай, когда одно лицо осуществляет полномочия двумя ветвями власти. Заместителями председателя является уполномоченные лица, назначаемые Вице Премьер-министром РО."],[0,"Конституция ст. 45","Конституция РО · Глава IV. Государственная Дума РО","Статья 45. Статус депутатов Государственной Думы\n\n1. Член Государственной Думы обязан лично участвовать в голосовании и действовать в пределах Конституции и федерального законодательства.\n\n2. Представитель государственной организации сохраняет принадлежность к соответствующей организации, однако участие в Государственной Думе не предоставляет ему права использовать ее служебные полномочия для давления на иных депутатов Государственной Думы.\n\n3. Депутат Государственной Думы не вправе использовать депутатский мандат для дачи обязательных распоряжений государственным органам и их сотрудникам вне полномочий, прямо установленных законом.\n\n4. Представители суда, прокуратуры, Следственного комитета и правоохранительных органов не вправе использовать участие в Государственной Думе для влияния на конкретное судебное разбирательство, уголовное дело, проверку или оперативное мероприятие."],[0,"Конституция ст. 46","Конституция РО · Глава IV. Государственная Дума РО","Статья 46. Полномочия Государственной Думы\n\n1. Государственная Дума принимает, изменяет и отменяет кодексы и федеральные законы.\n\n2. Государственная Дума рассматривает проекты нормативных правовых актов, поступившие в порядке законодательной инициативы.\n\n3. Государственная Дума участвует в процедуре изменения Конституции в порядке, установленном настоящей Конституцией и федеральным конституционным законом.\n\n4. Государственная Дума вправе запрашивать у государственных органов сведения, необходимые для законодательной деятельности, если предоставление таких сведений не нарушает режим государственной, следственной, судебной или иной охраняемой законом тайны.\n\n5. Государственная Дума осуществляет иные полномочия, определенные федеральным законом."],[0,"Конституция ст. 47","Конституция РО · Глава IV. Государственная Дума РО","Статья 47. Законодательная инициатива\n\n1. Правом законодательной инициативы обладают Премьер-министр РО, Правительство РО, Вице Премьер-министр РО, депутаты Государственной Думы, Верховный Суд РО, Генеральный прокурор РО и Глава Следственного комитета РО.\n\n2. Проект закона должен содержать текст предлагаемых норм и обоснование необходимости их принятия."],[0,"Конституция ст. 48","Конституция РО · Глава IV. Государственная Дума РО","Статья 48. Принятие решений Государственной Думой\n\n1. Порядок созыва заседаний, кворум и организация голосования устанавливаются федеральным законом и регламентом Государственной Думы.\n\n2. Если Конституцией или федеральным конституционным законом не установлено иное, решение Государственной Думы принимается большинством голосов депутатов, участвующих в голосовании при наличии кворума.\n\n3. Каждый депутат Государственной Думы голосует лично. Передача голоса другому лицу не допускается."],[0,"Конституция ст. 49","Конституция РО · Глава IV. Государственная Дума РО","Статья 49. Подписание и опубликование федеральных законов\n\n1. Принятый Государственной Думой федеральный закон направляется Премьер-министру РО.\n\n2. Премьер-министр в течение 48 часов подписывает и направляет закон на официальное опубликование либо возвращает его в Государственная Дума с мотивированными возражениями.\n\n3. Государственная Дума вправе преодолеть вето Премьер-министра не менее чем двумя третями голосов от установленного состава Государственной Думы. После преодоления вето Премьер-министр обязан подписать и направить закон на официальное опубликование.\n\n4. Федеральный закон не вступает в силу до его официального опубликования, если самим законом не установлен более поздний срок вступления в силу."],[0,"Конституция ст. 50","Конституция РО · Глава V. Правительство РО","Статья 50. Статус Правительства\n\n1. Правительство РО — высший коллегиальный исполнительный орган государственного управления и государственной власти.\n\n2. Правительство действует на основании Конституции, федерального законодательства и актов Премьер-министра."],[0,"Конституция ст. 51","Конституция РО · Глава V. Правительство РО","Статья 51. Состав Правительства\n\n1. В состав Правительства входят Премьер-министр РО в предусмотренных законом случаях, ВицеПремьер-министр либо иное уполномоченное лицо, федеральные министры, их заместители и иные должностные лица, определенные федеральным законом.\n\n2. Конкретная структура Правительства определяется федеральным законом и актами, принятыми в соответствии с ним."],[0,"Конституция ст. 52","Конституция РО · Глава V. Правительство РО","Статья 52. Задачи Правительства\n\n1. Правительство обеспечивает исполнение законодательства, управление государственной собственностью и бюджетом, проведение единой государственной политики, функционирование государственных организаций и защиту прав граждан.\n\n2. Правительство участвует в законодательном процессе посредством права законодательной инициативы и подготовки проектов нормативных правовых актов в пределах своей компетенции.\n\n3. Правительство вправе проводить проверки государственных организаций в порядке, с периодичностью и в пределах, установленных федеральным законом."],[0,"Конституция ст. 53","Конституция РО · Глава V. Правительство РО","Статья 53. Право законодательной инициативы Правительства\n\n1. Правительство вправе разрабатывать и вносить в Государственная Дума проекты кодексов, федеральных законов и поправок к ним.\n\n2. Законодательная инициатива Правительства должна быть мотивированной, соответствовать Конституции и установленному разграничению компетенции государственных органов.\n\n3. Правительство не вправе самостоятельно изменять кодексы или федеральные законы посредством подзаконного акта, устанавливать уголовную ответственность либо изменять положения Конституции."],[0,"Конституция ст. 54","Конституция РО · Глава V. Правительство РО","Статья 54. Бюджет и имущество государства\n\n1. Правительство распоряжается государственным бюджетом и имуществом исключительно в публичных интересах.\n\n2. Премирование государственных организаций и служащих, финансирование и иные выплаты осуществляются только в установленном функциональном и правовом порядке.\n\n3. Отчуждение государственного имущества в личных целях запрещается."],[0,"Конституция ст. 55","Конституция РО · Глава V. Правительство РО","Статья 55. Контроль государственных организаций\n\n1. Правительство вправе осуществлять надзорные и организационные проверки государственных организаций в пределах своей компетенции.\n\n2. Проверки не должны использоваться как средство давления на следствие, суд, прокуратуру или оперативную деятельность.\n\n3. Правительство обязано реагировать на выявленные правонарушения государственных служащих и не вправе сознательно игнорировать очевидные нарушения закона."],[0,"Конституция ст. 56","Конституция РО · Глава V. Правительство РО","Статья 56. Внутренние акты государственных организаций\n\n1. Регламенты, инструкции, положения об отделах и иные внутренние акты государственных организаций подлежат утверждению в порядке, установленном Правительством.\n\n2. Внутренний акт не может расширять компетенцию организации сверх федерального закона."],[0,"Конституция ст. 57","Конституция РО · Глава V. Правительство РО","Статья 57. Адвокатская деятельность и лицензирование\n\n1. Правительство обеспечивает выдачу и учет адвокатских лицензий в порядке, установленном федеральным законом.\n\n2. Стоимость и условия лицензирования устанавливаются нормативными актами Правительства в пределах федерального законодательства.\n\n3. Государственные органы обязаны обеспечивать реальную возможность осуществления права задержанного на защиту."],[0,"Конституция ст. 58","Конституция РО · Глава V. Правительство РО","Статья 58. Невмешательство Правительства в расследование\n\n1. Правительство осуществляет общее руководство исполнительной властью, не вмешиваясь в расследование конкретных уголовных дел и оперативную деятельность правоохранительных органов.\n\n2. Исключения допускаются только на основании Конституции или федерального закона и не могут означать указание на заведомо незаконный результат расследования."],[0,"Конституция ст. 59","Конституция РО · Глава VI. Судебная власть","Статья 59. Осуществление правосудия\n\n1. Правосудие в РО осуществляется исключительно судами.\n\n2. Судебная власть самостоятельна и независима при разрешении конкретных дел."],[0,"Конституция ст. 60","Конституция РО · Глава VI. Судебная власть","Статья 60. Система судов\n\n1. Судебную систему РО образуют Верховный Суд РО, Кутузовский районный суд и мировые судьи.\n\n2. Верховный Суд РО является высшим судебным органом РО.\n\n3. Мировые судьи являются нижним звеном судебной системы и рассматривают в первой инстанции дела небольшой сложности и иные категории дел, прямо отнесенные к их компетенции федеральным законодательством. Судебные акты мировых судей могут быть обжалованы в Кутузовский районный суд.\n\n4. Кутузовский районный суд является основным судом первой инстанции по делам, не отнесенным к компетенции мировых судей или Верховного Суда, а также вышестоящим судом по отношению к мировым судьям. Верховный Суд РО является вышестоящим судом по отношению к Кутузовскому районному суду и осуществляет пересмотр его судебных актов в случаях и порядке, установленных федеральным законодательством.\n\n5. Создание иных судов допускается федеральным конституционным законом."],[0,"Конституция ст. 61","Конституция РО · Глава VI. Судебная власть","Статья 61. Состав Верховного Суда\n\n1. Верховный Суд возглавляет Председатель Верховного Суда.\n\n2. При Председателе Верховного Суда могут осуществлять полномочия не более трёх Верховных судей.\n\n3. Порядок назначения, освобождения и дисциплинарной ответственности судей устанавливается федеральным конституционным законом."],[0,"Конституция ст. 62","Конституция РО · Глава VI. Судебная власть","Статья 62. Независимость и законность решений суда\n\n1. Судья обязан разрешать дело объективно, беспристрастно и на основании закона.\n\n2. Заведомо неправосудное решение подлежит отмене или пересмотру в установленном законом порядке и может повлечь ответственность судьи.\n\n3. Никто не вправе оказывать давление на судью с целью получения заранее определенного решения."],[0,"Конституция ст. 63","Конституция РО · Глава VI. Судебная власть","Статья 63. Обязательность судебных актов\n\n1. Вступившие в силу судебные акты обязательны для граждан, организаций и государственных органов.\n\n2. Неисполнение судебного акта влечет ответственность, установленную законом.\n\n3. Суд вправе устанавливать срок исполнения своего акта в пределах федерального законодательства."],[0,"Конституция ст. 64","Конституция РО · Глава VI. Судебная власть","Статья 64. Судебный контроль за государственными органами\n\n1. Суд вправе признавать незаконными действия и решения государственных органов и должностных лиц, отменять незаконные индивидуальные акты, присуждать компенсацию и применять иные способы защиты, предусмотренные законом.\n\n2. В предусмотренных законом случаях суд вправе временно отстранить или окончательно снять с должности руководителя государственной организации или иное должностное лицо."],[0,"Конституция ст. 65","Конституция РО · Глава VI. Судебная власть","Статья 65. Открытость судопроизводства\n\n1. Судебные разбирательства являются открытыми, кроме случаев, когда закрытое заседание необходимо для защиты государственной тайны, участников процесса либо иных охраняемых законом интересов.\n\n2. Место и организационный порядок проведения судебных заседаний определяются судебным законодательством."],[0,"Конституция ст. 66","Конституция РО · Глава VI. Судебная власть","Статья 66. Состязательность и право быть услышанным\n\n1. Судопроизводство основывается на состязательности и равноправии сторон.\n\n2. Лицам, участвующим в деле, должна быть предоставлена разумная возможность представить доказательства, возражения и правовую позицию."],[0,"Конституция ст. 67","Конституция РО · Глава VI. Судебная власть","Статья 67. Обжалование судебных актов\n\n1. Судебные акты могут быть обжалованы в порядке, установленном процессуальным законодательством.\n\n2. Подача жалобы сама по себе не приостанавливает исполнение акта, если иное не предусмотрено законом или решением компетентного суда."],[0,"Конституция ст. 68","Конституция РО · Глава VII. Прокуратура РО и Следственный комитет РО","Статья 68. Прокуратура РО\n\n1. Прокуратура РО осуществляет надзор за соблюдением Конституции и исполнением федерального законодательства, защищает публичный интерес и участвует в уголовном судопроизводстве в установленных законом формах.\n\n2. Прокурор при осуществлении процессуальных полномочий обязан действовать объективно и независимо от незаконных указаний.\n\n3. В организационном отношении прокуратура РО входит во фракцию Правительства РО. Такое организационное включение не предоставляет Правительству права вмешиваться в конкретную прокурорскую проверку, судебное производство с участием прокурора либо предопределять содержание акта прокурорского реагирования.\n\n4. Генеральный прокурор РО назначается на должность и освобождается от должности Премьер-министром РО."],[0,"Конституция ст. 69","Конституция РО · Глава VII. Прокуратура РО и Следственный комитет РО","Статья 69. Прокурорский надзор за задержанием государственных служащих\n\n1. Федеральный закон может устанавливать специальный порядок задержания и помещения под стражу действующих государственных служащих, предусматривающий обязательное участие или уведомление прокурора.\n\n2. Исключения из такого порядка допускаются при наличии судебного акта, законного ордера, особого правового режима либо иных прямо предусмотренных законом оснований."],[0,"Конституция ст. 70","Конституция РО · Глава VII. Прокуратура РО и Следственный комитет РО","Статья 70. Следственный комитет РО\n\n1. Следственный комитет РО является федеральным следственным органом, осуществляющим предварительное расследование уголовных дел, отнесенных к его подследственности.\n\n2. Следственный комитет РО является самостоятельным федеральным государственным органом и не входит в систему Прокуратуры РО. Прокуратура не осуществляет организационное или административное руководство Следственным комитетом. Взаимодействие между ними осуществляется исключительно в формах, предусмотренных федеральным законодательством."],[0,"Конституция ст. 71","Конституция РО · Глава VII. Прокуратура РО и Следственный комитет РО","Статья 71. Основные задачи Следственного комитета\n\n1. К основным задачам Следственного комитета относятся возбуждение уголовных дел при наличии законных оснований, проведение следственных действий, собирание и закрепление доказательств, предъявление обвинения и направление оконченного уголовного дела в суд для разрешения вопроса об утверждении обвинительного заключения и ответственности обвиняемого.\n\n2. Следственный комитет не вправе возбуждать дело, предъявлять обвинение или применять меры процессуального принуждения при отсутствии достаточных законных оснований."],[0,"Конституция ст. 72","Конституция РО · Глава VII. Прокуратура РО и Следственный комитет РО","Статья 72. Руководство предварительным расследованием\n\n1. По уголовным делам, находящимся в производстве Следственного комитета, Следственный комитет руководит предварительным расследованием.\n\n2. В пределах расследуемого уголовного дела уполномоченный следователь вправе давать обязательные к исполнению поручения органам Министерства внутренних дел, если такие поручения законны, конкретны и относятся к предмету расследования."],[0,"Конституция ст. 73","Конституция РО · Глава VII. Прокуратура РО и Следственный комитет РО","Статья 73. Следственные действия\n\n1. Допрос, осмотр места происшествия, обыск, выемка, следственный эксперимент и иные следственные действия проводятся только при наличии предусмотренных законом оснований.\n\n2. Вмешательство в права граждан при проведении следственного действия должно быть соразмерно его законной цели."],[0,"Конституция ст. 74","Конституция РО · Глава VII. Прокуратура РО и Следственный комитет РО","Статья 74. Взаимодействие Следственного комитета\n\n1. Следственный комитет взаимодействует с Министерством внутренних дел, ГИБДД, Федеральной службой безопасности, прокуратурой и иными государственными органами в пределах расследуемого дела и компетенции соответствующих органов.\n\n2. Следственный комитет не осуществляет обычное патрулирование, рейды и иные мероприятия, не относящиеся к его следственной компетенции, кроме совместных мероприятий, предусмотренных законом."],[0,"Конституция ст. 75","Конституция РО · Глава VII. Прокуратура РО и Следственный комитет РО","Статья 75. Объективность расследования\n\n1. Процессуальное решение следователя должно быть объективным, мотивированным и беспристрастным.\n\n2. Запрещаются злоупотребление полномочиями, фабрикация доказательств и давление на участников уголовного процесса."],[0,"Конституция ст. 76","Конституция РО · Глава VII. Прокуратура РО и Следственный комитет РО","Статья 76. Акты прокуратуры и Следственного комитета\n\n1. Законные постановления, требования и поручения прокуратуры и Следственного комитета обязательны для адресатов в пределах компетенции соответствующего органа.\n\n2. Акты прокуратуры и Следственного комитета могут быть обжалованы в суд или вышестоящему должностному лицу в порядке, установленном законом."],[0,"Конституция ст. 77","Конституция РО · Глава VIII. Правоохранительные органы, органы государственной безопасности и Вооружённые Силы","Статья 77. Общие принципы деятельности силовых государственных организаций\n\n1. К силовым государственным организациям относятся органы внутренних дел, ГИБДД, Федеральная служба безопасности, Вооружённые Силы и иные органы, прямо отнесенные к ним федеральным законом.\n\n2. Их сотрудники обязаны действовать в пределах компетенции, соблюдать права граждан, требования к служебной идентификации и установленный порядок применения государственного функционала.\n\n3. Полномочия одной организации не могут произвольно присваиваться другой организацией."],[0,"Конституция ст. 78","Конституция РО · Глава VIII. Правоохранительные органы, органы государственной безопасности и Вооружённые Силы","Статья 78. Министерство внутренних дел\n\n1. Органы Министерства внутренних дел обеспечивают общественный порядок и безопасность на территории муниципальных образований, осуществляют патрулирование, реагирование на вызовы, задержание правонарушителей, оперативно-розыскные мероприятия, конвоирование и охрану мест происшествий в пределах закона.\n\n2. Министерство внутренних дел оказывает содействие Следственному комитету и Федеральной службе безопасности при проведении специальных мероприятий и исполняет законные поручения Следственного комитета по расследуемым им уголовным делам.\n\n3. Обращения граждан подлежат рассмотрению в сроки, установленные федеральным законодательством."],[0,"Конституция ст. 79","Конституция РО · Глава VIII. Правоохранительные органы, органы государственной безопасности и Вооружённые Силы","Статья 79. Государственная инспекция безопасности дорожного движения\n\n1. ГИБДД осуществляет контроль безопасности дорожного движения, пресечение нарушений дорожного законодательства и иные полномочия, установленные федеральным законом.\n\n2. При выявлении признаков преступления, выходящего за пределы компетенции ГИБДД, материалы без необоснованной задержки передаются Министерству внутренних дел, Следственному комитету или Федеральной службе безопасности в зависимости от подследственности и компетенции."],[0,"Конституция ст. 80","Конституция РО · Глава VIII. Правоохранительные органы, органы государственной безопасности и Вооружённые Силы","Статья 80. Федеральная служба безопасности\n\n1. Федеральная служба безопасности является федеральным правоохранительным органом, осуществляющим внутреннюю разведку, контрразведывательную и антитеррористическую деятельность, а также противодействие преступлениям федерального уровня и преступлениям против государственной безопасности.\n\n2. Федеральная служба безопасности подчиняется Премьер-министру РО и Министру юстиции в пределах установленной компетенции.\n\n3. Федеральная служба безопасности вправе координировать специальные мероприятия по преступлениям федерального характера и угрозам государственной безопасности, при необходимости привлекая иные государственные организации."],[0,"Конституция ст. 81","Конституция РО · Глава VIII. Правоохранительные органы, органы государственной безопасности и Вооружённые Силы","Статья 81. Дополнительная компетенция Федеральной службы безопасности\n\n1. Федеральная служба безопасности осуществляет формирование материалов уголовных и оперативных производств в пределах своей компетенции, выявляет коррупционные преступления в государственных органах и проводит специальные операции.\n\n2. Обработка правонарушений регионального уровня Федеральной службой безопасности допускается по законному запросу старшего состава Министерства внутренних дел или ГИБДД, при отсутствии возможности их самостоятельной обработки либо при наличии иной предусмотренной законом веской причины."],[0,"Конституция ст. 82","Конституция РО · Глава VIII. Правоохранительные органы, органы государственной безопасности и Вооружённые Силы","Статья 82. Взаимодействие государственных организаций\n\n1. Следственный комитет руководит предварительным расследованием уголовных дел, находящихся в его производстве.\n\n2. Министерство внутренних дел обеспечивает общественный порядок и оказывает содействие Следственному комитету и Федеральной службе безопасности.\n\n3. ГИБДД осуществляет компетенцию в сфере дорожной безопасности и передает материалы по признакам преступлений компетентному органу.\n\n4. Федеральная служба безопасности координирует мероприятия по угрозам федерального уровня и государственной безопасности.\n\n5. Государственные органы обязаны обмениваться необходимыми материалами и содействовать друг другу только в пределах закона и своей компетенции."],[0,"Конституция ст. 83","Конституция РО · Глава VIII. Правоохранительные органы, органы государственной безопасности и Вооружённые Силы","Статья 83. Вооружённые Силы РО\n\n1. Вооруженные Силы предназначены для защиты военных объектов, охраны вооружения, проведения военной подготовки и выполнения задач в условиях чрезвычайного или военного положения.\n\n2. Вооруженные Силы подчиняются Премьер-министру РО, Министерству внутренних дел и военному командованию в установленной иерархии.\n\n3. Привлечение Вооруженных Сил к мероприятиям внутренней безопасности допускается исключительно в случаях, предусмотренных федеральным законодательством, либо по законному решению Премьер-министра или Правительства."],[0,"Конституция ст. 84","Конституция РО · Глава VIII. Правоохранительные органы, органы государственной безопасности и Вооружённые Силы","Статья 84. Задержание военнослужащими\n\n1. Военнослужащие вправе задерживать граждан на военных объектах и прилегающих режимных территориях в случаях совершения противоправных действий, а также в иных прямо предусмотренных законом случаях.\n\n2. Задержанное лицо подлежит передаче компетентному правоохранительному органу без необоснованной задержки, если федеральным законом не предусмотрено иное."],[0,"Конституция ст. 85","Конституция РО · Глава VIII. Правоохранительные органы, органы государственной безопасности и Вооружённые Силы","Статья 85. Видеофиксация и доказательственная сохранность\n\n1. Федеральным законом устанавливаются случаи обязательной видеофиксации задержания, ареста, обыска, изъятия имущества, выдачи или снятия розыска, процессуальных действий и иных значимых действий государственных служащих.\n\n2. Запись должна сохраняться в установленный законом срок и предоставляться суду, прокуратуре или иному уполномоченному органу при законном запросе.\n\n3. Фальсификация, необоснованное уничтожение или сокрытие обязательной видеозаписи влечёт ответственность."],[0,"Конституция ст. 86","Конституция РО · Глава IX. Особые правовые режимы","Статья 86. Чрезвычайное и военное положение\n\n1. Чрезвычайное или военное положение вводится в порядке, установленном федеральным конституционным законом.\n\n2. Акт о введении особого режима должен определять основания, территорию, срок действия, временные полномочия государственных органов и перечень допустимых ограничений прав."],[0,"Конституция ст. 87","Конституция РО · Глава IX. Особые правовые режимы","Статья 87. Временное расширение полномочий\n\n1. На период чрезвычайного или военного положения государственным органам могут предоставляться дополнительные полномочия, необходимые для устранения угрозы.\n\n2. Такие полномочия не могут использоваться для отмены Конституции, устранения судебной защиты, легализации заведомо незаконного насилия или присвоения полномочий, не связанных с целями особого режима."],[0,"Конституция ст. 88","Конституция РО · Глава IX. Особые правовые режимы","Статья 88. Использование силовых организаций в особых условиях\n\n1. В условиях чрезвычайного или военного положения Премьер-министр и Правительство вправе координировать совместные действия Министерства внутренних дел, Федеральной службы безопасности, Следственного комитета и Вооружённых Сил в пределах федерального законодательства.\n\n2. Процессуальное руководство уголовными делами при этом сохраняется за органом, которому дело подследственно."],[0,"Конституция ст. 89","Конституция РО · Глава IX. Особые правовые режимы","Статья 89. Гарантии законности при особом режиме\n\n1. Введение особого правового режима не освобождает государственные органы и должностных лиц от обязанности соблюдать закон.\n\n2. Действия и решения, принятые в период особого режима, могут быть обжалованы в суд и прокуратуру, если федеральным законом прямо не установлен особый порядок обжалования."],[0,"Конституция ст. 90","Конституция РО · Глава X. Конституционные поправки и заключительные положения","Статья 90. Инициатива изменения Конституции\n\n1. Предложения о внесении изменений в Конституцию могут вносить Премьер-министр РО, Государственная Дума РО, Правительство РО, Верховный Суд РО, Генеральный прокурор РО и Глава Следственного комитета РО.\n\n2. Порядок рассмотрения конституционных поправок устанавливается федеральным конституционным законом."],[0,"Конституция ст. 91","Конституция РО · Глава X. Конституционные поправки и заключительные положения","Статья 91. Пределы конституционных поправок\n\n1. Поправка не может отменять судебную защиту, презумпцию невиновности, запрет произвольного задержания, право на защиту либо придавать обратную силу норме, устанавливающей или усиливающей ответственность.\n\n2. Поправка не может предоставлять одному органу неограниченное право присваивать полномочия других государственных органов."],[0,"Конституция ст. 92","Конституция РО · Глава X. Конституционные поправки и заключительные положения","Статья 92. Обеспечение конституционной законности\n\n1. Нормативные правовые акты и внутренние регламенты государственных организаций подлежат приведению в соответствие с настоящей Конституцией.\n\n2. При выявлении противоречия между нормативными актами применяется акт большей юридической силы. Окончательное разрешение спора о конституционности акта относится к компетенции Верховного Суда."],[0,"Конституция ст. 93","Конституция РО · Глава X. Конституционные поправки и заключительные положения","Статья 93. Вступление в силу\n\n1. Конституция вступает в силу с момента ее официального опубликования и утверждения в установленном порядке.\n\n2. Ранее принятые нормативные акты применяются постольку, поскольку они не противоречат настоящей Конституции.\n\n3. Государственные органы обязаны привести действующие законы, кодексы, указы, регламенты и внутренние инструкции в соответствие с настоящей Конституцией."],[1,"УК — общие положения","Уголовный кодекс РО","ОБЩАЯ ЧАСТЬ"],[1,"УК ст. 1","Уголовный кодекс РО · Глава I. Задачи и принципы Уголовного кодекса РО","Статья 1. Уголовное законодательство РО\n\nч. 1 Уголовное законодательство РО состоит из настоящего Кодекса. Новые законы, предусматривающие уголовную ответственность, подлежат включению в настоящий Кодекс.\n\nч. 2 Настоящий Кодекс основывается на Конституции РО и общепризнанных принципах и нормах международного права."],[1,"УК ст. 1.1","Уголовный кодекс РО · Глава I. Задачи и принципы Уголовного кодекса РО","Статья 1.1 Задачи Уголовного кодекса РО\n\nч. 1 Задачами настоящего Кодекса являются: охрана прав и свобод человека и гражданина, собственности, общественного порядка и общественной безопасности, окружающей среды, конституционного строя РО от преступных посягательств, обеспечение мира и безопасности человечества, а также предупреждение преступлений.\n\nч. 2 Для осуществления этих задач настоящий Кодекс устанавливает основание и принципы уголовной ответственности, определяет, какие опасные для личности, общества или государства деяния признаются преступлениями, и устанавливает виды наказаний и иные меры уголовно-правового характера за совершение преступлений."],[1,"УК ст. 1.2","Уголовный кодекс РО · Глава I. Задачи и принципы Уголовного кодекса РО","Статья 1.2 Принцип законности\n\nч. 1 Преступность деяния, а также его наказуемость и иные уголовно-правовые последствия определяются только настоящим Кодексом.\n\nч. 2 Применение уголовного закона по аналогии не допускается."],[1,"УК ст. 1.3","Уголовный кодекс РО · Глава I. Задачи и принципы Уголовного кодекса РО","Статья 1.3 Принцип равенства граждан перед законом\n\nч. 1 Лица, совершившие преступления, равны перед законом и подлежат уголовной ответственности независимо от пола, расы, национальности, языка, происхождения, имущественного и должностного положения, места жительства, отношения к религии, убеждений, принадлежности к общественным объединениям, а также других обстоятельств."],[1,"УК ст. 1.4","Уголовный кодекс РО · Глава I. Задачи и принципы Уголовного кодекса РО","Статья 1.4 Принцип вины\n\nч. 1 Лицо подлежит уголовной ответственности только за те общественно опасные действия (бездействие) и наступившие общественно опасные последствия, в отношении которых установлена его вина.\n\nч. 2 Объективное вменение, то есть уголовная ответственность за невиновное причинение вреда, не допускается."],[1,"УК ст. 1.5","Уголовный кодекс РО · Глава I. Задачи и принципы Уголовного кодекса РО","Статья 1.5 Принцип справедливости\n\nч. 1 Наказание и иные меры уголовно-правового характера, применяемые к лицу, совершившему преступление, должны быть справедливыми, то есть соответствовать характеру и степени общественной опасности преступления, обстоятельствам его совершения и личности виновного.\n\nч. 2 Никто не может нести уголовную ответственность дважды за одно и то же преступление."],[1,"УК ст. 1.6","Уголовный кодекс РО · Глава I. Задачи и принципы Уголовного кодекса РО","Статья 1.6 Принцип гуманизма\n\nч. 1 Уголовное законодательство РО обеспечивает безопасность человека.\n\nч. 2 Наказание и иные меры уголовно-правового характера, применяемые к лицу, совершившему преступление, не могут иметь своей целью причинение физических страданий или унижение человеческого достоинства."],[1,"УК ст. 1.7","Уголовный кодекс РО · Глава I. Задачи и принципы Уголовного кодекса РО","Статья 1.7 Основание уголовной ответственности\n\nч. 1 Основанием уголовной ответственности является совершение деяния, содержащего все признаки состава преступления, предусмотренного настоящим Кодексом."],[1,"УК ст. 1.8","Уголовный кодекс РО · Глава I. Задачи и принципы Уголовного кодекса РО","Статья 1.8 Состав преступления\n\nч. 1 Состав преступления представляет собой совокупность объективных и субъективных признаков, которые в сумме определяют общественно опасное деяние как преступление. Признаки состава преступления закрепляются в нормах действующего законодательства. Их можно условно разделить на четыре подсистемы: признаки объекта, субъекта, объективной и субъективной стороны преступления.\n\nПризнак объекта - уголовно-правовая категория, которая используется для обозначения общественных порядков, которым причиняется ущерб вследствие совершения преступления.\nПризнак субъекта - лицо, осуществляющее воздействие на объект уголовно-правовой охраны и способное нести за это ответственность.\nПризнак объективной стороны преступления - один из элементов состава преступления, включающий в себя признаки, характеризующие внешнее проявление преступления в реальной действительности, доступное для наблюдения и изучения.\nПризнак субъективной стороны преступления - это внутреннее психическое отношение лица к совершаемому им общественно опасному деянию.\n\nПримечание: Наличие в деянии всех признаков некоего состава преступления является основанием для признания его преступным; отсутствие хотя бы одного из них означает, что отсутствует и состав преступления в целом, а деяние при этом признается не преступным и не противоправным в том числе.\n\nч. 2 Виды составов преступления. Настоящим кодексом выделяется 3 вида состава преступления.\n\nа) Материальные составы - составы преступления, объективная сторона которых включает в себя наличие общественно опасных последствий.\nб) Формальные составы – составы преступления, объективная сторона которых включает только признаки, характеризующие общественно опасные деяния и не предусматривает наличие общественно опасных последствий.\nб.1) Усеченные составы - составы преступления, в которых момент их окончания перенесен на более раннюю стадию.\nПример: Покушение на совершение преступления, приготовление к преступлению."],[1,"УК ст. 1.9","Уголовный кодекс РО · Глава I. Задачи и принципы Уголовного кодекса РО","Статья 1.9 Судимость\n\nч. 1 Судимость - правовой статус лица, обусловленный фактом осуждения и назначения ему наказания за совершенное преступление и влекущее при повторном совершении этим лицом преступления установленные уголовным законодательством правовые последствия.\n\nч. 2 Лицо, которому назначена мера наказания за совершение преступления, считается судимым со дня назначения наказания до момента погашения или снятия судимости в порядке, установленном Конституцией и законами РО.\n\nч. 3 При назначении меры наказания в виде уголовного штрафа, судимость у лица, которому была назначена такая мера, не возникает.\n\nч. 4 Правовое состояние судимости запрещает лицу находиться на государственной службе."],[1,"УК ст. 1.10","Уголовный кодекс РО · Глава I. Задачи и принципы Уголовного кодекса РО","Статья 1.10 Действие уголовного закона во времени\n\nч. 1. Преступность и наказуемость деяния определяются уголовным законом, действовавшим во время совершения этого деяния.\n\nч. 2. Временем совершения преступления признается время совершения общественно опасного действия (бездействия) независимо от времени наступления последствий."],[1,"УК ст. 1.11","Уголовный кодекс РО · Глава I. Задачи и принципы Уголовного кодекса РО","Статья 1.11 Обратная сила уголовного закона\n\nч. 1. Уголовный закон, устраняющий преступность деяния, смягчающий наказание или иным образом улучшающий положение лица, совершившего преступление, имеет обратную силу, то есть распространяется на лиц, совершивших соответствующие деяния до вступления такого закона в силу, в том числе на лиц, отбывающих наказание или отбывших наказание, но имеющих судимость. Уголовный закон, устанавливающий преступность деяния, усиливающий наказание или иным образом ухудшающий положение лица, обратной силы не имеет.\n\nч. 2. Если новый уголовный закон смягчает наказание за деяние, которое отбывается лицом, то это наказание подлежит сокращению в пределах, предусмотренных новым уголовным законом."],[1,"УК ст. 2","Уголовный кодекс РО · ГЛАВА II. Понятие преступления, виды преступлений и вина","Статья 2. Понятие преступления\n\nч. 1 Преступлением признается виновно совершенное общественно опасное деяние, запрещенное настоящим Кодексом под угрозой наказания.\n\nч. 2 Не является преступлением действие (бездействие), хотя формально и содержащее признаки какого-либо деяния, предусмотренного настоящим Кодексом, но в силу малозначительности не представляющее общественной опасности."],[1,"УК ст. 2.1","Уголовный кодекс РО · ГЛАВА II. Понятие преступления, виды преступлений и вина","Статья 2.1 Рецидив преступлений\n\nч. 1 Рецидивом преступлений признается совершение умышленного преступления лицом, имеющим судимость за ранее совершенное умышленное преступление.\n\nч. 2 Рецидив преступлений влечет более строгое наказание на основании и в пределах, предусмотренных настоящим Кодексом, а также иные последствия, предусмотренные законодательством РО."],[1,"УК ст. 2.2","Уголовный кодекс РО · ГЛАВА II. Понятие преступления, виды преступлений и вина","Статья 2.2 Формы вины\n\nч. 1 Виновным в преступлении признается лицо, совершившее деяние умышленно или по неосторожности.\n\nч. 2 Деяние, совершенное только по неосторожности, признается преступлением лишь в случае, когда это специально предусмотрено статьей настоящего Кодекса."],[1,"УК ст. 2.3","Уголовный кодекс РО · ГЛАВА II. Понятие преступления, виды преступлений и вина","Статья 2.3 Преступление, совершенное умышленно\n\nч. 1 Преступлением, совершенным умышленно, признается деяние, совершенное с прямым или косвенным умыслом.\n\nч. 2 Преступление признается совершенным с прямым умыслом, если лицо осознавало общественную опасность своих действий (бездействия), предвидело возможность или неизбежность наступления общественно опасных последствий и желало их наступления.\n\nч. 3 Преступление признается совершенным с косвенным умыслом, если лицо осознавало общественную опасность своих действий (бездействия), предвидело возможность наступления общественно опасных последствий, не желало, но сознательно допускало эти последствия либо относилось к ним безразлично."],[1,"УК ст. 2.4","Уголовный кодекс РО · ГЛАВА II. Понятие преступления, виды преступлений и вина","Статья 2.4 Преступление, совершенное по неосторожности\n\nч. 1 Преступлением, совершенным по неосторожности, признается деяние, совершенное по легкомыслию или небрежности.\n\nч. 2 Преступление признается совершенным по легкомыслию, если лицо предвидело возможность наступления общественно опасных последствий своих действий (бездействия), но без достаточных к тому оснований самонадеянно рассчитывало на предотвращение этих последствий.\n\nч. 3 Преступление признается совершенным по небрежности, если лицо не предвидело возможности наступления общественно опасных последствий своих действий (бездействия), хотя при необходимой внимательности и предусмотрительности должно было и могло предвидеть эти последствия."],[1,"УК ст. 2.5","Уголовный кодекс РО · ГЛАВА II. Понятие преступления, виды преступлений и вина","Статья 2.5 Невиновное причинение вреда\n\nч. 1 Деяние признается совершенным невиновно, если лицо, его совершившее, не осознавало и по обстоятельствам дела не могло осознавать общественной опасности своих действий (бездействия) либо не предвидело возможности наступления общественно опасных последствий и по обстоятельствам дела не должно было или не могло их предвидеть.\n\nч. 2 Деяние признается также совершенным невиновно, если лицо, его совершившее, хотя и предвидело возможность наступления общественно опасных последствий своих действий (бездействия), но не могло предотвратить эти последствия в силу несоответствия своих психофизиологических качеств требованиям экстремальных условий или нервно-психическим перегрузкам."],[1,"УК ст. 2.6","Уголовный кодекс РО · ГЛАВА II. Понятие преступления, виды преступлений и вина","Статья 2.6 Ответственность за преступление, совершенное с двумя формами вины\n\nч. 1 Если в результате совершения умышленного преступления причиняются тяжкие последствия, которые по закону влекут более строгое наказание и которые не охватывались умыслом лица, уголовная ответственность за такие последствия наступает только в случае, если лицо предвидело возможность их наступления, но без достаточных к тому оснований самонадеянно рассчитывало на их предотвращение, или в случае, если лицо не предвидело, но должно было и могло предвидеть возможность наступления этих последствий. В целом такое преступление признается совершенным умышленно."],[1,"УК ст. 3","Уголовный кодекс РО · ГЛАВА III. Неоконченное преступление и соучастие в преступлении","Статья 3. Оконченное и неоконченное преступления\n\nч. 1 Преступление признается оконченным, если в совершенном лицом деянии содержатся все признаки состава преступления, предусмотренного настоящим Кодексом.\n\nч. 2 Неоконченным преступлением признаются приготовление к преступлению и покушение на преступление.\n\nч. 3 Уголовная ответственность за неоконченное преступление наступает по статье настоящего Кодекса, предусматривающей ответственность за оконченное преступление, со ссылкой на статью 3.1 настоящего Кодекса."],[1,"УК ст. 3.1","Уголовный кодекс РО · ГЛАВА III. Неоконченное преступление и соучастие в преступлении","Статья 3.1 Приготовление к преступлению и покушение на преступление\n\nч. 1 Приготовлением к преступлению признаются приискание, изготовление или приспособление лицом средств или орудий совершения преступления, приискание соучастников преступления, сговор на совершение преступления либо иное умышленное создание условий для совершения преступления, если при этом преступление не было доведено до конца по не зависящим от этого лица обстоятельствам.\n\nч. 2 Покушением на преступление признаются умышленные действия (бездействие) лица, непосредственно направленные на совершение преступления, если при этом преступление не было доведено до конца по не зависящим от этого лица обстоятельствам."],[1,"УК ст. 3.2","Уголовный кодекс РО · ГЛАВА III. Неоконченное преступление и соучастие в преступлении","Статья 3.2 Добровольный отказ от преступления\n\nч. 1 Добровольным отказом от преступления признается прекращение лицом приготовления к преступлению либо прекращение действий (бездействия), непосредственно направленных на совершение преступления, если лицо осознавало возможность доведения преступления до конца.\n\nч. 2 Лицо не подлежит уголовной ответственности за преступление, если оно добровольно и окончательно отказалось от доведения этого преступления до конца.\n\nч. 3 Лицо, добровольно отказавшееся от доведения преступления до конца, подлежит уголовной ответственности в том случае, если фактически совершенное им деяние содержит иной состав преступления.\n\nч. 4 Организатор преступления и подстрекатель к преступлению не подлежат уголовной ответственности, если эти лица своевременным сообщением органам власти или иными предпринятыми мерами предотвратили доведение преступления исполнителем до конца. Пособник преступления не подлежит уголовной ответственности, если он предпринял все зависящие от него меры, чтобы предотвратить совершение преступления.\n\nч. 5 Если действия организатора или подстрекателя, предусмотренные частью четвертой настоящей статьи, не привели к предотвращению совершения преступления исполнителем, то предпринятые ими меры могут быть признаны смягчающими обстоятельствами при назначении наказания."],[1,"УК ст. 3.3","Уголовный кодекс РО · ГЛАВА III. Неоконченное преступление и соучастие в преступлении","Статья 3.3 Понятие соучастия в преступлении\n\nч. 1 Соучастием в преступлении признается умышленное совместное участие двух или более лиц в совершении умышленного преступления."],[1,"УК ст. 3.4","Уголовный кодекс РО · ГЛАВА III. Неоконченное преступление и соучастие в преступлении","Статья 3.4 Виды соучастников преступления\n\nч. 1 Соучастниками преступления наряду с исполнителем признаются организатор, подстрекатель и пособник.\n\nч. 2 Исполнителем признается лицо, непосредственно совершившее преступление либо непосредственно участвовавшее в его совершении совместно с другими лицами (соисполнителями), а также лицо, совершившее преступление посредством использования других лиц, не подлежащих уголовной ответственности в силу возраста, невменяемости или других обстоятельств, предусмотренных настоящим Кодексом.\n\nч. 3 Организатором признается лицо, организовавшее совершение преступления или руководившее его исполнением, а равно лицо, создавшее организованную группу или преступное сообщество (преступную организацию) либо руководившее ими.\n\nч. 4 Подстрекателем признается лицо, склонившее другое лицо к совершению преступления путем уговора, подкупа, угрозы или другим способом.\n\nч. 5 Пособником признается лицо, содействовавшее совершению преступления советами, указаниями, предоставлением информации, средств или орудий совершения преступления либо устранением препятствий, а также лицо, заранее обещавшее скрыть преступника, средства или орудия совершения преступления, следы преступления либо предметы, добытые преступным путем, а равно лицо, заранее обещавшее приобрести или сбыть такие предметы."],[1,"УК ст. 3.5","Уголовный кодекс РО · ГЛАВА III. Неоконченное преступление и соучастие в преступлении","Статья 3.5 Ответственность соучастников преступления\n\nч. 1 Ответственность соучастников преступления определяется характером и степенью фактического участия каждого из них в совершении преступления.\n\nч. 2 Соисполнители отвечают по статье Особенной части настоящего Кодекса за преступление, совершенное ими совместно, без ссылки на статью 3.4 настоящего Кодекса.\n\nч. 3 Уголовная ответственность организатора, подстрекателя и пособника наступает по статье, предусматривающей наказание за совершенное преступление, со ссылкой на статью 3.4 настоящего Кодекса, за исключением случаев, когда они одновременно являлись соисполнителями преступления.\n\nч. 4 Лицо, не являющееся субъектом преступления, специально указанным в соответствующей статье Особенной части настоящего Кодекса, участвовавшее в совершении преступления, предусмотренного этой статьей, несет уголовную ответственность за данное преступление в качестве его организатора, подстрекателя либо пособника.\n\nч. 5 В случае недоведения исполнителем преступления до конца по не зависящим от него обстоятельствам остальные соучастники несут уголовную ответственность за приготовление к преступлению или покушение на преступление. За приготовление к преступлению несет уголовную ответственность также лицо, которому по не зависящим от него обстоятельствам не удалось склонить других лиц к совершению преступления."],[1,"УК ст. 3.6","Уголовный кодекс РО · ГЛАВА III. Неоконченное преступление и соучастие в преступлении","Статья 3.6 Совершение преступления группой лиц, группой лиц по предварительному сговору, организованной группой или преступным сообществом (преступной организацией)\n\nч. 1 Преступление признается совершенным группой лиц, если в его совершении совместно участвовали два или более исполнителя без предварительного сговора.\n\nч. 2 Преступление признается совершенным группой лиц по предварительному сговору, если в нем участвовали лица, заранее договорившиеся о совместном совершении преступления.\n\nч. 3 Преступление признается совершенным организованной группой, если оно совершено устойчивой группой лиц, заранее объединившихся для совершения одного или нескольких преступлений.\n\nч. 4 Преступление признается совершенным преступным сообществом (преступной организацией), если оно совершено структурированной организованной группой или объединением организованных групп, действующих под единым руководством, члены которых объединены в целях совместного совершения одного или нескольких тяжких либо особо тяжких преступлений для получения прямо или косвенно финансовой или иной материальной выгоды.\n\nч. 5 Лицо, создавшее организованную группу или преступное сообщество (преступную организацию) либо руководившее ими, подлежит уголовной ответственности за их организацию и руководство ими в случаях, предусмотренных статьями 12.12, 12.5 настоящего Кодекса, а также за все совершенные организованной группой или преступным сообществом (преступной организацией) преступления, если они охватывались его умыслом. Другие участники организованной группы или преступного сообщества (преступной организации) несут уголовную ответственность за участие в них в случаях, предусмотренных статьями 12.12, 12.5 настоящего Кодекса, а также за преступления, в подготовке или совершении которых они участвовали.\n\nч. 6 Создание организованной группы в случаях, не предусмотренных статьями Особенной части настоящего Кодекса, влечет уголовную ответственность за приготовление к тем преступлениям, для совершения которых она создана.\n\nч. 7 Совершение преступления группой лиц, группой лиц по предварительному сговору, организованной группой или преступным сообществом (преступной организацией) влечет более строгое наказание на основании и в пределах, предусмотренных настоящим Кодексом."],[1,"УК ст. 3.7","Уголовный кодекс РО · ГЛАВА III. Неоконченное преступление и соучастие в преступлении","Статья 3.7 Эксцесс исполнителя преступления\n\nч. 1 Эксцессом исполнителя признается совершение исполнителем преступления, не охватывающегося умыслом других соучастников. За эксцесс исполнителя другие соучастники преступления уголовной ответственности не подлежат."],[1,"УК ст. 4","Уголовный кодекс РО · ГЛАВА IV. Обстоятельства, исключающие преступность деяния","Статья 4. Необходимая оборона\n\nч. 1 Не является преступлением причинение вреда посягающему лицу в состоянии необходимой обороны, то есть при защите личности и прав обороняющегося или других лиц, охраняемых законом интересов общества или государства от общественно опасного посягательства, если это посягательство было сопряжено с насилием, опасным для жизни обороняющегося или другого лица, либо с непосредственной угрозой применения такого насилия.\n\nч. 2 Защита от посягательства, не сопряженного с насилием, опасным для жизни обороняющегося или другого лица, либо с непосредственной угрозой применения такого насилия, является правомерной, если при этом не было допущено превышения пределов необходимой обороны, то есть умышленных действий, явно не соответствующих характеру и опасности посягательства.\n\nч. 2.1 Не являются превышением пределов необходимой обороны действия обороняющегося лица, если это лицо вследствие неожиданности посягательства не могло объективно оценить степень и характер опасности нападения.\n\nч. 2.2 Не являются превышением пределов необходимой обороны действия лица, направленные на защиту себя и своей семьи от насилия или угрозы применения насилия либо на защиту своего имущества против лица, незаконно проникшего в его жилище.\n\nч. 3 Положения настоящей статьи в равной мере распространяются на всех лиц независимо от их профессиональной или иной специальной подготовки и служебного положения, а также независимо от возможности избежать общественно опасного посягательства или обратиться за помощью к другим лицам или органам власти."],[1,"УК ст. 4.1","Уголовный кодекс РО · ГЛАВА IV. Обстоятельства, исключающие преступность деяния","Статья 4.1 Причинение вреда при задержании лица, совершившего преступление\n\nч. 1 Не является преступлением причинение вреда лицу, совершившему преступление, при его задержании для доставления органам власти и пресечения возможности совершения им новых преступлений, если иными средствами задержать такое лицо не представлялось возможным и при этом не было допущено превышения необходимых для этого мер.\n\nч. 2 Превышением мер, необходимых для задержания лица, совершившего преступление, признается их явное несоответствие характеру и степени общественной опасности совершенного задерживаемым лицом преступления и обстоятельствам задержания, когда лицу без необходимости причиняется явно чрезмерный, не вызываемый обстановкой вред. Такое превышение влечет за собой уголовную ответственность только в случаях умышленного причинения вреда."],[1,"УК ст. 4.2","Уголовный кодекс РО · ГЛАВА IV. Обстоятельства, исключающие преступность деяния","Статья 4.2 Крайняя необходимость\n\nч. 1 Не является преступлением причинение вреда охраняемым уголовным законом интересам в состоянии крайней необходимости, то есть для устранения опасности, непосредственно угрожающей личности и правам данного лица или иных лиц, охраняемым законом интересам общества или государства, если эта опасность не могла быть устранена иными средствами и при этом не было допущено превышения пределов крайней необходимости.\n\nч. 2 Превышением пределов крайней необходимости признается причинение вреда, явно не соответствующего характеру и степени угрожавшей опасности и обстоятельствам, при которых опасность устранялась, когда указанным интересам был причинен вред равный или более значительный, чем предотвращенный. Такое превышение влечет за собой уголовную ответственность только в случаях умышленного причинения вреда."],[1,"УК ст. 4.3","Уголовный кодекс РО · ГЛАВА IV. Обстоятельства, исключающие преступность деяния","Статья 4.3 Обоснованный риск\n\nч. 1 Не является преступлением причинение вреда охраняемым уголовным законом интересам при обоснованном риске для достижения общественно полезной цели.\n\nч. 2 Риск признается обоснованным, если указанная цель не могла быть достигнута не связанными с риском действиями (бездействием) и лицо, допустившее риск, предприняло достаточные меры для предотвращения вреда охраняемым уголовным законом интересам.\n\nч. 3 Риск не признается обоснованным, если он заведомо был сопряжен с угрозой для жизни многих людей, с угрозой экологической катастрофы или общественного бедствия."],[1,"УК ст. 4.4","Уголовный кодекс РО · ГЛАВА IV. Обстоятельства, исключающие преступность деяния","Статья 4.4 Исполнение приказа или распоряжения\n\nч. 1. Не является преступлением причинение вреда охраняемым уголовным законом интересам лицом, действующим во исполнение обязательных для него приказа или распоряжения. Уголовную ответственность за причинение такого вреда несет лицо, отдавшее незаконные приказ или распоряжение.\n\nч. 2. Лицо, совершившее умышленное преступление во исполнение заведомо незаконных приказа или распоряжения, несет уголовную ответственность на общих основаниях. Неисполнение заведомо незаконных приказа или распоряжения исключает уголовную ответственность."],[1,"УК ст. 4.5","Уголовный кодекс РО · ГЛАВА IV. Обстоятельства, исключающие преступность деяния","Статья 4.5 Физическое или психическое принуждение\n\nч 1. Не является преступлением причинение вреда охраняемым уголовным законом интересам в результате физического принуждения, если вследствие такого принуждения лицо не могло руководить своими действиями (бездействием).\n\nч 2. Вопрос об уголовной ответственности за причинение вреда охраняемым уголовным законом интересам в результате психического принуждения, а также в результате физического принуждения, вследствие которого лицо сохранило возможность руководить своими действиями, решается с учетом положений статьи 4.2 настоящего Кодекса."],[1,"УК ст. 4.6","Уголовный кодекс РО · ГЛАВА IV. Обстоятельства, исключающие преступность деяния","Статья 4.6 о наркотических веществах\n\nч. 1 Найденные наркотические вещества, относящиеся к каннабиноидам в ходе обыска сотрудниками гос. структуры, у гражданских лиц в количестве до 3 грамм (включительно), изымаются без привлечения к уголовной ответственности.\n\nч. 2 Один \"Куст Green\" приравнивается к 5-ти граммам наркотических веществ.\n\nч. 3 Одно “Семечко Green” приравнивается к двум граммам наркотических средств."],[1,"УК ст. 5","Уголовный кодекс РО · ГЛАВА V. Виды и назначение наказаний, освобождение от уголовной ответственности","Статья 5. Виды наказаний\n\nч. 1 Видами наказаний являются:\n\nа) Судебный штраф;\nб) Уголовный штраф;\nв) Лишение права занимать определенные должности или заниматься определенной деятельностью;\nг) Увольнение с государственной или военной службы, в том числе с лишением всех званий, наград и привилегий;\nд) Лишение свободы на определенный срок;\nе) Исправительные работы;\nё) Принудительные работы.\n\nч. 2 В результате судебного процесса по уголовному делу могут быть назначены следующие виды наказаний:\n\nа) Судебный штраф;\nб) Уголовный штраф;\nв) Лишение права занимать определенные должности или заниматься определенной деятельностью;\nг) Увольнение с государственной или военной службы, в том числе с лишением всех званий, наград и привилегий;\nд) Лишение свободы на определенный срок;\nе) Исправительные работы;\nё) Принудительные работы.\n\nПримечание: Исключительно сотрудники прокуратуры и следственного комитета уполномочены на назначение Уголовного штрафа в рамках задержания или расследования.\nПримечание 2: Размер уголовного штрафа определяется тяжестью обстоятельств и соразмерностью совершенного деяния. При преступлению до двух звезд сумма штрафа не превышает 30.000 рублей, при категории до пяти звезд сумма штрафа не превышает 80 000 рублей. За посягательство на жизнь, государственную измену и иные преступления, угрожающие государственной безопасности, а также за преступления против жизни человека, штрафная санкция не предусмотрена.\n\nч. 3 Судебные штрафы, предусмотренные статьями настоящего Кодекса, применяются исключительно в судебном порядке. Уголовные штрафы, предусмотренные статьями настоящего Кодекса, применяются исключительно сотрудниками Министерства внутренних дел РО, Федеральной службы безопасности РО, Федеральной службы охраны РО, а также Прокуратурой РО и судом.\n\nч. 4 В результате расследования правоохранительными органами по уголовным статьям может быть назначено только лишение свободы на определенный срок."],[1,"УК ст. 5.1","Уголовный кодекс РО · ГЛАВА V. Виды и назначение наказаний, освобождение от уголовной ответственности","Статья 5.1 Исправительные работы\n\nч. 1 Исправительные работы назначаются осужденному, имеющему основное место работы, а равно не имеющему его. Осужденный, имеющий основное место работы, отбывает исправительные работы по основному месту работы. Осужденный, не имеющий основного места работы, отбывает исправительные работы в местах, определяемых Судом.\n\nч. 2 Срок исправительных работ устанавливается приговором суда.\n\nч. 3 В случае злостного уклонения осужденного от отбывания исправительных работ суд может заменить неотбытое наказание принудительными работами или лишением свободы."],[1,"УК ст. 5.1.2","Уголовный кодекс РО · ГЛАВА V. Виды и назначение наказаний, освобождение от уголовной ответственности","Статья 5.1.2 Принудительные работы\n\nч. 1 Принудительные работы применяются как альтернатива лишению свободы.\n\nч. 2 Если, назначив наказание в виде лишения свободы, суд придет к выводу о возможности исправления осужденного без реального отбывания наказания в местах лишения свободы, он постановляет заменить осужденному наказание в виде лишения свободы принудительными работами.\n\nч. 3 Принудительные работы заключаются в привлечении осужденного к труду в местах, определяемых судом.\n\nч. 4 Срок принудительных работ устанавливается приговором суда.\n\nч. 5 В случае уклонения осужденного от отбывания принудительных работ либо признания осужденного к принудительным работам злостным нарушителем порядка и условий отбывания принудительных работ неотбытая часть наказания заменяется лишением свободы.\n\nч. 6 Места, порядок и иные условия отбывания принудительных работ определяется Судом."],[1,"УК ст. 5.2","Уголовный кодекс РО · ГЛАВА V. Виды и назначение наказаний, освобождение от уголовной ответственности","Статья 5.2 Общие начала назначения наказания\n\nч. 1 Лицу, признанному виновным в совершении преступления, назначается справедливое наказание в пределах, предусмотренных соответствующей статьей Особенной части настоящего Кодекса, и с учетом положений Общей части настоящего Кодекса.\n\nч. 1.2 По решению суда или постановлению прокуратуры РО лицу за совершение любого преступления, указанного в ч. 2 ст. 5.7 настоящего Кодекса, назначается справедливое наказание в пределах от минимальной санкции, предусмотренной применяемой нормой Особенной части настоящего Кодекса, и до 10 лет лишения свободы.\n\nч. 2 При назначении наказания учитываются характер и степень общественной опасности преступления и личность виновного, в том числе обстоятельства, смягчающие и отягчающие наказание.\n\nч. 3 При совокупности преступлений наказание назначается в пределах той статьи, которая предусматривает наиболее строгое наказание. При этом, суд и прокуратура РО на основании постановления может назначить наказание отдельно за каждое совершенное преступление путем их полного или частичного сложения.\n\nч. 4 Во внесудебном порядке срок лишения свободы за один или несколько одновременно разрешаемых эпизодов не может превышать пяти лет, за исключением случаев нарушения задержанным статьи 17.3 Уголовного кодекса непосредственно во время процессуальных действий. В таком случае допускается добавление наказания за оскорбление к совокупному наказанию за преступления, в том числе свыше пяти лет лишения свободы.\n\nч. 5 При упрощённом разрешении уголовного материала (в порядке статьи 56) может быть назначено только лишение свободы в пределах санкции статьи, но не более 5 лет по совокупности преступлений. Исключение - нарушение ст. 17.3 УК во время процессуальных действий: наказание за оскорбление может быть добавлено к общему сроку, даже если он превышает 5 лет. Иные виды наказаний в таком порядке не назначаются."],[1,"УК ст. 5.2.1","Уголовный кодекс РО · ГЛАВА V. Виды и назначение наказаний, освобождение от уголовной ответственности","Статья 5.2.1 Назначение наказания за неоконченное преступление\n\nч. 1 При назначении наказания за неоконченное преступление учитываются обстоятельства, в силу которых преступление не было доведено до конца.\n\nч. 2 Срок или размер наказания за приготовление к преступлению не может превышать половины максимального срока или размера наиболее строгого вида наказания, предусмотренного соответствующей статьей Особенной части настоящего Кодекса за оконченное преступление.\n\nч. 3 Срок или размер наказания за покушение на преступление не может превышать трех четвертей максимального срока или размера наиболее строгого вида наказания, предусмотренного соответствующей статьей Особенной части настоящего Кодекса за оконченное преступление."],[1,"УК ст. 5.3","Уголовный кодекс РО · ГЛАВА V. Виды и назначение наказаний, освобождение от уголовной ответственности","Статья 5.3 Обстоятельства, смягчающие наказание\n\nч. 1 Смягчающими обстоятельствами признаются:\n\nа) совершение преступления в результате физического или психического принуждения либо в силу материальной, служебной или иной зависимости;\nб) совершение преступления при нарушении условий правомерности необходимой обороны, задержания лица, совершившего преступление, крайней необходимости, обоснованного риска, исполнения приказа или распоряжения;\nв) противоправность или аморальность поведения потерпевшего, явившегося поводом для преступления;\nг) явка с повинной, активное способствование раскрытию и расследованию преступления, изобличению и уголовному преследованию других соучастников преступления;\nд) оказание медицинской и иной помощи потерпевшему после совершения преступления, добровольное возмещение имущественного ущерба и морального вреда, причиненных в результате преступления, иные действия, направленные на заглаживание вреда, причиненного потерпевшему;\nе) иные обстоятельства."],[1,"УК ст. 5.4","Уголовный кодекс РО · ГЛАВА V. Виды и назначение наказаний, освобождение от уголовной ответственности","Статья 5.4 Обстоятельства, отягчающие наказание\n\nч. 1 Отягчающими обстоятельствами признаются:\n\nа) совершение преступления в составе группы лиц;\nб) совершение преступления по мотивам политической, идеологической, расовой, национальной или религиозной ненависти, или вражды либо по мотивам ненависти или вражды в отношении какой-либо социальной группы;\nв) совершение преступления из мести за правомерные действия других лиц, а также с целью скрыть другое преступление или облегчить его совершение;\nг) совершение преступления в отношении лица или его близких в связи с осуществлением данным лицом служебной деятельности или выполнением общественного долга;\nд) совершение преступления с особой жестокостью, садизмом, издевательством, а также мучениями для потерпевшего;\nе) совершение преступления с использованием доверия, оказанного виновному в силу его служебного положения или договора;\nё) совершение преступления с использованием форменной одежды или документов представителя власти;\nж) совершение преступления в состоянии алкогольного или наркотического опьянения;\nз) совершение преступления с использованием психического давления на потерпевшего;\nи) рецидивизм;\nй) совершение преступления в отношении потерпевшего, находящегося в отношении виновного в заведомо беспомощном положении."],[1,"УК ст. 5.5","Уголовный кодекс РО · ГЛАВА V. Виды и назначение наказаний, освобождение от уголовной ответственности","Статья 5.5 Назначение более мягкого наказания, чем предусмотрено за данное преступление\n\nч. 1 При наличии исключительных обстоятельств, связанных с целями и мотивами преступления, ролью виновного, его поведением во время или после совершения преступления, и других обстоятельств, существенно уменьшающих степень общественной опасности преступления, а равно при активном содействии участника группового преступления раскрытию этого преступления наказание может быть назначено ниже низшего предела, предусмотренного статьей Особенной части настоящего Кодекса, или суд может назначить более мягкий вид наказания, чем предусмотрен этой статьей, или не применить дополнительный вид наказания, предусмотренный в качестве обязательного."],[1,"УК ст. 5.6","Уголовный кодекс РО · ГЛАВА V. Виды и назначение наказаний, освобождение от уголовной ответственности","Статья 5.6 Освобождение от уголовной ответственности в связи с назначением судебного штрафа и (или) исправительных работ. А также в связи с примирением сторон\n\nч. 1 Лицо, впервые совершившее преступление, предусмотренное статьями: предельный срок наказания, может быть освобождено судом от уголовной ответственности, если оно примирилось с потерпевшим и загладило причиненный потерпевшему вред.\n\nч. 2 Лицо, впервые совершившее преступление может быть освобождено судом от уголовной ответственности с назначением судебного штрафа от 10.000 и (или) исправительных работ за любые нарушения настоящего кодекса."],[1,"УК ст. 5.7","Уголовный кодекс РО · ГЛАВА V. Виды и назначение наказаний, освобождение от уголовной ответственности","Статья 5.7 Освобождение от уголовной ответственности в связи с истечением сроков давности\n\nч. 1 Лицо освобождается от уголовной ответственности, если со дня совершения преступления прошло 15 лет (( 15 дней ))\n\nч. 2 К лицам, находящимся в Федеральном розыске как по решению суда, так и по постановлению прокуратуры РО, сроки давности не применяются.\n\nч. 3 Сотрудники МВД/ФСБ могут установить уровень боло-розыска в диапазоне от ★-★★★★★ (приоритет розыска от 1 до 5) за нарушение Уголовного Кодекса.\n\nч. 4 По решению суда/постановлению прокуратуры РО гражданину может быть объявлен уровень боло-розыска в размере ★-★★★★★ (приоритет розыска от 1 до 5) за нарушение Уголовного Кодекса.\n\nч. 5 Сроки давности исчисляются со дня совершения преступления и до момента вступления приговора/решения об аресте в законную силу. В случае совершения лицом нового преступления сроки давности по каждому преступлению исчисляются самостоятельно."],[1,"УК ст. 5.8","Уголовный кодекс РО · ГЛАВА V. Виды и назначение наказаний, освобождение от уголовной ответственности","Статья 5.8 Судимость\n\nч. 1 При аресте по статьям помеченными ★★★★ (приоритет розыска 4) и более, в протоколе ареста ставится отметка о судимости.\n\nч. 2 Погашение или снятие судимости аннулирует все правовые последствия, предусмотренные настоящим Кодексом, связанные с судимостью.\n\nч. 3 При назначении в соответствии с частью 4, статьи 5 настоящего кодекса, меры наказания в виде уголовного штрафа за совершенное преступление, запрета к работе на государственной службе (судимости) не возникает."],[1,"УК ст. 5.9","Уголовный кодекс РО · ГЛАВА V. Виды и назначение наказаний, освобождение от уголовной ответственности","Статья 5.9 Лицо, добровольно сдавшее предметы, указанные в статьях 12.8, 12.8.1, 13.1, 13.2 настоящего Кодекса, освобождается от уголовной ответственности по соответствующей статье. Не может признаваться добровольной сдачей предметов их изъятие при задержании лица, а также при производстве любых оперативных и/или следственных действий."],[1,"УК ст. 5.10","Уголовный кодекс РО · ГЛАВА V. Виды и назначение наказаний, освобождение от уголовной ответственности","Статья 5.10 Лицо, заключенное под стражу, может быть освобождено под залог по статьям уголовного кодекса, не влекущим судимость. Залог устанавливается пропорционально количеству лет, на которые был заключен гражданин, в соотношении 1 к 25.000."],[1,"УК ст. 5.11","Уголовный кодекс РО · ГЛАВА V. Виды и назначение наказаний, освобождение от уголовной ответственности","Статья 5.11 Упрощенное разрешение уголовного материала сотрудником правоохранительного органа\n\nч. 1 Уполномоченный сотрудник правоохранительного органа вправе непосредственно в ходе задержания разрешить уголовный материал без оформления самостоятельного письменного или электронного уголовного делопроизводства, если одновременно:\n\nдеяние относится к общей подследственности;\n\nОсобенная часть настоящего Кодекса не предусматривает обязательного судебного рассмотрения;\n\nматериал не относится к исключительной юрисдикции Следственного комитета РО или Федеральной службы безопасности РО;\n\nсобытие преступления и причастность лица подтверждаются достаточными и непосредственно проверяемыми доказательствами;\n\nфедеральное законодательство не требует обязательного участия прокурора либо иной специальной процедуры.\n\nч. 2 Упрощенное разрешение уголовного материала не является предварительным расследованием и не требует составления постановления о возбуждении уголовного дела, обвинительного заключения или формирования отдельного уголовного дела. При этом сохраняются обязательные требования к законности задержания, разъяснению прав, видеофиксации, обыску, изъятию и сохранению доказательств.\n\nч. 3 По результатам упрощенного разрешения уголовного материала сотрудник правоохранительного органа вправе назначить лишение свободы на определенный срок в пределах санкции соответствующей статьи, но не более пяти лет по совокупности преступлений, либо уголовный штраф в порядке статьи 5.2 настоящего Кодекса.\n\nч. 4 При задержании лица, являющегося государственным сотрудником, сотрудник правоохранительного органа не вправе самостоятельно назначить ему уголовный штраф: такое решение принимает исключительно прокурор. Обязательные работы, лишение права занимать определенные долж
