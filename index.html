вила гос. — общие положения","Правила государственных организаций","Общее положение"],[9,"Правила гос. п. 1.1","Правила государственных организаций","1.1 Сотрудником государственных структур считается игрок использующий что-либо с фракционного склада, гардероба, автопарка и/или выполняющий свои обязанности вне зависимости от использования функционала (министры, адвокаты и т.п.)."],[9,"Правила гос. п. 1.1.1","Правила государственных организаций","1.1.1 Сотрудникам гос. структур запрещено любые криминальные действия без написанной и одобренной РП ситуации на форуме. | WARN / Ban / HardBan 3-15 дней.\nПояснение: РП ситуация должна содержать полную завязку и знакомство с криминальным миром, начиная от знакомств с определенными людьми, заканчивая дальнейшим продвижением в криминальный мир и сотрудничеством.\nИсключение: р. 13, п. 4."],[9,"Правила гос. п. 1.1.2","Правила государственных организаций","1.1.2 Сумма взятки не должна превышать 100.000 (взятка должна быть исключительно деньгами), для получения более крупных сумм необходимо написание криминальной РП ситуации (пояснение р. 1, п. 1.1). | WARN."],[9,"Правила гос. п. 1.2","Правила государственных организаций","1.2 Запрещено продавать / сливать гос. имущество / казну. | Demorgan 45-90 минут / Ban 3-30 дней / Hardban 7-30 / PermBan, а так же аннулирование сделки / обнуление персонажа.\nПримечание: при продаже слитого имущества администрация вправе выдать блокировку аккаунта до возврата денежных средств с продажи слитого имущества.\nПояснение: после изъятия администратор вправе выдать дополнительное наказание.\nИсключение: одобренная РП ситуация на форуме; одобрение главного куратора; гос.трейд, одобренный администрацией."],[9,"Правила гос. п. 1.2.1","Правила государственных организаций","1.2.1 Запрещено продавать или оставлять себе предметы, которые были получены после криминальных событий. | Demorgan 35-90 минут / Ban 3 - 15 дней / HardBan до изъятия.\nПримечание: все предметы, полученные по итогам перестрелки/операции, должны быть положены на склад / утилизированы, так как является вещь доками.\nПояснение: после изъятия администратор вправе выдать дополнительное наказание."],[9,"Правила гос. п. 1.2.2","Правила государственных организаций","1.2.2 Сотрудникам гос. структур разрешено хранить предметы, принадлежащие любой гос. структуре, исключительно на складе своей фракции, в транспорте своей фракции и(или) в своём инвентаре. | Demorgan 35-90 минут / Ban 3-30 дней + Изъятие / HardBan до изъятия.\nПояснение: после изъятия администратор вправе выдать дополнительное наказание."],[9,"Правила гос. п. 1.3","Правила государственных организаций","1.3 Запрещено изъятие адвокатских / обычных лицензий без весомой IC причины. | WARN / Ban 3-15 дней.\nПримечание: лидер фракции несет полную ответственность за настройку матрицы фракции, в случае массовых изъятий и нарушений лидер получает выговор / снятие.\nПример: в случае нарушения игроком статьи не связанной с оружием, стрельбой и т.п. изымать лицензию на оружие."],[9,"Правила гос. п. 1.4","Правила государственных организаций","1.4 Запрещено намеренно затягивать процесс задержания. | Demorgan 60 минут / WARN.\nПример: выбирать самый длительный маршрут проезда к КПЗ другой фракции; выбирать самое дальнее КПЗ для ареста игрока; задержание нескольких игроков, при котором, лишь с одним игроком проводят процессуальные действия, а остальные игроки ждут и т.п.\nИсключение: затягиванием не считается арест игрока в любом из КПЗ своей фракции."],[9,"Правила гос. п. 1.5","Правила государственных организаций","1.5 Запрещено принимать во фракцию игроков, которые имеют активный ЧС государственных организаций. | Demorgan 90 минут / WARN."],[9,"Правила гос. п. 1.6","Правила государственных организаций","1.6 Изъятие нелегальных предметов производится исключительно через функционал сервера. | Demorgan 60 минут / WARN."],[9,"Правила гос. п. 1.7","Правила государственных организаций","1.7 Максимально допустимый срок посадки в КПЗ за 1 звезду - до 10 минут. | HardBan 5-10 дней.\nПояснение: запрещено отклонение в большую сторону, максимальный срок для игрока, который имеет 5 звезд - 50 минут.\nИсключение: решение суда; постановление; террористический акт; при оскорблении игроком государственных сотрудников во время процессуальных действия разрешается добавление срока КПЗ, согласно УК сервера."],[9,"Правила гос. п. 1.8","Правила государственных организаций","1.8 Все права, а так же статьи, которые нарушил игрок, должны быть озвучены в голосовой чат. | Demorgan 50 минут / WARN / Ban 3-7 дней.\nПримечание: озвучивание должно быть в полном объеме, четкое, в умеренном темпе и понятное для игрока(-ов); при просьбе игрока расшифровать статьи, сотрудникам государственных структур необходимо полностью озвучить их.\nИсключение: в случае использовании игроком режима \"Я не слышу\" / \"Я без звука\" обязательна отыгровка в текстовый чат."],[9,"Правила гос. п. 1.9","Правила государственных организаций","1.9 При просьбе вызова адвоката от задержанного необходимо реализовать его право на защиту. | WARN.\nПримечание: игроку должна быть предоставлена возможность воспользоваться приложением \"Адвокаты\" и/или вызвать самостоятельно через \"Контакты\" -> \"Правительство\". Реализация прав должна происходить на территории КПЗ/допросной.\nИсключение: если игрок изначально отказался от адвоката, но захотел его попросить после, то сотрудник может отказать в этом; задержание по итогу и/или после одобренного постановления на арест/иска; игрок игнорирует вопрос о запросе адвоката от государственного служащего после своего запроса, который мог быть не услышан/не увиден сотрудником.\nПояснение: пункт правил распространяется на человека проводящего процессуальные действия; в случае запроса игроком гос. адвоката и не принятия вызова, должна быть предоставлена возможность вызвать адвоката через приложение \"Адвокаты\", в случае непринятия вызовов обоими адвокатами право считается реализовано; адвоката необходимо в полной мере ознакомить с нарушением игрока."],[9,"Правила гос. п. 1.10","Правила государственных организаций","1.10 Запрещено первым оскорблять, провоцировать, использовать унизительные анимации, а также грубо выражаться в присутствии / на задержанного или посторонних граждан. | Demorgan 100 минут / WARN / HardBan 5 дней.\nПримечание: сотрудники государственных структур могут, в рамках разумного, грубо выражаться в стрессовых ситуациях, таких как: перестрелки, криминальные действия от гражданских лиц и т.д.\nИсключение: написанная и одобренная RP-ситуация на криминального гос. служащего; раздел 1, п.10.1."],[9,"Правила гос. п. 1.10.1","Правила государственных организаций","1.10.1 В значимых для RP составляющей функциональных зеленых зонах (территории государственных организаций, территории массового сбора игроков и т.п.) запрещена модель поведения не соответствующая модели поведения государственного сотрудника. | WARN / Ban 2-5 дней / HardBan 5 дней.\nПример: получение взяток, неформальное общение, грубое общение и т.п.\nИсключение: общение между участниками государственных фракций при отсутствии рядом игроков из не государственных структур и/или задержанных; одобренная РП-ситуация на криминального гос. игрока; стрессовая РП ситуация, в ходе которой допускается применение незначительного насилия с целью запугивания допрашиваемого (1 удар / пощечина, удар тазером и т.п. незначительные увечья)."],[9,"Правила гос. п. 1.11","Правила государственных организаций","1.11 Запрещена выдача / изъятие военных билетов без весомой IC причины. | HardBan 15-30 дней / HardBan до изъятия / PermBan.\nИсключение: одобрение главного куратора."],[9,"Правила гос. п. 1.12","Правила государственных организаций","1.12 Премирование государственных фракций и их участников происходит исключительно через функционал финансирования. | Выговор лидеру.\nИсключение: одобрение главного куратора."],[9,"Правила гос. п. 1.13","Правила государственных организаций","1.13 Сотрудникам государственной организации запрещено повышать более чем на 1 ранг в сутки. | WARN / Ban 3 дня / Выговор лидеру + понижение игрока до прежнего ранга.\nИсключение: одобрение главного куратора; перевод с другой государственной организации; восстановление в должности; решение суда по исковому заявлению."],[9,"Правила гос. п. 1.14","Правила государственных организаций","1.14 Сотрудник государственной организации может быть арестован / посажен в КПЗ только при выявлении нарушения от прокурора, принявшего вызов на задержание. | Ban 7-15 дней / HardBan 7-10 дней.\nИсключение: пункт 1.22.1, решение суда, постановление, государственный переворот и т.п.; отсутствие удостоверения и ОПЗ на игроке.\nПримечание: вызов прокурора должен происходить на территории КПЗ / допросной, через приложение \"Контакты\". Если задержанный игрок был уволен из государственной организации во время задержания вызов прокурора так же является обязательным."],[9,"Правила гос. п. 1.15","Правила государственных организаций","1.15 Запрещено повышать игрока без отчета о проделанной работе. | Ban 3-15 дней / HardBan 5-10 дней / Выговор лидеру + понижение игрока до прежнего ранга.\nПримечание: отчет должен соответствовать установленной во фракции системе повышений.\nИсключение: перевод с другой государственной организации / восстановление после ухода по собственному желанию; одобрение главного куратора фракций; решение суда по исковому заявлению."],[9,"Правила гос. п. 1.16","Правила государственных организаций","1.16 Снятие функционального розыска с игрока возможно лишь сотрудником, которым он был выдан. | Warn / Ban / HardBan 3-15 дней.\nИсключение: решение суда / прокуратуры / одобрение главного следящего за гос. фракциями."],[9,"Правила гос. п. 1.17","Правила государственных организаций","1.17 Запрещено изымать предметы у игрока (из транспортного средства, рюкзаков, инвентаря и т.п.) не имея причин. | Hardban 15-30 дней / PermBan + Обнуление аккаунта.\nПримечание: решение по обнулению принимается ГА на своё усмотрение, в зависимости от объема изъятого."],[9,"Правила гос. п. 1.18","Правила государственных организаций","1.18 Игрокам государственных структур запрещено использование вещей не входящих во фракционный гардероб, а также нарушение общего внешнего вида государственного игрока. | Demorgan 60 - 90 минут / WARN.\nПример: неестественный цвет волос, неформальные прически, нанесение татуировок в районе лица / шеи, на кистях рук, грим / макияж и линзы неестественного цвета.\nИсключение: игроки под прикрытием / внедрении и т.д."],[9,"Правила гос. п. 1.18.1","Правила государственных организаций","1.18.1 Частные адвокаты исполняющие свою адвокатскую деятельность обязаны соблюдать официально-деловой стиль, соответствующий пункту 1.18. | Demorgan 35 - 90 минут / WARN."],[9,"Правила гос. п. 1.19","Правила государственных организаций","1.19 Запрещено использование фракционного склада вне фракционных мероприятий / процессов. | Ban 10-30 дней / HardBan 15-30 дней.\nИсключение: игроки под прикрытием / внедрении и т.д.\nПример: стычки за тайники с целью получения наград, перестрелки внерабочее время и т.п.."],[9,"Правила гос. п. 1.20","Правила государственных организаций","1.20 Запрещено намеренное злоупотребление функционалом государственных структур. | WARN / Ban 7-15 дней / HardBan 10-30 дней / PermBan.\nПод злоупотребление попадает:\n- Задержание за маску (в т.ч. приказ снять маску, а затем дальнейшее задержание за неподчинение, в случае невыполнения)\n- Выдача 5 звезд / розыска за мелкое нарушение, выдача срока КПЗ максимального времени за мелкое нарушение\n- Необоснованная выдача судимости\n- Задержание игрока внутри здания Больницы за функциональный розыск\n- Добавление звезд за функциональный розыск. Если игрок изначально имел 3 звезды, которые со временем истекли, и у него осталась 1 звезда, то запрещено давать дополнительно 2 звезды либо перевыдавать розыск, наказывать необходимо как за 1 звезду\n- Намеренный срыв игрового процесса обычным игрокам, а именно задержание в казино(включая крышу), массовые задержания на территориях складов, офисов, намеренное и целенаправленное задержание участников одной ОПГ и т.п.\n- Задержание игроков государственных структур во время задержания ими других игроков\nИсключение: решение прокурора, принявшего вызов на задержание."],[9,"Правила гос. п. 1.21","Правила государственных организаций","1.21 Номер опознавательного знака игроков из государственных фракций приравнивается к его статическому ID (#1234).\nПояснение: опознавательный знак должен быть надет на игрового персонажа и виден при любых условиях, и обстоятельствах (только для сотрудников МВД, ГИБДД). | Demorgan 60 минут.\nИсключение: следователи, при работе под прикрытием(слежка с целью сбора информации); участники гос. переворота."],[9,"Правила гос. п. 1.21.1","Правила государственных организаций","1.21.1 Сотрудники государственных структур обязаны носить и предоставлять удостоверение, при запросе игрока(-ов) в любой форме. | Demorgan 60 минут.\nПримечание: если игрок всё время общается через войс-чат, то требование показать УДО через текстовый чат может игнорироваться.\nПояснение: предоставлять удостоверение необходимо только участникам RP процесса, где обе стороны задействованы в нем, случайные или провокационные просьбы можно игнорировать, если игрок не является участником общего RP процесса.\nИсключение: игроки больницы, Вести Москвы."],[9,"Правила гос. п. 1.21.2","Правила государственных организаций","1.21.2 Сотрудники государственных структур обязаны функционально (в планшете) находится в том отделе, в котором они фактически находятся. | Demorgan 45 минут."],[9,"Правила гос. п. 1.22","Правила государственных организаций","1.22 Запрещено действовать вопреки решений постановлений, исков, прокурора (в т.ч. прокуратуры) и суда. | Ban 5-15 дней / Hardban 5-15 дней.\nИсключение: р. 1 п.22.1."],[9,"Правила гос. п. 1.22.1","Правила государственных организаций","1.22.1 Прокурорам и судьям запрещено выносить заведомо неверные, очевидно нарушающие РП логику и/или правила проекта, решения. | WARN / Ban 7-15 дней / HardBan 10-30 дней / PermBan.\n\nВзаимодействие государственных организаций"],[9,"Правила гос. п. 2.1","Правила государственных организаций","2.1 Следственный комитет руководит предварительным расследованием уголовных дел и вправе давать обязательные к исполнению поручения МВД в пределах расследуемого уголовного дела."],[9,"Правила гос. п. 2.2","Правила государственных организаций","2.2 МВД обеспечивает охрану общественного порядка, оказывает содействие Следственному комитету и ФСБ при проведении специальных мероприятий."],[9,"Правила гос. п. 2.3","Правила государственных организаций","2.3 ГИБДД осуществляет контроль безопасности дорожного движения и при выявлении признаков преступления незамедлительно передает материалы в МВД, Следственный комитет или ФСБ в зависимости от компетенции."],[9,"Правила гос. п. 2.4","Правила государственных организаций","2.4 ФСБ координирует мероприятия по борьбе с нарушениями федерального уровня и преступлениями против государственной безопасности, при необходимости привлекая иные государственные организации."],[9,"Правила гос. п. 2.5","Правила государственных организаций","2.5 Армия привлекается к обеспечению безопасности государства исключительно в случаях, предусмотренных законодательством сервера либо по решению Правительства или Премьер-министра."],[9,"Правила гос. п. 2.6","Правила государственных организаций","2.6 Правительство осуществляет общее руководство исполнительной властью, не вмешиваясь в расследование уголовных дел и оперативную деятельность правоохранительных органов, за исключением случаев, предусмотренных законодательством сервера."],[9,"Правила гос. п. 2.7","Правила государственных организаций","2.7 Любые внутренние инструкции, регламенты работы, отделы, услуги и т.п. должны быть утверждены Правительством и/или куратором фракции. |Выговор лидеру."],[9,"Правила гос. п. 2.8","Правила государственных организаций","2.8 Перевод должен быть одобрен со стороны двух лидеров, либо их заместителей (лидер и заместители фракции, в которой находится игрок, и в которую он хочет перевестись). | WARN / Выговор лидеру + увольнение игрока.\nИсключение: перевод может быть одобрен со стороны Премьер-министра."],[9,"Правила гос. п. 2.9","Правила государственных организаций","2.9 Запрещено намеренно повышать игроков с целью дальнейшего его перевода в другую фракцию. | WARN / Выговор лидеру + понижение игрока на 1 ранг.\nПояснение: с момента получения ранга во фракции игрок не может получить одобрение на перевод в другие государственные организации в течении 7 дней."],[9,"Правила гос. п. 2.10","Правила государственных организаций","2.10 Запрещено при переводе устанавливать ранг выше, чем он был предыдущей фракции. | WARN / Выговор лидеру + понижение игрока.\n\nПравительство"],[9,"Правила гос. п. 3.1","Правила государственных организаций","3.1 Правительство - высший коллегиальный исполнительный орган государственного управления и государственной власти. | Demorgan 15 - 90 минут / WARN / Выговор лидеру / Снятие.\nЗадачи и обязанности Правительства:\nПроводить проверки государственных организаций.\nПримечание: проверки могут проводится не более 1 в неделю на одну государственную организацию.\nЗаконодательная власть правительства обязана разработать и обеспечивать актуальность законодательной базы.\nПримечание: куратор фракции может отклонить изменение / нововведение в законодательную базу, если такие изменения идут в разрез RP логики.\nРасходовать бюджет государственной казны только в интересах государства.\nПравительство вправе урезать премии каким-либо государственным структурам, при наличии веской IC причины и RP составляющей.\nУполномоченным сотрудникам правительства, ведущих надзорную деятельность, запрещено игнорировать любые правонарушения со стороны сотрудников государственных структур.\nЛюбое актуальное постановление / указ должен быть выложен на форум в специальной теме в разделе правительства.\nИсключение: функциональный ордер на обыск транспорта.\nСотрудники прокуратуры, а также власть правительства уполномочены снимать розыск с игроков при его ошибочной выдаче от гос. служащих, а также от внутриигровой системы.\nВыдача адвокатских лицензий, поддержание общедоступности реализации прав задержанного."],[9,"Правила гос. п. 3.2","Правила государственных организаций","3.2 Цена регистрации предприятий не может превышать 250.000 игровой валюты. | Выговор лидеру.\nПримечание: лимит может быть увеличен на усмотрение ГА."],[9,"Правила гос. п. 3.3","Правила государственных организаций","3.3 Запрещена выдача адвокатских лицензий выше функциональной стоимости. | Demorgan 100 минут.\n\nФСБ"],[9,"Правила гос. п. 4.1","Правила государственных организаций","4.1 Сотрудники ФСБ подчиняются министру юстиции и Премьер-министру."],[9,"Правила гос. п. 4.2","Правила государственных организаций","4.2 ФСБ - федеральная правоохранительная структура, орган внутренней разведки, контрразведки и антитеррористической деятельности. | Demorgan 10 - 90 минут / WARN / Выговор.\nЗадачи и обязанности ФСБ:\n\nСлежка за исполнением и обработкой вызовов от обычных игроков, которые поступают в МВД/ГИБДД.\nФормирование кейс-файлов.\nПояснение: материал может поступать от игроков всех фракций, итоговый кейс должен быть предоставлен сотрудниками ФСБ, материал, который находится внутри может быть от любой фракции.\nРеагирование на нарушение федерального характера.\nОтработка по региональным нарушениям при запросе от старшего состава МВД / ГИБДД.\nПримечание: запрос делается в случае недостатка региональных правоохранительных структур при массовых беспорядках, либо других веских IC причин.\nПояснение: запрос от старшего состава МВД / ГИБДД через рацию департамента должен содержать уточнение, куда и для каких целей, требуется помощь.\nВыявление коррупционных преступлений в государственных органах.\nПроведение специальных операций.\nМВД"],[9,"Правила гос. п. 5.1","Правила государственных организаций","5.1 Сотрудники МВД подчиняются более старшему составу МВД, министерству внутренних дел и премьер-министру."],[9,"Правила гос. п. 5.2","Правила государственных организаций","5.2 МВД региональная правоохранительная структура, которая занимается обеспечением порядка и безопасности на территории муниципалитетов. | Demorgan 15 - 90 минут / Выговор лидеру.\nЗадачи и обязанности МВД:\nОхрана общественного порядка.\nПатрулирование.\nРеагирование на вызовы.\nЗадержание преступников.\nПроведение оперативно-розыскных мероприятий.\nИсполнение поручений Следственного комитета.\nКонвоирование задержанных.\nОхрана мест происшествий.\nПримечание: при отсутствии лидера ФСБ, фракции МВД, на период его отсутствия, разрешается отрабатывать нарушения федеральной юрисдикции."],[9,"Правила гос. п. 5.3","Правила государственных организаций","5.3 Сотрудникам МВД необходимо обрабатывать обращения граждан не позднее 48 часов с момента подачи обращения. | Выговор лидеру.\n*Возможны исключения.\n\nАрмия"],[9,"Правила гос. п. 6.1","Правила государственных организаций","6.1 Основные задачи армии:\nЗащита военных объектов.\nОхрана складов вооружения.\nПроведение военной подготовки.\nВыполнение задач в условиях чрезвычайного или военного положения.\nОбеспечение государственных мероприятий по распоряжению Правительства или Премьер-министра.\nОказание помощи силовым структурам в случаях, предусмотренных законодательством сервера."],[9,"Правила гос. п. 6.2","Правила государственных организаций","6.2 Армия имеет право задерживать граждан за противоправные действия только на территории Форта или около него, а также в случае нарушений в отношении сотрудников армии для дальнейшей передачи сотрудникам ФСБ/МВД или самостоятельной транспортировки задержанного игрока с дальнейшей передачей сотрудникам ФСБ/МВД. | Demorgan 50-90 минут / WARN.\nИсключение: задержания сотрудников армии за военные преступления (дезертирство и подобного рода нарушения), военное положение, режим ЧС."],[9,"Правила гос. п. 6.3","Правила государственных организаций","6.3 Территория армии начинается после КПП, вся территория до КПП свободна для посещения граждан."],[9,"Правила гос. п. 6.4","Правила государственных организаций","6.4 Сотрудники армии подчиняются: министерству обороны, более старшему составу армии и Премьер-министра.\n\nОбщее положение силовых структур"],[9,"Правила гос. п. 7.1","Правила государственных организаций","7.1 Сотрудниками силовых структур являются все сотрудники ГИБДД, сотрудники МВД, армии, ФСБ."],[9,"Правила гос. п. 7.2","Правила государственных организаций","7.2 Сотрудникам силовых структур запрещено задерживать игрока который был убит в процессе задержания и находится в больнице. | WARN."],[9,"Правила гос. п. 7.3","Правила государственных организаций","7.3 Сотрудники силовых структур обязаны патрулировать, проводить задержание / выезжать на вызовы и мероприятия (включая функциональные) только на фракционном транспорте силовых структур. | Demorgan 45 минут.\nИсключение: следователи и переговорщики.\nПримечание: следователи могут приезжать на личном транспорте с целью сбора информации для дальнейшего расследования, при этом им запрещено участвовать в перестрелках и задержании. Запрещено использование фракционного транспорта детективов для патрулирования, реагирования на вызовы или перевозки задерживаемых. Переговорщики могут приезжать на личном транспорте с целью установления контакта с похитителями для дальнейшего проведения переговоров, при этом им запрещено участвовать в перестрелках."],[9,"Правила гос. п. 7.3.1","Правила государственных организаций","7.3.1 Запрещено выезжать на ограбления (бизнеса, банка и др. функциональные активности) в составе менее 2-х человек. | Demorgan 45 минут.\nИсключение: следователи, переговорщики."],[9,"Правила гос. п. 7.4","Правила государственных организаций","7.4 При задержании / выдаче розыска дистанционно / аресте / изъятии лицензии частного адвоката / изъятии обычных лицензии /обыске игрока или авто за противоправные действия / выдаче ордера на арест / работе по похищениям/ограблениям банков/бизнесов игроки государственных фракций обязаны иметь видеозапись с причиной вышеперечисленного, а также всего процесса, и хранить ее в течение 48 часов с момента инцидента. | Demorgan 100 минут / WARN / Ban 10-15 дней / Hardban 15-30 дней / PermBan + Обнуление аккаунта.\nПояснение: видеозапись необходима в случае оформления игроком иска в суд. Администрация вправе запросить видеоматериал для разбора ситуации, установления причины задержания и т.п., игроки в свою очередь обязаны предоставить видео по первому требованию администрации, но не позднее 24 часов с момента запроса.\nПримечание: видеозапись должна быть цельной, без каких-либо редакций и обработок. Качество видео должно быть не менее 480p и иметь оригинальный звук."],[9,"Правила гос. п. 7.5","Правила государственных организаций","7.5 Сотрудникам силовых структур запрещено находиться на территории криминальной организации. | Demorgan 90 минут / WARN.\nИсключение: рейд, работа под прикрытием, военное положение, если с территории был открыт огонь по сотрудникам, они могут в течение 15 минут зайти на территорию (отсчёт времени идёт с момента открытия огня по гос. сотрудникам).\nПримечание: если по сотрудникам ФСБ, МВД, Армии открыли огонь, они могут находиться на титульном районе ОПГ в количестве от 10 человек.\n\nСудебная власть"],[9,"Правила гос. п. 8.1","Правила государственных организаций","8.1 Лидер судебной ветви может назначаться главным следящим за государственными структурами.\nПримечание: путем обзвона или свободного назначения (на усмотрение гл. следящего)."],[9,"Правила гос. п. 8.2","Правила государственных организаций","8.2 Председатель верховного суда исполняет обязанности главного судебного органа, имеет все функции и возможности для выдачи наказаний всем игрокам, включая лидеров фракций и верховных судей."],[9,"Правила гос. п. 8.2.1","Правила государственных организаций","8.2.1 Председатель верховного суда имеет возможность назначить в своё подчинение не более 3 верховных судей.\nПримечание: итоговое количество устанавливает Главный администратор / Главный куратор государственных фракций."],[9,"Правила гос. п. 8.3","Правила государственных организаций","8.3 Решение председателя верховного суда можно обжаловать путем IC иска, который рассматривается кураторами Правительства либо гл. следящим за государственными структурами."],[9,"Правила гос. п. 8.4","Правила государственных организаций","8.4 Снятие председателя верховного суда происходит путем написания кейс-файла, который одобряет / отклоняет гл. следящий за государственными структурами."],[9,"Правила гос. п. 8.4.1","Правила государственных организаций","8.4.1 За неверные решения судья получает 1 штрафной балл.\nПримечание: незначительные нарушения, за грубые нарушение предусмотрено снятие (см. п. п. 8.4.2)."],[9,"Правила гос. п. 8.4.2","Правила государственных организаций","8.4.2 При достижении 5 штрафных баллов верховного судью снимают с занимаемой должности."],[9,"Правила гос. п. 8.4.3","Правила государственных организаций","8.4.3 Председатель верховного суда может быть снят по решению лидера Правительства, при одобрении главного куратора."],[9,"Правила гос. п. 8.4.4","Правила государственных организаций","8.4.4 Штрафной балл снимается главным следящим за государственными структурами, ЗГА или ГА, на личное их усмотрение, в зависимости от активности судебной ветви, но не чаще, чем 1 балл раз в 5 дней."],[9,"Правила гос. п. 8.5","Правила государственных организаций","8.5 По решению верховного судьи лидер государственной организации может быть снят. | WARN / Выговор.\nПояснение: для снятия необходим иск в суд, весомые и грубые нарушения IC законов, а также одобрение гл. следящего за гос. организациями.\nПримечание: решение по выдаче выговора / снятия с должности принимается коллективно с главным куратором."],[9,"Правила гос. п. 8.6","Правила государственных организаций","8.6 Все судебные процессы происходят в здании правительства."],[9,"Правила гос. п. 8.7","Правила государственных организаций","8.7 Судебному подразделению необходимо начать принятие обращения граждан не позднее 48 часов с момента обращения. | Выговор.\nПояснение: в случае отказа необходимо дать развернутое и мотивированное решение причин отказа."],[9,"Правила гос. п. 8.7.1","Правила государственных организаций","8.7.1 Принятие мер / расследование должно начаться не позднее, чем 48 часов с момента обработки иска. | Выговор."],[9,"Правила гос. п. 8.7.2","Правила государственных организаций","8.7.2 Ходатайства и иные обращения / дополнения к суду в рамках уже принятого дела должны рассматриваться не позднее 48 часов с момента подачи.| Предупреждение / Выговор."],[9,"Правила гос. п. 8.7.3","Правила государственных организаций","8.7.3 На исполнение судебных актов устанавливается временные рамки до 72 часов, в зависимости от ситуации и итогов судебного решения. | Выговор.\nПример: запросы, компенсации, восстановлении в должности, проведении прокурорских проверок, проведение внутренних проверок и т.п.\nИсключение: одобрение главного куратора фракций.\nПояснение: в случае подачи апелляции, кассации на судебный акт, который подлежит исполнению, то сроки исполнения такого акта приостанавливаются до окончания обжалования."],[9,"Правила гос. п. 8.7.4","Правила государственных организаций","8.7.4 При вынесении итога по исковому заявлению суд должен дать мотивированное и развернутое решение в течение 48 часов. | Выговор.\nИсключение: одобрение главного куратора фракций.\n\nСледственный комитет"],[9,"Правила гос. п. 9.1","Правила государственных организаций","9.1 Лидер Следственного комитета назначается администрацией сервера."],[9,"Правила гос. п. 9.2","Правила государственных организаций","9.2 Основные задачи:\nРасследование уголовных преступлений, отнесенных к подследственности Следственного комитета.\nВозбуждение уголовных дел.\nПроведение следственных действий.\nСбор и закрепление доказательств.\nПредъявление обвинения.\nПередача уголовного дела в суд для утверждения обвинительного заключения."],[9,"Правила гос. п. 9.3","Правила государственных организаций","9.3 Следователь вправе проводить следственные действия (допрос, осмотр места происшествия, обыск, выемку, следственный эксперимент и иные процессуальные мероприятия) только при наличии законных оснований. | WARN / Ban 3 - 7 дней."],[9,"Правила гос. п. 9.4","Правила государственных организаций","9.4 Запрещается возбуждать уголовные дела, предъявлять обвинения либо применять меры процессуального принуждения при отсутствии достаточных доказательств или исключительно на основании предположений."],[9,"Правила гос. п. 9.5","Правила государственных организаций","9.5 Лидер Следственного комитета имеет бальную штрафную систему (см. раздел с Судьями)."],[9,"Правила гос. п. 9.6","Правила государственных организаций","9.6 Сотрудники Следственного комитета обязаны взаимодействовать с МВД, ГИБДД, прокуратурой и иными государственными организациями только после запроса."],[9,"Правила гос. п. 9.7","Правила государственных организаций","9.7 Сотрудникам Следственного комитета запрещается участвовать в патрулировании, проведении рейдов и иных мероприятиях, не относящихся к их компетенции, за исключением случаев совместных мероприятий. | Demorgan 100 минут / Ban 5-7 дней."],[9,"Правила гос. п. 9.8","Правила государственных организаций","9.8 Любое процессуальное решение должно быть объективным и беспристрастным. Запрещается злоупотребление должностными полномочиями, фабрикация доказательств и оказание давления на участников уголовного процесса. | WARN / Ban 7-15 дней / HardBan 10-30 дней / PermBan."],[9,"Правила гос. п. 9.9","Правила государственных организаций","9.9 Следственный комитет обязан принять в работу поступающие документы в течение 24-х часов. | Выговор лидеру.\n\nГИБДД"],[9,"Правила гос. п. 10.1","Правила государственных организаций","10.1. Основные задачи и обязанности ГИБДД:\nКонтроль соблюдения Правил дорожного движения.\nОформление ДТП.\nРегулирование дорожного движения.\nПроверка документов водителей.\nПроведение специальных профилактических мероприятий.\nРозыск транспортных средств по ориентировкам.\nСопровождение организованных колонн."],[9,"Правила гос. п. 10.2","Правила государственных организаций","10.2 Сотрудники ГИБДД подчиняются более старшему составу ГИБДД, руководящему составу МВД и Правительству."],[9,"Правила гос. п. 10.3","Правила государственных организаций","10.3 Инспектор ГИБДД обязан действовать вежливо, беспристрастно и исключительно в рамках предоставленных ему полномочий."],[9,"Правила гос. п. 10.4","Правила государственных организаций","10.4 Сотрудник вправе остановить транспортное средство при наличии предусмотренных законом оснований либо в рамках проведения специальных мероприятий или ориентировок. | Demorgan 60 - 100 минут."],[9,"Правила гос. п. 10.5","Правила государственных организаций","10.5 Сотрудникам ГИБДД разрешено задерживать других игроков при выявленных признаках преступлений и затем обязательно передавать в компетентные правоохранительные органы. | Demorgan 45 минут."],[9,"Правила гос. п. 10.6","Правила государственных организаций","10.6 Запрещается использовать служебный транспорт и специальные полномочия в личных целях, а также инициировать необоснованные проверки граждан. | Demorgan 60-100 минут.\n\nВести Москвы"],[9,"Правила гос. п. 11.1","Правила государственных организаций","11.1 Вести Москвы - свободное новостное агентство, подчиняющееся правительству и министерству культуры."],[9,"Правила гос. п. 11.2","Правила государственных организаций","11.2 Сотрудники Вести Москвы обязаны проверять, редактировать и обрабатывать функциональные объявления граждан. | Беседа / Выговор лидеру."],[9,"Правила гос. п. 11.3","Правила государственных организаций","11.3 Запрещена подача объявлений / новостей в обход функционала проекта. | WARN.\nИсключение: написанная РП ситуация на форуме, теракт (игровой захват), доп. плата за срочность, долгосрочные контракты на подачу объявлений, проведение наборов во фракцию."],[9,"Правила гос. п. 11.4","Правила государственных организаций","11.4 Запрещена подача объявлений (adv) / новостей (wnews) не содержащих всеобщий характер, относящийся ко всем игрокам сервера. | Demorgan 15-35 минут.\nПример: приветы, поздравления конкретных игроков/семей и т.п."],[9,"Правила гос. п. 11.5","Правила государственных организаций","11.5 Подача объявлений / новостей не должна содержать оскорбительный характер или нарушать другие правила проекта. | Наказание согласно регламенту правил(-а) проекта."],[9,"Правила гос. п. 11.6","Правила государственных организаций","11.6 Сотрудники Вести Москвы могут задерживать только на территории зелёной зоны Вести Москвы для дальнейшей передачи игрокам силовой структуре для проведения процессуальных действий. | Demorgan 60 - 100 минут / WARN.\nПримечание: если задержанный игрок не передан силовой структуре в течение 15 минут с начала задержания, задержание прекращается.\n\nФСО"],[9,"Правила гос. п. 12.1","Правила государственных организаций","12.1 ФСО — структура, осуществляющая обеспечение безопасности и государственной охраны высших должностных лиц, подчиняющееся Правительству."],[9,"Правила гос. п. 12.2","Правила государственных организаций","12.2 Задачи и обязанности ФСО:\nОбеспечение личной безопасности охраняемых лиц.\nПримечание:\nк охраняемым лицам относятся Президент, представители Правительства и иные должностные лица, определённые законодательством сервера или решением Правительства.\nОсуществление охраны государственных объектов особой важности.\nОбеспечение безопасности при проведении официальных мероприятий с участием охраняемых лиц.\nПояснение:\nсотрудники ФСО осуществляют предварительную подготовку маршрута, обеспечивая безопасность охраняемого лица.\nСопровождение и обеспечение безопасности охраняемых лиц при их передвижении.\nПримечание:\nмаршрут сопровождения может быть изменён при наличии угрозы безопасности охраняемого лица.\nВзаимодействие с ФСБ, МВД, ГИБДД, Следственным комитетом и Армией при обеспечении безопасности охраняемых лиц."],[9,"Правила гос. п. 12.3","Правила государственных организаций","12.3 Запрещено игнорирование запросов на сопровождение. | Demorgan 15 - 60 минут."],[9,"Правила гос. п. 12.4","Правила государственных организаций","12.4 Максимально допустимое количество машин при сопровождении - 10, минимальное - 2. | Demorgan 15 - 35 минут."],[9,"Правила гос. п. 12.5","Правила государственных организаций","12.5 Руководящему составу правительство в рамках рабочих обязанностей / выездов запрещено выезжать без сопровождения ФСО. | Demorgan 20 - 45 минут.\n\nПравила проведения РП допроса"],[9,"Правила гос. п. 13.1","Правила государственных организаций","13.1 РП допрос должен иметь веские IC основания. | WARN.\nПримечание: веские IC основания - задержания после ограбления бизнесов/банков, похищения и ограбления населения, террористические акты, гос. переворот и т.п.\nИсключение: допрос в рамках иска / обращения в прокуратуру и судебного заседания / преследование по уголовному делопроизводству."],[9,"Правила гос. п. 13.1.1","Правила государственных организаций","13.1.1 Допрос можно проводить только в присутствии следователя. | WARN / Ban 2-5 дней.\nИсключение: допросы, не относящиеся к уголовным правонарушениям."],[9,"Правила гос. п. 13.2","Правила государственных организаций","13.2 Допрашиваемому запрещено нарушать правила PG. | Demorgan 35-100 минут / Ban 2-5 дней.\nПримечание: вытягивание информации во время допроса - естественный процесс, постепенная дача информации не считается за PG."],[9,"Правила гос. п. 13.3","Правила государственных организаций","13.3 Допрашиваемый не обязан отвечать четко на вопросы связанные с его рангом / влиянием в криминальной организации, а так же на прямые вопросы, связанные с криминальной деятельностью фракции.\nПримечание: ответ обязан поступать, однако можно отвечать размыто и косвенно."],[9,"Правила гос. п. 13.3.1","Правила государственных организаций","13.3.1 Сотрудникам государственных фракций запрещено задавать некорректные вопросы в /do. | WARN.\nПример: /do Состоит ли игрок в криминальной фракции? /do Какой ранг имеет игрок во фракции? и др. подобные."],[9,"Правила гос. п. 13.4","Правила государственных организаций","13.4 Допрос не должен нести грубый насильственный характер, запрещено наносить телесные повреждения. | WARN.\nИсключение: криминальная РП ситуация на государственного сотрудника; р. 1 п. 10.1 правил государственных организаций."],[9,"Правила гос. п. 13.4.1","Правила государственных организаций","13.4.1 Допрос без написанной и одобренной РП ситуации (без применения силы) должен происходить исключительно в допросной или интерьере фракции допрашивающего игрока. | WARN."],[9,"Правила гос. п. 13.4.2","Правила государственных организаций","13.4.2 Допрос с написанной и одобренной РП ситуации (с применением силы) должен происходить исключительно вне зеленых зон, в т.ч. вне интерьера фракции допрашиваемого игрока. | WARN."],[9,"Правила гос. п. 13.5","Правила государственных организаций","13.5 Допрос не должен длиться более 60 минут. | Demorgan 35-90 минут всем участникам допроса со стороны государственной фракции."],[9,"Правила гос. п. 13.6","Правила государственных организаций","13.6 Запрещено намеренно затягивать RP допрос. | WARN.\nПояснение: бесполезные вопросы, вопросы не несущие какие-либо RP итоги и последствия, диалоги, которые не имеют смысловую нагрузку и прочее.\n\nПравила обыска багажников транспортных средств"],[9,"Правила гос. п. 14.1","Правила государственных организаций","14.1 Выдача ордера на обыск любого транспортного средства настраивается лидером фракции.\nПримечание: лидер фракции несет полную ответственность за настройку матрицы фракции, в случае массовых изъятия и нарушения р. 1, п. 17 лидер получает выговор / снятие."],[9,"Правила гос. п. 14.1.1","Правила государственных организаций","14.1.1 Ордер может быть выдан на основе: массовых беспорядков, увеличения оборота незаконного оружия, военного положения, решению суда, решению прокурора, рейда и т.п.."],[9,"Правила гос. п. 14.1.2","Правила государственных организаций","14.1.2 Ордер можно использовать лишь на те транспортные средства, которые фигурируют в кейс-файле / делопроизводстве / судебном иске / нарушении."],[9,"Правила гос. п. 14.2","Правила государственных организаций","14.2 При обычном патрулировании обыск транспортного средства можно произвести исключительно за нарушение УК.\nИсключение: р. 14, п. 1.2 и п. 3."],[9,"Правила гос. п. 14.3","Правила государственных организаций","14.3 При ограблении бизнеса / банка / дома государственные структуры вправе осмотреть все близстоящие транспортные средства."],[9,"Правила гос. п. 14.4","Правила государственных организаций","14.4 При использовании ордера обязательно иметь видеоматериал и хранить его 48 часа, согласно р. 7, п. 4 предоставлять администрации."],[10,"Правила проекта — общие положения","Основные правила проекта","Общее положение"],[10,"Правила проекта п. 1.1","Основные правила проекта","1.1 Проект позиционирует себя как русскоязычный, все диалоги должны происходить на русском языке. | Mute 60-240 минут.\nИсключение: отдельные слова и фразы для отыгровки роли своего персонажа."],[10,"Правила проекта п. 1.2","Основные правила проекта","1.2 Администрация не компенсирует средства, услуги, предметы и т.д., которые были утрачены в силу функционального воздействия / задумки системы.\nПояснение: подразумеваемое изъятие предметов происходит без участия администрации, либо других лиц, все функциональные системы автономны. Например, если Вы не успели забрать вовремя предметы после покупки на маркетплейсе, то они у Вас пропадут.\nПример: пропажа предметов со склада маркетплейса и т.п."],[10,"Правила проекта п. 1.3","Основные правила проекта","1.3 На проекте существуют различные виды наказаний; исходя из обстоятельств ситуации, а также грубости и многократности нарушения игрок может получить:\n- PermBan — глобальная блокировка на всем проекте.\n- HardBan — блокировка аккаунта на определенном сервере без возможности игры на других персонажах / аккаунтах в рамках данного сервера.\n- Ban — блокировка определенного персонажа при возможности игры на другом в рамках одного сервера.\n- Demorgan — ограничение свободы в виде своеобразной игровой тюрьмы, которую невозможно покинуть до истечения срока.\n- GunBan — блокировка использования оружия пользователем.\n- Mute — блокировка использования голосового и текстового чатов пользователем.\n- Warn — внутриигровое предупреждение, снимающееся за RCoins.\n- VehBan - ограничение по управлению транспортного средства игроком, устанавливает ограничения по максимальной скорости для определенного игрока."],[10,"Правила проекта п. 1.4","Основные правила проекта","1.4 Все изменения и дополнения к правилам проекта вступают в силу исключительно после официального оповещения руководством в разделе «Новости» официального Discord-сервера проекта.\nПояснение: До момента официального оповещения об изменениях любые корректировки, дополнения или новые редакции правил не считаются действующими и не подлежат применению.\n\nПоложение об аккаунте и персонаже\n\nПоложение об аккаунте:"],[10,"Правила проекта п. 2.1","Основные правила проекта","2.1 Максимальное количество разрешенных аккаунтов на одного человека - один. | Блокировка всех аккаунтов на 30 дней / PermBan."],[10,"Правила проекта п. 2.2","Основные правила проекта","2.2 Запрещено передавать аккаунт 3-м лицам. | PermBan."],[10,"Правила проекта п. 2.3","Основные правила проекта","2.3 Администрация не несет ответственности за аккаунт игрока в случае его передачи, взлома, обмана и т.д."],[10,"Правила проекта п. 2.4","Основные правила проекта","2.4 Запрещена продажа / обмен игровых аккаунтов. | PermBan."],[10,"Правила проекта п. 2.5","Основные правила проекта","2.5 Запрещено одновременно состоять несколькими персонажами во фракции. | WARN персонажей.\nИсключение: при покупке третьего персонажа можно вступать двумя в любые две фракции (все три персонажа должны быть созданы).\nПояснение: какой именно персонаж находится во фракции (1 и 3, 2 и 3, либо 1 и 2) не имеет никакого значения.\nПримечание: запрещено находится на старших / руководящих рангах в обеих фракциях.\n\nПоложение об игровом имуществе:"],[10,"Правила проекта п. 2.6","Основные правила проекта","2.6 Запрещено владеть имуществом без игровой активности. | Изъятие имущества.\nИгровая активность - это активность персонажа, которая присуща каждому игроку во время игры (перестрелки, игровые покупки, игра в азартные игры и т.п.)\nИгровой активностью не считается:\nОплата налогов\nОплата заказов\nАФК\nДля сохранения своего имущества необходимо минимум 1-2 часа в день игровой активности (либо более продолжительное время в другие дни, при отсутствии возможности игры).\nМинимальная активность в неделю - 4 часа, в месяц - 30 часов.\nИсключение: решение ГА; в случае возникновения уважительных причин отсутствия активности возможно предупреждение ГА, с дальнейшим исключением и не изъятием имущества (только при одобрении и согласовании с ГА сервера)."],[10,"Правила проекта п. 2.7","Основные правила проекта","2.7 Запрещено иметь более 1 бизнеса на аккаунте. | Изъятие бизнесов."],[10,"Правила проекта п. 2.8","Основные правила проекта","2.8 При отсутствии активности администрация выдаст функциональное предупреждение о необходимости возобновления игры для сохранения имущества, имущество не может быть изъято без функционального уведомления. После первого уведомления игроку необходимо возобновить активность или продать имущество в течение 15 дней.\nИсключение: согласование с главным администратором сервера."],[10,"Правила проекта п. 2.9","Основные правила проекта","2.9 Персонажу запрещено иметь nonRP \"Имя Фамилия\", к nonRP никнеймам относятся:\nИмена / фамилии, которых не существует в реальности или имеющие несуразное звучание.\nНикнеймы несущие в себе скрытый смысл / звучание.\nЛюбые Имена / Фамилии политических деятелей, а также людей как-либо связанных с политической активностью.\nИмена неподходящие под RP направление проекта.\nУменьшительно-ласкательные имена.\nЯвно не относящиеся к RP модели проекта \"Россия Онлайн\".\n\nЗа подобный ряд никнеймов выдается demorgan до смены никнейма.\nВ случае получения игроком наказания за nonRP никнейм, дальнейшей его смены, а затем возврата идентичного или такого же nonRP никнейма, игрок получает 150 минут demorgan'a.\nГлавный администратор сервера имеет право отклонить никнейм без каких-либо обоснований или пояснений."],[10,"Правила проекта п. 2.10","Основные правила проекта","2.10 Запрещено играть за персонажа противоположного Вам пола. | Demorgan до смены внешности персонажа.\nПримечание: в случае получения игроком наказания за внешность, дальнейшей ее смены, а затем возврата идентичной или такой же внешности, игрок получает 150 минут demorgan'a.\n\nМодерация платформ"],[10,"Правила проекта п. 3.1","Основные правила проекта","3.1 Администрация сервера вправе вынести наказания по зафиксированному нарушению с модерируемых платформ."],[10,"Правила проекта п. 3.2","Основные правила проекта","3.2 Под модерацией находятся следующие платформы:\nИгровые сервера проекта.\nОфициальные ресурсы проекта.\nTwitch / Youtube / Telegram каналы медиа-партнеров.\nВидеоматериалы и скриншоты игроков проекта расположенных на доступных видео и фото хостингах.\nЛичные сообщения между администратором и игроком.\nФорум проекта.\nВнутриигровые функциональные системы.\nПример: автомобильные номера, ID карта, удостоверение, маркетплейс, диалоги с ботами, в которых интегрированы ИИ, аватарки Majestic ID, логотипы и т.п.\nПояснение: в подобных системах запрещено любое нарушение правил сервера, начиная от запрещенных слов / контента, заканчивая оскорблением родных."],[10,"Правила проекта п. 3.3","Основные правила проекта","3.3 Наказание по зафиксированным нарушением выдается согласно общему регламенту проекта."],[10,"Правила проекта п. 3.4","Основные правила проекта","3.4 Сообщения между игроками не входят в зону модерации администрацией.\nИсключение: распространение / угрозы распространения личной информации, покупка / продажа игрового имущества за реальные деньги, распространение закрытой информации, использование / распространение / продажа запрещенного ПО, угрозы в реальной жизни и др. грубые нарушения."],[10,"Правила проекта п. 3.5","Основные правила проекта","3.5 В случае грубого нарушения человек, оформляющий жалобу, может воспользоваться любым видеоматериалом из перечисленных платформ, дабы доказать нарушение игрока.\nПример: распространение / угрозы распространения личной информации, покупка / продажа игрового имущества за реальные деньги, распространение закрытой информации, использование / распространение / продажа запрещенного ПО и др. грубые нарушения."],[10,"Правила проекта п. 3.6","Основные правила проекта","3.6 Запрещено использовать запрещенные стримерской платформой (twitch, youtube и др.) слова, высказывания, предложения и прочее. | Mute 120 минут / Ban 3-10 дней / HardBan 15-30 дней / PermBan."],[10,"Правила проекта п. 3.7","Основные правила проекта","3.7 Запрещен намеренный \"стрим-снайп\". | Ban 7-30 дней / HardBan 15-30 дней.\nПояснение: помеха стримерам / ютуберам, порча им игрового процесса, слишком навязчивая помощь без надобности / просьб и т.п."],[10,"Правила проекта п. 3.7.2","Основные правила проекта","3.7.2 Запрещено оказывать помощь стримерам, передавать деньги, подарки, предлагать рукопожатия и т.п. действия. | Kick / Demorgan 15 минут / HardBan 7 дней.\nИсключение: просьба / инициатива самого стримера.\n\nИгровые чаты\n\nЗапрещено нарушение общих положений игрового чата:"],[10,"Правила проекта п. 4.1","Основные правила проекта","4.1 Текстовый и голосовой чат является исключительно IC чатом, где запрещено любое общение по OOC. | Demorgan 10-30 минут.\nПримечание: вся OOC информация передается исключительно через /b, /fb, /gb и /cb чаты."],[10,"Правила проекта п. 4.2","Основные правила проекта","4.2 Запрещено завуалированное оскорбление или упоминание родственников в оскорбительном, либо шуточном характере. | Ban 5-30 дней / HardBan 15 дней."],[10,"Правила проекта п. 4.3","Основные правила проекта","4.3 Запрещено прямое оскорбление родственников. | HardBan 30-60 дней."],[10,"Правила проекта п. 4.4","Основные правила проекта","4.4 Запрещен спам, флуд сообщениями или текстом в любые текстовые чаты. | Mute 10-60 минут."],[10,"Правила проекта п. 4.5","Основные правила проекта","4.5 Запрещено использование программ для изменения тональности голоса. | Mute 10-60 минут."],[10,"Правила проекта п. 4.6","Основные правила проекта","4.6 Запрещено издавать громкие или мешающие звуки. | Mute 30-120 минут."],[10,"Правила проекта п. 4.7","Основные правила проекта","4.7 Запрещена OOC травля и/или оскорбления игроков. | Demorgan 45-60 минут / Ban 3-10 дней.\n\nПравила глобальных чатов (/dep, /gnews, /wnews, /mark):"],[10,"Правила проекта п. 4.8","Основные правила проекта","4.8 Запрещены оскорбления в грубой форме, а также использование матерной брани. | WARN.\nИсключение: использование голосовой рации."],[10,"Правила проекта п. 4.9","Основные правила проекта","4.9 Запрещена MG / OOC информация. | WARN."],[10,"Правила проекта п. 4.10","Основные правила проекта","4.10 Запрещены сообщения / диалоги не несущие смысловую нагрузку. | WARN."],[10,"Правила проекта п. 4.11","Основные правила проекта","4.11 Запрещено использование CapsLock. | Mute 120-240 минут.\nПример: \"АРМИЯ, НА СВЯЗЬ\".\n\nRole Play процесс\n\nЗапрещено нарушение основных правил RolePlay:"],[10,"Правила проекта п. 5.1","Основные правила проекта","5.1 DM (Deathmatch - прямое убийство / нанесение урона / стрельба по игроку, а также транспортному средству где сидит игрок (включая дроны и др. подобные функциональные предметы), без IC причины и IC диалога). | Demorgan 120-140 минут / Ban 3-30 дней.\nИсключение: IC диалог не является обязательным фактором в следующих ситуациях:\nУгроза жизни персонажу / его союзникам (игроки из фракции), а именно: прицеливание оружием в сторону игроков, нанесение ударов, намеренный наезд на персонажа / союзников транспортом.\nГрубые оскорбления персонажа / его союзников (игроки из фракции). Грубым оскорблением считается: оскорбление / упоминание родственников, нации, этноса; нецензурные (матерные) оскорбления.\nУгон фракционного / личного / семейного транспортного средства.\nОграбление бизнеса (разрешено убийство причастных к ограблению, запрещено убийство мимо проезжающих рабочих и т.п.).\nОграбление личного/семейного дома (запрещено убийство игроков непричастных к ограблению).\nТочки расположения контрабанды, кроме дальнобойщиков выполняющих погрузку / разгрузку\nПролет на дроне в опасных местах (местах скопления вооруженных людей, ограбления бизнесов, поставок, перестрелке и т.п.)\nОтключение камер игроками криминальных структур.\nМероприятие захват цехов / дилеров (разрешено убийство причастных к мероприятиям, запрещено убийство мимо проезжающих рабочих и т.п.)\nНарушение правил PG от игрока.\nПоднятие предметов во время перестрелки."],[10,"Правила проекта п. 5.2","Основные правила проекта","5.2 DB (DriveBy - целенаправленный / умышленный наезд на игрока транспортом). | Demorgan 65-90 минут / WARN / Ban 3-30 дней."],[10,"Правила проекта п. 5.3","Основные правила проекта","5.3 NonRP:\nПоведение (действия, которые идут вразрез с РП логикой). | Demorgan 45-90 минут / WARN / Ban / HardBan 3-30 дней.\nDrive - вождение транспорта в невозможных для этого условиях: заезд в интерьеры зданий, езда по горам, воде, рекам, намеренная езда по встречной полосе, тротуарам, бордюрам и т.д, таран авто, таран легковым автомобилем более тяжелого. |VehBan 120 - 240 минут / Demorgan 15-90 минут / WARN / Ban / HardBan 3-30 дней.\nИсключение: гос. сотрудники, преследующие подозреваемого (езда по встречной полосе, тротуарам и т.д).\nFly - управление воздушным средством в невозможных для этого условиях. | Demorgan 45-90 минут / WARN / Ban / HardBan 3-30 дней.\nПример: низкие полеты над землей при большой скорости, близкие полеты около деревьев, пролеты под мостами. А так же совершать посадку вне предназначенных для этого местах: склоны более 40%, камни, дороги, на которых в данный момент происходит оживленное движение транспортных средств, и т.д."],[10,"Правила проекта п. 5.4","Основные правила проекта","5.4 NLR (New Life Rule - правила новой жизни) - после получения критических повреждений запрещено возвращение на место гибели, нанесение урона, убийство игрока, за то что он нанёс урон/убил вас, посредством мести. | Demorgan 90 минут / WARN.\nПояснение: после смерти персонажа, он забывает последние 15 минут своей жизни и не может использовать данную информацию."],[10,"Правила проекта п. 5.5","Основные правила проекта","5.5 PG (Power gaming) - преувеличение возможностей своего персонажа. Поведение игрока, которое он не смог бы себе позволить в реальной жизни. | Demorgan 45-90 минут / WARN / Ban 2-7 дней.\nПримечание: правило PG работает по принципу 1x1.\nИсключение: п. 1.13 и 1.13.1 правил ограблений и похищений."],[10,"Правила проекта п. 5.6","Основные правила проекта","5.6 SK (Spawn kill) - стрельба по игрокам, нанесение урона, убийство на месте появления / базирования определенной группы лиц или человека. | GunBan 10 часов / Ban 2-5 дней / HardBan 2-7 дней.\nИсключение: функциональное ограбление дома."],[10,"Правила проекта п. 5.7","Основные правила проекта","5.7 TK (Team kill) - намеренное нанесение урона, убийство игроков / напарников, которые состоят с вами в одной организации. | GunBan 6 часов / Demorgan 50-120 минут / WARN / Ban 3-10 дней.\nИсключение: самооборона."],[10,"Правила проекта п. 5.8","Основные правила проекта","5.8 MG (Meta Gaming) - использование OOC информации, которую ваш персонаж не знает в рамках игрового процесса. | Demorgan 60-90 минут / WARN / Ban 2-5 дней."],[10,"Правила проекта п. 5.9","Основные правила проекта","5.9 Уход от RP. | WARN / HardBan 5-10 дней.\nПримечание: уход в АФК во время RP процесса, выход из игры, уход в воду / закрытый интерьер / использование дрона во время погони, так же приравнивается к уходу от RP, игнорирование отыгровок (в /do и т.д.) с упоминанием игрока через @dynamicID, использование вертикальной лестницы с целью уйти от погони.\nИсключение: согласие обеих сторон."],[10,"Правила проекта п. 5.10","Основные правила проекта","5.10 Любые криминальные действия по отношению к сотрудникам Больницы в рабочее время. | Demorgan 90 минут / WARN всем участникам процесса.\nПримечание: на сотрудников Больницы так же распространяются правила PG, они обязаны учитывать все обстоятельства.\nИсключение: PG со стороны сотрудника Больницы."],[10,"Правила проекта п. 5.11","Основные правила проекта","5.11 Намеренно менять / убирать оружие с целью его сохранения. | Изъятие спец. вооружения (СВД, СВ-98, ВССК \"Выхлоп\") + Demorgan 100 минут / Ban 2-5 дней / HardBan 3-7 дней.\nИсключение: в оружии закончилась обойма / барабан; смена оружия на более подходящее для продолжения боя (дистанция, использование гранат и т.п.).\nПояснение: пункт правил распространяется только в случае смерти игрового персонажа."],[10,"Правила проекта п. 5.12","Основные правила проекта","5.12 Провоцировать игроков на нарушение правил сервера. | Demorgan 45-90 минут / Ban 3-30 дней / HardBan 15-30 дней."],[10,"Правила проекта п. 5.13","Основные правила проекта","5.13 Запрещены любые виды, а также попытки обмана на имущество (OOC сделки, IC сделки с дальнейшим обманом и т.п.), а также создание лотерей без одобрения старшего серверного состава (лотереи, кейсы, \"мистерибоксы\" и т.п.) | HardBan 30 дней / PermBan + обнуление (в т.ч. сообщникам).\nПояснение: все сделки должны проводиться с помощью функционала сервера, не прибегая к составлению сторонних IC / OOC договоров; пострадавшая сторона не получает возврата потерянного имущества.\nПример: игра в кости на имущество, игра в кости на сумму, которую не позволяет функционал проекта (10.000.001 и более), обмен имущества на 2 и более транспорта и т.п."],[10,"Правила проекта п. 5.14","Основные правила проекта","5.14 Запрещены любые увольнения / повышения / понижения / премирование / снятие / пополнение средств / выдача предупреждений / выдача штрафа / ЧС организации / освобождение из КПЗ игроков с некорректной причиной и т.д. | Demorgan 60 минут / WARN / Ban 3-7 дней."],[10,"Правила проекта п. 5.15","Основные правила проекта","5.15 В случае намеренного нарушения игроком(-ами) правил сервера в функциональных зеленых зонах, разрешено игнорировать ситуацию / действия.\nПояснение: под игнорированием подразумевается полное отсутствие какой-либо реакции на действия/ситуацию, запрещены провокации и агрессивные действия, в ином случае может быть выдано наказание."],[10,"Правила проекта п. 5.16","Основные правила проекта","5.16 Разрешено игнорирование отыгровок /do не несущих смысловую нагрузку либо, не дающую никаких RP последствий, либо идущие в разрез функционалу проекта.\nПример: /do Что у человека находится при себе? (есть функциональный обыск), /do VIN номер авто закрашен; /do Номера замазаны грязью; /do Документы утеряны, любые /do отыгровки связанные с угнанным транспортом (не даёт никаких RP последствий и/или идет в разрез функционалу)."],[10,"Правила проекта п. 5.17","Основные правила проекта","5.17 Разрешено не отыгрывать функциональные действия, сопровождающиеся автоматической отыгровкой."],[10,"Правила проекта п. 5.18","Основные правила проекта","5.18 Уходить от погони и перестрелок / прятаться от погони и перестрелок в зелёных зонах запрещено. | Demorgan 45-90 минут / WARN / Ban 2-5 дней.\n\nЗапрещено"],[10,"Правила проекта п. 6.1","Основные правила проекта","6.1 Запрещена любая помеха работе администрации. | Kick / Mute 10-60 минут / Demorgan 10-100 минут / WARN / Ban 3-30 дней."],[10,"Правила проекта п. 6.2","Основные правила проекта","6.2 Скрывать от администрации баги и уязвимости системы, а так же распространять. | Ban 7-30 дней / PermBan."],[10,"Правила проекта п. 6.3","Основные правила проекта","6.3 Скрывать от администрации злоумышленников. | HardBan 15-30 дней / PermBan."],[10,"Правила проекта п. 6.4","Основные правила проекта","6.4 Оскорбление, неуважительное отношение, унижение и неуважительное общение к администрации сервера, серверу и/или проекту. | Ban 5-30 дней / HardBan 10-60 дней."],[10,"Правила проекта п. 6.5","Основные правила проекта","6.5 Выдавать себя за администратора сервера. | Ban 7-30 дней."],[10,"Правила проекта п. 6.6","Основные правила проекта","6.6 Любые договорённости, сговоры и участие в аукционных торгах за имущество с целью получения его по заниженной стоимости. | Изъятие полученного имущества.\nПример: договорённости по распределению бизнесов и отсутствие борьбы за другие лоты, разделение бизнесов между участниками аукциона и так далее.\nПояснение: нарушением считается, если участники аукциона, имея финансовую возможность и экономически рациональное решение об участии в аукционе, намеренно упускает такую возможность с целью победы другого игрока и дальнейшего его приобретения по заниженной стоимости."],[10,"Правила проекта п. 6.7","Основные правила проекта","6.7 Нанесение вреда экономике сервера. | Ban 30 дней / HardBan 30 дней / PermBan."],[10,"Правила проекта п. 6.8","Основные правила проекта","6.8 Использовать уязвимости системы и баги. | Demorgan 35 минут / WARN / Ban 3-30 дней / HardBan 3-30 дней / Permban + изъятие предметов."],[10,"Правила проекта п. 6.9","Основные правила проекта","6.9 Переносить конфликты из OOC в IC и наоборот. | Ban 5-30 дней / HardBan 15-30 дней / PermBan."],[10,"Правила проекта п. 6.10","Основные правила проекта","6.10 Любые угрозы в реальной жизни. | Ban 10-30 дней / HardBan 15-30 дней / PermBan."],[10,"Правила проекта п. 6.11","Основные правила проекта","6.11 Обходить систему Anti-AFK. | Ban 5-30 дней / HardBan 15-30 дней."],[10,"Правила проекта п. 6.12","Основные правила проекта","6.12 Действия, направленные на возбуждение ненависти, либо вражды, в IC и OOC на почве разногласия о гендерной, социальной и т.п. принадлежности. | Demorgan 90 минут / Ban 3-15 дней / HardBan 3-15 дней."],[10,"Правила проекта п. 6.13","Основные правила проекта","6.13 Любые завуалированные оскорбление вероисповедания, религии и нации, а также действия, направленные на возбуждение ненависти, либо вражды, в IC и OOC на почве разногласия о расовой, национальной, этнической, языковой принадлежности. | Ban 15-30 дней / HardBan 15-30 дней / Permban.\nПримечание: запрещены оскорбления на любых языках, а так же оскорбительные \"сленги\"."],[10,"Правила проекта п. 6.14","Основные правила проекта","6.14 Запрещены прямые оскорбления вероисповедования, религии, нации, а так же угнетения по какому-либо признаку или принадлежности. | HardBan 30-60 дней / PermBan."],[10,"Правила проекта п. 6.15","Основные правила проекта","6.15 Совершать многочисленные нарушения правил сервера. | Ban 15-30 дней / HardBan 15-30 дней / PermBan."],[10,"Правила проекта п. 6.16","Основные правила проекта","6.16 Использование постороннего ПО для получения игрового преимущества. | PermBan.\nПримечание: администрация имеет право сделать проверку ПК подозрительного игрока, в случае обнаружения какого-либо стороннего ПО выдается бан как за его использование. Отказ от проверки / выход во время проверки воспринимается как наличие стороннего ПО."],[10,"Правила проекта п. 6.17","Основные правила проекта","6.17 Использование файлов/утилит для получения игрового преимущества. | HardBan 30 дней / PermBan."],[10,"Правила проекта п. 6.18","Основные правила проекта","6.18 Какой-либо обход наказаний. | Permban.\nПримечание: при первом обходе наказания игроку выдается ЧС сервера, на котором было совершено нарушение, при втором обходе наказания игроку выдается ЧС проекта."],[10,"Правила проекта п. 6.19","Основные правила проекта","6.19 Реклама посторонних ресурсов. | HardBan 15-30 дней / PermBan.\nПример: сторонние ссылки, проекты GTA V, неофициальные дискорды и т.п."],[10,"Правила проекта п. 6.20","Основные правила проекта","6.20 Пользоваться уязвимостью правил сервера. | Ban 5-30 дней / HardBan 5-30 дней."],[10,"Правила проекта п. 6.21","Основные правила проекта","6.21 Запрещены любые финансовые операции / договоренности, связанные с продажей игровой валюты, ценностей или услуг за реальные деньги / имущество. | PermBan.\nПримечание: запрещена любая заинтересованность. | HardBan 15-30 дней.\nПояснение: любые транзакции должны происходить исключительно через официальный сайт или через F2 - Магазин, в игре."],[10,"Правила проекта п. 6.22","Основные правила проекта","6.22 Трансфер имущества между серверами. | HardBan 30 дней / PermBan + аннулирование сделки."],[10,"Правила проекта п. 6.23","Основные правила проекта","6.23 Распространение информации или материалов касающихся работы администрации проекта. | HardBan 30 дней / PermBan.\nПримечание: к данной информации относятся: закрытые голосовые каналы / чаты администрации, видеозаписи работы администрации от его лица и т.п."],[10,"Правила проекта п. 6.24","Основные правила проекта","6.24 Распространение / угрозы распространения личной информации игроков / администрации и их родственников. | HardBan 30 дней / PermBan."],[10,"Правила проекта п. 6.25","Основные правила проекта","6.25 Вредительство проекту, серверу, форуму, официальным Discord серверам проекта, а также репутации администрации, сервера или проекта. | HardBan 30 дней / PermBan."],[10,"Правила проекта п. 6.26","Основные правила проекта","6.26 Вводить в заблуждения / обманывать администрацию проекта. | Ban 10-30 дней / HardBan 10-30 дней / PermBan."],[10,"Правила проекта п. 6.27","Основные правила проекта","6.27 Злоупотребление функционалом сервера. | WARN / Ban 3-30 дней / HardBan 10-30 дней."],[10,"Правила проекта п. 6.28","Основные правила проекта","6.28 Обход функционала сервера. | Ban 3-30 дней / HardBan 10-30 дней."],[10,"Правила проекта п. 6.29","Основные правила проекта","6.29 Помеха РП процессу. | Ban 2-5 дней."],[10,"Правила проекта п. 6.30","Основные правила проекта","6.30 Намеренно подставлять лидера, для дальнейшего получения им выговора / снятия. | Ban 5-30 дней / HardBan 15-30 дней."],[10,"Правила проекта п. 6.31","Основные правила проекта","6.31 Создавать помехи игрокам, выполняющим задания в деморгане. | WARN / Ban 2-5 дней.\nПример: бить другого игрока выполняющего задание, преграждать открытие клетки и т.п."],[10,"Правила проекта п. 6.32","Основные правила проекта","6.32 Нарушение правил сервера с целью получения / сохранения спец. средств (вооружения и т.д). | HardBan 10-20 дней + изъятие предметов.\nИсключение: свап, выход из игры в наручниках (оружие изымается системой)."],[10,"Правила проекта п. 6.32.1","Основные правила проекта","6.32.1 В случае дальнейшей реализации выбитых спец. средств с нарушением п.6.32 игрок получает HardBan 999 дней / PermBan."],[10,"Правила проекта п. 6.33","Основные правила проекта","6.33 Активная реклама личных промокодов, соц. сетей и т.п. ресурсов. | Удаление промокода + Ban 5-30 дней.\nПример: реклама промокода на спавне новичков."],[10,"Правила проекта п. 6.34","Основные правила проекта","6.34 Внутриигровые обмены донат-услуг на имущество. | Ban 30 дней / HardBan 30 дней.\nПример: обмен виртуальной валюты на подарочный опыт боевого пропуска; покупка уровней боевого пропуска другому игроку с целью наград, которые получит игрок и т.п.."],[10,"Правила проекта п. 6.35","Основные правила проекта","6.35 Взлом игровых аккаунтов / имущества, а также соучастие во взломе. | HardBan 30 дней / PermBan."],[10,"Правила проекта п. 6.36","Основные правила проекта","6.36 Любые действия нарушающие действующее УК РФ. | HardBan 30 дней / PermBan.\nПояснение: правило не распространяется на игровые механики и функционал предусмотренный проектом, распространяется лишь на действия игрока, которые он совершает намеренно.\n\nРегламент жалоб-обращений"],[10,"Правила проекта п. 7.1","Основные правила проекта","7.1 Каждый игрок имеет право оформить жалобу через систему обращений (F2-Обращения)."],[10,"Правила проекта п. 7.2","Основные правила проекта","7.2 Рассматриваются любые ситуации по которым можно вынести вердикт быстро и без длительных разбирательств.\nПример: DM; DB; DM+nonRP drive; уход от РП и оскорбление и т.п. легкие ситуации."],[10,"Правила проекта п. 7.3","Основные правила проекта","7.3 Правила оформления жалобы-обращения:\nВ репорт описывайте нарушение, которое вы заметили, а так же статический ID нарушителя, прикрепляете ссылку на доказательства и ожидаете ответ от администрации.\nЗагрузить доказательства можно на любой популярный хостинг видео или изображений (YouTube / Imgur, в зависимости от нарушения).\nВидео должно полностью раскрывать нарушения и суть обращения, ситуация должна быть простой для разбора, длительность видеозаписи, где четко видно нарушение игрока не должна превышать 2 минуты.\nВ случае неразборчивости ситуации администратор вправе отправить вас на форум."],[10,"Правила проекта п. 7.4","Основные правила проекта","7.4 Необходимо сохранять (не удалять с видео/фотохостингов) доказательства в течении 48 часов. | Ban 2 дня."],[10,"Правила проекта п. 7.5","Основные правила проекта","7.5 Главная администрация сервера вправе изменять регламент/приостанавливать рассмотрение жалоб-обращений в зависимости от загрузки сервера, а также общего положения дел на сервере."],[10,"Правила проекта п. 7.6","Основные правила проекта","7.6 Рассматриваются те нарушения, которые не требует дополнительных разбирательств и у которых есть возможность вынесения вердикта в короткий срок."],[10,"Правила проекта п. 7.7","Основные правила проекта","7.7 В случае некорректного отказа в рассмотрении жалобы-обращения необходимо оформить жалобу на администратора или написать в личные сообщения discord'a главного / заместителя главного администратора."],[10,"Правила проекта п. 7.8","Основные правила проекта","7.8 Срок подачи жалобы-обращения должен составлять не более 120 минут с момента происшествия."],[10,"Правила проекта п. 7.9","Основные правила проекта","7.9 В случае отказа/невозможности подачи по каким-либо причинам жалобы-обращения игрок имеет возможность оформить жалобу на форум."]]}</script><script id="app-code">(function () {

      '<div id="app"></div><script type="application/json" id="pamyatka-data">' + safeJson(data) + SC +
      '<script type="application/json" id="laws-data">' + lawsEl.textContent + SC +
      '<script id="app-code">' + codeEl.textContent + SC + "</body></html>";
  }
  $("#btn-publish").addEventListener("click", function () {
    DATA.meta.updated = today();
    try {
      var blob = new Blob([buildDocument(DATA)], { type: "text/html;charset=utf-8" });
      var a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "index.html";
      document.body.appendChild(a); a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 3000);
      S.saved = true; store(false, DRAFT_KEY, JSON.stringify({ base: hash(ORIGINAL), data: DATA })); renderSavebar();
    } catch (e) { $("#save-msg").textContent = "Не удалось скачать файл. Попробуйте другой браузер."; }
  });
  window.addEventListener("beforeunload", function (e) { if (S.edit && DIRTY() && !S.saved) { e.preventDefault(); e.returnValue = ""; } });

  // ---------- side menu (mobile drawer) ----------
  function setMenu(open) {
    document.body.classList.toggle("menu-open", open);
    $("#scrim").hidden = !open;
  }
  function openSec(id) {
    S.sec = id; S.src = ""; S.at = null; S.more = 0; S.q = ""; qEl.value = "";
    setHash(true); render(); window.scrollTo(0, 0); setMenu(false);
  }
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && document.body.classList.contains("menu-open")) setMenu(false); });

  // ---------- clicks ----------
  document.addEventListener("click", function (e) {
    var el = e.target.closest("[data-act]"); if (!el) return;
    var act = el.getAttribute("data-act"), val = el.getAttribute("data-v");
    var si = Number(el.getAttribute("data-s")), bi = Number(el.getAttribute("data-b")), sec = DATA.sections[si];
    if (act === "go") {
      if (secById(val) && !S.edit) openSec(val);
      else if (document.getElementById(val)) goTo(val);
      else { S.src = ""; S.sec = ""; S.at = null; setQuery("", true); setTimeout(function () { goTo(val); }, 30); }
    }
    else if (act === "home") { S.src = ""; S.sec = ""; S.at = null; setQuery("", true); window.scrollTo(0, 0); setMenu(false); }
    else if (act === "lib") { S.src = ""; S.sec = ""; S.at = null; setQuery("", true); setTimeout(function () { goTo("grp-zakony"); }, 20); }
    else if (act === "doc") { S.src = String(val); S.sec = ""; S.at = null; setQuery("", true); window.scrollTo(0, 0); setMenu(false); }
    else if (act === "copy-text") { copy(val || "", "Текст скопирован — можно вставлять в рацию"); }
    else if (act === "copy-dc") { copy((DATA.meta && DATA.meta.discord) || "", "Ник в Discord скопирован: " + ((DATA.meta && DATA.meta.discord) || "")); }
    else if (act === "menu") { setMenu(!document.body.classList.contains("menu-open")); }
    else if (act === "menu-close") { setMenu(false); }
    else if (act === "grp") {
      closedGroups[val] = !closedGroups[val];
      try { store(false, CLOSED_KEY, JSON.stringify(closedGroups)); } catch (x) {}
      var gEl = el.parentNode; gEl.classList.toggle("closed", !!closedGroups[val]); el.setAttribute("aria-expanded", String(!closedGroups[val]));
    }
    else if (act === "src") { S.src = val || ""; S.more = 0; S.at = null; setHash(true); render(); toResults(); }
    else if (act === "nocode") {
      var P = parseQuery(S.q), rest = S.q;
      ["ук", "пк", "упк", "тк", "ду", "увс", "ву", "укпс", "кпс", "пго", "опп"].forEach(function (c) { rest = rest.replace(new RegExp("(^|[\\s,.])" + c + "(?=$|[\\s,.])", "gi"), " "); });
      if (P.codes.length) setQuery(rest.replace(/\s+/g, " ").trim(), true);
    }
    else if (act === "tip") { S.src = ""; setQuery(val, true); qEl.focus(); toResults(); }
    else if (act === "more") { S.more += 15; render(); }
    else if (act === "expand") {
      var ds = document.querySelectorAll("#content details.law"), openAll = Array.prototype.some.call(ds, function (d) { return !d.open; });
      Array.prototype.forEach.call(ds, function (d) { d.open = openAll; });
      el.textContent = openAll ? "Свернуть всё" : "Развернуть всё";
    }
    else if (act === "link") {
      var it = IDX[Number(el.getAttribute("data-id"))]; if (!it) return;
      copy(baseUrl() + (it.num ? "#q=" + encodeURIComponent(it.title.replace(/\s*\(часть \d+\)$/, "")) : "#doc=" + slugOf(String(it.src)) + "&at=" + it.id));
    }
    else if (act === "copyq") { copy(baseUrl() + hashStr()); }
    else if (act === "goto") {
      var g = IDX[Number(el.getAttribute("data-id"))]; if (!g) return;
      S.src = String(g.src); S.sec = ""; S.q = ""; qEl.value = ""; S.at = g.id; S.more = 0; setHash(true); render(); afterRender();
    }
    else if (act === "blk-edit") {
      var b = sec.blocks[bi];
      openDlg(TYPES[b.t] + " — " + sec.title, blockForm(b), function () { sec.blocks[bi] = readForm(b.t); changed(); });
    } else if (act === "blk-add") {
      var t = $("#add-type-" + si).value, nb = { t: t, text: "", items: [], cols: t === "table" ? ["Статья", "Что запрещено", "Наказание"] : undefined, rows: [], tone: "info", title: "", start: 1 };
      openDlg("Новый блок: " + TYPES[t], blockForm(nb), function () { sec.blocks.push(readForm(t)); changed(); });
    } else if (act === "blk-up" || act === "blk-down") { if (move(sec.blocks, bi, act === "blk-up" ? -1 : 1)) changed(); }
    else if (act === "blk-del") arm(el, function () { sec.blocks.splice(bi, 1); changed(); });
    else if (act === "sec-edit") {
      openDlg("Раздел", fld("f-sec-title", "Заголовок раздела", inp("f-sec-title", sec.title)) + fld("f-sec-label", "Короткое название для меню", inp("f-sec-label", sec.label)) + fld("f-sec-grp", "Группа в меню слева", grpSelect(sec.group)) + fld("f-sec-aud", "Для кого", inp("f-sec-aud", sec.aud), "Например: Всем, Караул и ВПС, Комсостав. Можно оставить пустым."), function () {
        var tt = $("#f-sec-title").value.trim(); if (!tt) return false; sec.title = tt; sec.label = $("#f-sec-label").value.trim() || tt; sec.group = $("#f-sec-grp").value; var au = $("#f-sec-aud").value.trim(); if (au) sec.aud = au; else delete sec.aud; changed();
      });
    } else if (act === "sec-add") {
      openDlg("Новый раздел", fld("f-sec-title", "Заголовок раздела", inp("f-sec-title", "")) + fld("f-sec-label", "Короткое название для меню", inp("f-sec-label", "")) + fld("f-sec-grp", "Группа в меню слева", grpSelect("sluzhba")) + fld("f-sec-aud", "Для кого", inp("f-sec-aud", ""), "Например: Всем, Караул и ВПС, Комсостав."), function () {
        var tt = $("#f-sec-title").value.trim(); if (!tt) return false;
        var ns = { id: slug(tt), title: tt, label: $("#f-sec-label").value.trim() || tt, group: $("#f-sec-grp").value, blocks: [] }; var au = $("#f-sec-aud").value.trim(); if (au) ns.aud = au;
        DATA.sections.push(ns); changed();
      });
    } else if (act === "sec-up" || act === "sec-down") { if (move(DATA.sections, si, act === "sec-up" ? -1 : 1)) changed(); }
    else if (act === "sec-del") arm(el, function () { DATA.sections.splice(si, 1); changed(); });
    else if (act === "draft-load") { try { DATA = JSON.parse(store(true, DRAFT_KEY)).data; } catch (x) {} setEdit(true); }
    else if (act === "draft-drop") { store(false, DRAFT_KEY, null); banners(); }
  });

  // ---------- start ----------
  readHash(); render(); banners(); afterRender();
})();
</script></body></html>
