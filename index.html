 создающей непосредственную угрозу жизни, здоровью или существенному имуществу;\n7) сохранять охраняемую законом или договором тайну;\n8) соблюдать иные обязанности, прямо предусмотренные федеральным законодательством или трудовым договором."],[3,"ТК ст. 14","Трудовой кодекс РО · Глава II. СТОРОНЫ ТРУДОВЫХ ОТНОШЕНИЙ","Статья 14. Основные права работодателя\n\nРаботодатель вправе:\n1) заключать, изменять и расторгать трудовые договоры;\n2) требовать исполнения трудовых обязанностей и соблюдения законных локальных актов;\n3) контролировать качество и результат работы;\n4) поощрять работников;\n5) применять дисциплинарные меры в установленном законом порядке;\n6) требовать возмещения прямого действительного ущерба при наличии законных оснований;\n7) принимать локальные нормативные акты в пределах своей компетенции."],[3,"ТК ст. 15","Трудовой кодекс РО · Глава II. СТОРОНЫ ТРУДОВЫХ ОТНОШЕНИЙ","Статья 15. Основные обязанности работодателя\n\nРаботодатель обязан:\n1) соблюдать трудовое законодательство и условия трудового договора;\n2) предоставить работнику обусловленную работу;\n3) обеспечить безопасные условия труда и необходимые средства;\n4) своевременно и в полном объеме выплачивать вознаграждение;\n5) знакомить работника с относящимися к нему локальными актами;\n6) не допускать дискриминации и унижающего достоинство обращения;\n7) исполнять законные судебные акты и акты государственного надзора;\n8) рассматривать обращения работника по вопросам его трудовых прав;\n9) обеспечивать хранение кадровых документов и сведений, если такое хранение требуется законом."],[3,"ТК ст. 16","Трудовой кодекс РО · Глава III. ЗАКЛЮЧЕНИЕ, ИЗМЕНЕНИЕ, ПРИОСТАНОВЛЕНИЕ И ПРЕКРАЩЕНИЕ ТРУДОВОГО ДОГОВОРА","Статья 16. Понятие трудового договора\n\n1. Трудовой договор — соглашение между работником и работодателем, по которому работник обязуется лично выполнять определенную трудовую функцию, а работодатель — предоставить работу, обеспечить законные условия труда и выплачивать вознаграждение.\n2. Трудовой договор может быть заключен в письменной, электронной либо иной форме.\n3. Условия договора должны позволять определить работодателя, работника, трудовую функцию и основные условия оплаты труда."],[3,"ТК ст. 17","Трудовой кодекс РО · Глава III. ЗАКЛЮЧЕНИЕ, ИЗМЕНЕНИЕ, ПРИОСТАНОВЛЕНИЕ И ПРЕКРАЩЕНИЕ ТРУДОВОГО ДОГОВОРА","Статья 17. Документы при трудоустройстве\n\n1. Работодатель вправе потребовать документ, удостоверяющий личность, а также документы, объективно необходимые для соответствующей работы.\n2. Для работы, требующей лицензии, медицинского заключения, допуска к государственной тайне, военного билета или иной специальной квалификации, работодатель вправе требовать подтверждающий документ.\n3. Для поступления на государственную службу применяются специальные требования Федерального закона «О государственной службе РО» и профильного законодательства.\n4. Работодатель не вправе требовать документы, не связанные с трудовой функцией и не предусмотренные законом или объективной необходимостью."],[3,"ТК ст. 18","Трудовой кодекс РО · Глава III. ЗАКЛЮЧЕНИЕ, ИЗМЕНЕНИЕ, ПРИОСТАНОВЛЕНИЕ И ПРЕКРАЩЕНИЕ ТРУДОВОГО ДОГОВОРА","Статья 18. Возникновение трудовых отношений\n\n1. Трудовые отношения возникают с момента заключения трудового договора либо фактического допуска лица к работе уполномоченным представителем работодателя.\n2. Фактический допуск к работе не освобождает работодателя от обязанности оформить трудовые отношения.\n3. Допуск к работе лицом, не имеющим кадровых полномочий, сам по себе не создает обязанности работодателя, если работодатель не подтвердил или фактически не принял такую работу."],[3,"ТК ст. 19","Трудовой кодекс РО · Глава III. ЗАКЛЮЧЕНИЕ, ИЗМЕНЕНИЕ, ПРИОСТАНОВЛЕНИЕ И ПРЕКРАЩЕНИЕ ТРУДОВОГО ДОГОВОРА","Статья 19. Испытание и стажировка\n\n1. При поступлении на работу может устанавливаться испытание или стажировка, если это предусмотрено локальным актом или трудовым договором.\n2. До начала испытания работник должен быть уведомлен об основных критериях его прохождения.\n3. Неуспешное прохождение испытания может являться основанием прекращения трудовых отношений, если решение основано на фактических результатах и не носит дискриминационного характера.\n4. Для государственной службы специальные правила испытания и академии могут определяться профильным законодательством и внутренними актами."],[3,"ТК ст. 20","Трудовой кодекс РО · Глава III. ЗАКЛЮЧЕНИЕ, ИЗМЕНЕНИЕ, ПРИОСТАНОВЛЕНИЕ И ПРЕКРАЩЕНИЕ ТРУДОВОГО ДОГОВОРА","Статья 20. Изменение условий труда\n\n1. Существенное изменение трудовой функции, постоянный перевод на другую должность или уменьшение согласованного вознаграждения допускаются с согласия работника, если иное прямо не предусмотрено федеральным законом.\n2. Временное изменение обязанностей допускается при служебной или производственной необходимости в пределах квалификации работника и разумного срока.\n3. Изменение условий не может использоваться как скрытая дисциплинарная мера в обход установленного порядка."],[3,"ТК ст. 21","Трудовой кодекс РО · Глава III. ЗАКЛЮЧЕНИЕ, ИЗМЕНЕНИЕ, ПРИОСТАНОВЛЕНИЕ И ПРЕКРАЩЕНИЕ ТРУДОВОГО ДОГОВОРА","Статья 21. Перевод\n\n1. Переводом признается постоянное изменение трудовой функции или работодателя с сохранением непрерывности трудовых отношений.\n2. Перевод между работодателями производится с согласия работника и принимающей стороны.\n3. Для государственных служащих применяются также правила главы VIII настоящего Кодекса и специального законодательства."],[3,"ТК ст. 22","Трудовой кодекс РО · Глава III. ЗАКЛЮЧЕНИЕ, ИЗМЕНЕНИЕ, ПРИОСТАНОВЛЕНИЕ И ПРЕКРАЩЕНИЕ ТРУДОВОГО ДОГОВОРА","Статья 22. Временное отстранение от работы\n\n1. Работник может быть временно отстранен от исполнения обязанностей при наличии законного основания.\n2. Отстранение не является признанием вины и само по себе не считается дисциплинарным взысканием.\n3. Основаниями отстранения могут являться:\n1) отсутствие обязательной лицензии, допуска или медицинского заключения;\n2) состояние опьянения;\n3) непосредственная угроза безопасности;\n4) необходимость предотвратить уничтожение доказательств, давление на участников проверки или существенный служебный риск;\n5) вступивший в силу судебный акт либо законное требование компетентного государственного органа;\n6) иное основание, прямо установленное федеральным законом.\n4. Отстранение прекращается после отпадения его основания, если отсутствует самостоятельное основание для прекращения трудовых отношений."],[3,"ТК ст. 23","Трудовой кодекс РО · Глава III. ЗАКЛЮЧЕНИЕ, ИЗМЕНЕНИЕ, ПРИОСТАНОВЛЕНИЕ И ПРЕКРАЩЕНИЕ ТРУДОВОГО ДОГОВОРА","Статья 23. Общие основания прекращения трудового договора\n\nТрудовой договор прекращается:\n1) по соглашению сторон;\n2) по инициативе работника;\n3) по инициативе работодателя на законном основании;\n4) в связи с истечением срока срочного договора;\n5) при переводе к другому работодателю;\n6) в связи с невозможностью продолжения работы по объективным медицинским или юридическим основаниям;\n7) по вступившему в силу судебному акту;\n8) по иным основаниям, прямо предусмотренным федеральным законом;\n9) в связи с освобождением от государственной должности компетентным должностным лицом в порядке, установленном федеральным конституционным законом или федеральным законом."],[3,"ТК ст. 24","Трудовой кодекс РО · Глава III. ЗАКЛЮЧЕНИЕ, ИЗМЕНЕНИЕ, ПРИОСТАНОВЛЕНИЕ И ПРЕКРАЩЕНИЕ ТРУДОВОГО ДОГОВОРА","Статья 24. Прекращение договора по инициативе работника\n\n1. Работник вправе прекратить трудовые отношения по собственному желанию, уведомив работодателя способом, позволяющим подтвердить волеизъявление.\n2. Работодатель не вправе необоснованно удерживать работника на работе против его воли.\n3. При наличии у работника незавершенной передачи имущества, документов или дел работодатель вправе потребовать совершить разумные действия по передаче, но не вправе использовать это как основание бессрочного отказа в увольнении.\n4. Специальный закон может устанавливать особый порядок увольнения со службы или сдачи государственного имущества."],[3,"ТК ст. 25","Трудовой кодекс РО · Глава III. ЗАКЛЮЧЕНИЕ, ИЗМЕНЕНИЕ, ПРИОСТАНОВЛЕНИЕ И ПРЕКРАЩЕНИЕ ТРУДОВОГО ДОГОВОРА","Статья 25. Прекращение договора по инициативе работодателя\n\n1. Работодатель вправе прекратить трудовые отношения при наличии одного из следующих оснований:\n1) неоднократное виновное неисполнение трудовых обязанностей после применения дисциплинарной меры;\n2) однократное грубое нарушение трудовых обязанностей;\n3) прогул без уважительной причины;\n4) появление на работе в состоянии алкогольного или наркотического опьянения;\n5) умышленное причинение существенного ущерба работодателю;\n6) разглашение охраняемой законом или договором тайны;\n7) насилие, хищение или иное тяжкое противоправное деяние на рабочем месте, если факт установлен в предусмотренном законом порядке;\n8) непрохождение испытания или обязательной аттестации;\n9) утрата обязательной лицензии, допуска или медицинской пригодности, без которых продолжение работы невозможно;\n10) ликвидация работодателя или фактическое прекращение соответствующей должности;\n11) низкая трудовая активность;\n12) иное основание, прямо установленное федеральным законом.\n2. Само по себе задержание, подозрение, обвинение, проведение проверки или нахождение лица в розыске не означает доказанность трудового проступка и не влечет автоматического увольнения, если федеральным законом прямо не предусмотрено иное.\n3. Утрата доверия может являться основанием увольнения без дополнительного объяснения причины в органах Правительства, прокуратуры, Следственного комитета и Федеральной службы безопасности в силу обеспечения интересов национальной безопасности и особого статуса службы в данных органах.\n4. Основания, предусмотренные частью 1 настоящей статьи, не ограничивают специальные кадровые полномочия Премьер-министра РО, Вице Премьер-министра РО, федерального министра либо иного должностного лица, которому федеральным законодательством предоставлено право свободного назначения на государственную должность и освобождения от нее.\n5. Если федеральным законодательством должность отнесена к числу замещаемых по специальному назначению, уполномоченное должностное лицо вправе освободить занимающее ее лицо без предварительного дисциплинарного взыскания, служебной проверки, доказанности дисциплинарного проступка или указания одного из оснований, перечисленных в части 1 настоящей статьи.\n6. Такое освобождение является самостоятельным кадровым решением и не считается дисциплинарным взысканием, если в акте об освобождении прямо не указано иное.\nПримечание: Под низкой трудовой активностью понимается отсутствие сотрудника на рабочем месте, а также за пределами РО на протяжении более трёх дней подряд, за исключением случаев согласованного отпуска или отгула."],[3,"ТК ст. 25.1","Трудовой кодекс РО · Глава III. ЗАКЛЮЧЕНИЕ, ИЗМЕНЕНИЕ, ПРИОСТАНОВЛЕНИЕ И ПРЕКРАЩЕНИЕ ТРУДОВОГО ДОГОВОРА","Статья 25.1. Прекращение действия трудового договора по инициативе органов государственного надзора\n\n1) Трудовые отношение могут быть прекращены сотрудником органов государственного надзора в следующих случаях:\n\nА) подтвержденного факта нарушения работником законодательства РО;\n\nБ) участия работника в экстремистских и иных незаконных формированиях;\n\nВ) непройденной работником проверки от органов государственного надзора;"],[3,"ТК ст. 26","Трудовой кодекс РО · Глава III. ЗАКЛЮЧЕНИЕ, ИЗМЕНЕНИЕ, ПРИОСТАНОВЛЕНИЕ И ПРЕКРАЩЕНИЕ ТРУДОВОГО ДОГОВОРА","Статья 26. Однократное грубое нарушение\n\nК однократному грубому нарушению могут относиться:\n1) умышленный отказ исполнять законную обязанность, повлекший существенные последствия;\n2) применение насилия к работнику, клиенту или гражданину в связи с работой;\n3) хищение или умышленное уничтожение имущества;\n4) грубое нарушение требований безопасности, создавшее реальную угрозу жизни или тяжкого вреда;\n5) умышленное разглашение государственной, служебной, коммерческой или иной охраняемой законом тайны;\n6) использование должности для получения незаконной выгоды;\n7) иное нарушение, которое по характеру и последствиям делает продолжение трудовых отношений явно невозможным."],[3,"ТК ст. 27","Трудовой кодекс РО · Глава III. ЗАКЛЮЧЕНИЕ, ИЗМЕНЕНИЕ, ПРИОСТАНОВЛЕНИЕ И ПРЕКРАЩЕНИЕ ТРУДОВОГО ДОГОВОРА","Статья 27. Оформление прекращения и восстановление\n\n1. Решение об увольнении должно исходить от компетентного лица и содержать основание.\n2. По требованию работника работодатель обязан сообщить причину увольнения и предоставить относящиеся к нему документы, если их выдача не нарушает охраняемую законом тайну.\n3. Незаконное увольнение может быть отменено работодателем, вышестоящим органом в пределах его компетенции либо судом.\n4. При отмене незаконного увольнения работник подлежит восстановлению, если это объективно возможно и отсутствует другое самостоятельное законное основание для прекращения отношений.\n5. Вопрос о компенсации за незаконное лишение возможности трудиться разрешается по соглашению сторон или судом.\n6. Лицо, освобожденное от государственной должности в порядке специального кадрового полномочия Премьер-министра РО, Вице Премьер-министра РО или иного уполномоченного законом должностного лица, не подлежит восстановлению на этой должности только по мотиву отсутствия дисциплинарного проступка, недостаточности причин освобождения либо несогласия с политической или кадровой целесообразностью такого решения.\n7. Судебному или иному предусмотренному законом контролю могут подлежать наличие полномочия на освобождение, соблюдение обязательной процедуры и соответствие акта Конституции РО и федеральному законодательству, но не сама кадровая целесообразность решения, если закон предоставляет соответствующему должностному лицу право свободного освобождения от должности."],[3,"ТК ст. 28","Трудовой кодекс РО · Глава IV. РАБОЧЕЕ ВРЕМЯ, ПЕРЕРЫВЫ И ОТПУСКА","Статья 28. Рабочее время\n\nРабочим временем признается период, в течение которого работник обязан находиться на рабочем месте либо выполнять трудовые обязанности в соответствии с трудовым договором, графиком или законным распоряжением работодателя."],[3,"ТК ст. 29","Трудовой кодекс РО · Глава IV. РАБОЧЕЕ ВРЕМЯ, ПЕРЕРЫВЫ И ОТПУСКА","Статья 29. Режим рабочего времени\n\n1. Продолжительность и режим работы устанавливаются трудовым договором, графиком или правилами внутреннего трудового распорядка.\n2. Работодатель обязан организовать режим труда таким образом, чтобы работник имел реальную возможность пользоваться предусмотренным настоящим Кодексом временем отдыха.\n3. Работник вправе по собственной инициативе продолжать работу после завершения установленного рабочего времени, если это не нарушает требования безопасности и не создает обязанности работодателя оплачивать время, которое не было им поручено или одобрено."],[3,"ТК ст. 30","Трудовой кодекс РО · Глава IV. РАБОЧЕЕ ВРЕМЯ, ПЕРЕРЫВЫ И ОТПУСКА","Статья 30. Сверхурочная работа\n\n1. Сверхурочной признается работа сверх установленного для работника рабочего времени по поручению работодателя.\n2. Привлечение к сверхурочной работе допускается с согласия работника, кроме чрезвычайной, оперативной или иной неотложной необходимости, прямо вытекающей из закона или характера государственной службы.\n3. Сверхурочная работа не должна использоваться как постоянный способ замены нормального графика."],[3,"ТК ст. 31","Трудовой кодекс РО · Глава IV. РАБОЧЕЕ ВРЕМЯ, ПЕРЕРЫВЫ И ОТПУСКА","Статья 31. Неполное рабочее время\n\nПо соглашению работника и работодателя может устанавливаться неполный рабочий день, неполная рабочая неделя или иной сокращенный режим труда."],[3,"ТК ст. 32","Трудовой кодекс РО · Глава IV. РАБОЧЕЕ ВРЕМЯ, ПЕРЕРЫВЫ И ОТПУСКА","Статья 32. Время отдыха\n\nВременем отдыха является время, в течение которого работник свободен от исполнения трудовых обязанностей и вправе использовать его по своему усмотрению, если иное не вытекает из режима специальной службы."],[3,"ТК ст. 33","Трудовой кодекс РО · Глава IV. РАБОЧЕЕ ВРЕМЯ, ПЕРЕРЫВЫ И ОТПУСКА","Статья 33. Перерыв для отдыха и питания\n\n1. Работнику, непрерывно находившемуся на работе не менее двух часов, по его запросу предоставляется перерыв для отдыха и питания продолжительностью от одного до двух часов.\n2. Конкретное время перерыва определяется с учетом работы организации и текущей служебной или производственной обстановки.\n3. Сотрудник правоохранительного органа, ФСБ, Следственного комитета, Вооруженных Сил, медицинской организации или иной службы непрерывного реагирования может быть отозван с перерыва при реальной оперативной необходимости.\n4. Отзыв с перерыва не должен использоваться систематически без объективной необходимости."],[3,"ТК ст. 34","Трудовой кодекс РО · Глава IV. РАБОЧЕЕ ВРЕМЯ, ПЕРЕРЫВЫ И ОТПУСКА","Статья 34. Дополнительный перерыв при длительной работе\n\n1. Работник, фактически находившийся на работе более шести часов в течение одного рабочего периода, вправе запросить дополнительный перерыв продолжительностью до двух часов.\n2. Работодатель или непосредственный руководитель вправе перенести либо не предоставить такой перерыв при наличии существенной производственной, оперативной или иной объективной необходимости.\n3. Отказ должен быть связан с реальной необходимостью, а не использоваться как дисциплинарное воздействие."],[3,"ТК ст. 35","Трудовой кодекс РО · Глава IV. РАБОЧЕЕ ВРЕМЯ, ПЕРЕРЫВЫ И ОТПУСКА","Статья 35. Отпуск\n\n1. Работник, завершивший обязательную стажировку или испытание, вправе на отпуск общей продолжительностью до семи календарных дней в течение одного календарного месяца.\n2. Порядок подачи заявления и согласования дат определяется локальным актом.\n3. Работодатель обязан предоставить отпуск в пределах установленной нормы, если отсутствует чрезвычайная производственная или служебная необходимость.\n4. При невозможности предоставить отпуск в заявленный период работодатель обязан предложить разумный альтернативный период.\n5. Дополнительный отпуск за выдающиеся результаты труда может предоставляться работодателем по своему усмотрению."],[3,"ТК ст. 36","Трудовой кодекс РО · Глава IV. РАБОЧЕЕ ВРЕМЯ, ПЕРЕРЫВЫ И ОТПУСКА","Статья 36. Отзыв из отпуска\n\n1. Отзыв работника из уже начавшегося отпуска допускается с его согласия.\n2. Для военнослужащих, сотрудников правоохранительных органов, ФСБ, Следственного комитета, экстренной медицинской службы и иных служб непрерывного реагирования специальный закон или режим чрезвычайной необходимости может предусматривать обязательный отзыв.\n3. Неиспользованная часть отпуска сохраняется, если иное не предусмотрено специальным федеральным законом."],[3,"ТК ст. 37","Трудовой кодекс РО · Глава V. ЗАРАБОТНАЯ ПЛАТА И ПРЕМИРОВАНИЕ","Статья 37. Оплата труда\n\n1. Оплата труда производится в денежной форме в рублях РО, если федеральным законодательством не предусмотрено иное.\n2. Размер и система оплаты определяются законом, трудовым договором, штатным расписанием, локальным актом либо иным законным основанием.\n3. Оплата может включать фиксированную, почасовую, сдельную и премиальную составляющие."],[3,"ТК ст. 38","Трудовой кодекс РО · Глава V. ЗАРАБОТНАЯ ПЛАТА И ПРЕМИРОВАНИЕ","Статья 38. Срок выплаты заработной платы\n\n1. Заработная плата выплачивается своевременно и в полном объеме.\n2. Если оплата труда производится периодическими выплатами, период между ними не должен превышать семи календарных дней, если иной порядок объективно установлен государственной системой финансирования или специальным законом.\n3. Необоснованная задержка или невыплата заработной платы является нарушением трудового законодательства."],[3,"ТК ст. 39","Трудовой кодекс РО · Глава V. ЗАРАБОТНАЯ ПЛАТА И ПРЕМИРОВАНИЕ","Статья 39. Премирование\n\n1. Работодатель вправе премировать работников за добросовестный, эффективный или выдающийся труд.\n2. Размер премии может зависеть от должности, квалификации, результатов работы, отработанного времени, сложности и особой значимости выполненной задачи.\n3. Премия, не установленная как гарантированная часть оплаты труда, не является безусловным правом работника.\n4. Премирование не может использоваться как форма оплаты незаконного действия, подкупа или скрытого вознаграждения за злоупотребление полномочиями."],[3,"ТК ст. 40","Трудовой кодекс РО · Глава V. ЗАРАБОТНАЯ ПЛАТА И ПРЕМИРОВАНИЕ","Статья 40. Премирование государственных организаций\n\n1. Правительство РО вправе осуществлять дополнительное финансирование и премирование государственных организаций в пределах государственного бюджета.\n2. Основанием могут являться результаты работы, отчетность, выполнение государственных задач и иные объективные показатели.\n3. Отсутствие требуемой отчетности или подтвержденных результатов может являться основанием для отказа в дополнительном премировании.\n4. Порядок распределения бюджетного премирования определяется Правительством РО."],[3,"ТК ст. 41","Трудовой кодекс РО · Глава V. ЗАРАБОТНАЯ ПЛАТА И ПРЕМИРОВАНИЕ","Статья 41. Удержания из заработной платы\n\n1. Удержание денежных средств из заработной платы допускается только на основании закона, судебного акта, добровольного согласия работника либо заранее установленного и законного порядка материальной ответственности.\n2. Работодатель не вправе произвольно назначать денежные штрафы как дисциплинарное взыскание, если такая мера прямо не предусмотрена федеральным законом.\n3. Невыплата законно начисленной премии не считается штрафом, если премия не являлась гарантированной выплатой."],[3,"ТК ст. 42","Трудовой кодекс РО · Глава V. ЗАРАБОТНАЯ ПЛАТА И ПРЕМИРОВАНИЕ","Статья 42. Поощрения за труд\n\nРаботодатель вправе применять благодарность, грамоту, ценную награду, дополнительную премию, дополнительный отпуск, представление к государственной или ведомственной награде и иные законные формы поощрения."],[3,"ТК ст. 43","Трудовой кодекс РО · Глава VI. БЕЗОПАСНОСТЬ И ЗДОРОВЬЕ РАБОТНИКОВ","Статья 43. Право на безопасный труд\n\n1. Работник имеет право на рабочее место и условия труда, не создающие необоснованной угрозы его жизни и здоровью.\n2. Особенности работы, по самой природе связанной с риском, определяются специальным законодательством и должностными обязанностями."],[3,"ТК ст. 44","Трудовой кодекс РО · Глава VI. БЕЗОПАСНОСТЬ И ЗДОРОВЬЕ РАБОТНИКОВ","Статья 44. Обязанности работодателя в сфере охраны труда\n\nРаботодатель обязан:\n1) обеспечивать исправное оборудование и необходимые средства защиты;\n2) доводить до работника обязательные требования безопасности;\n3) не допускать к опасной работе лицо, объективно не подготовленное к ней;\n4) принимать разумные меры при выявлении угрозы жизни или здоровью;\n5) организовывать обязательные медицинские осмотры там, где они требуются законом."],[3,"ТК ст. 45","Трудовой кодекс РО · Глава VI. БЕЗОПАСНОСТЬ И ЗДОРОВЬЕ РАБОТНИКОВ","Статья 45. Право отказаться от опасной работы\n\n1. Работник вправе отказаться от выполнения задания, если существует непосредственная и очевидная угроза его жизни или здоровью, а выполнение задания не относится к обязанностям по законному преодолению такой угрозы.\n2. Военнослужащий, сотрудник правоохранительного органа, ФСБ, Следственного комитета, спасательной или медицинской службы не вправе ссылаться на обычный профессиональный риск как на основание отказа от законной обязанности, если данный риск свойственен службе и обеспечены предусмотренные законом меры защиты.\n3. Отказ от заведомо незаконного приказа регулируется также уголовным законодательством и законодательством о государственной службе."],[3,"ТК ст. 46","Трудовой кодекс РО · Глава VI. БЕЗОПАСНОСТЬ И ЗДОРОВЬЕ РАБОТНИКОВ","Статья 46. Медицинские требования к работе\n\n1. Для отдельных видов труда закон или работодатель в пределах закона может устанавливать обязательное медицинское освидетельствование.\n2. Просроченное обязательное медицинское заключение может являться основанием временного отстранения до прохождения осмотра.\n3. Медицинские сведения работника являются информацией ограниченного доступа и используются только в необходимом объеме."],[3,"ТК ст. 47","Трудовой кодекс РО · Глава VI. БЕЗОПАСНОСТЬ И ЗДОРОВЬЕ РАБОТНИКОВ","Статья 47. Несчастный случай на работе\n\n1. О существенном несчастном случае, тяжелом ранении или иной угрозе жизни на работе работодатель обязан организовать оказание помощи и фиксацию обстоятельств.\n2. При наличии признаков правонарушения материалы передаются компетентному государственному органу.\n3. Работодатель не вправе скрывать сведения о несчастном случае с целью избежать законной ответственности."],[3,"ТК ст. 48","Трудовой кодекс РО · Глава VI. БЕЗОПАСНОСТЬ И ЗДОРОВЬЕ РАБОТНИКОВ","Статья 48. Специальные условия опасной службы\n\nФедеральным законом могут устанавливаться специальные правила охраны труда, применения оружия, специальных средств, допуска к опасным объектам, медицинской пригодности и режима отдыха для военнослужащих, полиции, ГИБДД, ФСБ, Следственного комитета и иных специальных служб."],[3,"ТК ст. 49","Трудовой кодекс РО · Глава VI. БЕЗОПАСНОСТЬ И ЗДОРОВЬЕ РАБОТНИКОВ","Статья 49. Возмещение вреда здоровью\n\nВред, причиненный жизни или здоровью работника вследствие незаконных действий работодателя или грубого нарушения обязательных требований безопасности, подлежит возмещению в порядке, установленном федеральным законодательством или судом."],[3,"ТК ст. 50","Трудовой кодекс РО · Глава VII. ПООЩРЕНИЯ, ДИСЦИПЛИНАРНЫЕ МЕРЫ И МАТЕРИАЛЬНАЯ ОТВЕТСТВЕННОСТЬ","Статья 50. Трудовая дисциплина\n\nТрудовой дисциплиной признается обязательность исполнения работником трудовых обязанностей, законных распоряжений работодателя, правил внутреннего трудового распорядка и требований федерального законодательства."],[3,"ТК ст. 51","Трудовой кодекс РО · Глава VII. ПООЩРЕНИЯ, ДИСЦИПЛИНАРНЫЕ МЕРЫ И МАТЕРИАЛЬНАЯ ОТВЕТСТВЕННОСТЬ","Статья 51. Дисциплинарный проступок\n\nДисциплинарным проступком является виновное неисполнение или ненадлежащее исполнение работником трудовых обязанностей либо нарушение законного локального акта, если за соответствующее деяние не применяется иной специальный порядок ответственности."],[3,"ТК ст. 52","Трудовой кодекс РО · Глава VII. ПООЩРЕНИЯ, ДИСЦИПЛИНАРНЫЕ МЕРЫ И МАТЕРИАЛЬНАЯ ОТВЕТСТВЕННОСТЬ","Статья 52. Дисциплинарные взыскания\n\n1. К работнику могут применяться:\n1) замечание;\n2) выговор;\n3) строгий выговор, если такая мера предусмотрена локальным актом или специальным законодательством;\n4) переаттестация, если она объективно связана с квалификацией работника;\n5) понижение в должности при наличии согласия работника либо специального законного основания;\n6) занесение в чёрный список;\n7) увольнение.\n2. В отношении государственного служащего применяются виды дисциплинарных взысканий, предусмотренные Федеральным законом «О государственной службе РО» и профильным законодательством. Настоящая статья не расширяет перечень специальных служебных взысканий.\n3. В Вооруженных Силах и иных структурах со специальной дисциплиной федеральным законом могут устанавливаться дополнительные меры.\nПримечание: Дисциплинарное взыскание в виде занесения в чёрный список применяется исключительно в соответствии со статьёй 26 и пунктами 1, 2, 3, 4, 7 и 8 части 1 статьи 25 настоящего Кодекса."],[3,"ТК ст. 53","Трудовой кодекс РО · Глава VII. ПООЩРЕНИЯ, ДИСЦИПЛИНАРНЫЕ МЕРЫ И МАТЕРИАЛЬНАЯ ОТВЕТСТВЕННОСТЬ","Статья 53. Порядок применения дисциплинарного взыскания\n\n1. Взыскание должно иметь конкретное фактическое основание.\n2. До применения понижения или увольнения, если обстоятельства не являются очевидными и бесспорными, работнику должна быть предоставлена возможность дать объяснение.\n3. Решение должно быть принято компетентным лицом и зафиксировано способом, позволяющим установить его содержание, основание и срок действия, если взыскание имеет срок.\n4. За одно нарушение не допускается неоднократное применение нескольких самостоятельных дисциплинарных взысканий за одни и те же обстоятельства.\n5. Дисциплинарная мера должна быть соразмерна характеру нарушения."],[3,"ТК ст. 54","Трудовой кодекс РО · Глава VII. ПООЩРЕНИЯ, ДИСЦИПЛИНАРНЫЕ МЕРЫ И МАТЕРИАЛЬНАЯ ОТВЕТСТВЕННОСТЬ","Статья 54. Запрет неправомерного дисциплинарного преследования\n\nНе допускается применять дисциплинарное взыскание исключительно за:\n1) законное обжалование действий работодателя;\n2) отказ от заведомо незаконного требования;\n3) добросовестное сообщение о правонарушении;\n4) обращение в прокуратуру или суд;\n5) использование предусмотренного настоящим Кодексом права на отдых;\n6) иное законное осуществление трудового права."],[3,"ТК ст. 55","Трудовой кодекс РО · Глава VII. ПООЩРЕНИЯ, ДИСЦИПЛИНАРНЫЕ МЕРЫ И МАТЕРИАЛЬНАЯ ОТВЕТСТВЕННОСТЬ","Статья 55. Снятие дисциплинарного взыскания\n\n1. Работодатель вправе досрочно снять дисциплинарное взыскание по собственной инициативе, по просьбе работника или по представлению его руководителя.\n2. Если после применения взыскания прошло не менее трех календарных дней, работник добросовестно исполнял обязанности и не допустил нового нарушения, работодатель вправе учитывать это как достаточное основание для досрочного снятия взыскания.\n3. Специальным законом может быть установлен иной срок или порядок."],[3,"ТК ст. 56","Трудовой кодекс РО · Глава VII. ПООЩРЕНИЯ, ДИСЦИПЛИНАРНЫЕ МЕРЫ И МАТЕРИАЛЬНАЯ ОТВЕТСТВЕННОСТЬ","Статья 56. Материальная ответственность работника\n\n1. Работник обязан возместить прямой действительный ущерб, виновно причиненный работодателю, если ответственность установлена законом, договором или судом.\n2. Не подлежат взысканию предполагаемая упущенная выгода и обычный хозяйственный риск, если иное прямо не предусмотрено федеральным законом.\n3. Размер и порядок возмещения определяются соглашением сторон либо судом."],[3,"ТК ст. 57","Трудовой кодекс РО · Глава VII. ПООЩРЕНИЯ, ДИСЦИПЛИНАРНЫЕ МЕРЫ И МАТЕРИАЛЬНАЯ ОТВЕТСТВЕННОСТЬ","Статья 57. Материальная ответственность работодателя\n\nРаботодатель несет ответственность за незаконное лишение работника возможности трудиться, незаконное удержание заработной платы, причинение вреда имуществу работника и вред, причиненный нарушением обязательных требований охраны труда, в порядке, установленном законом или судом."],[3,"ТК ст. 58","Трудовой кодекс РО · Глава VIII. ТРУД ГОСУДАРСТВЕННЫХ СЛУЖАЩИХ","Статья 58. Соотношение трудового законодательства и законодательства о государственной службе\n\n1. Государственный служащий пользуется общими трудовыми гарантиями, если они совместимы с характером государственной службы и не изменены специальным федеральным законом.\n2. Поступление на службу, полномочия, служебная подчиненность, дисциплинарная ответственность, специальные и воинские звания, классные чины, применение оружия и специальные режимы службы регулируются профильным законодательством.\n3. Трудовой кодекс не может толковаться как предоставляющий государственному служащему полномочия, не предусмотренные законом.\n4. Вице Премьер-министр РО, федеральные министры, заместители федеральных министров и иные лица, замещающие государственные должности по назначению Премьер-министра РО, Вице Премьер-министра РО либо иного специально уполномоченного законом должностного лица, замещают такие должности на условиях специального публично-правового статуса.\n5. Если федеральным законодательством предусмотрено свободное назначение и освобождение такого лица, прекращение его полномочий не требует предварительного дисциплинарного взыскания, служебной проверки, доказанности проступка или применения оснований увольнения, установленных для обычных трудовых отношений.\n6. Освобождение лица от государственной должности не прекращает его обязанность передать государственное имущество, документы, сведения и дела в установленном порядке и не освобождает от ответственности за ранее совершенные правонарушения."],[3,"ТК ст. 58.1","Трудовой кодекс РО · Глава VIII. ТРУД ГОСУДАРСТВЕННЫХ СЛУЖАЩИХ","Статья 58.1. Особые кадровые полномочия в системе Правительства РО\n1. Премьер-министр РО вправе назначать и освобождать от должности Вице Премьер-министра РО, федеральных министров, их заместителей и иных членов Правительства РО в случаях и порядке, предусмотренных федеральным законодательством. Такое решение может быть принято по кадровым, политическим, организационным или иным соображениям и не требует наличия дисциплинарного проступка.\n2. Вице Премьер-министр РО вправе назначать и освобождать федеральных министров, первых заместителей и заместителей федеральных министров в случаях, когда такое полномочие прямо предоставлено ему федеральным законодательством.\n3. Федеральный министр либо его заместитель вправе назначать и освобождать Руководителя аппарата министерства, руководителей структурных подразделений и иных должностных лиц центрального аппарата в пределах кадровых полномочий, установленных федеральным законодательством.\n4. Освобождение лица от должности в соответствии с частями 1–3 настоящей статьи не требует применения процедуры дисциплинарного взыскания и не может быть признано незаконным исключительно вследствие отсутствия виновного проступка, неудовлетворительной оценки работы или иного обычного трудового основания.\n5. Право свободного освобождения от должности не распространяется на должности, для которых Конституцией РО, федеральным конституционным законом или федеральным законом установлен специальный исчерпывающий порядок прекращения полномочий.\n6. Акт о назначении или освобождении может быть обжалован в части наличия у принявшего его лица соответствующего полномочия, соблюдения обязательной процедуры и соответствия акту большей юридической силы. Кадровая, политическая или организационная целесообразность такого решения самостоятельному пересмотру по правилам обычного трудового спора не подлежит.\n7. Освобождение от должности не прекращает обязанности по передаче государственных документов, имущества и дел, не аннулирует ранее наложенную ответственность и не препятствует привлечению лица к ответственности за совершенные до освобождения правонарушения."],[3,"ТК ст. 59","Трудовой кодекс РО · Глава VIII. ТРУД ГОСУДАРСТВЕННЫХ СЛУЖАЩИХ","Статья 59. Служебный приказ и трудовые права\n1. Государственный служащий обязан исполнять законные служебные приказы.\n2. Право на отдых не освобождает служащего от обязанности реагировать на реальную чрезвычайную или оперативную необходимость в случаях, предусмотренных законом.\n3. Отказ от заведомо незаконного приказа не является трудовым или дисциплинарным проступком."],[3,"ТК ст. 60","Трудовой кодекс РО · Глава VIII. ТРУД ГОСУДАРСТВЕННЫХ СЛУЖАЩИХ","Статья 60. Отстранение государственного служащего\n\n1. Отстранение государственного служащего осуществляется по основаниям и в порядке, установленным Федеральным законом «О государственной службе РО» и профильным законодательством.\n2. Сам факт расследования или обвинения не означает автоматической виновности и не влечет обязательного увольнения.\n3. Отстранение допускается, если дальнейшее исполнение полномочий создает существенный риск для проверки, сохранности государственного имущества, безопасности или законности."],[3,"ТК ст. 61","Трудовой кодекс РО · Глава VIII. ТРУД ГОСУДАРСТВЕННЫХ СЛУЖАЩИХ","Статья 61. Межведомственный перевод\n\n1. Государственный служащий вправе обратиться с просьбой о переводе в другой государственный орган.\n2. Перевод требует согласия руководителя либо иного компетентного должностного лица обеих государственных организаций, если специальным законом не установлен иной порядок.\n3. При отсутствии руководителя решение вправе принять уполномоченный заместитель.\n4. Премьер-министр РО или Правительство РО вправе согласовать перевод в пределах предоставленных им кадровых полномочий.\n5. Перевод не означает автоматического сохранения конкретной должности, специального звания или полномочий, если профильным законодательством предусмотрен иной порядок."],[3,"ТК ст. 62","Трудовой кодекс РО · Глава VIII. ТРУД ГОСУДАРСТВЕННЫХ СЛУЖАЩИХ","Статья 62. Должность при переводе\n\n1. Принимающий государственный орган определяет должность переводимого лица с учетом его квалификации, опыта, имеющегося звания или чина и вакантных должностей.\n2. Если в обеих организациях применяется сопоставимый должностной табель, перевод по общему правилу не должен приводить к понижению более чем на пять должностных уровней без согласия служащего, если иное не обусловлено требованиями новой службы.\n3. Специальные правила сохранения и присвоения званий определяются Федеральным законом «О специальных и воинских званиях и классных чинах»."],[3,"ТК ст. 63","Трудовой кодекс РО · Глава VIII. ТРУД ГОСУДАРСТВЕННЫХ СЛУЖАЩИХ","Статья 63. Ограничения при государственной службе\n\nОграничения, связанные с судимостью, медицинской пригодностью, лицензиями, государственной тайной, конфликтом интересов и иными условиями поступления и прохождения государственной службы, устанавливаются уголовным законодательством, Федеральным законом «О государственной службе РО» и профильными федеральными законами."],[3,"ТК ст. 64","Трудовой кодекс РО · Глава IX. ТРУДОВЫЕ СПОРЫ И ГОСУДАРСТВЕННЫЙ КОНТРОЛЬ","Статья 64. Индивидуальный трудовой спор\n\nИндивидуальным трудовым спором признается неурегулированное разногласие между работником и работодателем по вопросу применения трудового законодательства, трудового договора, локального акта, дисциплинарного взыскания, оплаты труда, перевода, отстранения или увольнения."],[3,"ТК ст. 65","Трудовой кодекс РО · Глава IX. ТРУДОВЫЕ СПОРЫ И ГОСУДАРСТВЕННЫЙ КОНТРОЛЬ","Статья 65. Способы защиты трудовых прав\n\nРаботник вправе:\n1) обратиться к работодателю или вышестоящему руководителю;\n2) обратиться в прокуратуру РО;\n3) обратиться в суд;\n4) использовать иные предусмотренные федеральным законодательством способы защиты."],[3,"ТК ст. 66","Трудовой кодекс РО · Глава IX. ТРУДОВЫЕ СПОРЫ И ГОСУДАРСТВЕННЫЙ КОНТРОЛЬ","Статья 66. Рассмотрение жалобы работодателем\n\n1. Работодатель обязан рассмотреть обращение работника в разумный срок.\n2. Если обжалуется дисциплинарное взыскание, перевод, отстранение или увольнение, работодатель обязан проверить наличие компетенции, фактического основания и соблюдение процедуры.\n3. Работодатель вправе отменить или изменить собственное незаконное решение."],[3,"ТК ст. 67","Трудовой кодекс РО · Глава IX. ТРУДОВЫЕ СПОРЫ И ГОСУДАРСТВЕННЫЙ КОНТРОЛЬ","Статья 67. Полномочия прокуратуры в сфере труда\n\n1. Прокуратура осуществляет надзор за соблюдением трудового законодательства в соответствии с Федеральным законом «О прокуратуре РО».\n2. Прокурор вправе требовать необходимые документы, проводить проверку законности действий работодателя и применять предусмотренные законом акты прокурорского реагирования.\n3. Прокурор не вправе произвольно подменять работодателя при решении обычных кадровых вопросов, если федеральным законом не предусмотрено иное.\n4. Выявление признаков административного или уголовного правонарушения влечет передачу либо разрешение материала в порядке соответствующего кодекса."],[3,"ТК ст. 68","Трудовой кодекс РО · Глава IX. ТРУДОВЫЕ СПОРЫ И ГОСУДАРСТВЕННЫЙ КОНТРОЛЬ","Статья 68. Судебная защита\n\n1. Суд вправе признать незаконными увольнение, дисциплинарное взыскание, отстранение, перевод, невыплату заработной платы или иной акт работодателя.\n2. Суд вправе восстановить работника, отменить незаконный акт, взыскать причитающиеся денежные средства, присудить компенсацию и применить иной предусмотренный законом способ защиты.\n3. Судебный акт обязателен для работодателя и работника."],[3,"ТК ст. 69","Трудовой кодекс РО · Глава IX. ТРУДОВЫЕ СПОРЫ И ГОСУДАРСТВЕННЫЙ КОНТРОЛЬ","Статья 69. Государственная проверка работодателя\n\n1. Правительство РО и иные уполномоченные законом органы вправе проводить организационные проверки соблюдения трудового законодательства.\n2. Проверка должна иметь законное основание и не может использоваться для незаконного вмешательства в деятельность суда, прокуратуры, Следственного комитета или иной процессуально самостоятельной структуры.\n3. Работодатель обязан предоставить законно запрошенные документы, относящиеся к предмету проверки."],[3,"ТК ст. 70","Трудовой кодекс РО · Глава IX. ТРУДОВЫЕ СПОРЫ И ГОСУДАРСТВЕННЫЙ КОНТРОЛЬ","Статья 70. Ответственность за нарушение трудового законодательства\n\n1. Нарушение настоящего Кодекса влечет дисциплинарную, материальную, административную, уголовную или иную ответственность при наличии предусмотренного законом основания.\n2. Административная ответственность за нарушение трудового законодательства устанавливается Кодексом РО об административных правонарушениях"],[4,"ФЗ о ВС — общие положения","ФЗ «О Вооружённых Силах РО»","Настоящий Федеральный закон определяет статус и задачи Вооружённых Сил РО, порядок управления воинской частью, основы военной службы, правовой режим территории воинской части, полномочия военнослужащих и военной полиции, а также порядок участия Вооружённых Сил в выполнении государственных задач."],[4,"ФЗ о ВС ст. 1","ФЗ «О Вооружённых Силах РО» · Глава I. ОБЩИЕ ПОЛОЖЕНИЯ","Статья 1. Вооружённые Силы РО\n1. Вооружённые Силы РО (далее — Вооружённые Силы) являются государственной военной организацией, предназначенной для обороны РО, охраны военных объектов, вооружения и военной техники, поддержания боевой готовности и выполнения иных задач, установленных федеральным законодательством.\n2. Организационную основу Вооружённых Сил составляет воинская часть РО. Военные объекты, склады, учебные площадки, посты и иные территории, закреплённые за Вооружёнными Силами, относятся к указанной воинской части, если иное прямо не установлено федеральным законодательством.\n3. Создание иной самостоятельной воинской части допускается на основании решения Правительства РО.\n4. Вооружённые Силы не являются органом общей полицейской юрисдикции и не подменяют органы внутренних дел, ГИБДД, Федеральную службу безопасности, Следственный комитет, прокуратуру или суд."],[4,"ФЗ о ВС ст. 2","ФЗ «О Вооружённых Силах РО» · Глава I. ОБЩИЕ ПОЛОЖЕНИЯ","Статья 2. Правовая основа деятельности\n1. Вооружённые Силы действуют на основании Конституции РО, федеральных конституционных законов, кодексов, настоящего Федерального закона и иных федеральных законов.\n2. Акты Премьер-министра РО, Правительства РО, Министерства внутренних дел РО и военного командования обязательны постольку, поскольку приняты в пределах компетенции и не противоречат актам большей юридической силы.\n3. Внутренний акт Вооружённых Сил не может создавать для граждан новые обязанности, основания задержания, обыска, применения силы или юридической ответственности, не предусмотренные федеральным законодательством."],[4,"ФЗ о ВС ст. 3","ФЗ «О Вооружённых Силах РО» · Глава I. ОБЩИЕ ПОЛОЖЕНИЯ","Статья 3. Основные задачи Вооружённых Сил\nОсновными задачами Вооружённых Сил являются:\n1) охрана и оборона воинской части, военных объектов, вооружения, боеприпасов и военной техники;\n2) поддержание боевой готовности, подготовка военнослужащих и проведение учений;\n3) обеспечение военных перевозок, снабжения и охраны специальных военных грузов;\n4) участие в обеспечении обороны и государственной безопасности РО;\n5) участие в контртеррористических, чрезвычайных и иных специальных мероприятиях в предусмотренных законом случаях;\n6) оказание содействия иным государственным органам в пределах федерального законодательства."],[4,"ФЗ о ВС ст. 4","ФЗ «О Вооружённых Силах РО» · Глава I. ОБЩИЕ ПОЛОЖЕНИЯ","Статья 4. Пределы компетенции\n1. Военнослужащие осуществляют властные полномочия в отношении граждан преимущественно на территории воинской части, на охраняемом военном объекте либо при выполнении конкретной законной военной задачи.\n2. Обычное патрулирование населённых пунктов, систематический дорожный контроль и повседневное разрешение уголовных или административных материалов не относятся к самостоятельной компетенции Вооружённых Сил.\n3. При обнаружении непосредственно совершаемого опасного правонарушения военнослужащий вправе принять неотложные меры для защиты людей, пресечения опасности и сохранения доказательств с последующей передачей лица и материалов компетентному государственному органу."],[4,"ФЗ о ВС ст. 5","ФЗ «О Вооружённых Силах РО» · Глава I. ОБЩИЕ ПОЛОЖЕНИЯ","Статья 5. Военное имущество и охраняемые сведения\n1. Вооружение, боеприпасы, военная техника, служебный транспорт, средства связи, форма, медикаменты и иное имущество Вооружённых Сил являются государственным имуществом и используются только для законных служебных целей.\n2. Выдача, хранение, перемещение и списание вооружения, боеприпасов и иного учитываемого имущества осуществляются в порядке, установленном военными уставами и актами Министерства внутренних дел.\n3. Сведения о системах охраны, запасах вооружения, специальных маршрутах, планах обороны и иных военных вопросах могут относиться к охраняемой законом тайне.\n4. Режим охраняемых сведений не может использоваться для сокрытия правонарушения или незаконного отказа в предоставлении материалов суду, прокуратуре, Следственному комитету или Федеральной службе безопасности в пределах их законных полномочий."],[4,"ФЗ о ВС ст. 6","ФЗ «О Вооружённых Силах РО» · Глава II. УПРАВЛЕНИЕ И ВОЕННАЯ СЛУЖБА","Статья 6. Верховный Главнокомандующий\n1. Премьер-министр РО является Верховным Главнокомандующим Вооружёнными Силами РО.\n2. Премьер-министр определяет основные направления военной политики и вправе отдавать Вооружённым Силам обязательные законные приказы в пределах своих полномочий."],[4,"ФЗ о ВС ст. 7","ФЗ «О Вооружённых Силах РО» · Глава II. УПРАВЛЕНИЕ И ВОЕННАЯ СЛУЖБА","Статья 7. Министерство внутренних дел РО\n1. Министерство внутренних дел РО осуществляет государственную политику и общее организационное руководство Вооружёнными Силами.\n2. Министерство внутренних дел обеспечивает кадровое, финансовое, материальное, учебное и организационное обеспечение воинской части.\n3. Министр внутренних дел РО возглавляет Министерство внутренних дел, издаёт ведомственные акты и осуществляет кадровые и иные полномочия в пределах федерального законодательства."],[4,"ФЗ о ВС ст. 8","ФЗ «О Вооружённых Силах РО» · Глава II. УПРАВЛЕНИЕ И ВОЕННАЯ СЛУЖБА","Статья 8. Руководитель Вооружённых Сил РО\n1. Непосредственное командование Вооружёнными Силами осуществляет Руководитель Вооружённых Сил РО, одновременно являющийся командиром воинской части.\n2. Руководитель Вооружённых Сил подчиняется Премьер-министру РО как Верховному Главнокомандующему и Министру внутренних дел РО в пределах компетенции каждого из них.\n3. Руководитель Вооружённых Сил является прямым начальником военнослужащих и подразделений воинской части."],[4,"ФЗ о ВС ст. 9","ФЗ «О Вооружённых Силах РО» · Глава II. УПРАВЛЕНИЕ И ВОЕННАЯ СЛУЖБА","Статья 9. Назначение Руководителя Вооружённых Сил\n1. Руководитель Вооружённых Сил назначается на должность и освобождается от должности Федеральным Правительством.\n2. Срок его полномочий составляет тридцать календарных дней. Повторное назначение допускается.\n3. Воинское звание Руководителя Вооружённых Сил и порядок его повышения определяются Федеральным законом «О специальных и воинских званиях и классных чинах»."],[4,"ФЗ о ВС ст. 10","ФЗ «О Вооружённых Силах РО» · Глава II. УПРАВЛЕНИЕ И ВОЕННАЯ СЛУЖБА","Статья 10. Полномочия Руководителя Вооружённых Сил\nРуководитель Вооружённых Сил:\n1) организует службу и деятельность воинской части;\n2) распределяет задачи между подразделениями;\n3) издаёт приказы и распоряжения в пределах своей компетенции;\n4) устанавливает внутреннюю структуру подразделений в пределах штатных и законодательных ограничений;\n5) организует охрану территории, караульную службу, учения, перевозки и снабжение;\n6) осуществляет внутренний контроль и обеспечивает воинскую дисциплину;\n7) организует взаимодействие Вооружённых Сил с иными государственными органами."],[4,"ФЗ о ВС ст. 11","ФЗ «О Вооружённых Силах РО» · Глава II. УПРАВЛЕНИЕ И ВОЕННАЯ СЛУЖБА","Статья 11. Военная цепь командования\n1. Военная цепь командования основывается на должностном подчинении и единоначалии.\n2. Старшинство по воинскому званию само по себе не предоставляет права вмешиваться в деятельность другого подразделения вне занимаемой должности или специально возложенной задачи.\n3. Заместители командира воинской части, командиры подразделений и иные начальники осуществляют полномочия в пределах должности, приказов и внутренних актов."],[4,"ФЗ о ВС ст. 12","ФЗ «О Вооружённых Силах РО» · Глава II. УПРАВЛЕНИЕ И ВОЕННАЯ СЛУЖБА","Статья 12. Военнослужащий\n1. Военнослужащим признаётся гражданин РО, проходящий военную службу в Вооружённых Силах на предусмотренном законом основании.\n2. Военнослужащий обязан соблюдать федеральное законодательство, воинскую дисциплину, законные приказы, правила обращения с оружием и военным имуществом, а также уважать права и достоинство граждан.\n3. Система воинских званий и порядок их присвоения определяются специальным федеральным законом.\n4. При исполнении обязанностей военнослужащий носит установленную форму и знаки различия, если характер законной задачи не требует иного."],[4,"ФЗ о ВС ст. 13","ФЗ «О Вооружённых Силах РО» · Глава II. УПРАВЛЕНИЕ И ВОЕННАЯ СЛУЖБА","Статья 13. Приказ и воинская дисциплина\n1. Приказ командира должен относиться к его компетенции, быть понятным, исполнимым и не противоречить федеральному законодательству.\n2. Военнослужащий обязан исполнить законный приказ без необоснованной задержки.\n3. Заведомо незаконный приказ исполнению не подлежит. Командир несёт ответственность за его отдачу, а исполнение заведомо незаконного приказа не освобождает военнослужащего от ответственности в предусмотренных законом случаях.\n4. За нарушение воинской дисциплины применяются предусмотренные законом и военными уставами дисциплинарные меры.\n5. Если в действиях военнослужащего имеются признаки преступления или административного правонарушения, дисциплинарная процедура не заменяет передачу материала компетентному органу."],[4,"ФЗ о ВС ст. 14","ФЗ «О Вооружённых Силах РО» · Глава III. ВОИНСКАЯ ЧАСТЬ, ЕЁ ТЕРРИТОРИЯ И ОХРАНА","Статья 14. Территория воинской части\n1. Территорией воинской части признаётся официально закреплённая за Вооружёнными Силами территория, включающая места размещения личного состава, штаб, склады, площадки хранения техники, учебные зоны и иные военные объекты.\n2. Границы территории определяются установленным государственным актом и по возможности обозначаются на местности.\n3. Вокруг отдельных участков воинской части может устанавливаться прилегающая охраняемая территория, если это необходимо для безопасности склада вооружения, техники, полигона или иного опасного объекта.\n4. Нахождение лица за пределами установленной территории само по себе не создаёт специальной военной юрисдикции."],[4,"ФЗ о ВС ст. 15","ФЗ «О Вооружённых Силах РО» · Глава III. ВОИНСКАЯ ЧАСТЬ, ЕЁ ТЕРРИТОРИЯ И ОХРАНА","Статья 15. Режим воинской части\n1. На территории воинской части действует пропускной, внутриобъектовый и охранный режим.\n2. Конкретный порядок доступа, перечень постов и контрольно-пропускных пунктов, режим отдельных зон, порядок дежурств и иные внутренние правила устанавливаются командиром воинской части или военным уставом.\n3. Внутренний режим обязателен для военнослужащих и для иных лиц, законно находящихся на территории воинской части."],[4,"ФЗ о ВС ст. 16","ФЗ «О Вооружённых Силах РО» · Глава III. ВОИНСКАЯ ЧАСТЬ, ЕЁ ТЕРРИТОРИЯ И ОХРАНА","Статья 16. Доступ на территорию воинской части\n1. Лицо, не являющееся военнослужащим части, допускается на территорию при наличии законного основания или разрешения, предусмотренного пропускным режимом.\n2. При входе или въезде военнослужащий караула вправе проверить документ, подтверждающий личность или право доступа, а также предложить пройти установленный режимом досмотр.\n3. Лицу, не имеющему самостоятельного законного права доступа и отказавшемуся от проверки документов или досмотра, может быть отказано во входе или въезде.\n4. Пропускной режим не препятствует законному доступу суда, прокуратуры, Следственного комитета, Федеральной службы безопасности и иных органов, когда такое право прямо предоставлено федеральным законодательством."],[4,"ФЗ о ВС ст. 17","ФЗ «О Вооружённых Силах РО» · Глава III. ВОИНСКАЯ ЧАСТЬ, ЕЁ ТЕРРИТОРИЯ И ОХРАНА","Статья 17. Досмотр при доступе\n1. Досмотр лица, вещей и транспортного средства при добровольном доступе на территорию воинской части является мерой пропускного режима.\n2. Лицо должно быть уведомлено о необходимости такого досмотра до допуска на территорию.\n3. Пропускной досмотр не является следственным обыском и не предоставляет права на принудительный обыск без самостоятельного процессуального основания.\n4. При обнаружении запрещённого предмета или признаков преступления военнослужащий действует в пределах настоящего Федерального закона и Процессуального кодекса РО."],[4,"ФЗ о ВС ст. 18","ФЗ «О Вооружённых Силах РО» · Глава III. ВОИНСКАЯ ЧАСТЬ, ЕЁ ТЕРРИТОРИЯ И ОХРАНА","Статья 18. Незаконное проникновение и нарушение режима\n1. Военнослужащий вправе потребовать от лица, незаконно проникшего на территорию воинской части либо нарушающего установленный режим, остановиться, предъявить документы, прекратить нарушение или покинуть территорию.\n2. При наличии предусмотренного законом основания лицо может быть задержано.\n3. Для прекращения обычного нарушения режима применяются прежде всего устные требования, блокирование прохода, физическое удаление или иные соразмерные меры.\n4. Само незаконное нахождение на территории воинской части или отказ её покинуть не является самостоятельным основанием для применения смертельной силы."],[4,"ФЗ о ВС ст. 19","ФЗ «О Вооружённых Силах РО» · Глава III. ВОИНСКАЯ ЧАСТЬ, ЕЁ ТЕРРИТОРИЯ И ОХРАНА","Статья 19. Караульная служба\n1. Караульная служба обеспечивает охрану территории воинской части, контрольно-пропускных пунктов, складов вооружения, техники и иных важных объектов.\n2. Организация постов, смен, дежурств, состав караула и внутренний порядок несения службы определяются командиром воинской части и военными уставами.\n3. Караульный при исполнении вправе:\n1) проверять документы в случаях, предусмотренных пропускным режимом;\n2) проводить предусмотренный режимом досмотр;\n3) требовать прекращения нарушения режима;\n4) не допускать незаконный проход или въезд;\n5) временно ограничивать доступ к опасному участку;\n6) задерживать лицо при наличии законного основания;\n7) вызывать военную полицию или иной компетентный государственный орган."],[4,"ФЗ о ВС ст. 20","ФЗ «О Вооружённых Силах РО» · Глава III. ВОИНСКАЯ ЧАСТЬ, ЕЁ ТЕРРИТОРИЯ И ОХРАНА","Статья 20. Оружие, боеприпасы и склад\n1. Оружие, боеприпасы и специальные средства хранятся в определённых командованием местах и выдаются военнослужащим для исполнения служебных задач.\n2. Выдача и возврат вооружения подлежат служебному учёту.\n3. Военнослужащий обязан обеспечить сохранность выданного ему вооружения.\n4. Передача служебного оружия постороннему лицу, его присвоение или использование в личных целях запрещаются.\n5. Командование и военная полиция вправе проводить инвентаризацию военного имущества и проверять законность его выдачи и использования."],[4,"ФЗ о ВС ст. 21","ФЗ «О Вооружённых Силах РО» · Глава III. ВОИНСКАЯ ЧАСТЬ, ЕЁ ТЕРРИТОРИЯ И ОХРАНА","Статья 21. Военная техника и транспорт\n1. Военная техника и служебный транспорт используются для охраны, подготовки, перевозок, снабжения, специальных мероприятий и иных законных задач Вооружённых Сил.\n2. К управлению техникой допускаются военнослужащие, которым такое право предоставлено должностью, приказом или установленной подготовкой.\n3. Использование техники в личных целях запрещается.\n4. Порядок использования отдельных видов техники определяется внутренними актами в пределах федерального законодательства."],[4,"ФЗ о ВС ст. 22","ФЗ «О Вооружённых Силах РО» · Глава III. ВОИНСКАЯ ЧАСТЬ, ЕЁ ТЕРРИТОРИЯ И ОХРАНА","Статья 22. Фото-, аудио- и видеофиксация\n1. На территории воинской части может быть ограничена фото-, аудио- и видеофиксация объектов, вооружения, техники, систем охраны и иных охраняемых сведений.\n2. Такое ограничение должно быть установлено режимом воинской части и доведено до посетителей доступным способом.\n3. Ограничение не распространяется на обязательную служебную или процессуальную фиксацию уполномоченными государственными служащими.\n4. Запись, имеющая значение для дела или проверки, предоставляется компетентному государственному органу по законному требованию с соблюдением режима охраняемых сведений."],[4,"ФЗ о ВС ст. 23","ФЗ «О Вооружённых Силах РО» · Глава IV. ВОЕННАЯ ПОЛИЦИЯ И ЗАДЕРЖАНИЕ","Статья 23. Военная полиция\n1. Военная полиция является внутренним специализированным подразделением воинской части.\n2. Военная полиция обеспечивает воинскую дисциплину, безопасность территории, внутренние проверки, розыск самовольно отсутствующих военнослужащих, охрану военного имущества и содействие караулу.\n3. Военная полиция не является самостоятельным органом предварительного расследования и не подменяет МВД России, Федеральную службу безопасности, Следственный комитет или прокуратуру.\n4. Внутренняя структура и подчинённость военной полиции определяются командиром воинской части."],[4,"ФЗ о ВС ст. 24","ФЗ «О Вооружённых Силах РО» · Глава IV. ВОЕННАЯ ПОЛИЦИЯ И ЗАДЕРЖАНИЕ","Статья 24. Полномочия военной полиции\nВоенная полиция вправе:\n1) проверять служебные документы, учёт вооружения, военное имущество и служебный транспорт;\n2) проводить служебные проверки и получать объяснения военнослужащих;\n3) содействовать караулу и обеспечивать безопасность военных мероприятий;\n4) разыскивать военнослужащего, самовольно отсутствующего в месте службы, и доставлять его в воинскую часть;\n5) пресекать правонарушения на территории воинской части;\n6) охранять место происшествия и сохранять доказательства до прибытия компетентного органа.\nПринудительный обыск личных вещей, жилища или частного транспорта производится только при наличии самостоятельного процессуального основания."],[4,"ФЗ о ВС ст. 25","ФЗ «О Вооружённых Силах РО» · Глава IV. ВОЕННАЯ ПОЛИЦИЯ И ЗАДЕРЖАНИЕ","Статья 25. Задержание военнослужащими\n1. Военнослужащий вправе произвести задержание при наличии общих процессуальных оснований:\n1) на территории воинской части или установленной охраняемой территории;\n2) при преступлении против военнослужащего, военного объекта, оружия, боеприпасов, техники или специального военного груза;\n3) при исполнении законного процессуального акта компетентного государственного органа;\n4) в ходе непосредственного преследования лица, совершившего правонарушение на территории воинской части;\n5) в иных случаях, прямо предусмотренных федеральным законодательством.\n2. Процедура задержания, права задержанного, обязательная видеофиксация и иные процессуальные гарантии определяются Процессуальным кодексом РО.\n3. Вооружённые Силы не назначают уголовное или административное наказание, если такое полномочие прямо не предоставлено федеральным законом."],[4,"ФЗ о ВС ст. 26","ФЗ «О Вооружённых Силах РО» · Глава IV. ВОЕННАЯ ПОЛИЦИЯ И ЗАДЕРЖАНИЕ","Статья 26. Передача задержанного\n1. Задержанное военнослужащими лицо передаётся компетентному государственному органу без необоснованной задержки, если отсутствует самостоятельное законное основание для дальнейшего удержания Вооружёнными Силами.\n2. Передача осуществляется:\n1) Федеральной службе безопасности — при признаках преступления её подследственности или угрозы государственной безопасности;\n2) Следственному комитету — при признаках преступления его подследственности;\n3) органам внутренних дел — по материалам общей уголовной или административной компетенции;\n4) иному органу — если его компетенция прямо установлена федеральным законодательством.\n3. Вместе с лицом передаются известные обстоятельства задержания, доступные доказательства и сведения о применении силы."],[4,"ФЗ о ВС ст. 27","ФЗ «О Вооружённых Силах РО» · Глава IV. ВОЕННАЯ ПОЛИЦИЯ И ЗАДЕРЖАНИЕ","Статья 27. Правонарушения военнослужащих и служебная проверка\n1. Дисциплинарные проступки военнослужащих рассматриваются командованием или военной полицией.\n2. Служебная проверка может включать получение объяснений, изучение служебных документов, записей, военного имущества, служебных помещений и транспорта.\n3. При выявлении признаков преступления или административного правонарушения материалы передаются компетентному государственному органу.\n4. Служебная проверка не может использоваться для сокрытия правонарушения или воспрепятствования прокурорскому, следственному либо судебному контролю."],[4,"ФЗ о ВС ст. 28","ФЗ «О Вооружённых Силах РО» · Глава V. ДЕЯТЕЛЬНОСТЬ ВНЕ ВОИНСКОЙ ЧАСТИ И ПРИМЕНЕНИЕ СИЛЫ","Статья 28. Выход подразделений за пределы воинской части\n1. Организованный выход военнослужащих и техники за пределы территории воинской части допускается для:\n1) учений и подготовки;\n2) военных перевозок, снабжения и сопровождения специальных грузов;\n3) участия в официальных государственных мероприятиях;\n4) оказания законного содействия иному государственному органу;\n5) ликвидации чрезвычайной ситуации;\n6) участия в контртеррористической или иной специальной операции;\n7) обеспечения чрезвычайного или военного положения;\n8) непосредственного преследования в случаях, установленных настоящим Федеральным законом;\n9) иной законной военной задачи по распоряжению компетентного командования.\n2. Такой выход не предоставляет военнослужащим полномочий общей полиции или дорожного надзора.\n3. Учения и перевозки организуются с учётом безопасности граждан, а необходимое плановое ограничение дорожного движения согласуется с ГИБДД."],[4,"ФЗ о ВС ст. 29","ФЗ «О Вооружённых Силах РО» · Глава V. ДЕЯТЕЛЬНОСТЬ ВНЕ ВОИНСКОЙ ЧАСТИ И ПРИМЕНЕНИЕ СИЛЫ","Статья 29. Преследование за пределами территории\n1. Военнослужащий вправе продолжить непосредственное преследование лица за пределами территории воинской части, если преследование начато законно в связи с нападением на военный объект, хищением оружия или техники, иным преступлением на территории части либо непосредственной существенной угрозой военной безопасности.\n2. При первой разумной возможности о преследовании уведомляются органы внутренних дел, а при наличии угрозы государственной безопасности — Федеральная служба безопасности.\n3. После прекращения непосредственного преследования дальнейшие действия осуществляются в пределах общей компетенции соответствующих государственных органов."],[4,"ФЗ о ВС ст. 30","ФЗ «О Вооружённых Силах РО» · Глава V. ДЕЯТЕЛЬНОСТЬ ВНЕ ВОИНСКОЙ ЧАСТИ И ПРИМЕНЕНИЕ СИЛЫ","Статья 30. Применение силы, специальных средств и оружия\n1. Военнослужащие применяют физическую силу, специальные средства и оружие по общим правилам Процессуального кодекса РО и иных федеральных законов.\n2. Применение силы должно быть законным, необходимым и соразмерным фактической угрозе.\n3. Воинский приказ не является самостоятельным основанием для применения силы при отсутствии предусмотренных законом обстоятельств.\n4. Смертельная сила допускается только при наличии предусмотренного федеральным законодательством основания, связанного с непосредственной угрозой смерти или тяжкого вреда здоровью.\n5. Сам факт побега, нарушения пропускного режима, отказа исполнить требование или попытки уехать с территории не является достаточным основанием для смертельной силы."],[4,"ФЗ о ВС ст. 31","ФЗ «О Вооружённых Силах РО» · Глава V. ДЕЯТЕЛЬНОСТЬ ВНЕ ВОИНСКОЙ ЧАСТИ И ПРИМЕНЕНИЕ СИЛЫ","Статья 31. Применение военной техники\n1. Военная техника может применяться при выполнении законной военной задачи, охране и обороне воинской части, специальных операциях, чрезвычайных ситуациях, перевозках и иных предусмотренных законом мероприятиях.\n2. Использование техники непосредственно против человека допускается только при наличии основания, соразмерного опасности такого применения.\n3. Если способ применения техники объективно способен причинить смерть или тяжкий вред здоровью, действуют требования федерального законодательства о смертельной силе."],[4,"ФЗ о ВС ст. 32","ФЗ «О Вооружённых Силах РО» · Глава V. ДЕЯТЕЛЬНОСТЬ ВНЕ ВОИНСКОЙ ЧАСТИ И ПРИМЕНЕНИЕ СИЛЫ","Статья 32. Взаимодействие с государственными органами\n1. Вооружённые Силы взаимодействуют с МВД России, ГИБДД, Федеральной службой безопасности, Следственным комитетом, прокуратурой, судами и иными государственными органами в пределах компетенции каждого.\n2. При контртеррористической или иной операции в сфере государственной безопасности Вооружённые Силы выполняют согласованные задачи с Федеральной службой безопасности при сохранении военной цепи командования.\n3. МВД России и ГИБДД сохраняют свои полномочия по охране общественного порядка и дорожному движению.\n4. Вооружённые Силы исполняют законные судебные и процессуальные акты, однако следователь, прокурор или иное должностное лицо не осуществляет повседневное командование воинской частью.\n5. При чрезвычайном или военном положении дополнительные полномочия Вооружённых Сил определяются законом и актом о введении соответствующего режима."],[4,"ФЗ о ВС ст. 33","ФЗ «О Вооружённых Силах РО» · Глава VI. КОНТРОЛЬ, ОТВЕТСТВЕННОСТЬ И ЗАКЛЮЧИТЕЛЬНЫЕ ПОЛОЖЕНИЯ","Статья 33. Контроль и надзор\n1. Министр внутренних дел и Руководитель Вооружённых Сил осуществляют ведомственный контроль за службой, дисциплиной, сохранностью имущества и законностью внутренних актов.\n2. Прокуратура РО осуществляет надзор за соблюдением Вооружёнными Силами федерального законодательства в установленных законом формах.\n3. Вооружённые Силы обязаны исполнять вступившие в силу судебные акты и законные требования компетентных государственных органов.\n4. Ведомственный контроль, прокурорский надзор и судебный контроль не изменяют установленную законом военную цепь командования."],[4,"ФЗ о ВС ст. 34","ФЗ «О Вооружённых Силах РО» · Глава VI. КОНТРОЛЬ, ОТВЕТСТВЕННОСТЬ И ЗАКЛЮЧИТЕЛЬНЫЕ ПОЛОЖЕНИЯ","Статья 34. Обжалование и ответственность\n1. Действие, бездействие, приказ или решение военнослужащего, затрагивающие права лица, могут быть обжалованы вышестоящему командиру, в прокуратуру или суд.\n2. Военнослужащий несёт дисциплинарную, административную, гражданско-правовую и уголовную ответственность за виновные незаконные действия или бездействие.\n3. Командир несёт ответственность за заведомо незаконный приказ и злоупотребление командными полномочиями.\n4. Вред, причинённый незаконными действиями Вооружённых Сил или военнослужащего, возмещается в установленном федеральным законодательством порядке."],[5,"ФЗ об оружии — общие положения","ФЗ «Об оружии»","Настоящий Федеральный закон регулирует оборот оружия, боеприпасов, отдельных специальных средств и средств индивидуальной защиты на территории РО, устанавливает правила приобретения, хранения, ношения, перевозки и использования гражданского оружия, порядок лицензирования, коллекционирования, учета и изъятия оружия, а также особенности служебного и боевого оружия."],[5,"ФЗ об оружии ст. 1","ФЗ «Об оружии» · Глава I. ОБЩИЕ ПОЛОЖЕНИЯ","Статья 1. Предмет регулирования\n1. Настоящий Федеральный закон определяет правовые основы оборота оружия, боеприпасов и связанных с ними предметов в РО.\n2. Настоящий Федеральный закон не устанавливает уголовную или административную ответственность. Такая ответственность наступает исключительно в случаях, предусмотренных Уголовным кодексом РО и Кодексом РО об административных правонарушениях.\n3. Порядок применения оружия сотрудниками государственных органов и военнослужащими определяется также Процессуальным кодексом РО и специальными федеральными законами."],[5,"ФЗ об оружии ст. 2","ФЗ «Об оружии» · Глава I. ОБЩИЕ ПОЛОЖЕНИЯ","Статья 2. Основные принципы оборота оружия\nОборот оружия основывается на законности, государственном учете огнестрельного оружия, персональной ответственности владельца, недопустимости свободного оборота служебного и боевого оружия, обеспечении безопасного хранения и уважении права гражданина на необходимую оборону в пределах, установленных федеральным законодательством."],[5,"ФЗ об оружии ст. 3","ФЗ «Об оружии» · Глава I. ОБЩИЕ ПОЛОЖЕНИЯ","Статья 3. Основные понятия\nДля целей настоящего Федерального закона:\n1) оружие — устройство или предмет, конструктивно предназначенные для поражения живой или иной цели;\n2) огнестрельное оружие — оружие, предназначенное для поражения цели на расстоянии снарядом, получающим направленное движение за счет энергии метательного заряда;\n3) холодное оружие — предмет, конструктивно предназначенный преимущественно для поражения цели при непосредственном контакте с использованием мускульной силы человека;\n4) боеприпасы — патроны, снаряды и иное снаряжение, конструктивно предназначенные для применения с оружием и поражения цели;\n5) основная часть огнестрельного оружия — конструктивный элемент, без которого штатное производство выстрела невозможно и который подлежит учету в случаях, установленных Правительством РО;\n6) оборот оружия — приобретение, передача, сбыт, хранение, ношение, перевозка, использование, коллекционирование, производство, ремонт, учет, изъятие и уничтожение оружия;\n7) гражданское оружие — оружие, допущенное к приобретению гражданами в порядке настоящего Федерального закона;\n8) служебное оружие — оружие, являющееся государственным имуществом и предназначенное для исполнения служебных обязанностей сотрудниками государственных органов и организаций;\n9) боевое оружие — вооружение, предназначенное преимущественно для выполнения боевых и специальных государственных задач и не допущенное к обычному гражданскому обороту;\n10) коллекционное оружие — оружие, законно признанное предметом коллекционирования и, когда это требуется настоящим Федеральным законом, приведенное в состояние, исключающее возможность штатного выстрела;\n11) незаконное оружие — оружие, нахождение которого у конкретного лица не имеет законного основания, в том числе незаконно изготовленное или приобретенное оружие, оружие с уничтоженной либо скрытой обязательной маркировкой, а также служебное или боевое оружие в частном владении без предусмотренного законом основания;\n12) лицензия на оружие — государственное разрешение, предоставляющее гражданину право приобретать, хранить и носить гражданское оружие в пределах настоящего Федерального закона;\n13) лицензия коллекционера — государственное разрешение на приобретение и хранение оружия в целях коллекционирования по правилам настоящего Федерального закона."],[5,"ФЗ об оружии ст. 4","ФЗ «Об оружии» · Глава I. ОБЩИЕ ПОЛОЖЕНИЯ","Статья 4. Виды оружия по правовому режиму\nПо правовому режиму оружие подразделяется на:\n1) гражданское;\n2) служебное;\n3) боевое;\n4) коллекционное;\n5) оружие, запрещенное к гражданскому обороту.\nОтнесение конкретного вида оружия к гражданскому, служебному или боевому определяется настоящим Федеральным законом, иными федеральными законами и перечнями, утверждаемыми Правительством РО."],[5,"ФЗ об оружии ст. 5","ФЗ «Об оружии» · Глава I. ОБЩИЕ ПОЛОЖЕНИЯ","Статья 5. Гражданское оружие\n1. Гражданским признается огнестрельное и иное оружие, официально допущенное к приобретению гражданами и находящееся в законном обороте.\n2. Перечень видов оружия, разрешенных к гражданскому обороту, утверждается Правительством РО.\n3. Огнестрельное оружие, реализуемое гражданам специализированной оружейной организацией на законном основании и имеющее установленную маркировку, считается гражданским, если оно не отнесено законом к иной категории.\n4. Оружие, не включенное в гражданский оборот, не становится гражданским вследствие его фактического приобретения частным лицом."],[5,"ФЗ об оружии ст. 6","ФЗ «Об оружии» · Глава I. ОБЩИЕ ПОЛОЖЕНИЯ","Статья 6. Служебное и боевое оружие\n1. Служебное и боевое оружие является государственным имуществом, если иное прямо не установлено федеральным законом.\n2. Право на его получение, хранение и ношение возникает у сотрудника или военнослужащего в связи с исполнением служебных обязанностей и не требует гражданской лицензии на оружие.\n3. Служебное или боевое оружие не может быть обращено в личную собственность сотрудника путем выдачи со склада, временного пользования либо увольнения со службы.\n4. Основания и порядок применения такого оружия определяются специальным федеральным законом и Процессуальным кодексом РО."],[5,"ФЗ об оружии ст. 7","ФЗ «Об оружии» · Глава I. ОБЩИЕ ПОЛОЖЕНИЯ","Статья 7. Оружие, запрещенное к гражданскому обороту\nК гражданскому обороту не допускаются:\n1) боевое и служебное оружие, если федеральным законом прямо не предусмотрено иное;\n2) оружие, изготовленное или существенно переделанное без законного разрешения;\n3) огнестрельное оружие с умышленно уничтоженной, измененной или скрытой обязательной маркировкой, кроме законно зарегистрированного деактивированного коллекционного образца;\n4) взрывные устройства и иное вооружение, оборот которого прямо запрещен федеральным законодательством;\n5) оружие, прямо исключенное из гражданского оборота актом Правительства РО, изданным на основании настоящего Федерального закона."],[5,"ФЗ об оружии ст. 8","ФЗ «Об оружии» · Глава I. ОБЩИЕ ПОЛОЖЕНИЯ","Статья 8. Предметы, не являющиеся оружием, специальные средства и средства защиты\n1. Предметы хозяйственно-бытового, производственного и спортивного назначения не признаются оружием только вследствие возможности причинить ими вред.\n2. Обычные инструменты, фонари, спортивный инвентарь и иные предметы, не предназначенные конструктивно преимущественно для поражения цели, не требуют оружейной лицензии.\n3. Наручники, служебные электрошоковые устройства, специальные палки, специальные химические, светозвуковые и иные средства государственного принуждения являются служебными специальными средствами и не находятся в свободном гражданском обороте, если федеральным законом прямо не установлено иное.\n4. Бронежилет и иное средство индивидуальной защиты сами по себе оружием не являются.\n5. Средство индивидуальной защиты, состоящее на государственном учете и имеющее маркировку государственного органа, не может находиться в частном владении без законного основания."],[5,"ФЗ об оружии ст. 9","ФЗ «Об оружии» · Глава II. ГРАЖДАНСКОЕ ОРУЖИЕ: ПРИОБРЕТЕНИЕ, ХРАНЕНИЕ, НОШЕНИЕ И ИСПОЛЬЗОВАНИЕ","Статья 9. Право гражданина на оружие\n1. Совершеннолетний гражданин РО вправе приобретать, хранить и носить гражданское оружие при наличии действующей лицензии на оружие и соблюдении настоящего Федерального закона.\n2. Наличие лицензии не предоставляет права приобретать служебное, боевое или иное оружие, не допущенное к гражданскому обороту.\n3. Право на оружие может быть ограничено или прекращено только на основаниях и в порядке, установленных федеральным законодательством."],[5,"ФЗ об оружии ст. 10","ФЗ «Об оружии» · Глава II. ГРАЖДАНСКОЕ ОРУЖИЕ: ПРИОБРЕТЕНИЕ, ХРАНЕНИЕ, НОШЕНИЕ И ИСПОЛЬЗОВАНИЕ","Статья 10. Приобретение гражданского оружия\n1. Гражданское огнестрельное оружие приобретается у специализированной организации, законно осуществляющей торговлю оружием.\n2. При приобретении проверяются личность покупателя, действительность лицензии и возможность приобретения соответствующего вида оружия."],[5,"ФЗ об оружии ст. 11","ФЗ «Об оружии» · Глава II. ГРАЖДАНСКОЕ ОРУЖИЕ: ПРИОБРЕТЕНИЕ, ХРАНЕНИЕ, НОШЕНИЕ И ИСПОЛЬЗОВАНИЕ","Статья 11. Ношение гражданского оружия\n1. Ношение гражданского оружия допускается только при наличии действующей лицензии.\n2. Оружие при ношении должно находиться в кобуре, на предназначенном для этого оружейном ремне, в чехле, сумке либо иным безопасным способом, исключающим его беспричинное удержание в руках.\n3. Демонстративное обнажение либо удержание оружия в руках в общественном месте без законной необходимости не допускается.\n4. По законному требованию уполномоченного сотрудника владелец обязан предъявить документ, удостоверяющий личность, и подтвердить наличие действующей лицензии.\n5. Ношение оружия в состоянии опьянения запрещается. Настоящее правило не лишает лицо права на необходимую оборону при внезапно возникшем общественно опасном посягательстве."],[5,"ФЗ об оружии ст. 12","ФЗ «Об оружии» · Глава II. ГРАЖДАНСКОЕ ОРУЖИЕ: ПРИОБРЕТЕНИЕ, ХРАНЕНИЕ, НОШЕНИЕ И ИСПОЛЬЗОВАНИЕ","Статья 12. Хранение оружия\n1. Владелец обязан хранить оружие таким образом, чтобы исключить доступ к нему посторонних лиц.\n2. По месту постоянного хранения огнестрельное оружие должно находиться в запираемом сейфе, оружейном шкафу или ином надежно запираемом хранилище.\n3. Огнестрельное оружие при длительном хранении должно быть разряжено, если иное не требуется для законной служебной деятельности.\n4. Владелец несет ответственность за соблюдение установленных правил хранения в пределах, предусмотренных федеральным законодательством."],[5,"ФЗ об оружии ст. 13","ФЗ «Об оружии» · Глава II. ГРАЖДАНСКОЕ ОРУЖИЕ: ПРИОБРЕТЕНИЕ, ХРАНЕНИЕ, НОШЕНИЕ И ИСПОЛЬЗОВАНИЕ","Статья 13. Перевозка и транспортирование оружия\n1. Перевозка гражданского оружия допускается владельцем при наличии действующей лицензии либо иного законного основания.\n2. При перевозке оружие должно быть размещено способом, исключающим случайное применение, свободный доступ посторонних и беспричинную демонстрацию.\n3. Допускается временное размещение оружия в закрытом багажном или ином защищенном отсеке транспортного средства, если исключен доступ посторонних лиц.\n4. Оставление оружия в транспортном средстве на длительное время вместо надлежащего места хранения не допускается.\n5. Перевозка оружия, изъятого как доказательство или запрещенного к обороту, осуществляется по правилам Процессуального кодекса РО и ведомственного учета."],[5,"ФЗ об оружии ст. 14","ФЗ «Об оружии» · Глава II. ГРАЖДАНСКОЕ ОРУЖИЕ: ПРИОБРЕТЕНИЕ, ХРАНЕНИЕ, НОШЕНИЕ И ИСПОЛЬЗОВАНИЕ","Статья 14. Передача, продажа и дарение оружия\n1. Передача гражданского огнестрельного оружия в собственность другого лица допускается только через предусмотренную законом процедуру переоформления либо специализированную оружейную организацию.\n2. Продажа, дарение или иное отчуждение оружия непосредственно лицу, не имеющему права на его приобретение, запрещаются.\n3. Временная передача оружия другому гражданину для самостоятельного ношения или использования не допускается, кроме случаев, прямо предусмотренных федеральным законом.\n4. Передача оружия уполномоченному государственному служащему при проверке, изъятии, добровольной сдаче или иной законной процедуре не является отчуждением оружия."],[5,"ФЗ об оружии ст. 15","ФЗ «Об оружии» · Глава II. ГРАЖДАНСКОЕ ОРУЖИЕ: ПРИОБРЕТЕНИЕ, ХРАНЕНИЕ, НОШЕНИЕ И ИСПОЛЬЗОВАНИЕ","Статья 15. Боеприпасы\n1. Гражданин вправе приобретать и хранить боеприпасы только к оружию, которое он вправе законно приобретать или которым законно владеет.\n2. Передача и сбыт боеприпасов осуществляются по тем же основным правилам, что и передача гражданского оружия.\n3. Боеприпасы к служебному или боевому оружию, не допущенные к гражданскому обороту, не могут находиться у гражданина без самостоятельного законного основания."],[5,"ФЗ об оружии ст. 16","ФЗ «Об оружии» · Глава II. ГРАЖДАНСКОЕ ОРУЖИЕ: ПРИОБРЕТЕНИЕ, ХРАНЕНИЕ, НОШЕНИЕ И ИСПОЛЬЗОВАНИЕ","Статья 16. Применение оружия гражданином\n1. Лицензия на оружие предоставляет право владения и ношения оружия, но сама по себе не создает основания для причинения вреда другому человеку.\n2. Гражданин вправе применить оружие при необходимой обороне, крайней необходимости и в иных случаях, прямо допускаемых федеральным законодательством.\n3. Правомерность причинения вреда определяется прежде всего положениями Уголовного кодекса РО об обстоятельствах, исключающих преступность деяния.\n4. Применение оружия после прекращения общественно опасного посягательства в целях мести или наказания не допускается."],[5,"ФЗ об оружии ст. 17","ФЗ «Об оружии» · Глава II. ГРАЖДАНСКОЕ ОРУЖИЕ: ПРИОБРЕТЕНИЕ, ХРАНЕНИЕ, НОШЕНИЕ И ИСПОЛЬЗОВАНИЕ","Статья 17. Защита жилища\n1. Гражданин вправе использовать законно находящееся у него оружие для защиты себя и других лиц от общественно опасного посягательства, в том числе совершенного с незаконным проникновением в жилище.\n2. Незаконное проникновение в жилище учитывается при оценке характера и реальности угрозы, однако само по себе не предоставляет безусловного права причинить любой вред независимо от фактических обстоятельств.\n3. Пределы необходимой обороны определяются Уголовным кодексом РО."],[5,"ФЗ об оружии ст. 18","ФЗ «Об оружии» · Глава II. ГРАЖДАНСКОЕ ОРУЖИЕ: ПРИОБРЕТЕНИЕ, ХРАНЕНИЕ, НОШЕНИЕ И И
