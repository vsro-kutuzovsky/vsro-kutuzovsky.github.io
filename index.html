<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1B2F55"><meta name="description" content="Памятка военнослужащего ВС РО и поиск по законам и уставам сервера «Кутузовский» проекта «Россия Онлайн»"><title>Памятка ВС РО</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Oswald:wght@500;600&display=swap" media="print" onload="this.media='all'"><style id="app-style">
html{-webkit-text-size-adjust:100%}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
:root{
  --bg:#EDF0F4;--surface:#FFFFFF;--surface-2:#F5F7FA;--ink:#15192A;--ink-2:#3A4256;--muted:#5E6780;--line:#D5DBE5;
  --bar:#1B2F55;--bar-ink:#FFFFFF;--bar-muted:#AFC0DE;
  --navy:#1F3864;--navy-ink:#1F3864;--brass:#A9832F;--brass-ink:#7A5B17;--brass-soft:#F3EAD4;
  --info-bg:#EEF2FA;--info-bar:#1F3864;--ok-bg:#EAF4EC;--ok-bar:#2E6B3A;--warn-bg:#FBF3E4;--warn-bar:#9A6B12;
  --danger-bg:#FBEDED;--danger-bar:#8B1E1E;--alarm-bg:#FDECEC;--alarm-ink:#B00000;--mark:#FFE08A;--mark-ink:#15192A;
  --grp:#DCE3EF;--focus:#3D6FD6;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --f-disp:"Oswald","Arial Narrow","Roboto Condensed",Arial,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,"Courier New",monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#0D121C;--surface:#151B29;--surface-2:#1B2233;--ink:#E7EAF1;--ink-2:#C3C9D6;--muted:#8E97AB;--line:#2A3347;
  --bar:#111A2E;--bar-ink:#F2F4F8;--bar-muted:#8FA3C8;
  --navy:#2B4A80;--navy-ink:#9DB8EA;--brass:#D4B06A;--brass-ink:#E3C68A;--brass-soft:#2E2716;
  --info-bg:#172238;--info-bar:#6F93D6;--ok-bg:#15261A;--ok-bar:#5FAE72;--warn-bg:#2A2112;--warn-bar:#D6A24A;
  --danger-bg:#2B1616;--danger-bar:#E07A7A;--alarm-bg:#2E1414;--alarm-ink:#FF8A8A;--mark:#7A6420;--mark-ink:#FFF6D6;
  --grp:#1F2A42;--focus:#7FA6F0;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0D121C;--surface:#151B29;--surface-2:#1B2233;--ink:#E7EAF1;--ink-2:#C3C9D6;--muted:#8E97AB;--line:#2A3347;
  --bar:#111A2E;--bar-ink:#F2F4F8;--bar-muted:#8FA3C8;
  --navy:#2B4A80;--navy-ink:#9DB8EA;--brass:#D4B06A;--brass-ink:#E3C68A;--brass-soft:#2E2716;
  --info-bg:#172238;--info-bar:#6F93D6;--ok-bg:#15261A;--ok-bar:#5FAE72;--warn-bg:#2A2112;--warn-bar:#D6A24A;
  --danger-bg:#2B1616;--danger-bar:#E07A7A;--alarm-bg:#2E1414;--alarm-ink:#FF8A8A;--mark:#7A6420;--mark-ink:#FFF6D6;
  --grp:#1F2A42;--focus:#7FA6F0;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding-inline:16px}

/* brand */
.brand{background:var(--bar);color:var(--bar-ink)}
.brand .wrap{display:flex;align-items:center;gap:14px;padding-block:14px}
.brand img{width:52px;height:auto;flex:none}
.brand-txt{flex:1;min-width:0}
.brand-eyebrow{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--bar-muted)}
.brand-name{font-family:var(--f-disp);font-weight:600;font-size:21px;letter-spacing:.03em;text-transform:uppercase;line-height:1.2}
.brand-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:7px 12px;font-size:14px;font-weight:500;cursor:pointer;line-height:1.2}
.btn:hover{border-color:var(--navy-ink)}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.primary:hover{filter:brightness(1.1)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--navy-ink)}
.btn.small{padding:4px 9px;font-size:12.5px;border-radius:6px}
.btn.danger{color:var(--danger-bar)}
.btn.armed{background:var(--danger-bar);border-color:var(--danger-bar);color:#fff}
.btn[disabled]{opacity:.55;cursor:default}
.brand .btn{background:transparent;color:var(--bar-ink);border-color:rgba(255,255,255,.28)}
.brand .btn:hover{border-color:var(--brass)}
.brand .btn.on{background:var(--brass);border-color:var(--brass);color:#1B1606}

/* sticky toolbar */
.tools{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.tools .wrap{padding-block:10px 8px;display:grid;gap:8px}
.search{position:relative}
.search input{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 40px 10px 14px;font-size:16px}
.search input:focus{border-color:var(--navy-ink);outline:none}
.search .clear{position:absolute;right:6px;top:50%;transform:translateY(-50%)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
.chip{flex:none;text-decoration:none;color:var(--ink-2);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 11px;font-size:13px;white-space:nowrap}
.chip:hover{border-color:var(--navy-ink);color:var(--navy-ink)}
.chip .cnt{font-family:var(--f-mono);font-size:11px;margin-left:5px;color:var(--brass-ink)}
.chip.dim{opacity:.4}
.found{font-size:13px;color:var(--muted);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.law{border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.law summary{cursor:pointer;padding:10px 14px;display:grid;gap:2px;list-style:none}
.law summary::-webkit-details-marker{display:none}
.law-t{font-family:var(--f-mono);font-weight:700;font-size:13.5px;color:var(--navy-ink)}
.law-c{font-size:12px;color:var(--muted)}
.law-s{font-size:14px;color:var(--ink-2)}
.law[open] .law-s{display:none}
.law-x{white-space:pre-wrap;padding:10px 14px 12px;font-size:14.5px;border-top:1px dashed var(--line)}
.srcs{font-size:12.5px;color:var(--muted);margin-top:10px;max-width:90ch}
.aud{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--brass-ink);border:1px solid var(--brass);border-radius:999px;padding:2px 9px;white-space:nowrap}

/* hero */
.hero{padding-block:22px 6px}
.hero h1{font-family:var(--f-disp);font-weight:600;font-size:clamp(24px,4.2vw,34px);line-height:1.15;letter-spacing:.01em;margin:0 0 8px;text-wrap:balance;color:var(--ink)}
.hero .meta{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13.5px;color:var(--muted)}
.hero .meta b{color:var(--ink-2);font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;margin-top:12px;font-size:13px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}

/* sections */
main{display:grid;gap:18px;padding-block:14px 40px}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;scroll-margin-top:130px}
.sec-head{display:flex;align-items:center;gap:10px;padding:13px 18px;border-bottom:1px solid var(--line);background:var(--surface-2);flex-wrap:wrap}
.sec-head h2{font-family:var(--f-disp);font-weight:500;font-size:19px;letter-spacing:.04em;text-transform:uppercase;margin:0;flex:1;min-width:200px;color:var(--navy-ink);text-wrap:balance}
.sec-body{padding:16px 18px 18px;display:grid;gap:14px}
.sec-body > *{min-width:0}
.b-p{margin:0;max-width:72ch}
.b-sub{font-family:var(--f-body);font-weight:700;font-size:15px;margin:6px 0 -4px;color:var(--ink);letter-spacing:.01em}
.b-list{margin:0;padding-left:20px;display:grid;gap:6px}
.b-list li::marker{color:var(--brass)}
.b-steps{list-style:none;margin:0;padding:0;display:grid;gap:9px}
.b-steps li{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start}
.b-steps .num{font-family:var(--f-mono);font-weight:700;font-size:13px;width:26px;height:26px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;margin-top:1px}
.b-quote{margin:0;padding:12px 16px;border-left:3px solid var(--brass);background:var(--brass-soft);border-radius:0 8px 8px 0;font-style:italic;color:var(--ink-2)}
.ref{font-style:italic;font-size:.86em;color:var(--muted);white-space:normal}
.sud{font-size:.85em;color:var(--danger-bar);font-weight:600;white-space:nowrap}
strong{font-weight:650}

.b-callout{border-radius:10px;padding:13px 16px;border-left:4px solid var(--info-bar);background:var(--info-bg);display:grid;gap:8px}
.b-callout .c-title{font-weight:700;font-size:15px;color:var(--info-bar)}
.b-callout ul{margin:0;padding-left:20px;display:grid;gap:6px}
.b-callout p{margin:0}
.tone-ok{background:var(--ok-bg);border-color:var(--ok-bar)} .tone-ok .c-title{color:var(--ok-bar)}
.tone-warn{background:var(--warn-bg);border-color:var(--warn-bar)} .tone-warn .c-title{color:var(--warn-bar)}
.tone-danger{background:var(--danger-bg);border-color:var(--danger-bar)} .tone-danger .c-title{color:var(--danger-bar)}
.tone-alarm{background:var(--alarm-bg);border:2px solid var(--alarm-ink);text-align:center;padding:18px}
.tone-alarm .c-title{color:var(--alarm-ink);font-family:var(--f-disp);font-size:22px;letter-spacing:.05em;text-transform:uppercase}
.tone-alarm .alarm-line{margin:0;color:var(--alarm-ink);font-weight:650;font-size:16px;text-wrap:balance}
.tone-alarm .alarm-note{margin:4px 0 0;font-size:13.5px;color:var(--ink-2)}

.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
.b-table{width:100%;border-collapse:collapse;font-size:14.5px}
.b-table th{background:var(--navy);color:#fff;text-align:left;font-weight:600;font-size:13px;letter-spacing:.02em;padding:9px 12px}
.b-table td{padding:9px 12px;border-top:1px solid var(--line);vertical-align:top}
.b-table tr.grp td{background:var(--grp);color:var(--navy-ink);font-weight:700;font-size:13.5px;padding:7px 12px}
.b-table td.mono{font-family:var(--f-mono);font-weight:700;white-space:nowrap;font-size:13.5px}
.b-table td.pun{white-space:nowrap;color:var(--navy-ink);font-weight:600}
.pod{display:inline-flex;gap:3px;flex-wrap:nowrap}
.b-table td.podc{white-space:nowrap}
.pod i{font-style:normal;font-family:var(--f-mono);font-size:11.5px;font-weight:700;min-width:21px;height:21px;display:inline-grid;place-items:center;border-radius:5px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2)}
.pod i.v{background:var(--brass);border-color:var(--brass);color:#1B1606}

.ladder{display:grid;gap:3px;counter-reset:lvl}
.ladder .cap{font-size:12.5px;color:var(--muted);margin-bottom:4px}
.ladder .lv{display:grid;grid-template-columns:34px 1fr;align-items:stretch;border-radius:6px;overflow:hidden;background:var(--surface-2)}
.ladder .lv b{display:grid;place-items:center;background:var(--line);color:var(--navy-ink);font-family:var(--f-mono);font-size:13px}
.ladder .lv span{padding:7px 12px}
.ladder .lv.hl{background:var(--info-bg)}
.ladder .lv.hl b{background:var(--navy);color:#fff}
.ladder .lv.hl span{font-weight:650;color:var(--navy-ink)}

mark{background:var(--mark);color:var(--mark-ink);border-radius:3px;padding:0 1px}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:28px 18px;text-align:center;color:var(--muted)}

footer{border-top:1px solid var(--line);padding-block:18px 60px;font-size:13px;color:var(--muted);display:grid;gap:6px}
footer .who{color:var(--ink-2)}

/* edit mode */
.blk{position:relative}
.edit .blk{outline:1px dashed var(--line);outline-offset:6px;border-radius:4px}
.ebar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
.ebar .tag{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-right:4px}
.addrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding-top:4px;border-top:1px dashed var(--line)}
.addrow select{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:4px 8px;font-size:13px}
.banner{border-radius:10px;padding:10px 14px;font-size:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner.edit-on{background:var(--brass-soft);border:1px solid var(--brass)}
.banner.info{background:var(--info-bg);border:1px solid var(--line)}
.savebar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--bar);color:var(--bar-ink);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.savebar .wrap{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-inline:0}
.savebar .msg{flex:1;min-width:180px;font-size:14px}
.savebar .btn{background:transparent;color:var(--bar-ink);border-color:rgba(255,255,255,.3)}
.savebar .btn.primary{background:var(--brass);border-color:var(--brass);color:#1B1606}

/* dialog */
.ovl{position:fixed;inset:0;z-index:50;background:rgba(8,12,22,.55);display:grid;place-items:center;padding:16px}
.dlg{background:var(--surface);color:var(--ink);border-radius:12px;width:min(640px,100%);max-height:calc(100% - 20px);overflow:auto;padding:18px;display:grid;gap:12px;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.dlg h3{margin:0;font-family:var(--f-disp);font-weight:500;letter-spacing:.03em;text-transform:uppercase;font-size:18px;color:var(--navy-ink)}
.fld{display:grid;gap:5px}
.fld label{font-size:13px;font-weight:600;color:var(--ink-2)}
.fld input,.fld textarea,.fld select{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:8px 10px;font-size:14.5px;width:100%}
.fld textarea{min-height:140px;resize:vertical;line-height:1.45}
.hint{font-size:12.5px;color:var(--muted)}
.dlg-actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}

@media (max-width:640px){
  body{font-size:15px}
  .brand .wrap{flex-wrap:wrap}
  .brand-actions{width:100%;justify-content:flex-start}
  .sec-head,.sec-body{padding-inline:14px}
  .b-table thead{display:none}
  .b-table,.b-table tbody,.b-table tr,.b-table td{display:block;width:100%}
  .b-table tr{border-top:1px solid var(--line);padding:8px 0}
  .b-table tr.grp{padding:0}
  .b-table td{border:0;padding:3px 12px}
  .b-table td[data-label]::before{content:attr(data-label);display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  .b-table td.nolabel::before{display:none}
  .b-table td.mono,.b-table td.podc{display:inline-block;width:auto;padding-right:4px;vertical-align:middle}
  .b-table td.pun{white-space:normal;font-size:14px}
}
@media (prefers-reduced-motion:no-preference){.btn,.chip{transition:border-color .15s,background-color .15s}}

/* static site additions */
button.chip{cursor:pointer;font-family:inherit;line-height:1.4}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.chip.on .cnt{color:#F3D98B}
.chip.lawchip{border-color:var(--brass);color:var(--brass-ink)}
.found .btn{padding:2px 6px}
.law{scroll-margin-top:150px}
.law.hl{border-color:var(--brass);box-shadow:inset 3px 0 0 var(--brass)}
.law-h{font-size:14px;color:var(--ink);font-weight:500}
.law[open] .law-h{display:none}
.law-f{display:flex;gap:8px;flex-wrap:wrap;padding:0 14px 12px}
.sec-body > details.law{margin-top:-6px}
.sec-body > .chap + details.law{margin-top:-4px}
.chap{font-family:var(--f-disp);font-weight:500;text-transform:uppercase;letter-spacing:.04em;font-size:15.5px;color:var(--brass-ink);margin:10px 0 0;scroll-margin-top:150px;text-wrap:balance}
.toc{display:flex;flex-wrap:wrap;gap:6px}
.toc-i{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:5px 10px;font-size:13px;cursor:pointer;text-align:left;color:var(--ink-2)}
.toc-i span{font-family:var(--f-mono);font-size:11px;color:var(--brass-ink);margin-left:4px}
.toc-i:hover{border-color:var(--navy-ink)}
.lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.lib-card{display:grid;gap:3px;align-content:start;text-align:left;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:12px 14px;cursor:pointer;color:var(--ink)}
.lib-card:hover{border-color:var(--navy-ink)}
.lib-code{font-family:var(--f-mono);font-weight:700;font-size:15px;color:var(--navy-ink)}
.lib-name{font-size:14px;line-height:1.35}
.lib-n{font-size:12px;color:var(--muted)}
.tips{margin-top:12px;font-size:13.5px;color:var(--ink-2);line-height:2;max-width:90ch}
.tip{font-family:var(--f-mono);font-size:12.5px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:1px 7px;margin:0 3px;cursor:pointer;color:var(--navy-ink);white-space:nowrap;line-height:1.5}
.tip:hover{border-color:var(--navy-ink)}
.note{font-size:13.5px;color:var(--ink-2);background:var(--warn-bg);border:1px solid var(--line);border-left:3px solid var(--warn-bar);border-radius:8px;padding:8px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn.more{justify-self:start}
.exact .sec-head{background:var(--brass-soft)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:60;background:var(--bar);color:var(--bar-ink);padding:9px 16px;border-radius:9px;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:calc(100% - 32px)}
.brand-author{font-size:12.5px;color:var(--bar-muted);margin-top:2px;line-height:1.35}
.brand-author b{color:#F3D98B;font-weight:600;font-family:var(--f-mono);font-size:12px}
.author{margin-top:14px;display:inline-grid;gap:2px;padding:11px 16px 12px;border-radius:10px;background:var(--brass-soft);border:1px solid var(--brass);border-left-width:4px;max-width:100%}
.author-lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--brass-ink);font-weight:600}
.author-name{font-family:var(--f-disp);font-weight:600;font-size:20px;letter-spacing:.02em;color:var(--ink);line-height:1.25}
.author-role{font-size:14px;color:var(--ink-2);display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline}
.author-static{font-family:var(--f-mono);font-size:13px;color:var(--brass-ink);white-space:nowrap}
.author-static b{color:var(--ink);font-weight:700}
.xref{display:inline-block;margin:2px 6px 2px 0;padding:3px 10px;border:1px solid var(--navy-ink);border-radius:999px;background:var(--info-bg);color:var(--navy-ink);font:inherit;font-size:13px;font-weight:600;cursor:pointer;line-height:1.35;text-align:left}
.xref:hover{background:var(--navy);color:#fff}
.chip.dept{border-color:var(--brass);color:var(--brass-ink);font-weight:600}
.sec.dept{border-color:var(--brass)}
.sec.dept .sec-head{background:var(--brass-soft);box-shadow:inset 4px 0 0 var(--brass)}
.depts{margin-top:18px;container-type:inline-size}
.depts-lbl{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:8px}
.depts-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@container (max-width:519px){.dept-btn:last-child:nth-child(odd){grid-column:1/-1}}
@container (min-width:520px){.depts-grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
@container (min-width:860px){.depts-grid{grid-template-columns:repeat(7,minmax(0,1fr))}}

.pn{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.toc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}

.toc-link{background:none;border:0;border-radius:7px;text-align:left;padding:6px 8px;font:inherit;font-size:14px;color:var(--ink-2);cursor:pointer;line-height:1.3}

:"Всем","blocks":[{"t":"table","cols":["Что","Срок","Основание"],"rows":[["Рабочий день — будни","10:00–23:00","УВС, раздел «Рабочий день»"],["Рабочий день — выходные","10:00–22:00","УВС, раздел «Рабочий день»"],["Рабочий день — государственные праздники","13:00–22:00","УВС, раздел «Рабочий день»"],["**Вечерний рапорт** — присутствуют все, постовые покидают пост","ежедневно в 22:00","УВС п. 2.3"],["Обед-перерыв","до 2 часов в день","УВС п. 4.2.7"],["**Увольнительная** — от звания Сержант","раз в сутки, 60 минут","УВС п. 2.5"],["**Отпуск** — с одобрения комсостава","до 7 суток в месяц","УВС п. 4.2.6"],["Повышения","сразу после вечерней поверки","УВС п. 6.2.6"]]},{"t":"list","items":["В рабочее время находиться на территории ВЧ; исключения — спецоперации, увольнительное время, патрули, приказ штаба [[УВС п. 4.1.11]]. Покинуть ВЧ без разрешения — выговор или увольнение [[ДУ п. 4.13]].","Подполковники работают без нормированного дня и могут покидать ВЧ по личным делам с устного разрешения Генерала [[УВС п. 2.5]].","Неявка на вечерний рапорт — строгое нарушение воинской дисциплины [[УВС п. 2.3]].","Отсутствие на посту больше 5 дней без оповещения руководства — увольнение [[ДУ п. 4.36]]."]}],"group":"sluzhba"},{"id":"narusheniya","label":"Нарушения ДУ","title":"Частые нарушения Дисциплинарного устава","aud":"Всем","blocks":[{"t":"table","cols":["Пункт ДУ","Что запрещено","Наказание"],"rows":[["## Дисциплина и субординация"],["4.1","Несоблюдение военной этики","Выговор / переаттестация"],["4.2","Оскорблять гражданских, военнослужащих, государственных служащих","Выговор / переаттестация"],["4.10","Игнорировать или нарушать приказы старшего состава, в том числе построение","Выговор / переаттестация / понижение"],["4.17","Обманывать, вводить в заблуждение старший состав","Выговор / увольнение"],["4.34","Несоблюдение субординации","Выговор"],["4.45","Неуставное общение на плацу и посту","Устное предупреждение / выговор"],["## Построение и строй"],["4.25","Спать на посту или в строю","Выговор / понижение на 2 ранга"],["4.28","Разговаривать во время построения (кроме обращения ведущего)","Выговор"],["4.29","Самовольно покидать строй","Выговор / увольнение"],["4.30","Непристойные движения в строю — танцы, разминки","Понижение на 3 ранга / увольнение"],["4.33","Использовать телефон в строю","Выговор / строгий выговор"],["## Территория ВЧ и транспорт"],["4.13","Покидать территорию ВЧ без разрешения (кроме сержантов и выше при одобренном увольнительном)","Выговор / увольнение"],["4.14","Ездить на личном транспорте по территории ВЧ","Выговор / переаттестация"],["4.16","Парковать личный транспорт вне территории казарм","Выговор"],["4.20","Бездействие на территории ВЧ (кроме курилки)","Выговор / увольнение — только Генералитет"],["4.23","Проезжать КПП 1 или 2 на личном транспорте без остановки для проверки","Выговор"],["4.46","Превышать 45 км/ч на ТС по территории ВЧ (кроме поставки)","Выговор"],["## Форма и внешний вид"],["4.22","Носить форму не своего подразделения","Выговор / понижение на 3 ранга / увольнение"],["4.22.1","Носить погоны не своего звания","Выговор"],["4.35","Находиться на территории ВЧ в гражданской одежде","Выговор"],["4.47","Стрижка длиннее 3 мм; девушкам — аккуратная заплетённая","наказание в ДУ не указано"],["## Имущество, оружие, склад"],["4.7","Использовать служебную технику не по назначению","Выговор"],["4.8","Продавать, отдавать табельное оружие посторонним","Увольнение + список нежелательных лиц"],["4.26","Заступать в караул без полного снаряжения","Выговор"],["4.38","Класть личные вещи и мусор на склад ВЧ","Выговор / увольнение"],["4.44","Засорять склад сломанной амуницией (тяжёлые бронежилеты ниже 90%, лёгкие ниже 40%)","Выговор"],["4.51","Отходить от грузовиков дальше 3 м при погрузке и разгрузке материалов","Увольнение / + список нежелательных лиц"],["## Служба и отчётность"],["4.9","Пропускать на территорию ВЧ лиц без доступа","Выговор"],["4.18","Разглашать военную тайну","Увольнение / + список нежелательных лиц"],["4.24","Халатность","Выговор / увольнение + список нежелательных лиц"],["4.36","Отсутствовать на посту больше 5 дней без оповещения","Увольнение"],["4.43","Некорректно оформлять документы и отчётность","Устное предупреждение / выговор"],["4.50","Игнорировать вызов ВАА на дело дольше 2 дней","Увольнение / + список нежелательных лиц"]]}],"group":"razbory"},{"id":"vzyskaniya","label":"Взыскания и обжалование","title":"Взыскания и обжалование","aud":"Всем","blocks":[{"t":"list","items":["Виды взысканий: выговор (устный или строгий), переаттестация, понижение в звании, увольнение [[ДУ пп. 1.1, 1.6]].","Выговор отрабатывается по индивидуальному заданию сотрудника ВП или ВАА. Переаттестация — у ВП (для 1–3 порядковых званий допустим отдел МА); на неё 72 часа, иначе увольнение [[ДУ пп. 1.1–1.2]].","С действующим выговором нельзя получить увольнение, повышение и перевод в другую госструктуру [[ДУ п. 1.3]].","Третий выговор — увольнение [[ДУ п. 1.5]].","Выговор можно обжаловать в ВАА в течение 72 часов с момента выдачи; любые взыскания — у вышестоящего руководителя, вплоть до Премьер-министра [[ДУ п. 1.9]].","Взыскания военнослужащим других отделов выдают только ВП, Генерал, Генерал-полковник и Генерал-лейтенант [[ДУ п. 4.39]].","Вызов ВАА на «военное дело» игнорировать нельзя: неявка дольше 2 дней без уважительной причины — увольнение [[ДУ п. 4.50]]."]}],"group":"razbory"},{"id":"uk","label":"УК — частые статьи","title":"Уголовный кодекс РО — самые частые статьи","blocks":[{"t":"p","text":"**Подследственность** — буквы у статьи [[ст. 5.12 УК РО]]: **Р** — МВД, **Ф** — ФСБ, **В** — Военная полиция, **С** — Следственный комитет. Если букв несколько, дело может вести любое из этих ведомств. Наказание — лишение свободы в месяцах."},{"t":"table","cols":["Статья","Подсл.","Что запрещено","Наказание"],"rows":[["## Проникновение и нарушение режима воинской части"],["12.7","Ф/Р/С","Незаконное проникновение и/или нахождение на закрытом объекте","до 30 мес."],["12.7.1","Ф/Р/С","Незаконное проникновение и/или нахождение на режимном объекте (объекте с особым статусом), закрытом для посещения уполномоченным лицом","до 50 мес. + судимость"],["12.7.2","Ф","Проникновение на территорию оцепления военного или чрезвычайного положения (кроме пропуска, одобренного сотрудниками на КПП)","до 50 мес. + судимость"],["17.6","Ф/Р/С","Неподчинение законным требованиям сотрудников Армии РО и других силовых структур, злонамеренное игнорирование требований","до 30 мес."],["17.11","Ф/Р/С/В","Провокация сотрудников Армии, помеха несению службы на прилегающей постовой территории","до 30 мес."],["## Оскорбления и угрозы"],["17.3","Ф/Р","Оскорбление представителя власти при исполнении обязанностей или в связи с их исполнением","до 30 мес."],["17.8","Р","Грубое и неоднократное оскорбление человека в общественном месте в присутствии представителя власти","до 10 мес."],["6.6","Ф/Р","Угроза расправой (прямая или косвенная) сотруднику гос. структуры либо его близким","до 30 мес."],["6.7","Р","Угрозы с целью запугать человека","до 20 мес."],["## Нападение на воинскую часть, военнослужащих и военное имущество"],["17.1","Ф/Р","Посягательство на жизнь госслужащего при исполнении (в т. ч. военнослужащего) или его близких в связи со службой: тяжкие телесные повреждения или прямая угроза жизни","до 50 мес. + судимость"],["17.2","Ф/Р","Лёгкие или средние телесные повреждения, угроза насилием представителю власти в связи со службой","до 40 мес. + судимость"],["12.9","Ф/Р","Хищение огнестрельного оружия, его деталей, спецсредств, взрывчатых веществ","до 40 мес. + судимость"],["12.8.1","Ф/Р/С","Незаконное хранение, ношение, использование гос. спецсредств, тяжёлого бронежилета и иного гос. имущества","до 50 мес. + судимость"],["10.7.1","Р","Угон и управление гос. (в том числе военным) транспортом лицом, не служащим в этой структуре","до 40 мес. + судимость"],["10.8.1","Ф/Р/С","Умышленное уничтожение или повреждение государственного имущества","до 30 мес."],["17.12","Ф/Р/В","Помеха колонне гос. структур: встраивание, задержка движения, попытка остановить","до 30 мес."],["17.12.1","Ф/Р/В","Помеха гос. структурам при подготовке к перевозке и перевозке материалов (поставка)","50 мес. + судимость"],["## При задержании и проверке документов"],["17.13","Ф/Р","Побег или сопротивление при задержании, аресте, процессуальном принуждении","до 40 мес. + судимость"],["17.9","Ф/Р/С","Помеха задержанию либо содействие такой помехе (если это делает гос. сотрудник — ст. 17.10, до 50 мес.)","до 40 мес. + судимость"],["14.4","Ф/С","Приобретение, использование или сбыт формы гос. структуры, жетонов, удостоверений, нашивок","до 20 мес."],["17.4.1","Р","Подделка официальных документов и военных сертификатов, изготовление поддельных печатей, бланков, подписей","до 40 мес. + судимость"],["## Воинские преступления — подследственность Военной полиции"],["8.1","Ф/Р/В","Неисполнение приказа начальника, причинившее существенный вред интересам службы","до 30 мес."],["8.2","В/С","Самовольное оставление части или места службы, неявка в срок без уважительной причины","до 20 мес."],["8.3","В/С","Дезертирство — оставление части или неявка с целью уклониться от военной службы","до 30 мес."],["8.4","В/С","Нарушение правил боевого дежурства по обнаружению и отражению нападения на охраняемый объект","до 30 мес."],["8.5","В/С","Уничтожение или повреждение оружия, боеприпасов, предметов военной техники","до 20 мес."],["8.6","В/С","Нарушение правил вождения боевой, специальной или транспортной машины, повлёкшее тяжкий вред здоровью","до 40 мес. + судимость"]]},{"t":"callout","tone":"info","title":"Как применять","items":["Военнослужащий, осуществляющий властные полномочия на территории ВЧ, — **представитель власти** [[ФЗ «О ВС РО» ст. 4]]. Оскорбление постового, патруля или сотрудника ВП при исполнении — **ст. 17.3**.","Отказ предъявить документы или снять маску — **ст. 17.6** и основание для процедуры **установления личности** [[ПК гл. II ст. 1.1]]. Но задерживать **только за маску** правила проекта запрещают [[Правила гос. 1.20]].","Статьи только с буквами **Ф** и/или **С** (например, 12.7.2, 14.4) — исключительная подследственность ФСБ или СК: задержать и **передать**, окончательно не решать [[ПК гл. II ст. 2.7.1]].","Оскорбления и нарушения **между военнослужащими** — сначала Дисциплинарный устав (п. 4.1, 4.2 и др.); УК — если есть состав преступления."]}],"aud":"Всем","group":"razbory"},{"id":"sila","label":"Сила и оружие","title":"Сила и оружие","blocks":[{"t":"callout","tone":"warn","title":"Правила применения силы","items":["Сила — только **необходимая и соразмерная** угрозе; сначала менее опасные средства [[ПК гл. XI ст. 4]].","Смертельная сила — **только при непосредственной угрозе жизни** или тяжкого вреда здоровью [[ПК гл. XI ст. 5; ФЗ ст. 30]].","Само проникновение, отказ уйти, побег или попытка уехать с территории — **не основание** для смертельной силы [[ФЗ ст. 18 ч. 4, ст. 30 ч. 5]].","**Выстрел в воздух из УКПС п. 3.4 — НЕ ПРИМЕНЯТЬ.** ПК запрещает предупредительные выстрелы и выстрелы без цели поразить законную цель [[ПК гл. XI ст. 5 ч. 4]], а ПК стоит выше УКПС [[Конституция ст. 7; ПК гл. XIII ст. 1 ч. 3; ФЗ ст. 2 ч. 3]]. Стадии по УКПС 3.4 выполняются без этого шага: требование и предупреждение → отсчёт до трёх → наручники → вызов ВП.","Машина въезжает на закрытую, охраняемую территорию — можно сразу останавливать принудительно, соразмерными средствами, в том числе стрельбой по колёсам [[ПК гл. XI ст. 6 ч. 7, 9]]. Отказ выйти из машины — извлечь силой, но не стрелять на поражение [[ПК гл. XI ст. 6 ч. 10]]."]}],"aud":"Всем","group":"sluzhba"},{"id":"otdel-vp","dept":"ВП","title":"ВП — Военная полиция","label":"ВП","aud":"Отдел ВП","blocks":[{"t":"p","text":"Поддерживает правопорядок и воинскую дисциплину, охраняет военные объекты, предотвращает и пресекает правонарушения. **Законные требования ВП обязательны для всех военнослужащих** [[УВС п. 2.1]]. ВП — внутреннее подразделение части и не подменяет МВД, ФСБ, СК и прокуратуру [[ФЗ «О ВС РО» ст. 23; ДУ п. 2.4.1]]."},{"t":"sub","text":"Где действует ВП [[ДУ п. 2.2]]"},{"t":"list","items":["территория воинской части и военных объектов, КПП и прилегающая охраняемая территория;","места учений, операций и военных мероприятий; военный транспорт, имущество и вооружение;","военнослужащие при исполнении обязанностей;","за пределами части — если военнослужащий совершает нарушение, находится в розыске или его действия вредят репутации и безопасности армии; при преследовании лица, скрывшегося с военного объекта; поиск дезертиров;","приём задержанных и передача их в МВД / ФСБ."]},{"t":"sub","text":"Полномочия [[ФЗ «О ВС РО» ст. 24; ДУ п. 2.3]]"},{"t":"list","items":["**Надзор за всеми военнослужащими**, кроме генералитета; о нарушении генералитета — запрос в ВАА [[ДУ п. 2.3]].","Проверять служебные документы, учёт вооружения, военное имущество и служебный транспорт.","Проводить служебные проверки и получать объяснения военнослужащих.","Разыскивать самовольно отсутствующих и доставлять их в часть; за дезертирами можно выезжать даже в составе одного сотрудника [[УКПС 4.4]].","Пресекать правонарушения на территории части; охранять место происшествия и сохранять доказательства до прибытия компетентного органа.","**Выдавать взыскания военнослужащим любых отделов** [[ДУ п. 4.39]]; вмешиваться в работу других отделов — только для пресечения нарушения [[ДУ п. 4.40]].","Проводить переаттестацию (устный экзамен) и давать индивидуальные задания на отработку выговоров [[ДУ пп. 1.1–1.2]]."]},{"t":"callout","tone":"danger","title":"ВП не вправе [[ДУ п. 2.4; ФЗ «О ВС РО» ст. 23–24]]","items":["подменять МВД, ФСБ, СК и прокуратуру, вести предварительное расследование;","за пределами военных объектов действовать в отношении гражданских без непосредственной угрозы армии;","вмешиваться в управление подразделением, если командование не нарушает закон или устав;","отменять приказы командования — незаконный приказ можно только приостановить;","назначать наказания, которых нет в уставе;","принудительно обыскивать личные вещи, жилище или частный транспорт без самостоятельного процессуального основания."]},{"t":"sub","text":"Служебная проверка"},{"t":"steps","items":["**Зафиксируй нарушение:** запись, скриншоты, свидетели, рапорт [[ТК ст. 53 ч. 1]].","**Получи объяснения** военнослужащего; изучи документы, записи, имущество, служебные помещения и транспорт [[ФЗ «О ВС РО» ст. 27 ч. 2]].","Дисциплинарный проступок — взыскание по ДУ {{vzyskaniya}}. Есть признаки преступления или административного правонарушения — **материалы передаются** компетентному органу, проверка их не заменяет [[ФЗ «О ВС РО» ст. 13 ч. 5, ст. 27 ч. 3]].","Решение можно обжаловать в ВАА в течение 72 часов; жалобы на действия ВП тоже рассматривает ВАА [[ДУ пп. 1.9, 3.2.3]]."]},{"t":"callout","tone":"warn","title":"Правила проекта для силовых структур","items":["Задержание, обыск, изъятие — только **с видеозаписью**: цельной, без монтажа, не ниже 480p, с оригинальным звуком [[Правила гос. 7.4]].","Злоупотребление функционалом запрещено: задержание **«за маску»** (в том числе приказ снять маску и задержание за отказ), задержание госсотрудников, которые сами проводят задержание, максимальный срок за мелкое нарушение [[Правила гос. 1.20]]. Процедура установления личности [[ПК гл. II ст. 1.1]] — когда проверка документов законна сама по себе, а не как повод задержать за маску.","Нельзя задерживать игрока, убитого в процессе задержания и находящегося в больнице [[Правила гос. 7.2]].","Госслужащего под арест или в КПЗ — только по решению прокурора, принявшего вызов [[Правила гос. 1.14]].","Изымать предметы без причины запрещено [[Правила гос. 1.17]].","Удостоверение носить и предъявлять по запросу участника RP-процесса [[Правила гос. 1.21.1]]."]},{"t":"p","text":"Подробно: {{zaderzhanie}} {{peredacha}} {{osobye}} {{sroki}} {{tk}}"}],"group":"otdely"},{"id":"otdel-vps","dept":"ВПС","title":"ВПС — Военно-постовая служба","label":"ВПС","aud":"Отдел ВПС","blocks":[{"t":"p","text":"Несёт службу на КПП и постах: проверяет документы и транспорт, держит пропускной режим, охраняет военные объекты и не допускает проникновения [[УВС п. 2.1]]. Все заступившие на пост подчиняются **дежурному по КПП** — старшему по рангу на этом посту [[УКПС 3.12–3.13]]."},{"t":"table","cols":["Пост","Что это","Часовых"],"rows":[["КПП-1","Основной, приоритетный КПП. Перекрытие — не меньше 2 машин NAZ TIGER [[УКПС 2.1]]","от 1 до 8"],["КПП-2","Дополнительный КПП. Перекрытие — 1 машина NAZ TIGER [[УКПС 2.1]]","от 1 до 8"],["ПВ-1 … ПВ-8","Постовые вышки: красная, жёлтая, зелёная, фиолетовая, голубая, розовая, мятная, синяя [[УКПС 2.2]]","—"]]},{"t":"sub","text":"Как заступить на пост"},{"t":"steps","items":["**Полный комплект:** бронежилет, заряженное оружие, боеприпасы, бинты; знать караульный устав. Без комплекта заступать нельзя — выговор [[УКПС 6.7; ДУ п. 4.26]].","**Доложи в рацию:** пост, код «Белый», состав — «КПП-1 „Белый“. Состав: 2» [[УКПС 1.1, 3.1]].","**Каждые 15 минут** — доклад о состоянии поста: «ПВ-7 „Зелёный“. Состав: 1» [[УКПС 3.2]].","**Уходя** — доклад с кодом «Серый» [[УКПС 1.1, 3.1]]. Покидать пост без причины или без разрешения нельзя [[УКПС 6.2]].","В 22:00 на **вечерний рапорт** постовые и дежурные покидают пост [[УВС п. 2.3]]."]},{"t":"table","cols":["Код рации","Когда"],"rows":[["«Белый» [Б]","Заступил на пост"],["«Серый» [С]","Покинул пост"],["«Зелёный» [З]","Всё спокойно, без происшествий"],["«Жёлтый» [Ж]","Скопление подозрительных лиц, нарушение общественного порядка"],["«Красный» [К]","Проникновение на территорию, вооружённое нападение, массовое нарушение порядка"],["«Чёрный» [Ч]","Боевая тревога: нападение на часть большой вооружённой группой"]]},{"t":"p","text":"Коды — [[УКПС 1.1]]. Тэги в рации: [ВП], [ССО], [ВПС], [ВК], [ВВС], [ВДВ], [ВА] — Академия; у генералитета тэга нет [[УКПС 1.2]]."},{"t":"sub","text":"Как нести службу"},{"t":"list","items":["На въезде и выезде проверить **документы или удостоверение** и узнать **цель** у каждого — и военнослужащего, и гражданского [[УКПС 3.3]]. Кто проходит без проверок — {{kpp}}","Подъехал не военнослужащий — проверить документы, узнать цель визита и **сообщить в рацию** [[УКПС 3.6]].","В машине военнослужащие вместе с незнакомцами — незнакомцев высадить, пропустить только военнослужащих [[УКПС 3.12]].","С гражданами на КПП — вежливо и тактично; в разговоры не вступать, кроме проверки документов, цели визита и предупреждений [[УКПС 3.8, 6.6]].","Знать опознавательные знаки и сигналы транспорта ВС РО — иначе выговор [[УКПС 3.9]].","Не допускать проникновения посторонних — иначе выговор [[УКПС 3.10; ДУ п. 4.9]].","Военнослужащих ниже Сержанта с территории не выпускать без уставного одобрения [[УКПС 6.9]].","На посту — только уставное общение [[ДУ п. 4.45]]."]},{"t":"callout","tone":"danger","title":"Постовому запрещено","items":["выпускать из рук, отдавать или продавать оружие и амуницию [[УКПС 6.1]];","покидать пост без причины или без разрешения [[УКПС 6.2]];","пропускать посторонних без разрешения комсостава или генералитета [[УКПС 6.3]];","спать на посту — выговор или понижение на 2 ранга [[ДУ п. 4.25]]. «Уйти в себя» — до 5 минут, предупредив напарника и дежурного, в будке; если ты на посту один — нельзя [[УКПС 6.4]];","отключать рацию [[УКПС 6.5]];","залезать на будки и машины, бегать и прыгать без причины, шуметь, слушать музыку, курить [[УКПС 6.8]];","использовать полномочия караульного в корыстных целях — выговор [[УКПС 6.15]]."]},{"t":"sub","text":"Если проникновение"},{"t":"steps","items":["**Сообщи в рацию:** «Красный» — проникновение, «Чёрный» — нападение большой вооружённой группой [[УКПС 1.1, 5.1]].","Займи безопасную позицию и готовься к проникновению со стороны своего поста [[УКПС 5.2–5.3]].","**Свой пост не бросай**, даже если нападают на другой. Без паники, в разговоры с нарушителем не вступай [[УКПС 5.5–5.7]].","Действуй по порядку и с соразмерной силой: {{poryadok}} {{sila}}","После задержания: наручники; без сознания — перевернуть на живот; первая помощь; ждать ВП [[УКПС 5.10]]. Дальше — {{peredacha}} {{net-vp}}","Сам **не вызывай** МВД / ГИБДД / ФСБ и сам **не вези** задержанного — только с разрешения комсостава или генералитета [[УКПС 5.8–5.9]]."]},{"t":"callout","tone":"warn","title":"Важно","items":["«Ликвидировать на месте» из УКПС 5.4 — только в пределах закона: смертельная сила допустима лишь при непосредственной угрозе жизни или тяжкого вреда здоровью. Само проникновение, побег или попытка уехать — не основание [[ФЗ «О ВС РО» ст. 18 ч. 4, ст. 30; ПК гл. XI ст. 5]].","Выстрел в воздух из УКПС 3.4 не применять — ПК запрещает предупредительные выстрелы [[ПК гл. XI ст. 5 ч. 4]]."]}],"group":"otdely"},{"id":"otdel-gbr","dept":"ГБР","title":"ГБР — Группа быстрого реагирования","label":"ГБР","aud":"Отдел ГБР","blocks":[{"t":"p","text":"Мобильное подразделение для оперативного выезда на чрезвычайные происшествия, пресечения правонарушений, **задержания вооружённых лиц**, усиления охраны объектов и поддержки других подразделений [[УВС п. 2.1]]."},{"t":"sub","text":"Выезд за пределы части [[ФЗ «О ВС РО» ст. 28]]"},{"t":"p","text":"Организованный выезд допускается только для законной задачи: учения; перевозки, снабжение и сопровождение спецгрузов; государственные мероприятия; законное содействие другому госоргану; ликвидация ЧС; контртеррористическая или иная спецоперация; режим ЧП или военного положения; непосредственное преследование; иная законная задача по распоряжению командования. **Выезд не даёт полномочий полиции и дорожного надзора** [[ФЗ «О ВС РО» ст. 28 ч. 2]]."},{"t":"list","items":["На вызовы и задержания — только на **служебном транспорте** [[Правила гос. 7.3]]; на ограбления — не меньше 2 человек [[Правила гос. 7.3.1]].","Патруль — минимум 2 военнослужащих, звание выше Сержанта, и только если на обоих КПП стоит хотя бы по одному постовому [[УКПС 4.3–4.5]]. Выходя в патруль, знать законодательную базу — иначе возможно увольнение [[УКПС 4.2]].","Колонну не обгонять и от маршрута ведущего не отклоняться — выговор [[ДУ пп. 4.31–4.32]].","На территорию криминальной организации не заходить; исключения — рейд, военное положение. Если с территории открыли огонь по сотрудникам — можно зайти в течение 15 минут, составом от 10 человек [[Правила гос. 7.5]].","На всеобщих построениях ГБР разрешено оставаться в маске [[УВС п. 4.2.4]]."]},{"t":"sub","text":"Преследование [[ФЗ «О ВС РО» ст. 29]]"},{"t":"p","text":"Продолжать погоню за пределами части можно, только если она **законно началась**: нападение на военный объект, хищение оружия или техники, другое преступление на территории части или существенная угроза военной безопасности. При первой возможности уведомить МВД, при угрозе госбезопасности — ФСБ. Когда непосредственное преследование закончилось, дальше работают компетентные органы."},{"t":"callout","tone":"warn","title":"Задержание вооружённых лиц","items":["Оружие — по основаниям [[УВС п. 4.3]], и только законно, необходимо и соразмерно; приказ сам по себе не основание [[ФЗ «О ВС РО» ст. 30 ч. 2–3]].","Смертельная сила — только при непосредственной угрозе жизни или тяжкого вреда здоровью [[ФЗ «О ВС РО» ст. 30 ч. 4]]. Подробно — {{sila}}","Техника против человека — только при основании, соразмерном опасности [[ФЗ «О ВС РО» ст. 31 ч. 2]].","После применения оружия: прекратить огонь, когда угроза устранена; вызвать медпомощь раненым; сохранить обстановку [[ФЗ об оружии ст. 18]]."]},{"t":"p","text":"Задержанного — Военной полиции или по подследственности: {{peredacha}} {{zaderzhanie}} Правила проекта для силовых — в разделе {{otdel-vp}}"}],"group":"otdely"},{"id":"otdel-sso","dept":"ССО","title":"ССО — Силы специальных операций","label":"ССО","aud":"Отдел ССО","blocks":[{"t":"p","text":"Специально подготовленные подразделения для особо сложных и важных боевых задач: разведывательных, диверсионных, антитеррористических и иных специальных операций, в том числе в глубоком тылу противника [[УВС п. 2.1]]."},{"t":"sub","text":"Что разрешено на спецоперации"},{"t":"list","items":["находиться за пределами части [[УВС п. 4.1.11]];","носить форму не своего подразделения [[УВС п. 4.1.12]];","носить служебную маску; на всеобщих войсковых построениях маска разрешена ССО, ВВС и ГБР [[УВС п. 4.2.4]];","проходить КПП без проверок — спецоперации и конвои пропускаются в первую очередь [[УКПС 3.3]]."]},{"t":"sub","text":"Правовые рамки"},{"t":"list","items":["Выход за пределы части — для контртеррористической или иной спецоперации, содействия госорганам и других законных задач [[ФЗ «О ВС РО» ст. 28]].","В контртеррористических операциях и операциях госбезопасности — согласованные задачи с ФСБ при сохранении военной цепи командования [[ФЗ «О ВС РО» ст. 32 ч. 2]].","Армия привлекается к обеспечению безопасности государства только в случаях, предусмотренных законодательством, либо по решению Правительства или Премьер-министра [[Правила гос. 2.5]].","Освобождение заложников, пресечение террористических посягательств — основание для применения оружия [[УВС п. 4.3]]; сила — соразмерно угрозе {{sila}}","**Военная тайна:** расположение, передвижение и состав, внутренние процедуры и коды не разглашать [[УВС п. 4.1.8]] — увольнение [[ДУ п. 4.18]]."]},{"t":"callout","tone":"info","title":"В разработке","items":["Порядок подготовки и проведения спецопераций ССО."]}],"group":"otdely"},{"id":"otdel-vvs","dept":"ВВС","title":"ВВС — Военно-воздушные силы","label":"ВВС","aud":"Отдел ВВС","blocks":[{"t":"p","text":"Защищают воздушное пространство, ведут воздушную разведку, поражают наземные и воздушные цели, перевозят личный состав и технику, оказывают авиационную поддержку сухопутным подразделениям [[УВС п. 2.1]]."},{"t":"sub","text":"Лётная техника"},{"t":"list","items":["**Пользоваться лётной техникой могут только ВВС**, военнослужащие других подразделений с одобрением на доступ и комсостав от Подполковника и выше. При нехватке техники приоритет — пилотам ВВС. Нарушение — выговор [[ДУ п. 4.37]].","Управлять техникой может тот, кому это право дано должностью, приказом или подготовкой; в личных целях — запрещено [[ФЗ «О ВС РО» ст. 21]]. Использование не по назначению — выговор [[ДУ п. 4.7]].","Патрулирование — на служебном воздушном или наземном транспорте ВС РО [[УКПС 4.1]]. Патруль — от 2 человек, звание выше Сержанта и только при постовых на обоих КПП [[УКПС 4.3–4.5]].","Нарушение правил эксплуатации боевой, специальной или транспортной машины, повлёкшее тяжкий вред здоровью, — до 40 мес. + судимость, подследственность В/С [[УК ст. 8.6]]. Угон военного транспорта посторонним — [[УК ст. 10.7.1]]."]},{"t":"sub","text":"Воздушное пространство части"},{"t":"list","items":["Несанкционированное проникновение и нахождение в воздушном пространстве ВЧ — основание для применения оружия [[УВС п. 4.3]]. Сила — законно и соразмерно, смертельная — только при угрозе жизни {{sila}}","Пилоту можно предъявить требование о посадке; при неповиновении — принудительная остановка соразмерными средствами, а при проникновении на закрытую охраняемую территорию — без промедления [[ПК гл. XI ст. 6 ч. 1, 7, 9]].","Техника против человека — только при основании, соразмерном опасности [[ФЗ «О ВС РО» ст. 31 ч. 2]].","На всеобщих построениях ВВС разрешено оставаться в маске [[УВС п. 4.2.4]]. Тэг в рации — [ВВС] [[УКПС 1.2]]."]},{"t":"callout","tone":"info","title":"В разработке","items":["Порядок полётов, допуск пилотов и типы воздушной техники ВВС."]}],"group":"otdely"},{"id":"otdel-vms","dept":"ВМС","title":"ВМС — Военно-медицинская служба","label":"ВМС","aud":"Отдел ВМС","blocks":[{"t":"p","text":"**Военно-медицинская служба (ВМС)** — специальное подразделение Вооружённых сил, предназначенное для оказания медицинской помощи военнослужащим, эвакуации и лечения раненых, проведения профилактических мероприятий, контроля санитарного состояния подразделений и сохранения здоровья личного состава [[УВС п. 2.1]]."},{"t":"sub","text":"Ключевые задачи ВМС"},{"t":"list","items":["**Первая помощь** в полевых условиях и на учениях — в соответствии с законодательством РО.","**Реанимация и стабилизация** состояния пострадавших.","**Медицинские осмотры** — согласно регламенту ВМС. Запись на освидетельствование — в соответствующем канале спецсвязи по закреплённому шаблону.","**Лекции и тренинги** для медперсонала и бойцов.","**Контроль медснабжения:** аптечки, оборудование, лекарства, находящиеся на складе воинской части."]},{"t":"sub","text":"Дежурства сотрудников ВМС"},{"t":"callout","tone":"ok","title":"Дежурный медик","items":["На территории медицинского пункта **всегда должен оставаться один дежурный сотрудник ВМС**.","Его обязанности: **вакцинация, лечение военнослужащих и проведение медицинских освидетельствований**.","При большом наплыве военнослужащих дежурный вправе **вызвать по рации других сотрудников ВМС** для помощи в проведении освидетельствований."]},{"t":"p","text":"В течение дня сотрудники ВМС обязаны **периодически передавать в рацию** уведомление:"},{"t":"quote","text":"/f Товарищи военнослужащие, на территории воинской части работает дежурный медик. Кому нужны таблетки, вакцины и прохождение медицинского освидетельствования — ожидаю у медицинского пункта!"},{"t":"sub","text":"Что говорят законы о медпомощи для военнослужащих"},{"t":"list","items":["Экстренная медицинская помощь **не может быть произвольно ограничена** [[Конституция ст. 29 ч. 2]].","**Бинты** — часть обязательного снаряжения караула [[ДУ п. 4.26]].","**Медикаменты — военное имущество:** только для служебных целей, выдача и учёт — по уставам [[ФЗ «О ВС РО» ст. 5]]."]},{"t":"sub","text":"Взаимодействие с другими подразделениями"},{"t":"p","text":"ВМС входит в структуру ВС РО наряду с ВК, ВП, ВВС, ССО, ГБР, ВПС и Академией [[УВС п. 2.1]]."},{"t":"callout","tone":"warn","title":"Пределы полномочий ВМС","items":["ВМС **не подменяет гражданские медучреждения** и **не назначает наказания** [[ДУ п. 4.39; ФЗ «О ВС РО» ст. 25 ч. 3]].","При выявлении признаков преступления материалы **передаются в СК, ФСБ, МВД** или иной компетентный орган [[ФЗ «О ВС РО» ст. 26, ст. 27 ч. 3]]."]}],"group":"otdely"},{"id":"otdel-vk","dept":"ВК","title":"ВК — Военный комиссариат","label":"ВК","aud":"Отдел ВК","blocks":[{"t":"p","text":"Отвечает за воинский учёт, призыв, мобилизационную подготовку и работу с призывниками. **Вправе принимать на службу и отказывать в выдаче контракта** — как и любой генералитет [[УВС п. 2.1]]. Инструктор ВК — Капитан; Капитан — прямое начальство любого призывника Академии [[УВС пп. 2.4–2.5]]."},{"t":"sub","text":"Путь новобранца"},{"t":"steps","items":["**Документы.** Можно требовать документ, удостоверяющий личность, и документы, объективно нужные для службы; лишнего требовать нельзя [[ТК ст. 17]].","**Контракт.** Военная служба — по контракту [[УВС п. 1.3]]. Трудовые отношения возникают с заключения договора или с фактического допуска к службе уполномоченным лицом [[ТК ст. 18]].","**Внешний вид.** Выдающий контракт стрижёт новобранца или отвозит его в парикмахерскую: стрижка не длиннее 3 мм, у девушек — аккуратная заплетённая [[ДУ п. 4.47]].","**Академия и КМБ:** устав, строевая и физическая подготовка, обращение с оружием, основы тактики и дисциплины; в конце — экзамен и допуск к выдаче военного билета [[УВС п. 2.1]]. Критерии прохождения новобранцу называют до начала испытания [[ТК ст. 19 ч. 2]].","**Распределение** по подразделениям — после экзаменов [[УВС п. 2.1]]. До звания Сержант перевод в другое подразделение запрещён; Генерал и Генерал-полковник могут «зарезервировать» бойца за отделом со звания Сержант [[ДУ п. 4.19]]."]},{"t":"sub","text":"Академики"},{"t":"list","items":["ВК может заносить в чёрный список **только академиков** — за незавершение военной службы; остальных — Генерал и Генерал-полковник [[ДУ п. 1.7]].","Непрохождение испытания — основание прекратить службу, если решение основано на фактических результатах, а не на личном отношении [[ТК ст. 19 ч. 3]]. Как оформить — {{tk}}","Академики ниже Сержанта в патруль выходят только пешком и в сопровождении инструкторов [[УКПС 4.5]]; увольнительная — со звания Сержант [[УВС п. 2.5]]."]},{"t":"callout","tone":"danger","title":"Запрещено","items":["продавать военные билеты, по блату ускорять КМБ ради военного билета — увольнение, снятие с должности, список нежелательных лиц [[ДУ п. 4.49]];","выдавать или изымать военные билеты без весомой IC-причины — наказание от администрации проекта [[Правила гос. 1.11]];","отказывать или давать преимущества по признакам, не связанным с деловыми качествами. Требования, объективно обусловленные службой, дискриминацией не считаются [[ТК ст. 5]]."]},{"t":"callout","tone":"info","title":"В разработке","items":["Порядок набора, проведения КМБ и экзаменов Академии."]}],"group":"otdely"},{"id":"kpp","label":"Кто проходит через КПП","title":"Кто проходит через КПП","blocks":[{"t":"callout","tone":"ok","title":"Беспрепятственно, без проверок [[УКПС п. 3.3]]","items":["**Генерал, Генерал-полковник, Генерал-лейтенант, Генерал-майор ВС РО** — и в служебной, и в гражданской одежде;","**конвои, спецоперации, колонны, наборы, ЧП / ВП** — пропустить в первую очередь;","**военнослужащие армии РО от звания Сержант** — по служебным нуждам;","**Премьер-министр РО**; **Вице-премьер РО** — в пределах возложенной компетенции;","**Министр юстиции — Генеральный прокурор РО и его заместители** — при прокурорском надзоре или процессуальных полномочиях;","**руководитель гос. органа**, в ведении которого находится объект;","**сотрудники ФСО РО**, непосредственно охраняющие указанных лиц."]},{"t":"p","text":"О прибытии лиц из этого списка — **доложить по рации** высшему начальству и указать цель прибытия [[УКПС 5.11]]."},{"t":"p","text":"**После проверки документов и цели визита** пропускаются военнослужащие армии РО и лица с пропуском от Офиса Генерала Армии РО [[УКПС 2.1, 3.3, 3.6]]. Остальных — только с разрешения комсостава или генералитета [[УКПС 6.3]]. Законный доступ суда, прокуратуры, СК и ФСБ пропускной режим не ограничивает [[ФЗ «О ВС РО» ст. 16 ч. 4]]."},{"t":"p","text":"Военнослужащих ниже звания Сержант с территории не выпускать без уставного одобрения [[УКПС 6.9]]."}],"aud":"Караул и ВПС","group":"karaul"},{"id":"zaderzhanie","label":"Где и кого задерживать","title":"Где, кого и на каком основании задерживать","blocks":[{"t":"list","items":["На **территории воинской части** (начинается после КПП) и прилегающей охраняемой территории [[ФЗ «О ВС РО» ст. 14, 25; Правила гос. орг. 6.2–6.3]].","При преступлении **против военнослужащего**, военного объекта, оружия, техники или спецгруза [[ФЗ ст. 25 ч. 1]].","При **непосредственном преследовании** лица, совершившего нарушение на территории ВЧ; о погоне сразу уведомить МВД, а при угрозе госбезопасности — ФСБ [[ФЗ ст. 29]].","Военнослужащих — за воинские преступления, в том числе за пределами части (дезертиры и т. п.) [[ДУ п. 2.2]].","**Не наша юрисдикция:** патрулирование города, дорожный контроль, обычные дела граждан — это МВД и ГИБДД [[ФЗ ст. 4 ч. 2, ст. 28 ч. 2]]."]},{"t":"sub","text":"Основания для задержания (хотя бы одно)"},{"t":"p","text":"Лицо застигнуто при совершении нарушения или сразу после; на нём, при нём или в жилище явные следы; на него указывают 3 и более свидетеля; есть фото- или видеофиксация; есть акт уполномоченного лица; есть ориентировка или лицо в розыске; лицо создаёт угрозу жизни окружающих либо пьяно и при этом есть признаки нарушения [[ПК гл. II ст. 1]]."}],"aud":"Караул, ВПС, ВП","group":"karaul"},{"id":"poryadok","label":"Порядок действий постового","title":"Порядок действий постового","blocks":[{"t":"steps","start":1,"items":["**Включи боди-камеру (отыграй включение)** и не выключай до передачи задержанного. На записи — основание и весь процесс [[ПК гл. VII ст. 1]].","**Доложи в рацию:** «Красный» — проникновение или вооружённое нападение, «Чёрный» — боевая тревога, нападение на ВЧ большой вооружённой группой [[УКПС 1.1]].","**Потребуй** чётко, в приказной форме: остановиться, предъявить документы, прекратить нарушение или покинуть территорию; предупреди о применении оружия и сосчитай до трёх [[ФЗ ст. 18 ч. 1; ПК гл. XI ст. 2; УКПС 3.4]]. **Без выстрела в воздух!**","Не подчиняется — перекрой проход, удали физически; при законном основании — **задерживай**. Сила только соразмерная [[ФЗ ст. 18 ч. 2–3]].","**Надень наручники** и предъяви удостоверение или нашивку [[ПК гл. II ст. 2]].","**Первичный обыск:** документы; изъять оружие, колюще-режущее, наркотики, взрывчатку. Нет документов или лицо скрыто — установление личности [[ПК гл. II ст. 1.1, 2, 2.4]].","**Объяви основание задержания и статьи**, затем зачитай права [[ПК гл. II ст. 2, 6]]:"]},{"t":"quote","text":"«Вы имеете право хранить молчание. Всё, что вы скажете, может и будет использовано против Вас в суде. Вы имеете право на один телефонный звонок. Также Вы имеете право на адвоката. Если вам необходим адвокат, он будет для Вас запрошен. Вы понимаете свои права?»"},{"t":"steps","start":8,"items":["Окажи **первую помощь**, если нужно; в экстренной помощи отказывать нельзя [[УКПС 5.10; ПК гл. VIII ст. 4]].","**Вызови Военную полицию** и передай ей задержанного [[УКПС 3.5, 5.10; ФЗ ст. 19 п. 7]]."]}],"aud":"Караул и ВПС","group":"karaul"},{"id":"peredacha","label":"Передача задержанного ВП","title":"Передача задержанного Военной полиции","blocks":[{"t":"p","text":"Передающий обязан сообщить принимающему [[ПК гл. II ст. 2.7; ФЗ ст. 26 ч. 3]]:"},{"t":"list","items":["основание и **время** задержания;","предварительную квалификацию — **какие статьи**;","существенные обстоятельства и **свидетелей**;","применённые меры: наручники, сила, спецсредства; **что изъято**;","у кого и где **видеозапись**."]},{"t":"p","text":"Время задержания при передаче **не обнуляется** — считается с момента первого ограничения свободы [[ПК гл. II ст. 2.7.1 ч. 6]]."}],"aud":"Караул и ВПС","group":"karaul"},{"id":"net-vp","label":"Если ВП нет","title":"Если Военной полиции нет","blocks":[{"t":"steps","start":1,"items":["Продолжай удерживать задержанного и вести запись, обеспечь его безопасность [[ПК гл. VIII ст. 4]].","Запроси помощь у **комсостава или генералитета** [[УКПС 5.10]].","Вызывать МВД / ФСБ или самому везти задержанного — **только с одобрения** комсостава или генералитета [[УКПС 5.8–5.9]].","Передай по подследственности: **Р** — МВД, **Ф** — ФСБ, **С** — СК [[ФЗ ст. 26 ч. 2; ДУ п. 2.2]].","Если за процессуальный час (с учётом пауз) задержанного никто не принял и другого основания нет — **освободи**, верни законно принадлежащие вещи, запись и сведения передай ВП. Материал при этом не закрывается [[ПК гл. II ст. 2.5.1, 2.7.1 ч. 7, 7 «г»]]."]}],"aud":"Караул и ВПС","group":"karaul"},{"id":"osobye","label":"Особые случаи","title":"Особые случаи","blocks":[{"t":"callout","tone":"info","title":"Когда порядок другой","items":["**Задержан госслужащий** (в том числе военнослужащий) — обязателен вызов прокурора и СК; под арест — только по решению прокурора. Вызов не подтвердили или прокурор не прибыл за 15 минут — освободить, материалы направить в прокуратуру [[ПК гл. II ст. 4, 10 «д»; Правила гос. орг. 1.14]].","**Просит адвоката** — вызвать через госканал; нет ответа 3 минуты — продолжать; подтвердил прибытие — ждать до 10 минут [[ПК гл. II ст. 3.1–3.3]].","Заявляет о **неприкосновенности** — проверить статус до обыска и других действий со специальной процедурой [[ПК гл. II ст. 2.8]]."]}],"aud":"Караул, ВПС, ВП","group":"karaul"},{"id":"sroki","label":"Сроки","title":"Сроки, которые нужно помнить","blocks":[{"t":"table","cols":["Что","Срок","Основание"],"rows":[["**Процессуальный час** — максимум удержания без решения","60 минут","ПК гл. II ст. 7 «г»"],["Ответ на вызов государственного адвоката","3 минуты","ПК гл. II ст. 3.1"],["Ожидание адвоката после подтверждения (час на паузе)","до 10 минут","ПК гл. II ст. 3.2–3.3"],["Конфиденциальный разговор с адвокатом","до 10 минут","ПК гл. II ст. 9 «б»"],["Телефонный звонок задержанного (в присутствии сотрудника)","до 3 минут","ПК гл. II ст. 9 «а»"],["Ожидание прокурора при задержании госслужащего","до 15 минут","ПК гл. II ст. 4.2–4.3"],["Дополнительная проверка обстоятельств (час на паузе)","до 20 минут","ПК гл. II ст. 7.1 «г»"],["Доставка и ожидание СК / ФСБ (час на паузе, суммарно)","до 20 минут","ПК гл. II ст. 7.1 «д»"],["Хранение видеозаписи задержания","не менее 48 часов","ПК гл. VII ст. 3"]]}],"aud":"Караул, ВПС, ВП","group":"karaul"},{"id":"dep","label":"Вызовы в /dep","title":"Вызовы в /dep","blocks":[{"t":"callout","tone":"alarm","title":"Внимание! Вызовы в /dep","items":["На вызовы в /dep «Старший состав армии, прибыть в МВД/ФСБ — задержан ваш военнослужащий» — **МЫ НЕ РЕАГИРУЕМ!**","Только принимаем к сведению, но **НА ВЫЗОВ НИ В КОЕМ СЛУЧАЕ НЕ ЕДЕМ.**","По приезде вы НЕ будете являться субъектами задержания, и ваше нахождение там будет **НЕЗАКОННЫМ!**"],"text":"Уведомление о задержании сотрудника носит только информационный характер и не даёт руководству права вмешиваться [[ПК гл. II ст. 5]]. Субъекты задержания перечислены в [[ПК гл. II ст. 8]], посторонние вмешиваться не вправе [[ст. 8.1]]. Вмешательство гос. сотрудника в задержание — **ст. 17.10 УК РО** (до 50 мес. + судимость)."}],"aud":"Комсостав и генералитет","group":"sluzhba"},{"id":"tk","label":"ТК — увольнение","title":"Трудовой кодекс РО — увольнение","blocks":[{"t":"p","text":"Воинская часть работает по ТК РО. Дисциплинарный устав ВС РО дополняет его, но внутренний акт не может ухудшать положение работника по сравнению с ТК [[ТК ст. 4 ч. 2, ст. 52 ч. 3]]."},{"t":"sub","text":"Основания прекращения трудового договора (ст. 23)"},{"t":"p","text":"По соглашению сторон · по инициативе работника · по инициативе работодателя на законном основании · истечение срока договора · перевод к другому работодателю · невозможность продолжать работу по медицинским или юридическим причинам · вступивший в силу судебный акт · иное основание федерального закона · освобождение от гос. должности компетентным лицом."},{"t":"sub","text":"По собственному желанию (ст. 24)"},{"t":"list","items":["Военнослужащий подаёт рапорт — любым способом, который подтверждает его волю [[ТК ст. 24 ч. 1]].","Удерживать против воли **нельзя**; можно потребовать в разумный срок сдать имущество, документы, дела [[ТК ст. 24 ч. 2–3]].","По ДУ при действующем выговоре увольнение не выдаётся — сначала отработка [[ДУ п. 1.2–1.3]]. Отработку давать реальную и без затягивания."]},{"t":"sub","text":"Основания увольнения, которые применяются в ВЧ"},{"t":"table","cols":["Статья ТК РО","Основание","Как это выглядит в ВЧ"],"rows":[["25 п. 1","Неоднократное виновное неисполнение обязанностей **после** применённого взыскания","Третий выговор — увольнение [[ДУ п. 1.5]]"],["25 п. 2","Однократное грубое нарушение (перечень — ст. 26)","Продажа или передача табельного оружия [[ДУ 4.8]], разглашение военной тайны [[ДУ 4.18]]"],["25 п. 3","Прогул без уважительной причины","Отсутствие более 5 дней без оповещения руководства [[ДУ 4.36]]"],["23 п. 5","**Перевод** к другому работодателю — в другую государственную структуру","Перевод с согласия руководителей обеих структур [[ТК ст. 61]]; с действующим выговором перевод невозможен [[ДУ п. 1.3]]"],["24 ч. 1","**По собственному желанию (ПСЖ)**","Рапорт военнослужащего; перед увольнением — сдать имущество; при действующем выговоре — только после отработки [[ДУ п. 1.3]]"],["25 п. 8","Непрохождение испытания или обязательной аттестации — **ПСЖ из Академии с занесением в ЧС**","Академик уходит, не завершив военную службу, — увольнение с занесением в черный список сотрудниками ВК [[ДУ п. 1.7]]"]]},{"t":"sub","text":"Однократное грубое нарушение (ст. 26)"},{"t":"p","text":"Умышленный отказ исполнять законную обязанность с существенными последствиями · насилие к работнику или гражданину в связи с работой · хищение или умышленное уничтожение имущества · грубое нарушение безопасности с реальной угрозой жизни · умышленное разглашение гос., служебной или иной тайны · использование должности для незаконной выгоды · иное нарушение, после которого продолжать службу явно невозможно."},{"t":"sub","text":"Порядок увольнения"},{"t":"steps","start":1,"items":["**Зафиксируй факт** нарушения: запись, скриншоты, свидетели, рапорт [[ТК ст. 53 ч. 1]].","Дай военнослужащему **объясниться**, если нарушение не очевидно и не бесспорно; ВП получает объяснения [[ТК ст. 53 ч. 2; ФЗ «О ВС РО» ст. 24 п. 2]].","Проверь, что решение принимает **компетентное лицо** [[ТК ст. 27 ч. 1]]: увольнение за бездействие — только Генералитет [[ДУ 4.20]], занесение в ЧС — Генерал и Генерал-полковник [[ДУ 1.7]].","Мера **соразмерна** нарушению; за одно нарушение — одно взыскание [[ТК ст. 53 ч. 4–5]].","**Оформи решение:** кто уволен, за что, основание (статья ТК и пункт ДУ), дата [[ТК ст. 27 ч. 1, ст. 53 ч. 3]].","Прими **сдачу имущества:** оружие, форма, удостоверение, служебный транспорт [[ТК ст. 24 ч. 3, ст. 58 ч. 6; ФЗ ст. 20]].","По требованию уволенного — **назови причину** и выдай относящиеся документы [[ТК ст. 27 ч. 2]].","Разъясни право **обжалования:** ВАА — в течение 72 часов [[ДУ 1.9]], прокуратура, суд [[ТК ст. 65]]. Незаконное увольнение отменяется, военнослужащий восстанавливается [[ТК ст. 27 ч. 3–4]]."]},{"t":"callout","tone":"danger","title":"Уволить нельзя","items":["Только за то, что лицо **задержано, подозревается, проверяется или в розыске** — это не доказанный проступок [[ТК ст. 25 ч. 2, ст. 60 ч. 2]].","Только за законное обжалование, отказ от заведомо незаконного приказа, сообщение о нарушении, обращение в прокуратуру или суд, использование права на отдых [[ТК ст. 54, 59 ч. 3]].","Дважды за одно и то же нарушение [[ТК ст. 53 ч. 4]].","«По утрате доверия» без объяснения причин — это только для Правительства, прокуратуры, СК и ФСБ, **не для ВС РО** [[ТК ст. 25 ч. 3]]."]}],"aud":"Комсостав и ВП","group":"razbory"}]}</script><script type="application/json" id="laws-data">{"updated":"01.10.2026","sources":[["Конституция","Конституция РО"],["УК","Уголовный кодекс РО"],["ПК","Процессуальный кодекс РО"],["ТК","Трудовой кодекс РО"],["ФЗ о ВС","ФЗ «О Вооружённых Силах РО»"],["ФЗ об оружии","ФЗ «Об оружии»"],["ДУ","Дисциплинарный устав ВС РО"],["УВС","Устав внутренней службы ВС РО"],["УКПС","Устав караульно-постовой службы ВС РО"],["Правила гос.","Правила государственных организаций"],["Правила проекта","Основные правила проекта"]],"chunks":[[0,"Конституция — общие положения","Конституция РО","Преамбула\n\nМы, граждане РО, утверждая законность, справедливость, общественную безопасность и взаимную ответственность государства и гражданина, принимаем настоящую Конституцию как основной закон РО.\n\nСОДЕРЖАНИЕ"],[0,"Конституция ст. 1","Конституция РО · Глава I. Основы государственного и правового устройства","Статья 1. РО\n\n1. РО — демократическое и правовое государство, государственная власть в котором осуществляется в соответствии с настоящей Конституцией и федеральным законодательством.\n\n2. Наименования «РО» и «Российский округ» равнозначны."],[0,"Конституция ст. 2","Конституция РО · Глава I. Основы государственного и правового устройства","Статья 2. Человек, его права и свободы\n\n1. Человек, его права и свободы являются высшей ценностью. Признание, соблюдение и защита прав и свобод человека и гражданина являются обязанностью государства и его должностных лиц.\n\n2. Государственные полномочия не могут использоваться вопреки их назначению, в личных целях либо для создания необоснованных преимуществ или ограничений."],[0,"Конституция ст. 3","Конституция РО · Глава I. Основы государственного и правового устройства","Статья 3. Источник государственной власти\n\n1. Носителем суверенитета и источником государственной власти является народ РО.\n\n2. Граждане участвуют в осуществлении государственной власти непосредственно и через государственные органы в порядке, установленном законодательством.\n\n3. Присвоение полномочий государственного органа или должностного лица запрещается."],[0,"Конституция ст. 4","Конституция РО · Глава I. Основы государственного и правового устройства","Статья 4. Организация государственной власти\n\n1. Государственная власть организуется на основе разграничения полномочий между Премьер-министром РО, Государственной Думой РО, Правительством РО, судами, прокуратурой, Следственным комитетом и правоохранительными органами.\n\n2. Государственная Дума РО осуществляет законодательную власть. Правительство РО является высшим коллегиальным исполнительным органом государственного управления.\n\n3. Судебная власть самостоятельна при осуществлении правосудия. Правительство и Премьер-министр не вправе вмешиваться в рассмотрение конкретного судебного дела иначе как в формах, прямо предусмотренных законом.\n\n4. Правительство и Премьер-министр не вправе вмешиваться в расследование конкретного уголовного дела или оперативно-розыскную деятельность правоохранительных органов, кроме случаев и процедур, прямо предусмотренных федеральным законодательством."],[0,"Конституция ст. 5","Конституция РО · Глава I. Основы государственного и правового устройства","Статья 5. Территория РО\n\n1. Суверенитет РО распространяется на всю территорию государства.\n\n2. Порядок определения административных и муниципальных территорий, режимных объектов, охраняемых зон и иных территорий устанавливается федеральным законодательством."],[0,"Конституция ст. 6","Конституция РО · Глава I. Основы государственного и правового устройства","Статья 6. Законность\n\n1. Органы государственной власти, государственные организации, должностные лица и граждане обязаны соблюдать Конституцию и действующее законодательство.\n\n2. Государственный служащий вправе осуществлять только те полномочия, которые предоставлены ему законом, актом компетентного органа либо законным поручением вышестоящего должностного лица.\n\n3. Заведомо незаконный приказ или распоряжение не подлежит исполнению в случаях и порядке, установленных федеральным законодательством."],[0,"Конституция ст. 7","Конституция РО · Глава I. Основы государственного и правового устройства","Статья 7. Иерархия нормативных правовых актов\n\n1. В РО устанавливается следующая иерархия нормативных правовых актов:\n\nКонституция РО;\nФедеральные конституционные законы;\nКодексы и федеральные законы;\nНормативные указы Премьер-министра РО;\nПостановления и распоряжения Правительства РО а равно как Вице Премьер-министра;\nНормативные акты министерств и иных федеральных органов;\nВнутренние акты государственных организаций.\n2. Акт нижестоящей юридической силы не может противоречить акту вышестоящей юридической силы.\n\n3. Внутренний регламент, инструкция, приказ подразделения или иной локальный акт не может самостоятельно устанавливать для граждан новые обязанности, запреты, составы правонарушений или наказания."],[0,"Конституция ст. 8","Конституция РО · Глава I. Основы государственного и правового устройства","Статья 8. Законодательное регулирование\n\n1. Федеральные законы и кодексы принимаются Государственной Думой РО в коллегиальном порядке и вступают в силу после утверждения и официального опубликования в порядке, установленном настоящей Конституцией и федеральным законодательством.\n\n2. Государственная Дума обеспечивает развитие и актуальность законодательной базы. Правительство, суды, прокуратура, Следственный комитет и иные государственные органы вправе вносить предложения об устранении противоречий, пробелов и устаревших норм в пределах своей компетенции.\n\n3. Изменение законодательства не допускается, если оно противоречит настоящей Конституции, установленному разграничению компетенции государственных органов или основным гарантиям прав и свобод."],[0,"Конституция ст. 9","Конституция РО · Глава I. Основы государственного и правового устройства","Статья 9. Официальное опубликование\n\n1. Нормативные акты, затрагивающие права, обязанности, ответственность граждан или компетенцию государственных органов, подлежат официальному опубликованию.\n\n2. Действующий указ, распоряжение, постановление или иной нормативный акт Премьер-министра либо Правительства должен быть размещён в установленном официальном разделе Правительства на форуме проекта, если федеральным законом не предусмотрен иной способ опубликования.\n\n3. Неопубликованный нормативный акт, затрагивающий права и обязанности граждан, не подлежит применению, кроме случаев, прямо предусмотренных законом для сведений ограниченного доступа."],[0,"Конституция ст. 10","Конституция РО · Глава I. Основы государственного и правового устройства","Статья 10. Судебное толкование\n\n1. Суд применяет Конституцию и федеральное законодательство при рассмотрении конкретных дел.\n\n2. Правовая позиция Верховного Суда обязательна для нижестоящих судов и государственных органов в части толкования действующей нормы, но не может самостоятельно устанавливать новый состав преступления или административного правонарушения.\n\n3. Суд вправе признать нормативный акт или его часть не подлежащими применению при их противоречии Конституции или акту большей юридической силы."],[0,"Конституция ст. 11","Конституция РО · Глава I. Основы государственного и правового устройства","Статья 11. Государственные организации и служащие\n\n1. Статус, компетенция и порядок деятельности государственных организаций определяются Конституцией, федеральными законами и утвержденными в установленном порядке внутренними актами.\n\n2. Служащие государственных организаций обязаны соблюдать служебную дисциплину, правила идентификации, видеофиксации и иные требования, установленные федеральным законодательством.\n\n3. Злоупотребление должностными полномочиями и государственным функционалом запрещается и влечет установленную законом ответственность."],[0,"Конституция ст. 12","Конституция РО · Глава II. Права, свободы и обязанности человека и гражданина","Статья 12. Равенство перед законом и судом\n\n1. Все равны перед законом и судом.\n\n2. Не допускается необоснованное ограничение прав по признакам пола, расы, национальности, происхождения, убеждений, должностного или имущественного положения и иным обстоятельствам, не связанным с законной целью ограничения."],[0,"Конституция ст. 13","Конституция РО · Глава II. Права, свободы и обязанности человека и гражданина","Статья 13. Право на жизнь и безопасность\n\n1. Каждый имеет право на жизнь, личную безопасность и защиту от произвольного применения насилия.\n\n2. Применение физической силы, специальных средств и оружия государственными служащими допускается только на законном основании, в необходимом объеме и в порядке, установленном федеральным законодательством."],[0,"Конституция ст. 14","Конституция РО · Глава II. Права, свободы и обязанности человека и гражданина","Статья 14. Свобода и личная неприкосновенность\n\n1. Каждый имеет право на свободу и личную неприкосновенность.\n\n2. Задержание, арест, заключение под стражу и иное принудительное ограничение свободы допускаются исключительно по основаниям и в порядке, предусмотренным федеральным законодательством."],[0,"Конституция ст. 15","Конституция РО · Глава II. Права, свободы и обязанности человека и гражданина","Статья 15. Право знать основания задержания\n\n1. Задержанному лицу должны быть сообщены основание задержания, нарушенные им нормы законодательства и принадлежащие ему процессуальные права.\n\n2. Права и применяемые нормы должны быть разъяснены ясно и в объёме, достаточном для понимания задержанным существа предъявляемых требований и ограничений.\n\n3. Порядок и момент разъяснения прав определяются процессуальным законодательством.\n\n4. Процессуальные действия должны совершаться без необоснованного затягивания. Намеренное увеличение продолжительности задержания или иной процедуры в отсутствие законной необходимости запрещается."],[0,"Конституция ст. 16","Конституция РО · Глава II. Права, свободы и обязанности человека и гражданина","Статья 16. Право на защиту и адвоката\n\n1. Каждому гарантируется право на квалифицированную юридическую помощь.\n\n2. Задержанному должна быть предоставлена разумная возможность воспользоваться помощью адвоката в порядке, установленном процессуальным законодательством.\n\n3. Отказ лица от адвоката, а также последствия последующего изменения такого решения регулируются федеральным законом. Отказ должен быть выражен однозначно либо вытекать из поведения лица в случаях, прямо предусмотренных законом.\n\n4. Государство обеспечивает функционирование механизма вызова государственного или частного адвоката и лицензирования адвокатской деятельности."],[0,"Конституция ст. 17","Конституция РО · Глава II. Права, свободы и обязанности человека и гражданина","Статья 17. Презумпция невиновности\n\n1. Лицо считается невиновным, пока его виновность не установлена в предусмотренном законом порядке.\n\n2. Обвиняемый не обязан доказывать свою невиновность.\n\n3. Неустранимые сомнения толкуются в пользу обвиняемого."],[0,"Конституция ст. 18","Конституция РО · Глава II. Права, свободы и обязанности человека и гражданина","Статья 18. Недопустимость произвольного обвинения\n\n1. Возбуждение уголовного дела, предъявление обвинения и применение мер процессуального принуждения допускаются только при наличии установленных законом оснований и достаточных данных.\n\n2. Фабрикация доказательств, давление на участников процесса и использование заведомо недостоверных сведений запрещаются."],[0,"Конституция ст. 19","Конституция РО · Глава II. Права, свободы и обязанности человека и гражданина","Статья 19. Право не свидетельствовать против себя\n\n1. Никто не обязан свидетельствовать против самого себя, своего супруга и близких родственников, круг которых определяется законом."],[0,"Конституция ст. 20","Конституция РО · Глава II. Права, свободы и обязанности человека и гражданина","Статья 20. Недопустимость повторной ответственности\n\n1. Никто не может быть повторно привлечен к уголовной ответственности за одно и то же деяние после окончательного разрешения вопроса о его виновности.\n\n2. Привлечение к различным видам ответственности за различные самостоятельные последствия одного поведения допускается только в случаях, прямо установленных законом."],[0,"Конституция ст. 21","Конституция РО · Глава II. Права, свободы и обязанности человека и гражданина","Статья 21. Законность доказательств\n\n1. Доказательства, полученные с существенным нарушением закона, не могут использоваться как единственное или определяющее основание обвинения.\n\n2. Законность получения и допустимость доказательств подлежат проверке судом."],[0,"Конституция ст. 22","Конституция РО · Глава II. Права, свободы и обязанности человека и гражданина","Статья 22. Неприкосновенность частной жизни\n\n1. Каждый имеет право на неприкосновенность частной жизни, личную и семейную тайну, защиту чести и достоинства.\n\n2. Сбор, хранение и использование сведений о частной жизни допускаются только на законном основании."],[0,"Конституция ст. 23","Конституция РО · Глава II. Права, свободы и обязанности человека и гражданина","Статья 23. Тайна сообщений\n\n1. Каждый имеет право на тайну переписки, телефонных переговоров и иных сообщений.\n\n2. Ограничение этого права допускается на основании судебного решения либо в иных прямо предусмотренных федеральным законом случаях с последующим контролем законности."],[0,"Конституция ст. 24","Конституция РО · Глава II. Права, свободы и обязанности человека и гражданина","Статья 24. Неприкосновенность жилища и собственности\n\n1. Жилище и иная законно занимаемая частная территория неприкосновенны.\n\n2. Проникновение, обыск и выемка допускаются на основании судебного решения, процессуального акта уполномоченного органа либо в неотложных случаях, прямо установленных законом.\n\n3. Лицо вправе обжаловать законность проведенного обыска или иного вмешательства."],[0,"Конституция ст. 25","Конституция РО · Глава II. Права, свободы и обязанности человека и гражданина","Статья 25. Свобода передвижения\n\n1. Каждый вправе свободно передвигаться по территории РО, за исключением законно установленных режимных, военных, охраняемых и иных территорий с ограниченным доступом."],[0,"Конституция ст. 26","Конституция РО · Глава II. Права, свободы и обязанности человека и гражданина","Статья 26. Свобода мысл
