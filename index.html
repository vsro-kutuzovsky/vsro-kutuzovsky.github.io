ности или заниматься определенной деятельностью, лишение специального права, конфискация в качестве наказания, а также иные дополнительные уголовные наказания в упрощенном порядке сотрудником правоохранительного органа не назначаются. Изъятие запрещенного предмета или предмета, подлежащего изъятию по самостоятельному законному основанию, не является уголовным наказанием.\n\nч. 5 До помещения лица под арест сотрудник обязан объявить установленные обстоятельства, применяемую статью или статьи настоящего Кодекса, назначенный срок лишения свободы и разъяснить право на обжалование.\n\nч. 6 При наличии существенного спора о фактах, необходимости продолжительного расследования, экспертизы или иных действий, невозможных в рамках задержания, а равно при исключительной подследственности, обязательном судебном рассмотрении или специальном процессуальном статусе лица упрощенное разрешение не применяется. Материал и задержанный передаются компетентному органу, а при отсутствии самостоятельного основания для дальнейшего ограничения свободы лицо освобождается.\n\nч. 7 Решение, принятое сотрудником правоохранительного органа в упрощенном порядке, может быть обжаловано прокурору или в суд. Подача жалобы сама по себе не приостанавливает исполнение назначенного лишения свободы, если прокурор или суд не примет иное решение."],[1,"УК ст. 5.12","Уголовный кодекс РО · ГЛАВА V. Виды и назначение наказаний, освобождение от уголовной ответственности","Статья 5.12 Подследственность\n\nч. 1 Подследственность уголовных дел определяется буквенным обозначением соответствующего преступления:\n\n[Р] - Статья относится к подследственности МВД;\n[Ф] - Статья относится к подследственности ФСБ;\n[В] - Статья относится к подследственности Военной полиции;\n[C] - Статья относится к подследственности Следственного комитета.\n\nч. 2 Если статья Особенной части настоящего Кодекса отмечена несколькими обозначениями, Статья относится к подследственности любого из указанных ведомств.\n\nч. 3 Задержание лица по подозрению в совершении преступления осуществляется дознавателем ведомства(МВД,ФСБ), к подследственности которого относится соответствующее деяние. Задержание лица, объявленного в розыск, вправе произвести любой дознаватель независимо от ведомственной принадлежности инициатора розыска, с последующей передачей задержанного лица либо материалов задержания уполномоченному дознавателю в порядке, установленном Процессуальным кодексом РО.\n\nОСОБЕННАЯ ЧАСТЬ"],[1,"УК ст. 6.1","Уголовный кодекс РО · Глава 6. Преступления против жизни и здоровья","Статья 6.1 (Р) Умышленное и/или неоднократное нанесение телесных повреждений легкой или средней степени тяжести.\nПриоритет розыска - 2\nНаказание: До 20 месяцев лишения свободы."],[1,"УК ст. 6.2","Уголовный кодекс РО · Глава 6. Преступления против жизни и здоровья","Статья 6.2 (Ф/Р) Убийство, то есть умышленное причинение смерти другому человеку и/или нанесения телесных повреждений тяжелой степени.\nПриоритет розыска - 4\nНаказание: До 40 месяцев лишения свободы с созданием записи о судимости."],[1,"УК ст. 6.3","Уголовный кодекс РО · Глава 6. Преступления против жизни и здоровья","Статья 6.3 (Ф/Р) Тяжкое убийство, то есть убийство двух или более лиц, равно как убийство близких жертвы в связи с осуществлением данным лицом служебной деятельности.\nПриоритет розыска - 5\nНаказание: До 50 месяцев лишения свободы с созданием записи о судимости."],[1,"УК ст. 6.4","Уголовный кодекс РО · Глава 6. Преступления против жизни и здоровья","Статья 6.4 (Р) Причинение тяжкого вреда здоровью по неосторожности.\nПриоритет розыска - 2\nНаказание: До 20 месяцев лишения свободы."],[1,"УК ст. 6.5","Уголовный кодекс РО · Глава 6. Преступления против жизни и здоровья","Статья 6.5 (Р) Причинение смерти по неосторожности.\nПриоритет розыска - 3\nНаказание: До 30 месяцев лишения свободы."],[1,"УК ст. 6.6","Уголовный кодекс РО · Глава 6. Преступления против жизни и здоровья","Статья 6.6 (Ф/Р) Угроза расправой (прямая или косвенная) должностному (сотруднику гос. структур) лицу а равно их близким.\nПриоритет розыска - 3\nНаказание: До 30 месяцев лишения свободы."],[1,"УК ст. 6.7","Уголовный кодекс РО · Глава 6. Преступления против жизни и здоровья","Статья 6.7 (Р) Угрозы с целью запугать человека.\nПриоритет розыска - 2\nНаказание: До 20 месяцев лишения свободы."],[1,"УК ст. 6.8","Уголовный кодекс РО · Глава 6. Преступления против жизни и здоровья","Статья 6.8 (Р) Умышленное нанесение телесных повреждений животному.\nИсключение: законная охота и рыбалка.\nПриоритет розыска - 2\nНаказание: До 20 месяцев лишения свободы."],[1,"УК ст. 6.9","Уголовный кодекс РО · Глава 6. Преступления против жизни и здоровья","Статья 6.9 (Р) Нарушение правил дорожного движения, повлекшее за собой причинение потерпевшим тяжкого вреда здоровью и(или) наступила их смерть.\nПриоритет розыска - 4\nНаказание: До 40 месяцев лишения свободы с созданием записи о судимости."],[1,"УК ст. 7.1","Уголовный кодекс РО · Глава 7. Преступления против свободы, чести и достоинства личности","Статья 7.1 (Ф) Похищение человека.\nПриоритет розыска - 5\nНаказание: До 50 месяцев лишения свободы с созданием записи о судимости."],[1,"УК ст. 7.2","Уголовный кодекс РО · Глава 7. Преступления против свободы, чести и достоинства личности","Статья 7.2 (Р) Клевета, содержащаяся в публичном выступлении, средствах массовой информации либо с использованием своего служебного положения.\nПриоритет розыска - 2\nНаказание: До 20 месяцев лишения свободы."],[1,"УК ст. 7.3","Уголовный кодекс РО · Глава 7. Преступления против свободы, чести и достоинства личности","Статья 7.3 (Р) Клевета, соединенная с обвинением лица в совершении преступления.\nПриоритет розыска - 2\nНаказание: До 20 месяцев лишения свободы."],[1,"УК ст. 7.4","Уголовный кодекс РО · Глава 7. Преступления против свободы, чести и достоинства личности","Статья 7.4 (Р) Нарушение против личности, деловой репутации, а также оскорбления, допущенные сотрудниками представительств средств массовой информации в публикациях, репортажах и других формах журналистской деятельности, равно как и нарушение законодательства о журналистской деятельности.\nПриоритет розыска - 4\nНаказание: До 40 месяцев лишения свободы с созданием записи о судимости."],[1,"УК ст. 7.5","Уголовный кодекс РО · Глава 7. Преступления против свободы, чести и достоинства личности","Статья 7.5 (Р) Действия, направленные на возбуждение ненависти либо вражды по отношению к человеку или группе лиц по признаку от их пола, расы, национальности, языка, религии, происхождения, имущественного и должностного положения, место жительства, убеждений, принадлежности к общественным объединениям или каким-либо социальным группам.\nПриоритет розыска - 4\nНаказание: До 40 месяцев лишения свободы с созданием записи о судимости."],[1,"УК ст. 7.6","Уголовный кодекс РО · Глава 7. Преступления против свободы, чести и достоинства личности","Статья 7.6 (Р) Действия, направленные на возбуждение ненависти либо вражды по отношению к человеку или группе лиц по признаку от их пола, расы, национальности, языка, религии, происхождения, имущественного и должностного положения, место жительства, убеждений, принадлежности к общественным объединениям или каким-либо социальным группам, совершенные представителем власти.\nПриоритет розыска - 4\nНаказание: До 40 месяцев лишения свободы с созданием записи о судимости."],[1,"УК ст. 8.1","Уголовный кодекс РО · Глава 8. Преступления против военной службы","Статья 8.1 (Ф/Р/В) Неисполнение подчиненным приказа начальника, отданного в установленном порядке, причинившее существенный вред интересам службы.\nПриоритет розыска 3\nНаказание: До 30 месяцев лишения свободы."],[1,"УК ст. 8.2","Уголовный кодекс РО · Глава 8. Преступления против военной службы","Статья 8.2 (В/С) Самовольное оставление части или места службы, а равно неявка в срок без уважительных причин на службу при увольнении из части.\nПриоритет розыска 2\nНаказание: До 20 месяцев лишения свободы."],[1,"УК ст. 8.3","Уголовный кодекс РО · Глава 8. Преступлени ,"Уголовный кодекс РО · Глава 10. Преступления против собственности","Статья 10.6.1 (Ф/Р) Разбойное ограбление, то есть нападение в целях хищения чужого имущества, совершенное с применением насилия, опасного для жизни или здоровья, либо с угрозой применения такого насилия, в отношении крупных объектов, таких как банки или иные финансовые учреждения.\nПриоритет розыска 5\nНаказание: До 50 месяцев лишения свободы с созданием записи о судимости."],[1,"УК ст. 10.7","Уголовный кодекс РО · Глава 10. Преступления против собственности","Статья 10.7 (Р) Неправомерное завладение транспортным средством и(или) поездка на нем, в том числе и без цели хищения.\nПриоритет розыска 3\nНаказание: До 30 месяцев лишения свободы."],[1,"УК ст. 10.7.1","Уголовный кодекс РО · Глава 10. Преступления против собственности","Статья 10.7.1 (Р) Неправомерное завладение транспортным средством(транспортным средством оперативного назначения), принадлежащим государству или государственной структуре(организации) и управление им, в том числе и без цели хищения лицом, не трудоустроенным или не проходящим службу в организации(структуры), которой принадлежит транспортное средство.\nПриоритет розыска 4\nНаказание: До 40 месяцев лишения свободы с созданием записи о судимости."],[1,"УК ст. 10.8","Уголовный кодекс РО · Глава 10. Преступления против собственности","Статья 10.8 (Р) Умышленные уничтожение или повреждение чужого имущества.\nПриоритет розыска 2\nНаказание: До 20 месяцев лишения свободы."],[1,"УК ст. 10.8.1","Уголовный кодекс РО · Глава 10. Преступления против собственности","Статья 10.8.1 (Ф/Р/С) Умышленные уничтожение или повреждение государственного имущества.\nПриоритет розыска 3\nНаказание: До 30 месяцев лишения свободы."],[1,"УК ст. 10.9","Уголовный кодекс РО · Глава 10. Преступления против собственности","Статья 10.9 (Ф/Р) Умышленные уничтожение или повреждение чужого имущества, совершенные из хулиганских побуждений, путем поджога, взрыва или иным общеопасным способом.\nПриоритет розыска 4\nНаказание: До 40 месяцев лишения свободы с созданием записи о судимости."],[1,"УК ст. 10.10","Уголовный кодекс РО · Глава 10. Преступления против собственности","Статья 10.10 (Ф) Вымогательство, то есть требование передачи чужого имущества или права на имущество под угрозой применения насилия либо уничтожения или повреждения чужого имущества.\nПриоритет розыска 3\nНаказание: До 30 месяцев лишения свободы."],[1,"УК ст. 10.11","Уголовный кодекс РО · Глава 10. Преступления против собственности","Статья 10.11 (Ф/С) Незаконное изъятие имущества или лицензий сотрудником правоохранительных и(или) силовых органов у лица, подвергнутого задержанию или аресту, без соответствующих законных оснований.\nПриоритет розыска 3\nНаказание: От штрафа до 30 месяцев лишения свободы, а также полное возмещение материального ущерба."],[1,"УК ст. 10.12","Уголовный кодекс РО · Глава 10. Преступления против собственности","Статья 10.12 (Ф/Р) Кража с проникновением в частное жилище или помещение, то есть тайное хищение чужого имущества, совершенное с незаконным проникновением в жилище, помещение либо иное хранилище.\nПриоритет розыска 3\nНаказание: До 30 месяцев лишения свободы."],[1,"УК ст. 10.12.1","Уголовный кодекс РО · Глава 10. Преступления против собственности","Статья 10.12.1 (Ф/Р) Кража, совершенная группой лиц с проникновением в частное жилище или помещение. То есть тайное хищение чужого имущества, совершенное с незаконным проникновением в жилище, помещение либо иное хранилище.\nПриоритет розыска 4\nНаказание: До 40 месяцев лишения свободы с созданием записи о судимости."],[1,"УК ст. 11.1","Уголовный кодекс РО · Глава 11. Преступления в сфере экономической деятельности","Статья 11.1 (Ф/С) Осуществление предпринимательской деятельности без регистрации.\nПриоритет розыска 3\nНаказание: До 30 месяцев лишения свободы."],[1,"УК ст. 11.2","Уголовный кодекс РО · Глава 11. Преступления в сфере экономической деятельности","Статья 11.2 (Ф/С) Принуждение к совершению сделки или к отказу от ее совершения под угрозой применения насилия, уничтожения или повреждения чужого имущества. Без применения огнестрельного оружия.\nПриоритет розыска 3\nНаказание: До 30 месяцев лишения свободы."],[1,"УК ст. 11.2.1","Уголовный кодекс РО · Глава 11. Преступления в сфере экономической деятельности","Статья 11.2.1 (Ф/С) Принуждение к совершению сделки или к отказу от ее совершения под угрозой применения насилия, уничтожения или повреждения чужого имущества. С применением огнестрельного оружия.\nПриоритет розыска 3\nНаказание: До 30 месяцев лишения свободы."],[1,"УК ст. 11.3","Уголовный кодекс РО · Глава 11. Преступления в сфере экономической деятельности","Статья 11.3 (Ф/С) Уклонение от уплаты налогов - принудительное взыскание суммы долга в 2-х кратном размере.\nПриоритет розыска 4\nНаказание: До 40 месяцев лишения свободы с созданием записи о судимости."],[1,"УК ст. 11.4","Уголовный кодекс РО · Глава 11. Преступления в сфере экономической деятельности","Статья 11.4 (Ф/С) Сокрытие денежных средств либо имущества, за счет которых должно производиться взыскание налогов.\nПриоритет розыска 3\nНаказание: До 30 месяцев лишения свободы."],[1,"УК ст. 11.5","Уголовный кодекс РО · Глава 11. Преступления в сфере экономической деятельности","Статья 11.5 (Ф/С) Ограничение конкуренции путем заключения соглашения между субъектами-конкурентами, либо совершенное лицом с использованием своего служебного положения, если это деяние причинило крупный ущерб гражданам, организациям или государству либо повлекло извлечение дохода в крупном размере.\nПриоритет розыска 4\nНаказание: До 40 месяцев лишения свободы с созданием записи о судимости."],[1,"УК ст. 11.6","Уголовный кодекс РО · Глава 11. Преступления в сфере экономической деятельности","Статья 11.6 (Ф/С) Преднамеренное банкротство, то есть совершение управленческим составом юридического лица действий (бездействия), влекущих к потере платежеспособности юридического лица и невозможности производить расчеты по долгам.\nПриоритет розыска 4\nНаказание: До 40 месяцев лишения свободы с созданием записи о судимости."],[1,"УК ст. 11.7","Уголовный кодекс РО · Глава 11. Преступления в сфере экономической деятельности","Статья 11.7 (Ф/Р/С) Незаконные получение и разглашение сведений, составляющих коммерческую, налоговую или банковскую тайну.\nПриоритет розыска 4\nНаказание: До 40 месяцев лишения свободы с созданием записи о судимости."],[1,"УК ст. 11.8","Уголовный кодекс РО · Глава 11. Преступления в сфере экономической деятельности","Статья 11.8 (Ф/С) Уклонение организации от уплаты штрафа - принудительное взыскание суммы штрафа в 2-х кратном размере.\nПриоритет розыска - 3\nНаказание: До 30 месяцев лишения свободы."],[1,"УК ст. 11.9","Уголовный кодекс РО · Глава 11. Преступления в сфере экономической деятельности","Статья 11.9 (Ф/С) Нецелевое использование средств государственного бюджета.\nПриоритет розыска - 4\nНаказание: До 40 месяцев лишения свободы с созданием записи о судимости."],[1,"УК ст. 11.10","Уголовный кодекс РО · Глава 11. Преступления в сфере экономической деятельности","Статья 11.10 (Ф/С) Присвоение себе финансовых средств, принадлежащих государственной структуре или государственному учреждению.\nПриоритет розыска - 4\nНаказание: До 40 месяцев лишения свободы с созданием записи о судимости."],[1,"УК ст. 11.11","Уголовный кодекс РО · Глава 11. Преступления в сфере экономической деятельности","Статья 11.11 (Р) Отказ или уклонение от оплаты оказанных медицинских услуг.\nПриоритет розыска 2\nНаказание: До 20 месяцев лишения свободы, а также полное возмещение материального ущерба."],[1,"УК ст. 11.12","Уголовный кодекс РО · Глава 11. Преступления в сфере экономической деятельности","Статья 11.12 (Р) Незаконный вылов водных биологических ресурсов.\nПримечание: Запрещенные зоны для вылова водных биологических ресурсов обозначено на переходной карте РО и при входе в зону нахождения соответствующего водного ресурса.\nПриоритет розыска 3\nНаказание: До 30 месяцев лишения и изъятие лицензии на осуществление рыбной ловли."],[1,"УК ст. 12.1","Уголовный кодекс РО · Глава 12. Преступления против общественной безопасности","Статья 12.1 (Ф/С) Терроризм, то есть совершение взрыва, поджога или иных действий, устрашающих население и создающих опасность гибели человека, причинения значительного имущественного ущерба либо наступления иных тяжких последствий, в целях дестабилизации деятельности органов власти или международных организаций либо воздействия на принятие ими решений, а также угроза совершения указанных действий в целях воздействия на принятие решений органами власти.\nПриоритет розыска 5\nНаказание: До 50 месяцев лишения свободы с созданием записи о судимости."],[1,"УК ст. 12.2","Уголовный кодекс РО · Глава 12. Преступления против общественной безопасности","Статья 12.2 (Ф/С) Склонение, вербовка или иное вовлечение лица в терроризм, а равно финансирование терроризма.\nПриоритет розыска 5\nНаказание: До 50 месяцев лишения свободы с созданием записи о судимости."],[1,"УК ст. 12.3","Уголовный кодекс РО · Глава 12. Преступления против общественной безопасности","Статья 12.3 (Ф/С) Захват или удержание лица в качестве заложника, совершенные в целях понуждения государства, организации или гражданина совершить какое-либо действие или воздержаться от совершения какого-либо действия как условия освобождения заложника.\nПриоритет розыска 5\nНаказание: До 50 месяцев лишения свободы с созданием записи о судимости."],[1,"УК ст. 12.4","Уголовный кодекс РО · Глава 12. Преступления против общественной безопасности","Статья 12.4 (Ф/Р/С) Заведомо ложное сообщение о готовящихся взрыве, поджоге или иных действиях, создающих опасность гибели людей, причинения значительного имущественного ущерба либо наступления иных общественно опасных последствий.\nПриоритет розыска 3\nНаказание: До 30 месяцев лишения свободы."],[1,"УК ст. 12.5","Уголовный кодекс РО · Глава 12. Преступления против общественной безопасности","Статья 12.5 (Ф/Р/С) Организация массовых беспорядков, а равно участие в них, сопровождавшихся насилием, погромами, поджогами, уничтожением имущества, применением оружия, взрывных устройств, взрывчатых, отравляющих либо иных веществ и предметов, представляющих опасность для окружающих, а также оказанием вооруженного сопротивления представителю власти, а равно подготовка лица для организации таких массовых беспорядков или участия в них.\nПриоритет розыска 5\nНаказание: До 50 месяцев лишения свободы с созданием записи о судимости."],[1,"УК ст. 12.5.1","Уголовный кодекс РО · Глава 12. Преступления против общественной безопасности","Статья 12.5.1 (Ф/Р/С) Организация массовых беспорядков, а равно участие в них, сопровождавшихся насилием, погромами, поджогами, уничтожением имущества, применением оружия, взрывных устройств, взрывчатых, отравляющих либо иных веществ и предметов, представляющих опасность для окружающих, а также оказанием вооруженного сопротивления представителю власти, а равно подготовка лица для организации таких массовых беспорядков или участия в них, которое повлекло за собой нанесения ущерба государству и имуществу, здоровью человека и гражданина, причинение смерти, в том числе и по неосторожности.\nПриоритет розыска - 5\nНаказание: До 50 месяцев лишения свободы с созданием записи о судимости."],[1,"УК ст. 12.6","Уголовный кодекс РО · Глава 12. Преступления против общественной безопасности","Статья 12.6 (Р) Хулиганство, грубое систематическое нарушение общественного порядка, выражающее явное неуважение к обществу или игнорировании требований о прекращении нарушений общественного порядка.\nПриоритет розыска 2\nНаказание: До 20 месяцев лишения свободы."],[1,"УК ст. 12.7","Уголовный кодекс РО · Глава 12. Преступления против общественной безопасности","Статья 12.7 (Ф/Р/С) Незаконное проникновение и/или нахождение на закрытый в соответствии с законодательством РО, объект.\nПриоритет розыска 3\nНаказание: До 30 месяцев лишения свободы."],[1,"УК ст. 12.7.1","Уголовный кодекс РО · Глава 12. Преступления против общественной безопасности","Статья 12.7.1 (Ф/Р/С) Незаконное проникновение и/или нахождение на режимный объект, на объект, обладающий особым статусом, если таковой был закрыт для посещения уполномоченным лицом.\nПримечание: деяние, которое квалифицируется, как преступление, предусмотренное настоящей статьей, описано в законе \"О статусе территорий и особых объектах\".\nПриоритет розыска 5\nНаказание: До 50 месяцев лишения свободы с созданием записи о судимости."],[1,"УК ст. 12.7.2","Уголовный кодекс РО · Глава 12. Преступления против общественной безопасности","Статья 12.7.2 (Ф) Проникновение на территорию оцепления военного или чрезвычайного положения.\nИсключение: одобрение сотрудниками гос.структур на территории КПП.\nПриоритет розыска 5\nНаказание: До 50 месяцев лишения свободы с созданием записи о судимости."],[1,"УК ст. 12.8","Уголовный кодекс РО · Глава 12. Преступления против общественной безопасности","Статья 12.8 (Ф/Р/С) Незаконное приобретение, передача, сбыт, хранение, перевозка, ношение, использование любых видов оружия или боеприпасов, за исключением гос. имущества.\nПриоритет розыска 4\nНаказание: До 40 месяцев лишения свободы с созданием записи о судимости."],[1,"УК ст. 12.8.1","Уголовный кодекс РО · Глава 12. Преступления против общественной безопасности","Статья 12.8.1 (Ф/Р/С) Незаконное приобретение, передача, сбыт, хранение, перевозка, ношение, использование государственных спец. средств, дефибриллятора, шприца с эпинефрином, алкотестера, тяжелого бронежилета, тяжелой и сверхтяжелой бронеразгрузки-бронежилета или любого другого государственного имущества.\nПриоритет розыска 5\nНаказание: До 50 месяцев лишения свободы с созданием записи о судимости."],[1,"УК ст. 12.9","Уголовный кодекс РО · Глава 12. Преступления против общественной безопасности","Статья 12.9 (Ф/Р) Хищение огнестрельного оружия, комплектующих деталей к нему, спец средств, взрывчатых веществ или взрывных устройств.\nПриоритет розыска 4\nНаказание: До 40 месяцев лишения свободы с созданием записи о судимости."],[1, О · Глава 14. Преступления против основ конституционного строя и безопасности государства","Статья 14.1 (Ф/Р/С) Посягательство на жизнь государственного или общественного деятеля, совершенное в целях прекращения его государственной или иной политической деятельности либо из мести за такую деятельность.\nПриоритет розыска 5\nНаказание: До 50 месяцев лишения свободы с созданием записи о судимости."],[1,"УК ст. 14.2","Уголовный кодекс РО · Глава 14. Преступления против основ конституционного строя и безопасности государства","Статья 14.2 (Ф/Р/С) Действия, направленные на насильственный захват власти или насильственное удержание власти, а равно вооруженный мятеж, в нарушение Конституции РО, а равно направленные на насильственное изменение конституционного и/или государственного строя РО.\nПриоритет розыска 5\nНаказание: До 50 месяцев лишения свободы с созданием записи о судимости."],[1,"УК ст. 14.2.1","Уголовный кодекс РО · Глава 14. Преступления против основ конституционного строя и безопасности государства","Статья 14.2.1 (Ф/С) Агитация к действиям или возглавление движения, направленного на насильственный захват или насильственное удержание власти, вооруженный мятеж. Направление на насильственные изменения конституционного строя РО.\nПриоритет розыска 4\nНаказание: До 40 месяцев лишения свободы с созданием записи о судимости."],[1,"УК ст. 14.3","Уголовный кодекс РО · Глава 14. Преступления против основ конституционного строя и безопасности государства","Статья 14.3 (Ф/С) Разглашение сведений, составляющих государственную тайну, лицом, которому она была доверена или стала известна по службе, работе, если эти сведения стали достоянием других лиц.\nПриоритет розыска 5\nНаказание: До 50 месяцев лишения свободы с созданием записи о судимости."],[1,"УК ст. 14.4","Уголовный кодекс РО · Глава 14. Преступления против основ конституционного строя и безопасности государства","Статья 14.4 (Ф/С) Приобретение, использование или сбыт формы государственной структуры, жетонов, удостоверений и нашивок.\nПриоритет розыска 2\nНаказание: До 20 месяцев лишения свободы."],[1,"УК ст. 14.5","Уголовный кодекс РО · Глава 14. Преступления против основ конституционного строя и безопасности государства","Статья 14.5 (Ф/С) Государственная измена, то есть совершенные гражданином РО или иностранным гражданином шпионаж, выдача иностранному государству, международной либо иностранной организации или их представителям сведений, составляющих государственную тайну, доверенную лицу или ставшую известной ему по службе, работу, учебе или в иных случаях, предусмотренных законодательством.\nПриоритет розыска 5\nНаказание: До 50 месяцев лишения свободы с созданием записи о судимости."],[1,"УК ст. 14.6","Уголовный кодекс РО · Глава 14. Преступления против основ конституционного строя и безопасности государства","Статья 14.6 (Ф/С) Утрата документов, содержащих государственную тайну. Нарушение лицом, имеющим допуск к государственной тайне, установленных правил обращения с содержащими государственную тайну документами, а равно с предметами, сведения о которых составляют государственную тайну, если это повлекло по неосторожности их утрату.\nПриоритет розыска 3\nНаказание: До 30 месяцев лишения свободы."],[1,"УК ст. 14.7","Уголовный кодекс РО · Глава 14. Преступления против основ конституционного строя и безопасности государства","Статья 14.7 (Ф/С) Нарушение законодательства о выборах, референдуме, об отзыве прав на осуществление полномочий представителями законодательной ветви власти, о реализации законодательной инициативы граждан, об изменении законодательства или внесении в него различных правок.\nПодлог документов по выборам, референдуму, нарушение тайны голосования, заведомо неправильный подсчет голосов или иное искажение результатов голосования. Совершение уполномоченным лицом действий, направленных на воспрепятствование реализации прав на законодательную инициативу, либо непосредственное совершение этим лицом действий, нарушающих установленный порядок проведения референдума, конгресса, любых иных мероприятий, предусмотренных законом, проводящихся с целью любого рода изменения законодательства.\nПриоритет розыска 5\nНаказание: До 50 месяцев лишения свободы с созданием записи о судимости."],[1,"УК ст. 14.8","Уголовный кодекс РО · Глава 14. Преступления против основ конституционного строя и безопасности государства","Статья 14.8 (Ф/С) Незаконное использование, хранение, передача и разглашение государственных секретов, информации о заключенных и другой конфиденциальной компрометирующей информации лицом, не имеющим законного доступа к ней.\nПриоритет розыска 4\nНаказание: До 40 месяцев лишения свободы с созданием записи о судимости."],[1,"УК ст. 14.9","Уголовный кодекс РО · Глава 14. Преступления против основ конституционного строя и безопасности государства","Статья 14.9 (Ф/С) Незаконная продажа, хранение и перевозка глушащих устройств и радар-детекторов.\nПриоритет розыска 4\nНаказание: До 40 месяцев лишения свободы с созданием записи о судимости."],[1,"УК ст. 15.1","Уголовный кодекс РО · Глава 15. Преступления против власти","Статья 15.1 (Ф/С) Превышение должностных полномочий, то есть совершение должностным лицом действий, явно выходящих за пределы его полномочий и повлекших существенное нарушение прав и законных интересов граждан, государства или организаций.\nПриоритет розыска 4\nНаказание: До 40 месяцев лишения свободы с созданием записи о судимости."],[1,"УК ст. 15.1.1","Уголовный кодекс РО · Глава 15. Преступления против власти","Статья 15.1.1 (Ф/С) Злоупотребление служебными полномочиями, причинившее существенный вред правам и законным интересам граждан, государства или организаций.\nПриоритет розыска 5\nНаказание: До 50 месяцев лишения свободы с созданием записи о судимости."],[1,"УК ст. 15.2","Уголовный кодекс РО · Глава 15. Преступления против власти","Статья 15.2 (Ф/Р/С) Умышленное неисполнение сотрудником органов правопорядка приказа начальника, отданного в установленном порядке и не противоречащего закону, причинившее существенный вред правам и законным интересам граждан или организаций.\nПриоритет розыска 2\nНаказание: До 20 месяцев лишения свободы."],[1,"УК ст. 15.3","Уголовный кодекс РО · Глава 15. Преступления против власти","Статья 15.3 (Ф/С) Самовольное присвоение гражданином полномочий должностного лица повлекшие существенное нарушение прав и законных интересов граждан или организаций.\nПриоритет розыска 3\nНаказание: До 30 месяцев лишения свободы."],[1,"УК ст. 15.4","Уголовный кодекс РО · Глава 15. Преступления против власти","Статья 15.4 (Ф/С) Получение взятки, то есть получение должностным лицом, лично или через посредника взятки в виде денег, иного имущества, либо в виде оказания ему услуг имущественного характера, предоставления иных имущественных прав за совершение действий (бездействие) в пользу взяткодателя или представляемых им лиц.\nПриоритет розыска 5\nНаказание: До 50 месяцев лишения свободы с созданием записи о судимости."],[1,"УК ст. 15.5","Уголовный кодекс РО · Глава 15. Преступления против власти","Статья 15.5 (Ф/С) Дача взятки должностному лицу, лично или через посредника.\nПриоритет розыска 4\nНаказание: До 40 месяцев лишения свободы с созданием записи о судимости."],[1,"УК ст. 15.6","Уголовный кодекс РО · Глава 15. Преступления против власти","Статья 15.6 (Ф/С) Халатность, то есть неисполнение или ненадлежащее исполнение должностным лицом своих обязанностей вследствие недобросовестного или небрежного отношения к службе либо обязанностей по должности, если это деяние повлекло причинение крупного ущерба или существенное нарушение прав и/или законных интересов граждан и/или организаций либо охраняемых законом интересов общества или государства.\nПриоритет розыска 4\nНаказание: До 40 месяцев лишения свободы с созданием записи о судимости."],[1,"УК ст. 15.7","Уголовный кодекс РО · Глава 15. Преступления против власти","Статья 15.7 (Ф/Р/С) Подкуп голосов избирателей, равно как незаконная агитация в период проведения выборов, а также во время проведения голосования на выборных участках.\nПриоритет розыска 1\nНаказание: До 10 месяцев лишения свободы."],[1,"УК ст. 15.8","Уголовный кодекс РО · Глава 15. Преступления против власти","Статья 15.8 (Ф/С) Неисполнение государственными служащими и сотрудниками вступивших в законную силу постановлений, указов, приказов и иных нормативных актов, издаваемых главой исполнительной власти РО, его заместителем, уполномоченными сотрудниками исполнительной власти, а также сотрудниками службы внутренней разведки отдела IB.\nПриоритет розыска 4\nНаказание: До 40 месяцев лишения свободы с созданием записи о судимости."],[1,"УК ст. 15.9","Уголовный кодекс РО · Глава 15. Преступления против власти","Статья 15.9 (Ф/С) Неисполнение руководством государственных структур и организаций вступивших в законную силу постановлений, указов, приказов, распоряжений и иных нормативных актов, издаваемых главой исполнительной власти РО, его заместителем, а также органами государственного управления.\nПриоритет розыска 4\nНаказание: До 40 месяцев лишения свободы с созданием записи о судимости."],[1,"УК ст. 16.1","Уголовный кодекс РО · Глава 16. Преступления против правосудия","Статья 16.1 (Ф/С) Вмешательство в какой бы то ни было форме в деятельность суда, следствия, ограничение прав граждан в целях воспрепятствования осуществлению правосудия.\nПриоритет розыска 5\nНаказание: До 50 месяцев лишения свободы с созданием записи о судимости."],[1,"УК ст. 16.1.2","Уголовный кодекс РО · Глава 16. Преступления против правосудия","Статья 16.1.2 (Ф/С) Воспрепятствование законной профессиональной деятельности прокурора или иного лица, производящего следствие, по уголовному преследованию в рамках делопроизводства, в том числе неповиновение его законному требованию.\nПриоритет розыска 4\nНаказание: До 40 месяцев лишения свободы с созданием записи о судимости."],[1,"УК ст. 16.2","Уголовный кодекс РО · Глава 16. Преступления против правосудия","Статья 16.2 (Ф/С) Угроза, а равно посягательство на жизнь судьи, или иного лица, участвующего в отправлении правосудия, прокурора, защитника, эксперта, специалиста, судебного пристава, судебного исполнителя, а равно их близких в связи с рассмотрением дел в суде, производством расследования либо исполнением приговора, решения суда или иного судебного акта, совершенное в целях воспрепятствования законной деятельности указанных лиц либо из мести за такую деятельность.\nПриоритет розыска 5\nНаказание: До 50 месяцев лишения свободы с созданием записи о судимости."],[1,"УК ст. 16.3","Уголовный кодекс РО · Глава 16. Преступления против правосудия","Статья 16.3 (Ф/Р/С) Неуважение к суду, в том числе оскорбление участников судебного разбирательства.\nПриоритет розыска 4\nНаказание: До 40 месяцев лишения свободы с созданием записи о судимости."],[1,"УК ст. 16.4","Уголовный кодекс РО · Глава 16. Преступления против правосудия","Статья 16.4 (Ф/С) Привлечение заведомо невиновного к уголовной ответственности.\nПриоритет розыска 4\nНаказание: До 40 месяцев лишения свободы с созданием записи о судимости."],[1,"УК ст. 16.4.1","Уголовный кодекс РО · Глава 16. Преступления против правосудия","Статья 16.4.1 (Ф/С) Привлечение заведомо невиновного к административной ответственности.\nПриоритет розыска 3\nНаказание: До 30 месяцев лишения свободы"],[1,"УК ст. 16.5","Уголовный кодекс РО · Глава 16. Преступления против правосудия","Статья 16.5 (Ф/С) Заведомо незаконное задержание, заключение под стражу или содержание под стражей.\nПриоритет розыска 3\nНаказание: До 30 месяцев лишения свободы."],[1,"УК ст. 16.6","Уголовный кодекс РО · Глава 16. Преступления против правосудия","Статья 16.6 (Ф/С) Фальсификация доказательств по гражданскому, административному делу лицом, участвующим в деле, или его представителем.\nПриоритет розыска 2\nНаказание: До 20 месяцев лишения свободы."],[1,"УК ст. 16.7","Уголовный кодекс РО · Глава 16. Преступления против правосудия","Статья 16.7 (Ф/С) Фальсификация доказательств по уголовному делу лицом, производящим расследование, прокурором или защитником.\nПриоритет розыска 5\nНаказание: До 50 месяцев лишения свободы с созданием записи о судимости."],[1,"УК ст. 16.8","Уголовный кодекс РО · Глава 16. Преступления против правосудия","Статья 16.8 (Ф/С) Вынесение судьей (судьями) заведомо неправомерного приговора, решения или иного судебного акта.\nПриоритет розыска 5\nНаказание: До 50 месяцев лишения свободы с созданием записи о судимости."],[1,"УК ст. 16.9","Уголовный кодекс РО · Глава 16. Преступления против правосудия","Статья 16.9 (Ф/Р/С) Заведомо ложный донос о совершении преступления.\nПриоритет розыска 2\nНаказание: До 20 месяцев лишения свободы."],[1,"УК ст. 16.10","Уголовный кодекс РО · Глава 16. Преступления против правосудия","Статья 16.10 (Ф/С) Заведомо ложные показания свидетеля, потерпевшего либо заключение или показание эксперта, показание специалиста в суде.\nПриоритет розыска 4\nНаказание: До 40 месяцев лишения свободы с созданием записи о судимости."],[1,"УК ст. 16.11","Уголовный кодекс РО · Глава 16. Преступления против правосудия","Статья 16.11 (Ф/С) Подкуп свидетеля, потерпевшего в целях дачи ими ложных показаний либо эксперта, специалиста в целях дачи ими ложного заключения или ложных показаний.\nПриоритет розыска 3\nНаказание: До 30 месяцев лишения свободы."],[1,"УК ст. 16.12","Уголовный кодекс РО · Глава 16. Преступления против правосудия","Статья 16.12 (Ф/Р/С) Неисполнение вступивших в законную силу приговора суда, решения суда или иного судебного акта, указа кабинета министров, а равно воспрепятствование их исполнению.\nПриоритет розыска 4\nНаказание: До 40 месяцев лишения свободы с созданием записи о судимости."],[1,"УК ст. 16.13","Уголовный кодекс РО · Глава 16. Преступления против правосудия","Статья 16.13 (Ф/С) Сокрытие улик или уничтожение улик.\nПриоритет розыска 2\nНаказание: До 20 месяцев лишения свободы."],[1,"УК ст. 16.14","Уголовный кодекс РО · Глава 16. Преступления против правосудия","Статья 16.14 (Ф/С) Уклонение от расследования, задержания и суда, осознанные или неосознанные действия правонарушителя, направленные на избегание реального уголовного срока или другой уголовной ответственности. К таким действиям относятся:\nПопытка скрыться либо скрыть подозреваемого;\nУвольнение с работы;\nСмена фамилии и других идентификационных данных, изменение внешности с помощью пластической хирургии и других средств.\nВсе перечисленные действия расцениваются как уклонение от расследования при условии своевременного уведомления подозреваемого или его руководства о наличии запроса, ордера, постановления, решения или ведения следствия, расследования или судопроизводства в отношении объекта с целью установления или опровержения сведений и фактов о совершении правонарушений или преступлений.\nПриоритет розыска 5\nНаказание: До 50 месяцев лишения свободы с созданием записи о судимости."],[1,"УК ст. 16.15","Уголовный кодекс РО · Глава 16. Преступления против правосудия","Статья 16.15 (Ф/Р/С) Дача заведомо ложных показаний и сведений лицу, ведущему следствие и(или) адвокату в ходе рассмотрения дела, суде или проведения допроса.\nПриоритет розыска 4\nНаказание: До 40 месяцев лишения свободы с созданием записи о судимости."],[1,"УК ст. 16.16","Уголовный кодекс РО · Глава 16. Преступления против правосудия","Статья 16.16 (Ф/Р/С) Побег из места лишения свободы, из-под ареста или из-под стражи, совершенный лицом, отбывающим наказание или находящимся в предварительном заключении.\nПриоритет розыска 5\nНаказание: До 50 месяцев лишения свободы с созданием записи о судимости."],[1,"УК ст. 16.17","Уголовный кодекс РО · Глава 16. Преступления против правосудия","Статья 16.17 (Ф/С) Злостное неисполнение представителем власти вступивших в законную силу приговора, решения суда или иного судебного акта, равно как воспрепятствование их исполнению.\nПриоритет розыска 5\nНаказание: До 50 месяцев лишения свободы с созданием записи о судимости."],[1,"УК ст. 16.18","Уголовный кодекс РО · Глава 16. Преступления против правосудия","Статья 16.18 (Ф/С) Незаконное ограничение свободы, если это деяние повлекло существенное нарушение прав и законных интересов граждан.\nПримечание: Данная статья применяется тогда, когда лицо было ограничено в своём передвижении в замкнутом пространстве против своей воли. Данную статью нельзя применить по отношению к гос служащим, которые ограничивают свободу граждан в рамках процессуального кодекса.\nПриоритет розыска 4\nНаказание: До 40 месяцев лишения свободы с созданием записи о судимости."],[1,"УК ст. 17.1","Уголовный кодекс РО · Глава 17. Преступления против порядка управления","Статья 17.1 (Ф/Р) Умышленное и/или неоднократное посягательство на жизнь государственного служащего находящегося при исполнении, а равно их близких в связи с исполнением им своих должностных обязанностей либо из мести за такую деятельность, путем нанесения телесных повреждений высокой степени тяжести, или прямой угрозы жизни.\nПриоритет розыска 5\nНаказание: До 50 месяцев лишения свободы с созданием записи о судимости."],[1,"УК ст. 17.2","Уголовный кодекс РО · Глава 17. Преступления против порядка управления","Статья 17.2 (Ф/Р) Умышленное и/или неоднократное нанесение телесных повреждений легкой или средней степени тяжести, либо угроза применения насилия в отношении представителя власти или его близких в связи с исполнением им своих должностных обязанностей.\nПриоритет розыска 4\nНаказание: До 40 месяцев лишения свободы с созданием записи о судимости."],[1,"УК ст. 17.3","Уголовный кодекс РО · Глава 17. Преступления против порядка управления","Статья 17.3 (Ф/Р) Оскорбление представителя власти при исполнении им своих должностных обязанностей или в связи с их исполнением.\nПримечание: оскорбление заключается в негативной оценке личности либо внешности человека, его качеств, поведения, причём в форме, противоречащей установленным правилам поведения и требованиям общечеловеческой морали.\nПриоритет розыска 3\nНаказание: До 30 месяцев лишения свободы."],[1,"УК ст. 17.4","Уголовный кодекс РО · Глава 17. Преступления против порядка управления","Статья 17.4 (Р) Реализация или перевозка товаров без соответствующих коммерческих документов либо с использованием поддельных коммерческих документов.\nПриоритет розыска 2\nНаказание: До 20 месяцев лишения свободы."],[1,"УК ст. 17.4.1","Уголовный кодекс РО · Глава 17. Преступления против порядка управления","Статья 17.4.1 (Р) Подделка официальных документов, лицензий и военных сертификатов, а также изготовление и сбыт поддельных печатей, бланков и подписей для их использования.\nПриоритет розыска 4\nНаказание: До 40 месяцев лишения свободы с созданием записи о судимости."],[1,"УК ст. 17.5","Уголовный кодекс РО · Глава 17. Преступления против порядка управления","Статья 17.5 (Ф/С) Самоуправство, то есть самовольное, вопреки установленному законом или иным нормативным правовым актом порядку совершение каких-либо действий (бездействий).\nПриоритет розыска 5\nНаказание: До 50 месяцев лишения свободы с созданием записи о судимости."],[1,"УК ст. 17.6","Уголовный кодекс РО · Глава 17. Преступления против порядка управления","Статья 17.6 (Ф/Р/С) Неподчинение законным требованиям сотрудника ФСБ, ФСО, СК, МВД, ГИБДД, АРМИЙ РО, а также прокуратуры, равно как злонамеренное игнорирование таких требований.\nПримечание: Если лицо намеренно отказывается предъявлять идентификационную карту или карту с лицензиями; скрывает свою личность без законных на то оснований; отказывается снять предмет, который скрывает его личность, то по отношению к данному лицу должна быть инициирована процедура установки личности предусмотренная Процессуальным Кодексом РО.\nПриоритет розыска 3\nНаказание: До 30 месяцев лишения свободы."],[1,"УК ст. 17.7","Уголовный кодекс РО · Глава 17. Преступления против порядка управления","Статья 17.7 (Ф/С) Укрывательство преступника, орудий и средств совершения преступления, следов преступления или предметов, добытых преступлением.\nПриоритет розыска 4\nНаказание: До 40 месяцев лишения свободы с созданием записи о судимости."],[1,"УК ст. 17.8","Уголовный кодекс РО · Глава 17. Преступления против порядка управления","Статья 17.8 (Р) Грубое и неоднократное оскорбление человека в общественном месте, без его согласия в присутствии представителя власти.\nПриоритет розыска 1\nНаказание: До 10 месяцев лишения свободы."],[1,"УК ст. 17.9","Уголовный кодекс РО · Глава 17. Преступления против порядка управления","Статья 17.9 (Ф/Р/С) Незаконная помеха при задержании, аресте или процессуальном принуждении нарушителя, равно как содействие помехе задержанию, аресту или процессуальному принуждению нарушителя.\nПриоритет розыска 4\nНаказание: До 40 месяцев лишения свободы с созданием записи о судимости."],[1,"УК ст. 17.10","Уголовный кодекс РО · Глава 17. Преступления против порядка управления","Статья 17.10 (Ф/Р/С) Незаконная помеха при задержании, аресте или процессуальном принуждении нарушителя, равно как содействие помехе задержанию, аресту или процессуальному принуждению нарушителя, сотрудником государственных структур.\nПриоритет розыска 5\nНаказание: До 50 месяцев лишения свободы с созданием записи о судимости."],[1,"УК ст. 17.11","Уголовный кодекс РО · Глава 17. Преступления против порядка управления","Статья 17.11 (Ф/Р/С/В) Провокация сотрудников Армий, равно как помеха несения службы на прилегающей постовой территории.\nПриоритет розыска 3\nНаказание: До 30 месяцев лишения свободы."],[1,"УК ст. 17.12","Уголовный кодекс РО · Глава 17. Преступления против порядка управления","Статья 17.12 (Ф/Р/В) Помеха колонне государственных структур.\nПримечание: Помехой является встраивание, оттягивание её движения, действия направленные на её остановку.\nПриоритет розыска 3\nНаказание: До 30 месяцев лишения свободы."],[1,"УК ст. 17.12.1","Уголовный кодекс РО · Глава 17. Преступления против порядка управления","Статья 17.12.1 (Ф/Р/В) Создание помехи государственным структурам во время подготовки к перевозке и/или в процессе перевозки материалов.\nПриоритет розыска 5\nНаказание: 50 месяцев лишения свободы с созданием записи о судимости."],[1,"УК ст. 17.13","Уголовный кодекс РО · Глава 17. Преступления против порядка управления","Статья 17.13 (Ф/Р) Побег или сопротивление при задержании, аресте или процессуальном принуждении, равно как уклонение от правосудия.\nПриоритет розыска 4\nНаказание: До 40 месяцев лишения свободы с созданием записи о судимости."],[1,"УК ст. 17.14","Уголовный кодекс РО · Глава 17. Преступления против порядка управления","Статья 17.14 (Р) Браконьерство и/или рыбалка в зонах запретного рыбного промысла то есть охота, отлов, сбыт, хранение, приобретение либо перевозка исчезающих видов животных и растений, а также предметов и продуктов получаемых из них.\nПриоритет розыска 3\nНаказание: До 30 месяцев лишения свободы."],[2,"ПК — Глава I. Следствие","Процессуальный кодекс РО","Глава I. Следствие.\n\nСледствие — это комплекс предусмотренных законом действий и решений по установлению обстоятельств правонарушения, причастных к нему лиц, собиранию и проверке обвиняющих и оправдывающих доказательств, а также иных обстоятельств, имеющих значение для законного разрешения дела."],[2,"ПК гл. I ст. 1","Процессуальный кодекс РО · Глава I. Следствие","Статья 1. Следственные действия:\nУполномоченный сотрудник обязан инициировать процессуальную проверку, а при наличии предусмотренных законом оснований — расследование, в следующих случаях:\nа) Если сотрудник стал непосредственным очевидцем правонарушения.\nб) Если потерпевший или очевидец сообщил сотруднику о правонарушении, обстоятельства которого он непосредственно наблюдал.\nв) Если обнаружены явные следы правонарушения.\nг) По факту принятого и зарегистрированного заявления гражданина."],[2,"ПК гл. I ст. 2","Процессуальный кодекс РО · Глава I. Следствие","Статья 2. Принципы ведения расследования:\n\nАдекватность — сотрудник обязан действовать профессионально, не превышая свои должностные полномочия, и максимально точно разобраться в деле прежде чем делать умозаключения.\nБезотлагательность — сотрудник обязан отреагировать на правонарушение и начать действовать без необоснованных промедлений."],[2,"ПК гл. I ст. 3","Процессуальный кодекс РО · Глава I. Следствие","Статья 3. Передача дела:\n\nВ случае если сотрудник по объективным причинам не может или не уполномочен продолжать расследование, он обязан передать его уполномоченному сотруднику с подробным изложением всех известных ему обстоятельств дела. А также передать подозреваемого если он был задержан."],[2,"ПК гл. I ст. 4","Процессуальный кодекс РО · Глава I. Следствие","Статья 4. Письменная отчетность:\n\n1. Дело ведется с письменной или электронной отчетностью в случаях, предусмотренных законом, а также когда материал подлежит передаче в прокуратуру, следственный орган, суд или иной компетентный государственный орган. Отчетность должна позволять установить ход производства, основания решений и происхождение доказательств.\n2. При упрощенном разрешении уголовного материала непосредственно при задержании в случаях, предусмотренных Уголовным кодексом РО и настоящим Кодексом, отдельное письменное или электронное уголовное дело не оформляется. Обязательная видеофиксация и иные сохраненные материалы процессуальных действий должны позволять проверить законность задержания, доказательства, квалификацию и принятое решение."],[2,"ПК гл. I ст. 5","Процессуальный кодекс РО · Глава I. Следствие","Статья 5. Перечень следственных действий:\n\nа) Возбуждение уголовного дела либо принятие к производству материала проверки в предусмотренных законом случаях;\nб) Допрос (Свидетелей, потерпевших, подозреваемого, экспертов);\nв) Осмотр (Оценка и фиксация состояние, свойства и признаки материальных объектов, связанных с расследуемым событием);\nг) Освидетельствование (Экспертиза состояния какого-либо технического или биологического объекта);\nд) Следственный эксперимент (Воспроизведении опытным путём действий, обстановки или иных обстоятельств, связанных с расследуемым преступлением);\nе) Обыск (Обследовании помещений либо лиц (личный обыск) в целях обнаружения предметов);\nж) Выемка (Принудительное изъятие имеющих значение для дела определенных предметов и документов);\nз) Оперативно-розыскные мероприятия;\nи) Задержание (Мера принуждения, кратковременное ограничение свободы на момент расследования);\nк) Очная ставка;\nл) Контроль и запись переговоров;\nм) Опознание;\nн) Проверка показаний;\nо) Рейд."],[2,"ПК гл. I ст. 6","Процессуальный кодекс РО · Глава I. Следствие","Статья 6. Оперативно-розыскные мероприятия"],[2,"ПК гл. I ст. 6.1","Процессуальный кодекс РО · Глава I. Следствие","Статья 6.1. При осуществлении оперативно-розыскной деятельности могут проводиться следующие оперативно-розыскные мероприятия:\n\nа) Опрос.\nб) Наведение справок.\nв) Сбор образцов для сравнительного исследования.\nг) Контрольная закупка, проводимая уполномоченными сотрудниками оперативных подразделений в порядке, установленном законом;\nд) Исследование предметов и документов.\nе) Наблюдение.\nё) Отождествление личности.\nж) Обследование помещений, зданий, сооружений, участков местности и транспортных средств в пределах установленной законом компетенции;\nз) Снятие информации с технических каналов связи.\nи) Оперативное внедрение, проводимое уполномоченными сотрудниками оперативных подразделений в порядке, установленном законом;\nк) Оперативный эксперимент.\nл) Получение компьютерной информации. Если такое мероприятие ограничивает тайну сообщений или иное конституционное право, оно проводится на основании судебного разрешения либо в иной прямо предусмотренной законом форме;\nм) Объявление ориентировки.\nПримечание: Пункт м) применяется по решению суда и/или уголовному делопроизводству"],[2,"ПК гл. I ст. 6.2","Процессуальный кодекс РО · Глава I. Следствие","Статья 6.2. Приведенный перечень оперативно-розыскных мероприятий применяется с учетом федерального законодательства и может быть изменен или дополнен настоящим Кодексом либо иным актом равной или большей юридической силы."],[2,"ПК гл. I ст. 6.3","Процессуальный кодекс РО · Глава I. Следствие","Статья 6.3. Средства ограничения подвижности, в том числе наручники, могут применяться для законного задержания, привода и иных мер процессуального принуждения при наличии необходимости. Если ограничение свободы осуществляется именно как задержание по основаниям главы II настоящего Кодекса, на него распространяется процессуальный час независимо от фактического применения наручников. Кратковременное применение наручников исключительно для исполнения привода или иного самостоятельного процессуального акта не считается новым задержанием, если лицо освобождается от ограничения сразу после достижения законной цели соответствующей меры.\n\nПримечание: мера процессуального принуждения должна иметь конкретное законное основание и применяться только в объеме, необходимом для достижения процессуальной цели. К таким целям относятся, в частности, законный привод в суд или к следователю, обеспечение задержания, предотвращение побега, сопротивления либо уничтожения доказательств. Использование меры принуждения в личных целях, для унижения лица или при очевидном отсутствии процессуальной необходимости запрещается и влечет ответственность."],[2,"ПК гл. I ст. 6.4","Процессуальный кодекс РО · Глава I. Следствие","Статья 6.4. При необходимости задержания в рамках оперативно-розыскной деятельности, проводимой уполномоченным сотрудником Федеральной службы безопасности с применением оперативной группой для задержания на территории государственной структуры, требуется специальное разрешение Генеральной прокуратуры РО устное с обязательной фиксацией либо документальное. Для получения разрешения Генеральной прокуратуре РО предоставляются материалы правонарушения или преступления и обоснование необходимости проведения отдельного мероприятия на территории государственной структуры. Без такого разрешения задержание допускается только в прямо предусмотренных законом случаях, когда промедление создает непосредственную угрозу жизни, безопасности граждан или уничтожения доказательств, с незамедлительным последующим уведомлением Генеральной прокуратуры РО.\n\nПримечание: разрешение должно содержать конкретное основание, объем и пределы мероприятия. Использование данного порядка в иных целях запрещается и влечет ответственность."],[2,"ПК гл. I ст. 7","Процессуальный кодекс РО · Глава I. Следствие","Статья 7. Процессуальное действие — отдельная процессуальная операция или предусмотренное настоящим Кодексом действие, совершаемое уполномоченным государственным служащим в связи с проверкой, задержанием, расследованием, рассмотрением материала или исполнением процессуального акта."],[2,"ПК гл. I ст. 7.1","Процессуальный кодекс РО · Глава I. Следствие","Статья 7.1. К процессуальным действиям относятся действия уполномоченного государственного служащего, непосредственно затрагивающие права, свободы или обязанности лица, в том числе:\n\nа) досмотр (как личный, так и транспортного средства);\nб) обыск (как личный, так и транспортного средства);\nв) задержание;\nг) арест;\nд) выписывание штрафов;\nе) изъятие лицензий;\nё) применение специальных средств, физической силы и средств ограничения подвижности;\nж) предъявление обязательных устных требований с использованием средств усиления голоса или служебной связи."],[2,"ПК гл. I ст. 7.1.1","Процессуальный кодекс РО · Глава I. Следствие","Статья 7.1.1. Досмотром по смыслу п. а) статьи 7.1 настоящего Кодекса является осуществление обыска человека с его устного или письменного согласия, в то время как обыск по смыслу п. б) статьи 7.1 настоящего Кодекса не подразумевает согласия объекта на его обыск."],[2,"ПК гл. I ст. 8","Процессуальный кодекс РО · Глава I. Следствие","Статья 8. Рейд.\n\nРейд — это организованное комплексное мероприятие, в ходе которого уполномоченные государственные органы оцепляют определенный объект или территорию и проводят предусмотренные законом следственные, оперативно-розыскные и иные процессуальные действия для пресечения устойчивой или организованной противоправной деятельности. Основанием для рейда является судебный акт, постановление уполномоченного прокурора либо иной процессуальный акт, прямо предусмотренный федеральным законодательством."],[2,"ПК гл. I ст. 9","Процессуальный кодекс РО · Глава I. Следствие","Статья 9. Любые следственные действия производимые государственным сотрудником должны осуществляться в рамках и пределах его должностных полномочий."],[2,"ПК гл. I ст. 10","Процессуальный кодекс РО · Глава I. Следствие","Статья 10. Подследственность и компетенция при рассмотрении уголовных материалов.\n1. Следственный комитет РО и Федеральная служба безопасности РО осуществляют предварительное расследование преступлений, прямо отнесенных федеральным законодательством к их подследственности.\n2. Прокуратура РО вправе самостоятельно рассматривать все уголовные материалы, проводить по ним проверку и принимать предусмотренное законом решение.\n3. Если в ходе проверки установлено, что деяние относится к исключительной подследственности другого органа, материалы передаются по подследственности без необоснованной задержки. При смешанном материале допускается выделение и передача только соответствующей части.\n4. До передачи материала допускаются неотложные действия, необходимые для пресечения продолжающегося преступления, сохранения доказательств, защиты жизни и задержания лица."],[2,"ПК гл. I ст. 11","Процессуальный кодекс РО · Глава I. Следствие","Статья 11. Самостоятельность Следственного комитета и взаимодействие с прокуратурой.\n1. Следственный комитет является самостоятельным следственным органом и не входит в систему прокуратуры. Прокуратура не осуществляет организационное или административное руководство Следственным комитетом.\n2. Прокурорский надзор за законностью действий и решений следственного органа осуществляется исключительно в формах, установленных федеральным законодательством.\n3. Прокурор не вправе предопределять следственную версию, требовать фабрикации доказательств или навязывать следователю заранее установленный результат расследования.\n4. Следственный комитет предоставляет прокуратуре материалы в объеме, необходимом для законного прокурорского контроля и последующего участия прокурора в производстве."],[2,"ПК гл. I ст. 12","Процессуальный кодекс РО · Глава I. Следствие","Статья 12. Возбуждение уголовного дела и принятие его к производству.\n1. Уголовное дело возбуждается мотивированным постановлением уполномоченного следователя при наличии достаточных данных, указывающих на признаки преступления, отнесенного к его подследственности.\n2. Возбуждение дела не означает признания конкретного лица виновным.\n3. Материал, не относящийся к подследственности следственного органа, передается компетентному органу, а не прекращается только по причине отсутствия подследственности."],[2,"ПК гл. I ст. 13","Процессуальный кодекс РО · Глава I. Следствие","Статья 13. Срок предварительного расследования.\n1. Предварительное расследование осуществляется без необоснованного затягивания. Обычный срок расследования составляет до 96 часов с момента возбуждения уголовного дела, если характер дела позволяет завершить необходимые действия в этот срок.\n2. При объективной сложности дела руководитель следственного подразделения, заместитель Главы Следственного комитета или Глава Следственного комитета вправе мотивированно продлить срок до семи календарных дней.\n3. Дальнейшее продление допускается в исключительных случаях путем ходатайства перед судом с обязательным указанием причин продления и уже выполненных действий."],[2,"ПК гл. I ст. 14","Процессуальный кодекс РО · Глава I. Следствие","Статья 14. Окончание предварительного расследования.\n1. При наличии достаточных доказательств следователь составляет обвинительное заключение либо иной предусмотренный законом итоговый процессуальный акт.\n2. По окончании расследования уголовное дело направляется в суд, если вопрос о виновности и ответственности подлежит судебному разрешению; в прокуратуру, если законом предусмотрено самостоятельное прокурорское разрешение уголовного материала; либо в иной компетентный орган в случаях, прямо предусмотренных законом.\n3. При отсутствии события или состава преступления, неподтверждении причастности лица либо наличии иного законного основания уголовное дело прекращается мотивированным постановлением."],[2,"ПК — Глава II. Процесс задержания","Процессуальный кодекс РО","Глава II. Процесс задержания.\n\nЗадержание — это мера кратковременного (на срок до одного часа) ограничения свободы лица, которая осуществляется на основании (гл. II ст.1) настоящего Кодекса. Задержание не считается мерой наказания, а является мерой принуждения, оно первоначально применяется во внесудебном порядке, а в случаях, предусмотренных настоящим Кодексом, законность основания задержания либо административный материал могут быть незамедлительно рассмотрены судьей. В совокупности с другими предусмотренными законом средствами и методами задержание позволяет сотрудникам правоохранительных органов собрать необходимые сведения (достаточную доказательственную базу) для решения вопроса о возможности или невозможности применения к лицу какой-либо ответственности."],[2,"ПК гл. II ст. 1","Процессуальный кодекс РО · Глава II. Процесс задержания","Статья 1. Задержание подозреваемого.\nЛицо может быть задержано по подозрению в совершении правонарушения, за которое может быть назначено наказание в виде лишения свободы, ограничения свободы или штрафа.\n\nПри наличии хотя бы одного из следующих оснований:\n\nа) Когда лицо застигнуто в момент совершения правонарушения или непосредственно после его совершения, сотрудником правоохранительных органов;\nб) Когда на подозреваемом или его одежде, при нем или в его жилище будут обнаружены явные следы правонарушения;\nв) Когда 3 и более свидетелей указывают на данное лицо как на совершившее правонарушение;\nг) Когда есть фото или видео фиксация совершенного правонарушения этим лицом;\nд) Если имеется акт уполномоченного лица, позволяющий задержать лицо;\nе) Когда имеется ориентировка на транспортное средство или данное лицо, либо есть основания полагать, что лицо объявлено в розыск;\nж) Когда лицо создает непосредственную угрозу жизни или здоровью окружающих либо имеются достаточные основания полагать, что вследствие состояния опьянения оно не способно безопасно продолжать свои действия и одновременно имеются признаки совершенного правонарушения.\n\nПримечание: правонарушением в статьях настоящей главы и других статьях настоящего Кодекса признается преступление или административное правонарушение, представляющие собой противоправные деяния (действие, бездействие), влекущее уголовную или административную ответственность."],[2,"ПК гл. II ст. 1.1","Процессуальный кодекс РО · Глава II. Процесс задержания","Статья 1.1. Если лицо отказывается предъявлять документы; отказывается снять предмет, который скрывает его личность, то по отношению к данному лицу должна быть инициирована процедура установки личности. Порядок процедуры:\n\nа) Надеть наручники на лицо (если применяются)\nб) Разъяснить лицу основания для установления личности\nв) Предпринять все законные меры для оперативного установления личности задержанного, включая обращение к базам данных, а так же досмотреть документы задержанного.\nг) Сверить лицо задержанного с фотороботом.\nд) Провести личный обыск задержанного, в случае обнаружения нелегальных предметов - провести процесс задержания."],[2,"ПК гл. II ст. 2","Процессуальный кодекс РО · Глава II. Процесс задержания","Статья 2. Порядок задержания правомочным лицом. Задержание лица при ведении следствия производится в следующей последовательности:\n\nНадеть наручники на подозреваемого (если применяются).\nПредъявить опознавательный знак (нашивка, бейдж, жетон, удостоверение или иной идентификационный знак, подтверждающий принадлежность к правоохранительным органам).\nПроизвести первичный обыск на наличие документов с целью установления личности задержанного и его принадлежности к государственному органу, а также на наличие нелегальных и запрещенных предметов.\nПримечание: В случае необходимости проверить наличие либо отсутствие сведений о нахождении гражданина в розыске.\nПроизвести выемку любого вида оружия, спецсредств нелетального действия, взрывчатых веществ, колющих или режущих предметов, предполагаемых наркотических средств на время процессуальных действий.\nПри наличии законных оснований внести сведения о лице в учет розыска, изменить основание розыска либо отменить его в установленном порядке.\nРазъяснить задержанному основания задержания и статьи, по которым он задержан, с кратким разъяснением их содержания.\nРазъяснить задержанному его процессуальные и конституционные права в порядке статьи 6 настоящей главы.\nДоставить задержанного в изолятор временного содержания или суд (при необходимости)\nПри необходимости провести экспертизу состояния какого-либо технического или биологического объекта.\nПри необходимости произвести допрос подозреваемого. Если адвокат запрошен, он имеет право присутствовать на допросе.\nЕсли задержанный является государственным служащим, вызвать сотрудника прокуратуры в случаях, когда его участие обязательно, а также вправе уведомить государственный орган, в котором служит задержанный, о факте и месте проведения процессуальных действий."],[2,"ПК гл. II ст. 2.1","Процессуальный кодекс РО · Глава II. Процесс задержания","Статья 2.1. В случае возникновения непредвиденных обстоятельств, государственный служащий имеет право отойти от точного порядка исполнения задержания, однако обязан сохранить исполнение каждого из вышеперечисленных пунктов, за исключением пунктов, которые исполняются при необходимости."],[2,"ПК гл. II ст. 2.2","Процессуальный кодекс РО · Глава II. Процесс задержания","Статья 2.2. Если лицо и особые приметы задержанного перекрыты инородными предметами, разрешается их удалить."],[2,"ПК гл. II ст. 2.3","Процессуальный кодекс РО · Глава II. Процесс задержания","Статья 2.3. Если сотрудник, производящий задержание, не имеет прямого доступа к необходимому межведомственному каналу связи, он обязан запросить содействие у другого государственного служащего для вызова адвоката либо прокурора, когда такой вызов обязателен. Отсутствие технического доступа к каналу связи не освобождает сотрудника от обязанности предпринять разумные и доступные меры для реализации процессуальных прав задержанного."],[2,"ПК гл. II ст. 2.4","Процессуальный кодекс РО · Глава II. Процесс задержания","Статья 2.4. Первичный обыск производится с целью идентификации колющих, режущих орудий, огнестрельного оружия, наркотических веществ, взрывчатых элементов. При необходимости разрешается неоднократно смотреть документы задержанного. Такой обыск в целях безопасности проведения процессуальных действий позволяет изымать огнестрельное оружие, колющие, режущие орудия/предметы, наркотические вещества, взрывчатые элементы."],[2,"ПК гл. II ст. 2.5","Процессуальный кодекс РО · Глава II. Процесс задержания","Статья 2.5. Если в ходе проверки не подтвердились законные основания для дальнейшего удержания задержанного, процессуальные действия, связанные с ограничением его свободы, прекращаются, а задержанный освобождается, если отсутствует другое самостоятельное законное основание."],[2,"ПК гл. II ст. 2.5.1","Процессуальный кодекс РО · Глава II. Процесс задержания","Статья 2.5.1. Законно принадлежащие задержанному предметы, временно изъятые исключительно для обеспечения безопасности процессуальных действий, подлежат возврату после отпадения основания их удержания. Предмет может быть сохранен в материалах дела, конфискован либо передан компетентному органу только при наличии самостоятельного законного основания."],[2,"ПК гл. II ст. 2.6","Процессуальный кодекс РО · Глава II. Процесс задержания","Статья 2.6. Выемка - изъятие у лица определенных предметов и (или) документов, имеющих значение для уголовного дела либо для безопасности проведения процессуальных действий."],[2,"ПК гл. II ст. 2.7","Процессуальный кодекс РО · Глава II. Процесс задержания","Статья 2.7. Задержанный может быть передан от одного уполномоченного сотрудника другому. Передающий сотрудник обязан сообщить принимающему основания задержания, предварительную квалификацию, существенные обстоятельства, сведения о примененных мерах, а также данные, позволяющие истребовать относящуюся к задержанию видеофиксацию и иные материалы. Если после передачи установлено, что дальнейшее производство относится к исключительной подследственности или компетенции другого государственного органа, задержанный и материалы без необоснованной задержки передаются этому органу в установленном законом порядке."],[2,"ПК гл. II ст. 2.7.1","Процессуальный кодекс РО · Глава II. Процесс задержания","Статья 2.7.1. Передача задержанного по исключительной подследственности Следственного комитета или Федеральной службы безопасности РО.\n\n1. Если сотрудник правоохранительного органа, не уполномоченный осуществлять предварительное расследование соответствующего преступления, законно задержал лицо и из установленных на месте обстоятельств следует, что предполагаемое деяние относится к исключительной подследственности Следственного комитета РО или Федеральной службы безопасности РО, такой сотрудник не вправе окончательно разрешать уголовный материал и обязан организовать передачу задержанного и материалов компетентному органу.\n2. Задержанный доставляется в изолятор временного содержания, служебное помещение либо иное безопасное место проведения процессуальных действий, если немедленная передача уполномоченному сотруднику непосредственно на месте задержания объективно невозможна или небезопасна.\n3. Сотрудник, осуществивший задержание, без необоснованной задержки вызывает уполномоченного сотрудника соответствующего органа.\n4. До фактической передачи задержанного сотрудник, осуществивший задержание, вправе совершать неотложные действия, необходимые для пресечения продолжающегося преступления, обеспечения безопасности, установления личности, первичного обыска, сохранения и фиксации доказательств, выемки опасных предметов и предотвращения побега или уничтожения доказательств. Проведение полного предварительного расследования и принятие окончательного решения по существу материала осуществляются компетентным следственным органом.\n5. Прибывшему уполномоченному сотруднику передаются задержанный, сведения об основании и времени задержания, предварительная квалификация, видеозаписи, изъятые предметы и документы, сведения о свидетелях и иные имеющиеся материалы. Передача должна позволять установить непрерывность хранения доказательств и процессуальных действий. Сотрудник, первоначально задержавший лицо, вправе оставаться для предъявления доказательств, в том числе видеозаписи, и участия в процессе следствия до окончания следственных действий.\n6. Передача задержанного другому государственному органу не прерывает и не начинает заново срок задержания. Время исчисляется с момента первоначального фактического ограничения свободы.\n7. Если уполномоченный сотрудник соответствующего органа не прибыл либо не принял задержанного до истечения допустимого срока удержания с учетом предусмотренных настоящим Кодексом приостановлений, лицо подлежит освобождению, если отсутствует иное самостоятельное законное основание для дальнейшего ограничения свободы. Неприбытие уполномоченного сотрудника не прекращает материал и не препятствует его последующему расследованию."],[2,"ПК гл. II ст. 2.8","Процессуальный кодекс РО · Глава II. Процесс задержания","Статья 2.8. Если до проведения личного обыска сотруднику стало известно либо задержанный заявил, что обладает неприкосновенностью или иным специальным процессуальным статусом, сотрудник обязан без необоснованной задержки проверить наличие такого статуса до совершения действия, для которого законом установлена специальная процедура. Для подтверждения статуса допускается истребовать или найти в ходе обыска и осмотреть удостоверение или иной документ, подтверждающий соответствующее положение лица."],[2,"ПК гл. II ст. 2.9","Процессуальный кодекс РО · Глава II. Процесс задержания","Статья 2.9. Упрощенное разрешение уголовного материала непосредственно при задержании\n1. Если задержанный не является государственным служащим или иным лицом, для которого законом установлен специальный порядок, а предполагаемое преступление относится к общей подследственности и не требует обязательного судебного рассмотрения, уполномоченный сотрудник правоохранительного органа вправе разрешить уголовный материал непосредственно в ходе задержания в упрощенном порядке.\n2. Для применения упрощенного порядка не требуется формировать отдельное письменное либо электронное уголовное делопроизводство. Достаточными процессуальными материалами являются относящиеся к задержанию доказательства и обязательная видеофиксация, позволяющие проверить событие преступления, причастность лица, соблюдение его прав, правовую квалификацию и принятое решение.\n3. До принятия решения сотрудник обязан проверить как обвиняющие, так и известные ему оправдывающие обстоятельства, предоставить задержанному возможность воспользоваться адвокатом в установленном настоящим Кодексом порядке и убедиться в достаточности доказательств для окончательного разрешения материала.\n4. В упрощенном порядке сотрудник правоохранительного органа вправе назначить только лишение свободы на определенный срок в пределах санкции применяемой статьи Уголовного кодекса РО, но не более пяти лет по совокупности преступлений, за исключением случаев нарушением задержанным статьи 17.3 Уголовного Кодекса непосредственно в во время процессуальных действия. В таком случае допускается добавить добавить наказание за оскорбление к совокупному наказанию за преступления в том числе свыше пяти лет лишения свободы.\n5. Сотрудник правоохранительного органа не вправе в упрощенном порядке назначать уголовный штраф, обязательные работы, лишение права занимать должности или заниматься деятельностью, лишение специального права, конфискацию в качестве наказания либо иное дополнительное уголовное наказание. Изъятие запрещенных предметов и предметов, подлежащих изъятию по самостоятельному законному основанию, осуществляется отдельно и не считается уголовным наказанием.\n6. Перед помещением лица под уголовный арест сотрудник объявляет подтвержденную квалификацию, назначенный срок лишения свободы и право на обжалование. Принятое решение и его существенные основания должны быть зафиксированы на видеозаписи.\n7. Если в ходе задержания возникает существенный спор о фактических обстоятельствах, требуется продолжительное расследование, экспертиза или иное действие, которое невозможно разумно провести в рамках задержания, либо выявляется исключительная подследственность Следственного комитета РО или Федеральной службы безопасности РО, обязательное судебное рассмотрение или специальный процессуальный статус лица, сотрудник не вправе завершить материал в упрощенном порядке и действует по правилам передачи материала компетентному органу.\n8. Решение сотрудника, принятое в упрощенном порядке, может быть обжаловано в прокуратуру или в суд. Отсутствие отдельного письменного уголовного дела не препятствует проверке законности по видеозаписи и иным сохраненным материалам.\n9. Сотрудник Федеральной службы безопасности РО не вправе назначать или оформлять уголовный штраф, в том числе при задержании и упрощенном разрешении материала."],[2,"ПК гл. II ст. 3","Процессуальный кодекс РО · Глава II. Процесс задержания","Статья 3. Вызов адвоката на задержание."],[2,"ПК гл. II ст. 3.1","Процессуальный кодекс РО · Глава II. Процесс задержания","Статья 3.1. Если задержанный требует государственного адвоката, сотрудник обязан направить вызов посредством установленного государственного канала связи. Если в течение 3 минут не получен ответ о возможности предоставить адвоката, процессуальные действия могут быть продолжены, а первоначальная возможность воспользоваться государственным адвокатом считается предоставленной."],[2,"ПК гл. II ст. 3.2","Процессуальный кодекс РО · Глава II. Процесс задержания","Статья 3.2. Если поступило сообщение об отсутствии свободного государственного адвоката или невозможности его прибытия, процессуальные действия продолжаются. Если адвокат подтвердил прибытие, течение процессуального часа приостанавливается на срок ожидания, но не более чем на 10 минут. Если адвокат не прибыл в указанный срок, процессуальные действия могут быть продолжены.\nЕсли адвокат прибыл до принятия окончательного решения по задержанию, ему должна быть предоставлена возможность вступить в производство и реализовать права защитника."],[2,"ПК гл. II ст. 3.3","Процессуальный кодекс РО · Глава II. Процесс задержания","Статья 3.3. При вызове частного адвоката течение процессуального часа приостанавливается на срок ожидания, но не более чем на 10 минут с момента подтверждения вызова. Если адвокат не прибыл в указанный срок, процессуальные действия могут быть продолжены. Если адвокат прибыл до принятия окончательного решения по задержанию, ему должна быть предоставлена возможность вступить в производство и реализовать права защитника."],[2,"ПК гл. II ст. 3.4","Процессуальный кодекс РО · Глава II. Процесс задержания","Статья 3.4. Если задержанному была предоставлена реальная возможность воспользоваться адвокатом, но он сознательно отказался, не выбрал адвоката либо не предпринял необходимых действий в установленный разумный срок, первоначальная возможность воспользоваться защитой считается реализованной."],[2,"ПК гл. II ст. 4","Процессуальный кодекс РО · Глава II. Процесс задержания","Статья 4. При задержании государственного служащего обязательное участие прокурора и следователя."],[2,"ПК гл. II ст. 4.1","Процессуальный кодекс РО · Глава II. Процесс задержания","Статья 4.1. При задержании государственного служащего сотрудник прокуратуры и следственного комитета непосредственно изучает основания задержания, правовую квалификацию, представленные доказательства и видеозаписи, соблюдение процессуальных прав, после чего самостоятельно устанавливает наличие либо отсутствие состава правонарушения и принимает обязательное решение по дальнейшей судьбе задержанного."],[2,"ПК гл. II ст. 4.2","Процессуальный кодекс РО · Глава II. Процесс задержания","Статья 4.2. После подтверждения прокуратурой принятия вызова течение процессуального часа приостанавливается до прибытия прокурора, но не более чем на 15 минут. Если прокурор не прибыл в указанный срок, задержанный государственный служащий подлежит освобождению от дальнейшего удержания в рамках данной процедуры, а материалы задержания направляются в прокуратуру для последующего рассмотрения."],[2,"ПК гл. II ст. 4.3","Процессуальный кодекс РО · Глава II. Процесс задержания","Статья 4.3. Если прокуратура не подтвердила принятие вызова в течение 15 минут, задержанный государственный служащий освобождается от дальнейшего удержания. Освобождение по этому основанию не прекращает материал и не препятствует последующему внесению прокурорского, следственного или судебного акта."],[2,"ПК гл. II ст. 4.4","Процессуальный кодекс РО · Глава II. Процесс задержания","Статья 4.4. По результатам рассмотрения прокурор вправе освободить задержанного; признать квалификацию подтвержденной полностью или частично; исключить неподтвержденные статьи; изменить квалификацию в пределах установленных обстоятельств; назначить штраф; назначить предусмотренную законом меру, связанную с лишением или ограничением свободы; передать материал в Следственный комитет, Федеральную службу безопасности или иной компетентный орган; либо принять иное предусмотренное законом решение. Решение прокурора может быть объявлено устно, вступает в силу немедленно и обязательно для сотрудников, осуществляющих задержание и дальнейшее оформление.\nПримечание: По результатам рассмотрения следователь имеет право возбудить уголовное дело или во время задержания квалифицировать дополнительные статьи, а также отстранить от исполнения служебных обязанностей, запретить любые кадровые перестановки в отношении сотрудника и смену им паспортных данных."],[2,"ПК гл. II ст. 4.5","Процессуальный кодекс РО · Глава II. Процесс задержания","Статья 4.5. Если прокурор не усматривает законных оснований для привлечения задержанного к ответственности в рамках рассматриваемого материала, задержанный подлежит немедленному освобождению. Прокуратура вправе отдельно проверить законность действий сотрудников, осуществлявших задержание."],[2,"ПК гл. II ст. 4.6","Процессуальный кодекс РО · Глава II. Процесс задержания","Статья 4.6. Решение прокурора при задержании может быть обжаловано задержанным, его адвокатом либо сотрудником, представившим материалы, вышестоящему прокурору или в суд. Подача жалобы не приостанавливает исполнение решения, если вышестоящий прокурор или суд не распорядится иначе."],[2,"ПК гл. II ст. 4.7","Процессуальный кодекс РО · Глава II. Процесс задержания","Статья 4.7. Повторное прокурорское рассмотрение задержания не требуется, если лицо задерживается во исполнение вступившего в силу судебного акта, постановления прокурора о санкционировании ареста либо ранее вынесенного прокурорского решения в отношении этого лица, которое не было исполнено по объективной причине.\n\nПримечание: ранее вынесенным прокурорским решением признается решение, принятое прокурором в отношении конкретного лица и не приведенное в исполнение по объективным обстоятельствам, если оно не было отменено, изменено или признано утратившим силу."],[2,"ПК гл. II ст. 4.8","Процессуальный кодекс РО · Глава II. Процесс задержания","Статья 4.8. Прекращение лицом государственной службы, увольнение либо перевод после фактического начала задержания не отменяют обязательное прокурорское рассмотрение, если на момент задержания лицо являлось государственным служащим и специальная процедура уже была начата."],[2,"ПК гл. II ст. 4.9","Процессуальный кодекс РО · Глава II. Процесс задержания","Статья 4.9. Окончательное решение по делу в случае прибытия и сотрудника прокуратуры, и сотрудника следственного комитета выносится сотрудником прокуратуры.\nПояснение: В рамках вызова сотрудник следственного коми
