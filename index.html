СПОЛЬЗОВАНИЕ","Статья 18. Действия после применения оружия\n1. Лицо, применившее оружие и причинившее человеку ранение или смерть, обязано при первой безопасной возможности:\n1) прекратить применение оружия после прекращения угрозы;\n2) вызвать медицинскую помощь, если она необходима;\n3) сообщить о происшествии в органы внутренних дел;\n4) по возможности сохранить обстановку и предметы, имеющие значение для установления обстоятельств происшествия.\n2. Настоящая статья не обязывает лицо предпринимать действия, которые создают для него или других лиц непосредственную опасность."],[5,"ФЗ об оружии ст. 19","ФЗ «Об оружии» · Глава II. ГРАЖДАНСКОЕ ОРУЖИЕ: ПРИОБРЕТЕНИЕ, ХРАНЕНИЕ, НОШЕНИЕ И ИСПОЛЬЗОВАНИЕ","Статья 19. Утрата или хищение оружия\n1. Владелец обязан без необоснованной задержки сообщить в органы внутренних дел об утрате или хищении оружия, боеприпасов либо документа, подтверждающего право на оружие.\n2. Сведения об утраченном или похищенном огнестрельном оружии вносятся в государственный учет.\n3. Обнаруженное впоследствии оружие подлежит проверке и возвращению законному владельцу, если отсутствует самостоятельное основание для его изъятия."],[5,"ФЗ об оружии ст. 20","ФЗ «Об оружии» · Глава II. ГРАЖДАНСКОЕ ОРУЖИЕ: ПРИОБРЕТЕНИЕ, ХРАНЕНИЕ, НОШЕНИЕ И ИСПОЛЬЗОВАНИЕ","Статья 20. Основные запреты для владельца гражданского оружия\nВладельцу запрещается:\n1) носить или хранить оружие при недействующей лицензии, если закон не устанавливает срок для его сдачи или переоформления;\n2) передавать оружие лицу, не имеющему права на его получение;\n3) уничтожать, изменять, скрывать или подделывать обязательную маркировку и серийный номер;\n4) использовать оружие в личном конфликте при отсутствии предусмотренного законом основания для необходимой обороны;\n5) беспричинно демонстрировать оружие либо производить выстрелы вне законного применения, специально предназначенного места или иного законного основания;\n6) вносить оружие на объект, где федеральным законом или законно установленным режимом запрещен его пронос, если владелец не обладает специальным правом доступа с оружием;\n7) использовать гражданскую лицензию для приобретения или сокрытия служебного либо боевого оружия."],[5,"ФЗ об оружии ст. 21","ФЗ «Об оружии» · Глава III. ЛИЦЕНЗИРОВАНИЕ ГРАЖДАНСКОГО ОРУЖИЯ","Статья 21. Орган, осуществляющий лицензирование\n1. Лицензии на оружие и лицензии коллекционера выдаются уполномоченным подразделением Министерства внутренних дел РО.\n2. Правительство РО устанавливает форму лицензии, срок ее действия, государственную пошлину, общий порядок ведения реестра и перечень гражданского оружия.\n3. МВД РО организует проверку документов, проведение экзамена, ведение учета лицензий и контроль за соблюдением лицензионных условий.\n4. Внутренний акт МВД РО не может устанавливать дополнительные основания лишения права на оружие, не предусмотренные федеральным законодательством."],[5,"ФЗ об оружии ст. 22","ФЗ «Об оружии» · Глава III. ЛИЦЕНЗИРОВАНИЕ ГРАЖДАНСКОГО ОРУЖИЯ","Статья 22. Условия получения лицензии на оружие\nЛицензия может быть выдана гражданину, который:\n1) достиг совершеннолетия;\n2) подтвердил личность и гражданство РО;\n3) не лишен права на оружие вступившим в силу решением суда или иным окончательным актом, если такое лишение прямо допускается федеральным законом;\n4) представил действующее медицинское заключение об отсутствии противопоказаний к владению оружием;\n5) успешно прошел проверку знания правил безопасного обращения с оружием, настоящего Федерального закона и основных правил необходимой обороны;\n6) не представил заведомо ложных сведений при обращении за лицензией.\nНаличие факта задержания, неподтвержденного сообщения о правонарушении или незавершенной проверки само по себе не является основанием для отказа в выдаче лицензии."],[5,"ФЗ об оружии ст. 22.1","ФЗ «Об оружии» · Глава III. ЛИЦЕНЗИРОВАНИЕ ГРАЖДАНСКОГО ОРУЖИЯ","Статья 22.1 Стоимость лицензий на оружие\nЛицензия на гражданское оружие выдается уполномоченными сотрудниками, порядок проведения экзаменов определяется Правительством РО Стоимость лицензии составляет 12.000₽ и 3.000₽ за экзамен. Оплата за проведение экзамена, достаётся сотруднику, который проводил экзамен оплата за лицензию достается казне организаций сотрудника. С гос. служащих, не взимается плата."],[5,"ФЗ об оружии ст. 23","ФЗ «Об оружии» · Глава III. ЛИЦЕНЗИРОВАНИЕ ГРАЖДАНСКОГО ОРУЖИЯ","Статья 23. Медицинское заключение и экзамен\n1. Медицинское заключение выдается государственной или иной уполномоченной медицинской организацией в порядке, установленном Министерством здравоохранения РО.\n2. Экзамен на оружейную лицензию проводится уполномоченным подразделением МВД РО либо иной организацией, которой такое полномочие прямо предоставлено Правительством РО.\n3. Экзамен должен проверять знание правил оборота, хранения, безопасного обращения и правомерного применения оружия.\n4. При несдаче экзамена гражданин вправе пройти его повторно в порядке, установленном Правительством РО."],[5,"ФЗ об оружии ст. 24","ФЗ «Об оружии» · Глава III. ЛИЦЕНЗИРОВАНИЕ ГРАЖДАНСКОГО ОРУЖИЯ","Статья 24. Отказ в выдаче лицензии\n1. В выдаче лицензии отказывается при несоблюдении хотя бы одного из условий статьи 22 настоящего Федерального закона.\n2. Решение об отказе должно содержать конкретное правовое и фактическое основание.\n3. Отказ не может быть основан исключительно на личном мнении должностного лица о целесообразности владения оружием.\n4. Отказ может быть обжалован вышестоящему должностному лицу МВД РО, в прокуратуру или суд."],[5,"ФЗ об оружии ст. 25","ФЗ «Об оружии» · Глава III. ЛИЦЕНЗИРОВАНИЕ ГРАЖДАНСКОГО ОРУЖИЯ","Статья 25. Срок действия, продление и изменение сведений\n1. Срок действия лицензии устанавливается Правительством РО.\n2. Владелец вправе обратиться за продлением до истечения срока действия лицензии.\n3. При изменении имени, фамилии или иных существенных регистрационных сведений владелец обязан обратиться для их обновления в оружейном реестре в срок, установленный Правительством РО.\n4. Истечение срока действия лицензии прекращает право дальнейшего ношения оружия, но не превращает ранее законно приобретенное оружие в предмет, подлежащий немедленной конфискации без предоставления установленной законом возможности сдать, переоформить или иным образом законно распорядиться им."],[5,"ФЗ об оружии ст. 26","ФЗ «Об оружии» · Глава III. ЛИЦЕНЗИРОВАНИЕ ГРАЖДАНСКОГО ОРУЖИЯ","Статья 26. Приостановление действия лицензии\n1. Действие лицензии может быть временно приостановлено уполномоченным подразделением МВД РО:\n1) при истечении или прекращении действия обязательного медицинского заключения;\n2) при утрате документа о лицензии до его восстановления, если сведения невозможно подтвердить по государственному реестру;\n3) при возникновении документально подтвержденных медицинских противопоказаний;\n4) на период исполнения вступившего в силу временного судебного запрета на владение или ношение оружия;\n5) в иных случаях, прямо предусмотренных федеральным законом.\n2. Приостановление не является наказанием и применяется только на срок существования соответствующего основания.\n3. Решение о приостановлении подлежит мотивированному оформлению и может быть обжаловано."],[5,"ФЗ об оружии ст. 27","ФЗ «Об оружии» · Глава III. ЛИЦЕНЗИРОВАНИЕ ГРАЖДАНСКОГО ОРУЖИЯ","Статья 27. Прекращение лицензии и лишение права на оружие\n1. Лицензия прекращается:\n1) по заявлению владельца;\n2) в связи со смертью владельца;\n3) при установлении факта получения лицензии на основании заведомо подложных документов или ложных сведений, имеющих существенное значение;\n4) при вступлении в силу решения о лишении права на оружие;\n5) в иных случаях, прямо предусмотренных федеральным законом.\n2. Лишение права на оружие в качестве наказания осуществляется судом, если иное прямо не предусмотрено федеральным законом.\n3. Само задержание лица, предъявление ему подозрения или обвинения, составление административного материала либо временное изъятие оружия не означают автоматического прекращения лицензии.\n4. При прекращении лицензии владелец обязан в установленный срок сдать оружие на ответственное хранение, передать его через законную процедуру иному лицу либо распорядиться им иным способом, допускаемым федеральным законодательством."],[5,"ФЗ об оружии ст. 28","ФЗ «Об оружии» · Глава IV. КОЛЛЕКЦИОННОЕ, СЛУЖЕБНОЕ ОРУЖИЕ И СПЕЦИАЛЬНЫЕ СРЕДСТВА","Статья 28. Лицензия коллекционера\n1. Совершеннолетний гражданин, имеющий действующую лицензию на оружие, вправе получить лицензию коллекционера.\n2. Для получения лицензии коллекционера гражданин проходит дополнительную проверку знания правил учета, хранения, транспортирования и деактивации коллекционного оружия.\n3. Сведения о коллекционерах и принадлежащих им коллекционных образцах вносятся в государственный оружейный реестр.\n4. Лицензия коллекционера не предоставляет права использовать коллекционное оружие для стрельбы или носить его как готовое к применению оружие."],[5,"ФЗ об оружии ст. 29","ФЗ «Об оружии» · Глава IV. КОЛЛЕКЦИОННОЕ, СЛУЖЕБНОЕ ОРУЖИЕ И СПЕЦИАЛЬНЫЕ СРЕДСТВА","Статья 29. Коллекционное оружие и его деактивация\n1. Коллекционным может быть признано оружие, имеющее историческую, техническую, культурную либо иную коллекционную ценность и законно внесенное в оружейный реестр.\n2. Оружие, которое по своему виду не допускается к обычному гражданскому обороту либо имеет уничтоженную или существенно поврежденную маркировку, может находиться в частной коллекции только после необратимой либо установленным образом контролируемой деактивации, исключающей производство штатного выстрела.\n3. Факт деактивации подтверждается экспертным подразделением МВД РО либо иной организацией, уполномоченной Правительством РО.\n4. После деактивации оружию присваивается учетный номер или иное средство идентификации, позволяющее отличить конкретный коллекционный образец.\n5. Взрывные устройства, боеприпасы, сохраняющие поражающее действие, и иные предметы, прямо запрещенные федеральным законом к коллекционированию гражданами, не могут быть легализованы лицензией коллекционера."],[5,"ФЗ об оружии ст. 30","ФЗ «Об оружии» · Глава IV. КОЛЛЕКЦИОННОЕ, СЛУЖЕБНОЕ ОРУЖИЕ И СПЕЦИАЛЬНЫЕ СРЕДСТВА","Статья 30. Хранение и транспортирование коллекционного оружия\n1. Коллекционное оружие хранится по месту, указанному в реестре, с обеспечением сохранности и исключением доступа посторонних лиц.\n2. Деактивированный коллекционный образец запрещается заряжать, приводить в боеспособное состояние или использовать для стрельбы.\n3. Транспортирование коллекционного оружия допускается для регистрации, экспертизы, ремонта, выставки, продажи в установленном порядке либо иной законной цели.\n4. Лицензия коллекционера не освобождает владельца от соблюдения правил оборота обычного гражданского оружия, если у него имеется такое оружие."],[5,"ФЗ об оружии ст. 31","ФЗ «Об оружии» · Глава IV. КОЛЛЕКЦИОННОЕ, СЛУЖЕБНОЕ ОРУЖИЕ И СПЕЦИАЛЬНЫЕ СРЕДСТВА","Статья 31. Учет служебного и боевого оружия\n1. Служебное и боевое оружие подлежит ведомственному государственному учету.\n2. Выдача оружия сотруднику или военнослужащему производится на основании служебной необходимости в порядке, установленном федеральным законом и внутренними актами соответствующего органа.\n3. Получившее оружие лицо обязано обеспечивать его сохранность и не вправе передавать его посторонним лицам.\n4. После прекращения служебного основания оружие возвращается в установленное место хранения, если специальным федеральным законом или законным служебным решением не установлен иной порядок."],[5,"ФЗ об оружии ст. 32","ФЗ «Об оружии» · Глава IV. КОЛЛЕКЦИОННОЕ, СЛУЖЕБНОЕ ОРУЖИЕ И СПЕЦИАЛЬНЫЕ СРЕДСТВА","Статья 32. Применение служебного и боевого оружия\n1. Настоящий Федеральный закон не расширяет основания применения служебного или боевого оружия.\n2. Сотрудники полиции, ГИБДД, Федеральной службы безопасности, Вооруженных Сил и иных государственных органов применяют оружие только в случаях и порядке, установленных Процессуальным кодексом РО и соответствующим специальным федеральным законом.\n3. Наличие у сотрудника служебного оружия или приказ о его выдаче сами по себе не являются основанием для применения оружия против человека."],[5,"ФЗ об оружии ст. 33","ФЗ «Об оружии» · Глава IV. КОЛЛЕКЦИОННОЕ, СЛУЖЕБНОЕ ОРУЖИЕ И СПЕЦИАЛЬНЫЕ СРЕДСТВА","Статья 33. Специальные средства и средства индивидуальной защиты\n1. Служебные специальные средства выдаются и учитываются соответствующим государственным органом по правилам, применяемым к государственному имуществу.\n2. Гражданское владение служебными наручниками, специальными электрошоковыми устройствами и иными средствами, прямо отнесенными Правительством РО к служебным специальным средствам, запрещается, если федеральным законом не установлено иное.\n3. Гражданские бронежилеты и иные обычные средства индивидуальной защиты могут находиться в гражданском обороте без оружейной лицензии.\n4. Незаконное присвоение, хранение или сбыт государственного средства индивидуальной защиты либо специального средства влечет последствия в порядке Уголовного кодекса РО и иных федеральных законов."],[5,"ФЗ об оружии ст. 34","ФЗ «Об оружии» · Глава V. ПРОИЗВОДСТВО, ТОРГОВЛЯ, УЧЕТ, КОНТРОЛЬ И ИЗЪЯТИЕ","Статья 34. Производство и торговля оружием\n1. Производство огнестрельного оружия, его основных частей и боеприпасов допускается только организациям, получившим соответствующее государственное разрешение.\n2. Розничная торговля гражданским огнестрельным оружием осуществляется специализированными организациями, допущенными к такой деятельности Правительством РО или уполномоченным им органом.\n3. Гражданин не вправе самостоятельно изготавливать огнестрельное оружие, восстанавливать деактивированное оружие до боеспособного состояния либо существенно переделывать оружие с целью изменения его правового режима без предусмотренного законом разрешения.\n4. Ремонт оружия, не изменяющий его основные идентификационные признаки и правовой режим, допускается в порядке, установленном Правительством РО."],[5,"ФЗ об оружии ст. 35","ФЗ «Об оружии» · Глава V. ПРОИЗВОДСТВО, ТОРГОВЛЯ, УЧЕТ, КОНТРОЛЬ И ИЗЪЯТИЕ","Статья 35. Маркировка и государственный учет\n1. Огнестрельное оружие, находящееся в законном обороте, должно иметь читаемый серийный, инвентарный или иной предусмотренный законом идентификационный номер.\n2. Запрещаются умышленное уничтожение, изменение, подделка или сокрытие такой маркировки.\n3. МВД РО ведет государственный учет гражданского и коллекционного оружия, владельцев оружия, выданных лицензий, утраченного и похищенного оружия.\n4. Государственные органы самостоятельно ведут ведомственный учет служебного и боевого оружия и предоставляют сведения компетентным органам в случаях, установленных федеральным законодательством."],[5,"ФЗ об оружии ст. 36","ФЗ «Об оружии» · Глава V. ПРОИЗВОДСТВО, ТОРГОВЛЯ, УЧЕТ, КОНТРОЛЬ И ИЗЪЯТИЕ","Статья 36. Контроль, проверка и изъятие оружия\n1. Контроль за гражданским оборотом оружия осуществляет МВД РО в пределах своей компетенции.\n2. Уполномоченный сотрудник вправе проверить наличие лицензии и соответствие идентификационного номера оружия учетным сведениям при наличии законного основания для такой проверки.\n3. Проверка лицензии или маркировки сама по себе не предоставляет права проводить полный обыск лица, жилища или транспортного средства без самостоятельного процессуального основания.\n4. Оружие может быть временно изъято:\n1) при задержании лица, если оружие создает угрозу безопасности либо относится к обстоятельствам правонарушения;\n2) при проведении законного обыска, выемки или иного процессуального действия;\n3) при отсутствии подтвержденного законного основания владения;\n4) при наличии признаков уничтожения или подделки обязательной маркировки;\n5) при приостановлении или прекращении лицензии, когда продолжение владения или ношения не допускается;\n6) в иных случаях, прямо предусмотренных федеральным законодательством.\n5. Временное изъятие не является конфискацией и не означает автоматического лишения права на оружие.\n6. Порядок процессуального изъятия, оформления и хранения оружия определяется Процессуальным кодексом РО."],[5,"ФЗ об оружии ст. 37","ФЗ «Об оружии» · Глава V. ПРОИЗВОДСТВО, ТОРГОВЛЯ, УЧЕТ, КОНТРОЛЬ И ИЗЪЯТИЕ","Статья 37. Возврат, конфискация, уничтожение и добровольная сдача\n1. Законно принадлежащее лицу оружие подлежит возврату после прекращения основания временного изъятия, если отсутствует иное законное основание для его удержания.\n2. Конфискация оружия как уголовно-правовое или административное последствие допускается только в случаях и порядке, установленных соответствующим кодексом и окончательным решением компетентного органа.\n3. Оружие, окончательно признанное незаконным и не подлежащее возврату либо законной передаче, уничтожается или обращается в государственную собственность в установленном порядке.\n4. Лицо вправе добровольно сдать оружие, боеприпасы или иные запрещенные предметы в органы внутренних дел.\n5. Уголовно-правовые последствия добровольной сдачи определяются Уголовным кодексом РО. Сдача после фактического обнаружения предмета при принудительном процессуальном действии не считается добровольной сдачей для целей освобождения от ответственности, если Уголовным кодексом не установлено иное.\n6. Действия должностных лиц по изъятию, отказу в возврате, приостановлению или прекращению лицензии могут быть обжалованы вышестоящему должностному лицу, в прокуратуру или суд."],[5,"ФЗ об оружии ст. 38","ФЗ «Об оружии» · Глава VI. ЗАКЛЮЧИТЕЛЬНЫЕ ПОЛОЖЕНИЯ","Статья 38. Соотношение с иными актами и вступление в силу\n1. Вопросы уголовной ответственности за незаконный оборот, изготовление, хищение оружия, боеприпасов и взрывчатых веществ регулируются Уголовным кодексом РО.\n2. Процессуальный порядок обыска, изъятия, хранения доказательств и применения оружия государственными служащими определяется Процессуальным кодексом РО.\n3. Специальные правила выдачи и применения государственного оружия сотрудниками государственных органов и военнослужащими определяются соответствующими федеральными законами.\n4. Правительство РО и Министерство внутренних дел РО приводят подзаконные и ведомственные акты в соответствие с настоящим Федеральным законом.\n5. Настоящий Федеральный закон вступает в силу с момента его официального опубликования."],[6,"ДУ — общие положения","Дисциплинарный устав ВС РО","ДИСЦИПЛИНАРНЫЙ УСТАВ\nВОЕННЫЙ СИЛ РОССИИ ОНЛАЙН"],[6,"ДУ п. 1.1","Дисциплинарный устав ВС РО","1.1. Виды дисциплинарных взысканий:\nВыговор;\nПонижение в звании;\nПереаттестация;\nПонижение\nУвольнение.\nПримечание:\nВыговор - это дисциплинарное взыскание, которое применимо к любому сотруднику ВС РО, нарушившему действующий устав, а также по решению прокурора или суда.\nПереаттестация - мера дисциплинарного взыскания, выдающаяся в случае грубого или неоднократного нарушения устава, не прохождение проф. проверки. Во время переаттестации сотрудник отстраняется от службы. На прохождении переаттестации выделяется 72 часа с момента выдачи, в случае неисполнения последует увольнение. Для проведения устного экзамена назначается сотрудник отдела Военной полиции.\nДопустимо назначить сотрудника MA в том случае, если необходима переаттестация нарушителю ниже 4 порядкового звания."],[6,"ДУ п. 1.2","Дисциплинарный устав ВС РО","1.2. Отработка дисциплинарных взысканий:\nПереаттестация (аттестация у отдела ВП, для 1-3 порядковых званий допустим отдел МА);\nВыговор (отработка по индивидуальному заданию, от сотрудника ВП или же Военной Апелляционной Администрации);\nПримечание: индивидуальные задания определяются сотрудниками MP, либо Генералитетом."],[6,"ДУ п. 1.3","Дисциплинарный устав ВС РО","1.3. При наличии хотя бы одного выговора, военно служащий не может:\nПолучить увольнение\nПолучить повышение\nПеревестись в другую государственную структуру"],[6,"ДУ п. 1.5","Дисциплинарный устав ВС РО","1.5. Военнослужащий подлежит увольнению за получение третьего говорова."],[6,"ДУ п. 1.6","Дисциплинарный устав ВС РО","1.6. Взыскания выдаются исключительно в соответствии с данным Уставом. | Устный/Строгий."],[6,"ДУ п. 1.7","Дисциплинарный устав ВС РО","1.7. Генерал и его Генерал-Полковник имеют право занести сотрудника в ЧС.\nИсключение: Сотрудники ВК могут отправлять только Академиков в черный список по причине не завершению военной службы."],[6,"ДУ п. 1.8","Дисциплинарный устав ВС РО","1.8 Генерал ВС РО имеет право на прямое помилование любого выговора, любому сотруднику на свое усмотрение.\nПримечание: Генерал ВС РО не может помиловать сотрудника если тот нарушил статьи настоящего закона и/или, по решению правительства."],[6,"ДУ п. 1.9","Дисциплинарный устав ВС РО","1.9 Выговоры можно обжаловать у Военной апелляционной администрации в течении 72 часов с выдачи взыскания\nПримечание: Любые взыскания можно обжаловать через высшие инстанции любому вышестоящему руководителю (вплоть до Премьер-министра)"],[6,"ДУ — Раздел 2","Дисциплинарный устав ВС РО","Раздел 2\nСтруктура Военной полиции"],[6,"ДУ п. 2.1","Дисциплинарный устав ВС РО · Раздел 2","2.1 Военная полиция - основная управляющее подразделение Армии РО, проводящие надзор и обучающую функцию всех военнослужащих."],[6,"ДУ п. 2.2","Дисциплинарный устав ВС РО · Раздел 2","2.2 Военная полиция осуществляет свои полномочия:\n- На территории воинской части и военных объектов.\n- На контрольно-пропускных пунктах и прилегающей охраняемой территории.\n- В местах проведения учений, операций и военных мероприятий.\n- В отношении военного транспорта, имущества и вооружения.\n- В отношении военнослужащих, находящихся при исполнении обязанностей военной службы.\n- За пределами воинской части, если военнослужащий совершает нарушение, находится в розыске либо его действия наносят ущерб репутации и безопасности армии.\n- При преследовании лица, скрывшегося с территории военного объекта.\n- Нахождение дезертиров внутри и вне военной части.\n- Принятие задержанных и передача их в МВД/ФСБ"],[6,"ДУ п. 2.3","Дисциплинарный устав ВС РО · Раздел 2","2.3 Военная полиция имеет право проводить надзорную деятельность над всеми сотрудниками Армии\nИсключение: Генералитет\nПримечание: При нарушении Генералитета, ВП может подать запрос на \"Военную Апелляционную администрацию\", для решения дела."],[6,"ДУ п. 2.4","Дисциплинарный устав ВС РО · Раздел 2","2.4 Ограничение полномочий\n2.4.1Военная полиция не подменяет гражданские правоохранительные органы."],[6,"ДУ п. 2.4.2","Дисциплинарный устав ВС РО · Раздел 2","2.4.2 За пределами военных объектов Военная полиция действует только в отношении военнослужащих, военного имущества либо при наличии непосредственной угрозы армии."],[6,"ДУ п. 2.4.3","Дисциплинарный устав ВС РО · Раздел 2","2.4.3 Военная полиция не вправе вмешиваться в управление подразделением, если действия командования не нарушают законодательство или настоящий Устав.\n2.4.4Сотрудники Военной полиции не вправе отменять приказы командования. При обнаружении незаконного приказа его исполнение может быть приостановлено,"],[6,"ДУ п. 2.4.5","Дисциплинарный устав ВС РО · Раздел 2","2.4.5 Военная полиция не вправе самостоятельно назначать наказания, не предусмотренные настоящим Уставом."],[6,"ДУ — РАЗДЕЛ 3","Дисциплинарный устав ВС РО","РАЗДЕЛ 3.\nВОЕННАЯ АПЕЛЛЯЦИОННАЯ АДМИНИСТРАЦИЯ\n1 Общие положения"],[6,"ДУ п. 3.1","Дисциплинарный устав ВС РО · РАЗДЕЛ 3","3.1 Военная апелляционная администрация, далее — ВАА, является постоянным независимым апелляционным органом, действующим внутри Вооружённых сил."],[6,"ДУ п. 3.2","Дисциплинарный устав ВС РО · РАЗДЕЛ 3","3.2 ВАА осуществляет проверку законности дисциплинарных взысканий, приказов, решений, действий и бездействия должностных лиц армии."],[6,"ДУ п. 3.3","Дисциплинарный устав ВС РО · РАЗДЕЛ 3","3.3 В своей деятельности ВАА руководствуется законодательством России Онлайн, настоящим Уставом, внутренними нормативными актами армии и принципами объективности, законности и справедливости."],[6,"ДУ п. 3.4","Дисциплинарный устав ВС РО · РАЗДЕЛ 3","3.4 ВАА не входит в структуру Военной полиции и не подменяет её следственные, патрульные или надзорные функции."],[6,"ДУ п. 3.5","Дисциплинарный устав ВС РО · РАЗДЕЛ 3","3.5 Решения ВАА, принятые в пределах её полномочий, обязательны для исполнения всеми военнослужащими независимо от их должности и воинского звания."],[6,"ДУ п. 3.6","Дисциплинарный устав ВС РО · РАЗДЕЛ 3","3.6 Все решения ВАА обязаны быть беспристрастными.\nАпелляция подаётся не позднее 72 часов с момента вынесения взыскания или получения информации о нарушении.\nПропущенный срок может быть восстановлен при наличии уважительной причины.\nПодача апелляции сама по себе не приостанавливает исполнение решения. Вопрос о временном приостановлении рассматривается руководством ВАА отдельно."],[6,"ДУ п. 3.2","Дисциплинарный устав ВС РО · РАЗДЕЛ 3","3.2 Задачи Военной апелляционной администрации\n\nК основным задачам ВАА относятся:"],[6,"ДУ п. 3.2.1","Дисциплинарный устав ВС РО · РАЗДЕЛ 3","3.2.1 Рассмотрение апелляций на дисциплинарные взыскания."],[6,"ДУ п. 3.2.2","Дисциплинарный устав ВС РО · РАЗДЕЛ 3","3.2.2 Рассмотрение жалоб на незаконные либо необоснованные действия командования."],[6,"ДУ п. 3.2.3","Дисциплинарный устав ВС РО · РАЗДЕЛ 3","3.2.3 Рассмотрение жалоб на действия или бездействие Военной полиции."],[6,"ДУ п. 3.2.4","Дисциплинарный устав ВС РО · РАЗДЕЛ 3","3.2.4 Разрешение служебных споров между военнослужащими, подразделениями и должностными лицами."],[6,"ДУ п. 3.2.5","Дисциплинарный устав ВС РО · РАЗДЕЛ 3","3.2.5 Проверка законности приказов, распоряжений, увольнений, понижений в должности или звании и иных кадровых решений."],[6,"ДУ п. 3.2.6","Дисциплинарный устав ВС РО · РАЗДЕЛ 3","3.2.6 Защита уставных прав военнослужащих."],[6,"ДУ п. 3.2.7","Дисциплинарный устав ВС РО · РАЗДЕЛ 3","3.2.7 Восстановление нарушенных прав и отмена решений, противоречащих Уставу."],[6,"ДУ п. 3.2.8","Дисциплинарный устав ВС РО · РАЗДЕЛ 3","3.2.8 Предупреждение злоупотребления должностными полномочиями со стороны командного состава."],[6,"ДУ п. 3.2.9","Дисциплинарный устав ВС РО · РАЗДЕЛ 3","3.2.9 Предоставление официальных разъяснений по вопросам применения настоящего Устава."],[6,"ДУ п. 3.2.10","Дисциплинарный устав ВС РО · РАЗДЕЛ 3","3.2.10 Проводить \"Военное дело\" где должны присутствовать, военнослужащий подающий апелляцию, военнослужащий выдавший наказание, и начальство подающего сотрудника.\n\n3 Военной апелляционной администрации запрещено:"],[6,"ДУ п. 3.3","Дисциплинарный устав ВС РО · РАЗДЕЛ 3","3.3 ВАА не вмешивается в непосредственное командование подразделениями и проведение военных операций."],[6,"ДУ п. 3.4","Дисциплинарный устав ВС РО · РАЗДЕЛ 3","3.4 ВАА не вправе самостоятельно осуществлять задержания, обыски и иные следственные мероприятия."],[6,"ДУ п. 3.5","Дисциплинарный устав ВС РО · РАЗДЕЛ 3","3.5 ВАА не подменяет Военную полицию и не проводит расследование вместо неё."],[6,"ДУ п. 3.6","Дисциплинарный устав ВС РО · РАЗДЕЛ 3","3.6 ВАА не рассматривает повторную жалобу, если по ней уже принято окончательное решение и заявителем не представлены новые доказательства."],[6,"ДУ — РАЗДЕЛ 4","Дисциплинарный устав ВС РО","РАЗДЕЛ 4\nВоеннослужащим запрещено"],[6,"ДУ п. 4.1","Дисциплинарный устав ВС РО · РАЗДЕЛ 4","4.1. Несоблюдение военной этики.\nНаказание: Выговор/Переаттестация"],[6,"ДУ п. 4.2","Дисциплинарный устав ВС РО · РАЗДЕЛ 4","4.2. Оскорблять любых гражданских, военнослужащих, государственных служащих.\nНаказание: Выговор/Переаттестация"],[6,"ДУ п. 4.3","Дисциплинарный устав ВС РО · РАЗДЕЛ 4","4.3. Выпрашивать ускоренное продвижение по службе у старшего состава.\nНаказание: Выговор/Понижение на 2 порядкового\n\n4.4.Хранить, употреблять и/или распространять запрещенные законодательством наркотические или психотропные вещества.\nНаказание: Выговор / Увольнение."],[6,"ДУ п. 4.5","Дисциплинарный устав ВС РО · РАЗДЕЛ 4","4.5. Запрещено использовать микрофон на плаце без веской причины\nНаказание: Выговор/понижение на 2 ранга/Увольнение"],[6,"ДУ п. 4.6","Дисциплинарный устав ВС РО · РАЗДЕЛ 4","4.6. Иметь связи с криминальными преступными группировками. При возникновении таких связей следует немедленно сообщить об этом вышестоящим военнослужащим.\nНаказание: Увольнение + список нежелательных лиц государственной структуры."],[6,"ДУ п. 4.7","Дисциплинарный устав ВС РО · РАЗДЕЛ 4","4.7. Использовать служебную технику не по назначению.\nНаказание: Выговор"],[6,"ДУ п. 4.8","Дисциплинарный устав ВС РО · РАЗДЕЛ 4","4.8. Продавать, отдавать табельное оружие любым посторонним лицам.\nНаказание: Увольнение + список нежелательных лиц государственной структуры."],[6,"ДУ п. 4.9","Дисциплинарный устав ВС РО · РАЗДЕЛ 4","4.9. Пропускать на территорию Военной части лиц, не имеющих доступа или не являющихся военнослужащими.\nНаказание: Выговор"],[6,"ДУ п. 4.10","Дисциплинарный устав ВС РО · РАЗДЕЛ 4","4.10. Игнорировать или нарушать приказы, отданные старшим составом. В том числе и построение.\nНаказание: Выговор/Переаттестация/Понижение\nПримечание: Если вы считаете приказ нарушающим здравый смысл, вы можете его не выполнять, а также обжаловать у Генерала, Генерала - полковника, старшего состава Военной полиции и в Офисе Министерства Юстиции."],[6,"ДУ п. 4.11","Дисциплинарный устав ВС РО · РАЗДЕЛ 4","4.11. Превышать полномочия.\nНаказание: Выговор/Увольнение/Понижение на 3 ранга"],[6,"ДУ п. 4.12","Дисциплинарный устав ВС РО · РАЗДЕЛ 4","4.12. Направлять и применять огнестрельное оружие в отношении безоружного лица.\nНаказание: Выговор.\nИсключение: угроза жизни и здоровья, нападение на охраняемую территорию / угроза жизни гражданских лиц / проникновение на территорию Военной Части / и иных случаях по действующим НПА."],[6,"ДУ п. 4.13","Дисциплинарный устав ВС РО · РАЗДЕЛ 4","4.13. Покидать территорию Военную-часть без разрешения.\nНаказание: Выговор/Увольнение.\nИсключение: Военнослужащие от звания сержант при одобренном увольнительном."],[6,"ДУ п. 4.14","Дисциплинарный устав ВС РО · РАЗДЕЛ 4","4.14. Передвигаться на личном транспорте по территории Военной части.\nНаказание: Выговор/Переаттестация\nИсключение: Генерал, Генерал-лейтенант, Генерал-майор, Ассистент Генерала. Разрешено для въезда на разрешенную парковку исходя из пункта \"4.16 ДУ\""],[6,"ДУ п. 4.15","Дисциплинарный устав ВС РО · РАЗДЕЛ 4","4.15. Запрещено, ставить/выбрасывать предметы не несущие никакого смысла на плацу\nНаказание: Выговор/Понижение на 3 ранг/увольнение"],[6,"ДУ п. 4.16","Дисциплинарный устав ВС РО · РАЗДЕЛ 4","4.16. Парковать личный транспорт разрешено, только на территории казарм\nНаказание: Выговор"],[6,"ДУ п. 4.17","Дисциплинарный устав ВС РО · РАЗДЕЛ 4","4.17. Обманывать, вводить в заблуждение старший состав Армии.\nНаказание: Выговор/Увольнение."],[6,"ДУ п. 4.18","Дисциплинарный устав ВС РО · РАЗДЕЛ 4","4.18. Разглашать военную тайну.\nНаказание: Увольнение/Увольнение + список нежелательных лиц государственной структуры.\nПримечание: Согласно УК."],[6,"ДУ п. 4.19","Дисциплинарный устав ВС РО · РАЗДЕЛ 4","4.19. Сотрудники до звания \"Сержант\" не могут быть переведены в другие подразделения.\nНаказание: Выговор/Увольнение\nИсключение: Генерал, Генерал-полковник имеют право \"зарезервировать\" человека на отдел со звания сержант\nПримечание: Если комсостав или генералитет, совершит перевод он также получает наказание по данному пункту."],[6,"ДУ п. 4.20","Дисциплинарный устав ВС РО · РАЗДЕЛ 4","4.20. Бездействие на территории Военной части.\nНаказание: Выговор/Увольнение.\nПримечание: Наказание в виде увольнения, выдается только Генералитетом\nИсключение: Генерал, Генерал-лейтенант, Генерал-майор, Ассистент Генерала.\nИсключение: Курилка"],[6,"ДУ п. 4.22","Дисциплинарный устав ВС РО · РАЗДЕЛ 4","4.22. Носить форму, не относящуюся к вашему подразделению.\nНаказание: Выговор/Понижение на 3 ранга/Увольнение\nПримечание:"],[6,"ДУ п. 4.22.1","Дисциплинарный устав ВС РО · РАЗДЕЛ 4","4.22.1 Запрещено носить погоны не своего звания:\nНаказание: Выговор\nПримечание:"],[6,"ДУ п. 4.23","Дисциплинарный устав ВС РО · РАЗДЕЛ 4","4.23. Проезжать через КПП 1 или 2, на личном транспорте без остановки для проверки документов или установления личности.\nИсключение: Генерал, Генерал - Полковник, Генерал - Лейтенант, Генерал-майор, а также общие мероприятия.\nНаказание: Выговор"],[6,"ДУ п. 4.24","Дисциплинарный устав ВС РО · РАЗДЕЛ 4","4.24. Халатность.\nНаказание: Выговор/Увольнение + список нежелательных лиц государственной структуры.\nПримечание: Под халатностью подразумевается любое отклонение от установленных уставом действий военнослужащего, неисполнение своих служебных обязанностей, а также нарушения федеральных и региональных статей УК."],[6,"ДУ п. 4.25","Дисциплинарный устав ВС РО · РАЗДЕЛ 4","4.25. Спать на посту/в строю.\nНаказание: Выговор/Понижение на 2 ранга"],[6,"ДУ п. 4.26","Дисциплинарный устав ВС РО · РАЗДЕЛ 4","4.26. Заступать в караул без полного снаряжения (бронежилет, оружие, бинты и др.)\nНаказание: Выговор."],[6,"ДУ п. 4.27","Дисциплинарный устав ВС РО · РАЗДЕЛ 4","4.27. Присваивать себе чужое имущество при проведении обыска.\nНаказание: Выговор/увольнение."],[6,"ДУ п. 4.28","Дисциплинарный устав ВС РО · РАЗДЕЛ 4","4.28. Общаться друг с другом во время построения.\nНаказание: Выговор\nИсключение: Обращение сотрудника(ов), проводящего(их) построение к Вам и наоборот"],[6,"ДУ п. 4.29","Дисциплинарный устав ВС РО · РАЗДЕЛ 4","4.29. Самовольно покидать строй.\nНаказание: Выговор/Увольнение."],[6,"ДУ п. 4.30","Дисциплинарный устав ВС РО · РАЗДЕЛ 4","4.30. Совершать какие-либо непристойные движения в строю, таких как танцы, разминки.\nНаказание: Понижение на 3 ранга/Увольнение."],[6,"ДУ п. 4.31","Дисциплинарный устав ВС РО · РАЗДЕЛ 4","4.31. Обгонять сформированную колонну.\nНаказание: Выговор.\nИсключение: Технические неполадки в одном из ведущих транспортных средств колонны, приказ, техника поддержки."],[6,"ДУ п. 4.32","Дисциплинарный устав ВС РО · РАЗДЕЛ 4","4.32. Отклоняться от маршрута ведущей колонну техники.\nНаказание: Выговор\nПримечание: Нужно следовать исключительно за ведущим колонны."],[6,"ДУ п. 4.33","Дисциплинарный устав ВС РО · РАЗДЕЛ 4","4.33. Использовать телефон в строю.\nНаказание: Выговор/Строгий выговор."],[6,"ДУ п. 4.34","Дисциплинарный устав ВС РО · РАЗДЕЛ 4","4.34. Несоблюдение субординации.\nНаказание: Выговор"],[6,"ДУ п. 4.35","Дисциплинарный устав ВС РО · РАЗДЕЛ 4","4.35. Запрещено нахождение на территории Военной части, в гражданской одежде, а также выполнение в ней своих должностных обязанностей.\nНаказание: Выговор.\nИсключения: Генерал, Генерал-полковник, Генерал-лейтенант, Генерал-майор, Или же если солдат покидает военную часть для разных нужд."],[6,"ДУ п. 4.36","Дисциплинарный устав ВС РО · РАЗДЕЛ 4","4.36. Запрещено отсутствие на рабочем посту сроком более 5 дней без оповещения руководства.\nНаказание: Увольнение."],[6,"ДУ п. 4.37","Дисциплинарный устав ВС РО · РАЗДЕЛ 4","4.37. Пользоваться летной техникой могут только ВВС, военнослужащие других подразделений , у которых есть одобрение на доступ к летной технике, Комсостав от подполковника подразделения и выше.\nПояснение: Если происходит нехватка воздушной техники, то приоритет отдается Пилотам ВВС.\nНаказание: Выговор."],[6,"ДУ п. 4.38","Дисциплинарный устав ВС РО · РАЗДЕЛ 4","4.38. Запрещено класть личные вещи/мусор на склад Военной базы.\nНаказание: Выговор/Увольнение\nПримечание: Увольнение выдается на усмотрение сотрудника(ков) проверяющего(их) склад, и только за нелегальные предметы, помещенные на склад.\nПод \"личные вещи/мусор\" подразумевается все что не несет никакой практичности для использования в Военной части. (Рыбацкие принадлежности, одежда, еда, электрические приборы и тп)"],[6,"ДУ п. 4.39","Дисциплинарный устав ВС РО · РАЗДЕЛ 4","4.39. Запрещена Выдача взысканий другим отделам.\nНаказание: Выговор/Снятие с должности /Увольнение.\nИсключения: Отдел Военная полиция, Генерал, Генерал, Генерал-полковник, Генерал-лейтенант."],[6,"ДУ п. 4.40","Дисциплинарный устав ВС РО · РАЗДЕЛ 4","4.40. Запрещено вмешательство в работу других отделов.\nНаказание: Строгий Выговор/Снятие с должности /Увольнение.\nИсключения: Генерал, Генерал Полковник, Генерал-Лейтенант, отдел Военная полиция - только для пресечения нарушения."],[6,"ДУ п. 4.41","Дисциплинарный устав ВС РО · РАЗДЕЛ 4","4.41. Запрещено самостоятельно покидать канал специальной связи Армии.\nНаказание: Выговор/Увольнение."],[6,"ДУ п. 4.42","Дисциплинарный устав ВС РО · РАЗДЕЛ 4","4.42. Запрещено военнослужащим нахождение на территории казино, в случае установления данного факта военнослужащие несут ответственность согласно настоящему ДУ.\nИсключение: одобренное увольнительное время, отпуск, конец рабочего дня."],[6,"ДУ п. 4.43","Дисциплинарный устав ВС РО · РАЗДЕЛ 4","4.43. Запрещено некорректное оформление документов, любой отчетности.\nНаказание: Устное предупреждение/Выговор"],[6,"ДУ п. 4.44","Дисциплинарный устав ВС РО · РАЗДЕЛ 4","4.44. Запрещено \"засорять\" склад Армии сломанной амуницией, а именно: тяжелыми бронежилетами, прочность которых ниже 90%, легкими бронежилетами, прочность которых ниже 40%.\nНаказание: Выговор"],[6,"ДУ п. 4.45","Дисциплинарный устав ВС РО · РАЗДЕЛ 4","4.45 Запрещено не уставное общение на плацу, посту согласно 3.7 УВС.\nНаказание: Устное предупреждение/Выговор\nПримечание: Данный пункт подразумевает, более жесткий контроль за соблюдением уставного общения в местах массового скопления людей. Вне КПП, Плацу военнослужащие так же обязаны общаться по уставу."],[6,"ДУ п. 4.46","Дисциплинарный устав ВС РО · РАЗДЕЛ 4","4.46. По территории военной части разрешен скоростной лимит на ТС в 45 км/ч\nНаказание: Выговор\nИсключение: Поставка"],[6,"ДУ п. 4.47","Дисциплинарный устав ВС РО · РАЗДЕЛ 4","4.47. Иметь растительность на голове выше 3 мм.\nПримечание: При поступлении в военную часть, сотрудник выдающий контракт о службе должен постричь или же отвезти новобранца в парикмахерскую, по его решению.\nИсключение: Девушки обязаны иметь аккуратную заплетенную стрижку"],[6,"ДУ п. 4.48","Дисциплинарный устав ВС РО · РАЗДЕЛ 4","4.48. Любое мошенничество или обман в кадровых/секретарь отчетах. Исходя из пунктов Главы 7 (УВС)\nНаказание: Увольнение/ Снятие с должности / Увольнение + список нежелательных лиц государственной структуры."],[6,"ДУ п. 4.49","Дисциплинарный устав ВС РО · РАЗДЕЛ 4","4.49 Запрещена продажа военных билетов, блат для быстрого проведение КМБ для получения военных билетов.\nНаказание: Увольнение/ Снятие с должности / Увольнение + список нежелательных лиц государственной структуры."],[6,"ДУ п. 4.50","Дисциплинарный устав ВС РО · РАЗДЕЛ 4","4.50 Игнорирование запроса на появление на дело от \"ВАА\" от 2 дней.\nНаказание: Увольнение/Увольнение + список нежелательных лиц государственной структуры.\nИсключение: Уважительная причина неявки, заранее предупреждение ВАА или сотрудника ВП который пишет дело."],[6,"ДУ п. 4.51","Дисциплинарный устав ВС РО · РАЗДЕЛ 4","4.51 Запрещено во время разгрузки, загрузки материалов, отходить от грузовиков на расстояние больше 3 метров.\nНаказание: Увольнение/Увольнение + список нежелательных лиц государственной структуры.\nПримечание: Под этот пункт подпадает, любое взаимодействие с материалами без общей колоны и приказа взаимодействовать с материалами"],[7,"УВС — общие положения","Устав внутренней службы ВС РО","Устав внутренней службы Вооруженных Сил России Онлайн\nНастоящий Устав определяет права и обязанности Военнослужащих Вооруженных Сил России Онлайн (далле. ВС РО) и взаимоотношения между ними, обязанности основных должностных лиц ВС РО и её подразделений, а также правила внутреннего порядка.\n\nУставом внутренней службы руководствуются все военнослужащие ВС РО. Положения устава, обязанности всех военнослужащих, независимо от подразделений, в равной степени относятся ко всем существующим и предусмотренными уставом подразделениями.\nОбязанности должностных лиц, не указанных в Уставе, определяются соответствующими положениями, наставлениями, инструкциями и руководствами округа."],[7,"УВС — РАЗДЕЛ 1","Устав внутренней службы ВС РО","РАЗДЕЛ 1\nОБЩИЕ ПОЛОЖЕНИЯ"],[7,"УВС п. 1.1","Устав внутренней службы ВС РО · РАЗДЕЛ 1","1.1. Военная служба - особый вид государственной службы, представляющий собой профессиональную служебную деятельность граждан РО на воинских должностях в ВС РО, осуществляющих функции по обеспечению обороны и безопасности России Онлайн"],[7,"УВС п. 1.2","Устав внутренней службы ВС РО · РАЗДЕЛ 1","1.2. Требования Устава внутренней службы обязан знать и добросовестно выполнять каждый военнослужащий."],[7,"УВС п. 1.3","Устав внутренней службы ВС РО · РАЗДЕЛ 1","1.3. Военнослужащий - лицо, исполняющее должностные обязанности, связанные с прохождением воинской службы по контракту в рядах ВС РО.\nВ начале прохождения военной службы военнослужащий нуждается в особом внимании. Строгий контроль со стороны подразделений в особенности Военного Комитет (Далее ВК) и входящих в него инструкторов, их личный пример помогают военнослужащему быстрее осознать требования внутренней службы."],[7,"УВС п. 1.4","Устав внутренней службы ВС РО · РАЗДЕЛ 1","1.4. Каждому военнослужащему присваивается определенное воинское звание и ранг, полученное в соответствии с ранговой таблицей и системой повышений каждого подразделения в ВС РО"],[7,"УВС п. 1.5","Устав внутренней службы ВС РО · РАЗДЕЛ 1","1.5. Уставы ВС РО подразумевают соблюдение законов России Онлайн, всеми военнослужащими без исключения, независимо от звания и их обязанностей."],[7,"УВС п. 1.6","Устав внутренней службы ВС РО · РАЗДЕЛ 1","1.6. Уставы и правила подразделений, иных воинских формирований и ВС РО не должны противоречить уставу внутренней службы."],[7,"УВС п. 1.7","Устав внутренней службы ВС РО · РАЗДЕЛ 1","1.7. Незнание уставов ВС РО и законодательства РО не освобождает военнослужащего от ответственности."],[7,"УВС п. 1.8","Устав внутренней службы ВС РО · РАЗДЕЛ 1","1.8. Запрещено пользоваться уязвимостью уставов ВС РО с целью уйти от ответственности."],[7,"УВС п. 1.9","Устав внутренней службы ВС РО · РАЗДЕЛ 1","1.9. Военнослужащий в служебной деятельности руководствуется уставами и письменными законодательными актами и другими нормативными правовыми актами России Онлайн."],[7,"УВС — Раздел 2","Устав внутренней службы ВС РО","Раздел 2\nИерархия И Структура Вооруженных Сил России Онлайн"],[7,"УВС п. 2.1","Устав внутренней службы ВС РО · Раздел 2","2.1 Подразделения ВС РО\nВоенный комиссариат (ВК) — Подразделение, руководящее военным комиссариатом и отвечающее за воинский учёт, призыв, мобилизационную подготовку и взаимодействие с призывниками. Имеют право принимать и отказывать в выдаче контракта, равно как и любой генералитет.\n\nВоенная Полиция (ВП) - специальное подразделение Вооружённых сил, предназначенное для поддержания правопорядка и воинской дисциплины, охраны военных объектов, предотвращения и пресечения правонарушений, а также обеспечения безопасности военнослужащих. Решения и законные требования сотрудников военной полиции обязательны для исполнения всеми военнослужащими.\n\nВоенно воздушные силы (ВВС) - Подразделение Вооружённых сил, предназначенный для защиты воздушного пространства государства, ведения воздушной разведки, поражения наземных и воздушных целей, перевозки личного состава и техники, а также авиационной поддержки сухопутных подразделений.\nВоздушные дистный\n\nВоенно-медицинская служба (ВМС) — специальное подразделение Вооружённых сил, предназначенное для оказания медицинской помощи военнослужащим, эвакуации и лечения раненых, проведения профилактических мероприятий, контроля санитарного состояния подразделений и сохранения здоровья личного состава.\n\nСилы специальных операций (ССО) — специально подготовленные подразделения Вооружённых сил, предназначенные для выполнения особо сложных и важных боевых задач, проведения разведывательных, диверсионных, антитеррористических и иных специальных операций, в том числе в глубоком тылу противника.\n\nГруппа быстрого реагирования (ГБР) — специально подготовленное мобильное подразделение, предназначенное для оперативного выезда на чрезвычайные происшествия, пресечения правонарушений, задержания вооружённых лиц, усиления охраны объектов и оказания поддержки другим подразделениям.\n\nВоенно-постовая служба (ВПС) — подразделение, предназначенное для несения службы на контрольно-пропускных пунктах и охраняемых постах, проверки документов и транспорта, контроля пропускного режима, охраны военных объектов и предотвращения несанкционированного проникновения.\n\nАкадемия - учебное подразделение, в котором рядовые военнослужащие проходят начальную военную подготовку, изучают устав, осваивают основные навыки службы и сдают экзамены для дальнейшего распределения по подразделениям.\n\nКурс молодого бойца (КМБ) — программа начальной подготовки академиков, включающая изучение воинского устава, строевую и физическую подготовку, правила обращения с оружием, основы тактики и дисциплины. По окончании КМБ военнослужащие сдают экзамен и допускаются к выдаче военного билета."],[7,"УВС п. 2.2","Устав внутренней службы ВС РО · Раздел 2","2.2. Во главе ВС РО стоит Генерал - высшее должностное лицо ВС РО."],[7,"УВС п. 2.3","Устав внутренней службы ВС РО · Раздел 2","2.3 Воинские звания\nГенерал армии\n18\tГенерал-полковник\n17\tГенерал-лейтенант\n16\tГенерал-майор\n15\tПолковник\n14\tПодполковник\n13\tМайор\n12\tКапитан\n11\tСтарший лейтенант\n10\tЛейтенант\n9\tМладший лейтенант\n8\tСтарший прапорщик\n7\tПрапорщик\n6\tСтаршина\n5\tСтарший сержант\n4\tСержант\n3\tМладший сержант\n2\tЕфрейтор\n1\tРядовой"],[7,"УВС п. 2.4","Устав внутренней службы ВС РО · Раздел 2","2.4 Высшим командованием ВС РО являются:\n\nГенералитет:\n• Генерал армии;\n• Генерал-полковник;\n• Генерал-лейтенант;\n• Генерал-майор.\n\nКомсостав:\nПолковник\nПодполковник\n\nПолковник - является непосредственным руководителем личного состава подразделения.\n\nПодполковник замещает Полковника в его отсутствие имеет равные полномочия к управлению личного состава.\n\nМайор - Инструктор своего подразделения осуществляют функции подготовки и обучения.\nИнструктор не приобретает самостоятельного общего командования подразделением исключительно в силу занимаемой должности.\n\nКапитан - Прямое начальство любого призывника академии"],[7,"УВС п. 2.5","Устав внутренней службы ВС РО · Раздел 2","2.5 Иерархия управления и соответствие должностей внутри ВС РО\nГенерал армии\n↓\nГенерал-полковник\n↓\nГенерал-лейтенант\n↓\nГенерал-майор\n↓\nПолковник - Командир подразделения\n↓\nПодполковник - Заместитель Командира подразделения\n↓\nМайор - Инструктор\n↓\nКапитан - Инструктор ВК\n↓\nЛичный состав"],[7,"УВС п. 2.5.1","Устав внутренней службы ВС РО · Раздел 2","2.5.1 Иерархия обращений по вопросам является зеркальной от пункта 2.5 УВС."],[7,"УВС — ГЛАВА 3","Устав внутренней службы ВС РО","ГЛАВА 3\nСУБОРДИНАЦИЯ"],[7,"УВС п. 3.1","Устав внутренней службы ВС РО · ГЛАВА 3","3.1. Субординация — это система иерархических отношений, определяющая порядок подчинения военнослужащих своим командирам, в рамках которой уважается военно-служебная дисциплина, выполнение приказов и выполнение служебных обязанностей в соответствии с установленными нормами и требованиями."],[7,"УВС п. 3.2","Устав внутренней службы ВС РО · ГЛАВА 3","3.2. В рамках субординации каждый военнослужащий обязан следовать указаниям и распоряжениям, данным его непосредственным начальством в соответствии с установленными полномочиями."],[7,"УВС п. 3.3","Устав внутренней службы ВС РО · ГЛАВА 3","3.3. Субординация распространяется на все сферы военной деятельности, включая выполнение боевых задач, поддержание военной дисциплины, соблюдение уставов и правил поведения, а также выполнение служебных обязанностей."],[7,"УВС п. 3.4","Устав внутренней службы ВС РО · ГЛАВА 3","3.4. Воинская дисциплина представляет собой строгое соблюдение военнослужащими установленных правил и обязанностей, основанных на личной ответственности, уважении к чести, верности Военной присяге и Конституции России Онлайн, обеспечивая выполнение служебных задач и соблюдение правовых норм в любых условиях."],[7,"УВС п. 3.5","Устав внутренней службы ВС РО · ГЛАВА 3","3.5. В случае возникновения разногласий или вопросов по поводу исполнения приказов или распоряжений, военнослужащий имеет право обратиться к вышестоящему начальству или к административным органам военной службы для разрешения конфликтных ситуаций или получения разъяснений."],[7,"УВС п. 3.6","Устав внутренней службы ВС РО · ГЛАВА 3","3.6. Нарушение принципов субординации может повлечь за собой дисциплинарные меры в соответствии с военным законодательством и внутренними правилами Вооруженных Сил."],[7,"УВС п. 3.7","Устав внутренней службы ВС РО · ГЛАВА 3","3.7. Общение со старшим по званию:\n\nОбращение: \"Товарищ \"Звание\" \"Фамилия\", разрешите ...\";\n\nПример: \"Товарищ Полковник “Фамилия”, разрешите обратиться по вопросу моего отгула\";\n\nСогласие: \"Так точно\";\n\nНесогласие: \"Никак нет”\n\nВыполнение приказа: \"Есть\"\n\nНезнание ответа на вопрос: “Не могу знать!”\n\nИзвинения: “Виноват, исправлюсь”;\n\nПриветствия распространяются как на старший состав так и на общение с любым человеком вне зависимости от должности, структуры и т.д.\n\nПриветствие: “Здравия желаю, Лука Юдин!.”\n\nПри обращении к человеку используя слово “Гражданин”."],[7,"УВС п. 3.8","Устав внутренней службы ВС РО · ГЛАВА 3","3.8. Общение с младшим по званию.\nЗапрещено любые внеуставные отношения между военнослужащими. Комсоставу и Генералитету допускается обращаться к младшему на “Ты”\nПример: “Сержант Тарасов, выйти из строя!”"],[7,"УВС п. 3.9","Устав внутренней службы ВС РО · ГЛАВА 3","3.9. Общение с гражданскими.\nГражданским лицом считается каждый, кто одет в гражданскую одежду, т.е. не по форме гос. структур. Запрещено использовать нецензурную брань, оскорбления, применение силы без какой-либо угрозы для воинской части, своей жизни или жизни сослуживца.\nСо всеми гражданскими лицами общаться с применение слов: “Гражданин” или же “Гражданка”"],[7,"УВС п. 3.10","Устав внутренней службы ВС РО · ГЛАВА 3","3.10 Генералитету и Комсоставу разрешается использование ненормативной лексики исключительно в служебных целях: для оперативной отдачи приказов в критических ситуациях, пресечения грубых нарушений воинской дисциплины и усиления строгости предупреждения, либо в обучающих целях для повышения \"нервной устойчивости\". Использование ненормативной лексики с целью личного оскорбления, унижения военнослужащего или без служебной необходимости запрещается."],[7,"УВС п. 3.11","Устав внутренней службы ВС РО · ГЛАВА 3","3.11 Исполнение приказа\n1. Законный приказ подлежит исполнению.\n2. Приказ должен находиться в пределах полномочий лица, его отдающего.\n3. При невозможности исполнения приказа военнослужащий обязан незамедлительно доложить руководству!\n4. Приказ, явно противоречащий Конституции, федеральному законодательству либо превышающий полномочия отдавшего его лица, не может рассматриваться как законный только в силу занимаемой должности."],[7,"УВС — РАЗДЕЛ 4","Устав внутренней службы ВС РО","РАЗДЕЛ 4\nПРАВА И ОБЯЗАННОСТИ ВОЕННОСЛУЖАЩИХ"],[7,"УВС п. 4.1","Устав внутренней службы ВС РО · РАЗДЕЛ 4","4.1. Военнослужащий обязан:"],[7,"УВС п. 4.1.2","Устав внутренней службы ВС РО · РАЗДЕЛ 4","4.1.2. Честно и добросовестно исполнять свой долг перед Россией Онлайн и его жителями, защищая имущество государства, а также его границы и жизни граждан;"],[7,"УВС п. 4.1.3","Устав внутренней службы ВС РО · РАЗДЕЛ 4","4.1.3. С гордостью превозмогать все тяготы и лишения военной службы;"],[7,"УВС п. 4.1.4","Устав внутренней службы ВС РО · РАЗДЕЛ 4","4.1.4. Соблюдать Устав и законодательство РО, беспрекословно следуя им. Военнослужащий не имеет право препятствовать деятельности МВД/ГИБДД/ФСБ и другим силовым структурам РО, если их деятельность не нарушает законодательство РО;"],[7,"УВС п. 4.1.5","Устав внутренней службы ВС РО · РАЗДЕЛ 4","4.1.5. Знать и соблюдать Устав Внутренней Службы, а также устав подразделения, к которому он относится;"],[7,"УВС п. 4.1.6","Устав внутренней службы ВС РО · РАЗДЕЛ 4","4.1.6. Знать в лицо Генералитет Армии РО."],[7,"УВС п. 4.1.7","Устав внутренней службы ВС РО · РАЗДЕЛ 4","4.1.7. Вести фото/видео фиксацию всех происшествий, происходящих во время службы;"],[7,"УВС п. 4.1.8","Устав внутренней службы ВС РО · РАЗДЕЛ 4","4.1.8. Хранить военную тайну о расположении, передвижении или составе военнослужащих Военной части или имущества, принадлежащего Армии ВС РО, а также внутренние процедуры, коды и персональную информацию;"],[7,"УВС п. 4.1.9","Устав внутренней службы ВС РО · РАЗДЕЛ 4","4.1.9. Соблюдать субординацию, вести общение, учитывая нормы этического кодекса;"],[7,"УВС п. 4.1.10","Устав внутренней службы ВС РО · РАЗДЕЛ 4","4.1.10. Брать технику, закрепленную за своим подразделением и бережно относиться к ней, остальная техника с запроса."],[7,"УВС п. 4.1.11","Устав внутренней службы ВС РО · РАЗДЕЛ 4","4.1.11. Находиться на территории Военной части до окончания рабочего дня. Рабочим временем считается время с 10:00 до 23:00.\nИсключение: Спец. операции, увольнительное время, патрули, приказ Штаб состава;"],[7,"УВС п. 4.1.12","Устав внутренней службы ВС РО · РАЗДЕЛ 4","4.1.12. В рабочее время или во время исполнения своих должностных обязанностей носить форму только своего подразделения.\nИсключение: Спец. операции, тренировка, приказ Штаб состава;"],[7,"УВС п. 4.1.13","Устав внутренней службы ВС РО · РАЗДЕЛ 4","4.1.13. Использовать только табельное снаряжение, выдаваемое со склада ВС РО и имеющее маркировку «Армия» или оружие которое Армии получил по обмену."],[7,"УВС п. 4.1.14","Устав внутренней службы ВС РО · РАЗДЕЛ 4","4.1.14. Ношение табельного снаряжения обязательно в рабочее время."],[7,"УВС п. 4.1.15","Устав внутренней службы ВС РО · РАЗДЕЛ 4","4.1.15. Военнослужащий обязан оставлять еженедельный отчет о проделанной работе по приказу Генералитета и Комсостава"],[7,"УВС п. 4.2","Устав внутренней службы ВС РО · РАЗДЕЛ 4","4.2. Военнослужащий имеет право:"],[7,"УВС п. 4.2.1","Устав внутренней службы ВС РО · РАЗДЕЛ 4","4.2.1. Задерживать лиц, совершивших противозаконные действия, либо создающих угрозу такого совершения на территории Военной части и в его близи с дальнейшей передачей задержанного силовым структурам: МВД/ФСБ."],[7,"УВС п. 4.2.2","Устав внутренней службы ВС РО · РАЗДЕЛ 4","4.2.2. На увольнительное время в соответствии с Уставом;"],[7,"УВС п. 4.2.3","Устав внутренней службы ВС РО · РАЗДЕЛ 4","4.2.3. На «Перекур» в специально отведенное для этого место."],[7,"УВС п. 4.2.4","Устав внутренней службы ВС РО · РАЗДЕЛ 4","4.2.4. Носить маски в рабочее время, являющимися частью формы, утвержденные Уставом внутренней службы либо положением об ВС РО. В общественных местах и в рабочее время разрешено ношение масок. Военнослужащему запрещено ношение служебных масок вне рабочее время, а также при общении с высшими представителями Правительства, а именно Премьер-министр, Вице-премьер министр, Министр обороны, его заместители.\nИсключение: Во время спец. операции\nИсключение 2: На всеобщих войсковых построениях, ношении масок разрешено только подразделению ССО, ВВС, ГБР."],[7,"УВС п. 4.2.5","Устав внутренней службы ВС РО · РАЗДЕЛ 4","4.2.5. Для поощрения личного состава, за старание и инициативу, проявленную при несении службы, а также при выполнении специальных задач, к военнослужащим могут применяться следующие виды поощрений:\n- Награждаться воинскими медалями за несение военной службы;\n- Благодарность – выдается военнослужащему за успехи в службе, посредством проделанной работы на усмотрение Генералитет состава;\n- Премия – выдаётся Генералитетом составом, за успехи в службе в виде денежного вознаграждения, зависящем от проделанной работы, продолжительности службы в ВС РО."],[7,"УВС п. 4.2.6","Устав внутренней службы ВС РО · РАЗДЕЛ 4","4.2.6. На отпуск длительностью не более 7 суток в 1 месяц, при наличии одобрения от Ком состава, в соответствии с правилами подачи заявления на отпуск, военнослужащий, находящийся в отпуске, обязан явиться на построение, при ЧП или построениях от Генерала и Генерал - Полковника."],[7,"УВС п. 4.2.7","Устав внутренней службы ВС РО · РАЗДЕЛ 4","4.2.7. Военнослужащий может взять обед-перерыв, длительностью не более 2 часов в день. Также, военнослужащий, находящийся в отпуске, обязан явиться на построение, при ЧП или построениях от Генерала и Генерал-Лейтенанта."],[7,"УВС п. 4.2.8","Устав внутренней службы ВС РО · РАЗДЕЛ 4","4.2.8. Пользоваться всем принадлежащим ВС РО имуществом в порядке и пределах, установленных настоящим Законом и Уставом;"],[7,"УВС п. 4.2.9","Устав внутренней службы ВС РО · РАЗДЕЛ 4","4.2.9 Использовать лишь уставную форму, которая закрепленная в этой таблице:"],[7,"УВС п. 4.3","Устав внутренней службы ВС РО · РАЗДЕЛ 4","4.3. Военнослужащий имеет право применять оружие в следующих случаях:\n— защита граждан, военнослужащих и должностных лиц государственных органов;\n— пресечение попытки завладеть оружием, спецсредствами, боеприпасами, боевой, специальной и иной техники;\n— освобождение заложников, пресечение террористических и иных преступных посягательств;\n— при проникновении на территорию Военной части с использованием транспортного средства;\n— при проникновении лица на территорию Военной части, в руках или за спиной которого располагается огнестрельное оружие;\n— с момента нападения на Военной части и до полного устранения угрозы для охраняемой военной базы \"Военной части\";\n— при несанкционированном проникновение и нахождение в воздушном пространстве Военной части;\n— иные основания, предусмотренные законодательством."],[7,"УВС п. 4.4","Устав внутренней службы ВС РО · РАЗДЕЛ 4","4.4 Каждый военно служащий имеет право на обжалование своего наказания у \"Апелляционной администрации\"."],[7,"УВС — РАЗДЕЛ 4","Устав внутренней службы ВС РО","РАЗДЕЛ 4\nРабочий день\n\n- Будние дни с 10:00 до 23:00;\n- Выходные с 10:00 до 22:00;\n- Праздничные дни с 13:00 до 22:00; (лишь государственные праздники)"],[7,"УВС п. 2.2","Устав внутренней службы ВС РО · РАЗДЕЛ 4","2.2. Служебная деятельность военнослужащих не прекращается даже после завершения служебного дня. Каждый военнослужащий может быть вызван из отгула, во внеслужебное время, (по решению Генеральского состава) за исключением отпускного времени (в мирное время) для исполнения воинской и служебной обязанности с возможностью получения дополнительного времени на отдых по мере завершения выполнения поставленной задачи."],[7,"УВС п. 2.3","Устав внутренней службы ВС РО · РАЗДЕЛ 4","2.3. Ежедневно, в 22:00, проводится вечерний рапорт, на которой обязуется присутствовать каждый военнослужащий. Вечерняя рапорт может быть смещена исключительно по решению Генерала и Генералов-Лейтенанта. Неявка на вечерний рапорт - строгое нарушение воинской дисциплины.\nПримечание: На время проведения вечернего рапорта все постовые, в том числе дежурные обязаны покинуть свой пост."],[7,"УВС п. 2.4","Устав внутренней службы ВС РО · РАЗДЕЛ 4","2.4. В зависимости от определенных обстоятельств, Генерал вправе своим приказом вносить временные корректировки в служебный график."],[7,"УВС п. 2.5","Устав внутренней службы ВС РО · РАЗДЕЛ 4","2.5. Военнослужащие со звания Сержант имеют право на увольнительную раз в сутки длительностью 60 минут, за исключением времени начала проверки вечернего рапорта.\nИсключение: Военнослужащие со звания Подполковник обязуются соблюдать круглосуточный режим работы, имеют ненормированный служебный день и могут покидать территорию воинской части по личным делам вне служебной формы независимо от увольнительного времени с устного разрешения Генерала."],[7,"УВС — РАЗДЕЛ 5","Устав внутренней службы ВС РО","РАЗДЕЛ 5\nВоинская присяга\nЯ, (фамилия, имя), торжественно присягаю на верность своему Отечеству - России\nКлянусь свято соблюдать Конституцию Российской Онлайн, строго выполнять требования воинских уставов, приказы командиров и начальников.\nКлянусь достойно исполнять воинский долг, мужественно защищать свободу, независимость и конституционный строй России, народ и Отечество."],[7,"УВС — Раздел 6","Устав внутренней службы ВС РО","Раздел 6.\nКАДРОВАЯ ОТЧЕТНОСТЬ"],[7,"УВС п. 6.1","Устав внутренней службы ВС РО · ЧАСТЬ 1. ОТЧЕТНОСТЬ","6.1. Все отчеты необходимо составлять строго по форме."],[7,"УВС п. 6.2","Устав внутренней службы ВС РО · ЧАСТЬ 1. ОТЧЕТНОСТЬ","6.2. Запрещено удалять отчеты, редактировать заявления после отправки.\nПримечание: Запрещено редактировать сроки отпуска, после его одобрения.\nИсключение: Если вы сами заметили, что не правильно оставили отчёт, вы можете его удалить и создать новый, чтобы не получить наказание."],[7,"УВС п. 6.1.3","Устав внутренней службы ВС РО · ЧАСТЬ 1. ОТЧЕТНОСТЬ","6.1.3. Военнослужащие званием Подполковник и Полковник, обязаны подавать еженедельный отчёт на премирование на имя куратора подразделения."],[7,"УВС п. 6.1.4","Устав внутренней службы ВС РО · ЧАСТЬ 1. ОТЧЕТНОСТЬ","6.1.4. Каждый военнослужащий подразделения, должен оставлять недельный отчёт вне зависимости от количества проделанной работы.\nПримечание: Выполнив норму и оставив отчёт сотрудник получит премию и дополнительную премию. Не выполнив норму, но оставив отчëт сотрудник получит только премию. Норма устанавливается командирами каждого из подразделений индивидуально, и утверждается приказом командира бригады."],[7,"УВС п. 6.2.1","Устав внутренней службы ВС РО · ЧАСТЬ 2. ПОВЫШЕНИЯ СОТРУДНИКОВ","6.2.1. Для получения повышения в должности военнослужащий не должен иметь активных дисциплинарных взысканий."],[7,"УВС п. 6.2.2","Устав внутренней службы ВС РО · ЧАСТЬ 2. ПОВЫШЕНИЯ СОТРУДНИКОВ","6.2.2. Повышение военнослужащий проходит строго по системе повышения своего подразделения."],[7,"УВС п. 6.2.3","Устав внутренней службы ВС РО · ЧАСТЬ 2. ПОВЫШЕНИЯ СОТРУДНИКОВ","6.2.3. Запрещено обходить систему повышений. Любая попытка использовать в новых отчетах старые фото, видеофиксации или как либо видоизменять ранее использованные фотокарточки."],[7,"УВС п. 6.2.4","Устав внутренней службы ВС РО · ЧАСТЬ 2. ПОВЫШЕНИЯ СОТРУДНИКОВ","6.2.4. Повышение военнослужащего производится по представлению непосредственного Полковнику подразделения и его заместителей, согласованному с вышестоящим командованием."],[7,"УВС п. 6.2.5","Устав внутренней службы ВС РО · ЧАСТЬ 2. ПОВЫШЕНИЯ СОТРУДНИКОВ","6.2.5. Военнослужащему запрещено использовать материалы из своих/чужих предыдущих отчётов в новый отчет для получения должности/звания, а также любые махинации с подделкой материалов отчёта."],[7,"УВС п. 6.2.6","Устав внутренней службы ВС РО · ЧАСТЬ 2. ПОВЫШЕНИЯ СОТРУДНИКОВ","6.2.6. Все повышения проходят исключительно сразу после вечерней поверки.\nИсключение: Регламент повышения определяет Командир (начальник ) подразделения. Повышение в иное время может быть выдано по согласованию с Командиром бригады и (или) с его заместителями."],[7,"УВС п. 6.2.7","Устав внутренней службы ВС РО · ЧАСТЬ 2. ПОВЫШЕНИЯ СОТРУДНИКОВ","6.2.7. Военнослужащие назначенные на должность командиров подразделений, заместителей командиров подразделений, генерал-полковники, генерал-лейтенанты, генерал майоры, комсостав, проходят испытательный срок продолжительностью от 14 до 21 дня."],[7,"УВС п. 6.2.8","Устав внутренней службы ВС РО · ЧАСТЬ 2. ПОВЫШЕНИЯ СОТРУДНИКОВ","6.2.8. В случае если испытательный срок не был пройден то военнослужащий возвращается на ранее занимаемое звание и должность. В случаях, если командиры подразделений считают целесообразным то возможно зачисление в списки личного состава без подразделения."],[7,"УВС — Раздел 7","Устав внутренней службы ВС РО","Раздел 7\nОбщие положения построения\nПостроение — организованный сбор личного состава армии в установленном месте (Плацу) для проверки присутствия, доведения приказов, подведения итогов, распределения задач, проведения награждений, назначений, инструктажей или проверки внешнего вида.\nТребования настоящего раздела распространяются на всех военнослужащих, находящихся на службе в момент объявления построения."],[7,"УВС п. 7.1","Устав внутренней службы ВС РО · Раздел 7","7.1 Общее построение всей армии вправе объявить:\nГенерал армии РО.\nГенералитет армии.\nКомсостав - вправе провести построение для своего подразделения\nДежурный офицер при чрезвычайной ситуации, нападении на военный объект, массовом нарушении порядка или объявлении боевой тревоги.\nПример объявления общего построения:\n\nПример объявления общего построения:\n«Внимание всему личному составу! Объявляется общее построение армии на плацу. Время на прибытие — 10 минут. Форма одежды — (повседневная), оружие убрать. Командирам подразделений подтвердить получение приказа и обеспечить сбор личного состава».\n\nПример объявления построения подразделения:\n«Военная полиция, общее построение подразделения на плацу, в расположении ВП. Время на прибытие — 5 минут.».\n\nПример объявления экстренного построения:\n«Внимание всему личному составу! Экстренное построение на плацу. Прибыть незамедлительно, в боевой форме. Командирам подразделений доложить о готовности»."],[7,"УВС п. 7.2","Устав внутренней службы ВС РО · Раздел 7","7.2 Время на прибытие назначает сам ведущий построения"],[7,"УВС п. 7.3","Устав внутренней службы ВС РО · Раздел 7","7.3 Порядок проведения вечернего доклада"],[7,"УВС п. 7.3","Устав внутренней службы ВС РО · Раздел 7","7.3 Начало построения"],[7,"УВС п. 7.3.1","Устав внутренней службы ВС РО · Раздел 7","7.3.1 После формирования подразделений начальники докладывают о готовности лицу, проводящему построение."],[7,"УВС п. 7.3.2","Устав внутренней службы ВС РО · Раздел 7","7.3.2 Доклады производятся по очереди, установленной руководителем построения."],[7,"УВС п. 7.3.3","Устав внутренней службы ВС РО · Раздел 7","7.3.3 Для доклада командир подразделения выходит из строя, подходит к принимающему доклад, останавливается и обращается по званию."],[7,"УВС п. 7.3.4","Устав внутренней службы ВС РО · Раздел 7","7.3.4 Без разрешения принимающего доклад командиры других подразделений не перебивают выступающего."],[7,"УВС п. 7.4","Устав внутренней службы ВС РО · Раздел 7","7.4 Доклад командира подразделения производится в следующей форме:\n\"Личный состав подразделения [название подразделения] для вечернего доклада построен в количестве [количество] военнослужащих.\nЗа сегодняшний день подразделением были проведены [патрулирования, тренировки, проверки постов, наборы, учения и другие мероприятия, в зависимости от деятельности подразделения].\nДоклад окончен. Командир подразделения [название], [воинское звание, фамилия]»."],[8,"УКПС — общие положения","Устав караульно-постовой службы ВС РО","Устав караульно-постовой службы"],[8,"УКПС п. 1.1","Устав караульно-постовой службы ВС РО · ГЛАВА 1. ПРАВИЛА ИСПОЛЬЗОВАНИЯ РАЦИИ","1.1. Коды — специальные сокращения, которые используют для ускорения передачи информации. Коды может использовать любой военнослужащий, если это не ограничено его полномочиями.\n\nКод — \"Зеленый\" [З]: состояние стабильно, без происшествий, обстановка спокойная;\n\nКод — \"Желтый\" [Ж]: скопление подозрительных личностей, нарушение общественного порядка;\n\nКод — \"Красный\" [К]: проникновение на территорию, вооруженное нападение, массовое нарушение общественного порядка;\n\nКОД — \"Черный\" [Ч]- боевая тревога, нападение на военную часть большим скоплением вооруженных людей\n\nКод - \"Белый\" [Б]- Заступил на пост\nКод - \"Серый\" [C] - Покинул пост"],[8,"УКПС п. 1.2","Устав караульно-постовой службы ВС РО · ГЛАВА 1. ПРАВИЛА ИСПОЛЬЗОВАНИЯ РАЦИИ","1.2. Тэги подразделений для общения в рации:\n\nа) Военная полиция — [ВП]\n\nб) Силы специальных операций — [ССО]\n\nв) Военная постовая служба — [ВПС] или ВПС\n\nг) Военный комиссариат — [ВК] или ВК |;\n\nд) Военныо-воздушные войска - [ВВС] или ВВС|;\n\nе) Военно десантные войска - [ВДВ] или ВДВ |\n\nе) Академия — [ВА] или ВА |.\n\nПримечание: Генералитет тэга не имеют"],[8,"УКПС — ГЛАВА 2","Устав караульно-постовой службы ВС РО","ГЛАВА 2.\nВИДЫ ПОСТОВ"],[8,"УКПС п. 2.1","Устав караульно-постовой службы ВС РО · ГЛАВА 2","2.1\nКонтрольно-Пропускные-Пункты ПОСТЫ:\n\nКПП-1 - основной приоритетный Контрольно-Пропускной Пункт.\nДоступ к территории Военной части, через КПП-1 имеют:\n1) Военнослужащие армии РО\n2) Премьер-министр РО;\n3) Вице-премьер РО в пределах возложенной компетенции;\n4) Министр юстиции РО — Генеральный прокурор РО и его заместители при осуществлении прокурорского надзора или процессуальных полномочий;\n5) руководитель государственного органа, в ведении которого находится соответствующий объект;\n6) сотрудники ФСО РО, непосредственно обеспечивающие государственную охрану указанных лиц.\n7) Лица имеющие пропуск от Офиса Генерала Армии РО\nКоличество часовых на посту: от 1 до 8 бойцов.\nМинимальное кол-во военных машин на КПП-1 для перекрытия составляет 2 автомобиля: [NAZ TIGER].\n\nКПП-2 - дополнительный Контрольно-Пропускной Пункт.\nДоступ к территории Военной части, через КПП-2 имеют:\n1) Военнослужащие армии РО\n2) Премьер-министр РО;\n3) Вице-премьер РО в пределах возложенной компетенции;\n4) Министр юстиции РО — Генеральный прокурор РО и его заместители при осуществлении прокурорского надзора или процессуальных полномочий;\n5) руководитель государственного органа, в ведении которого находится соответствующий объект;\n6) сотрудники ФСО РО, непосредственно обеспечивающие государственную охрану указанных лиц.\n7) Лица имеющие пропуск от Офиса Генерала Армии РО\nКоличество часовых на посту: от 1 до 8 бойцов.\nМинимальное кол-во военных машин на КПП-1 для перекрытия составляет 1 автомобиль: [NAZ TIGER]."],[8,"УКПС п. 2.2","Устав караульно-постовой службы ВС РО · ГЛАВА 2","2.2 Постовые вышки (ПВ)\n\nКрасная вышка (ПВ-1)\nЖелтая вышка (ПВ-2)\nЗеленая вышка (ПВ-3)\nФиолетовая вышка (ПВ-4)\nГолубая вышка (ПВ-5)\nРозовая вышка (ПВ-6)\nМятная вышка (ПВ-7)\nСиняя вышка (ПВ-8)"],[8,"УКПС — ГЛАВА 3","Устав караульно-постовой службы ВС РО","ГЛАВА 3\nОбязанности постового"],[8,"УКПС п. 3.1","Устав караульно-постовой службы ВС РО · ГЛАВА 3","3.1 Постовой, заступающий или покидающий пост, обязан сообщать об этом в рацию.\nФорма доклада: (Название поста) (Тен-код о заступлении/уходе и состоянии на посту) (Состав)\nПример доклада в рацию:\nКПП-1 \"Белый\" Состав: 2."],[8,"УКПС п. 3.2","Устав караульно-постовой службы ВС РО · ГЛАВА 3","3.2 Постовой каждый 15 минут должен делать доклад о состоянии поста\nФорма доклада: Название поста) (Код состояния) (Состав)\nПример доклада в рацию:\nПВ-7 \"Зеленый\" Состав: 1."],[8,"УКПС п. 3.3","Устав караульно-постовой службы ВС РО · ГЛАВА 3","3.3 На выезде и въезде в/из Военной части любого человека, постовой обязан проверить документы/удостоверение и узнать цель пребывания/убывание каждого военнослужащего/гражданина прибывающего/убывающего на/из территорию Военной части.\nИсключение:\n— Генерал, Генерал полковник, Генерал-лейтенант, Генерал майор, ВС РО\n— Военнослужащие со звания Генерал майор в служебной и гражданской одежде освобождаются от всех проверок.\n— Конвои, спецоперации, колонны, наборы, ЧП/ВП - освобождаются от всех проверок и подлежат скорейшему пропуску через КПП.\n— Военнослужащие армии РО от звания Сержант по служебным нуждам, Премьер-министр РО; Вице-премьер РО в пределах возложенной компетенции; Министр юстиции РО — Генеральный прокурор РО и его заместители при осуществлении прокурорского надзора или процессуальных полномочий, руководитель государственного органа, в ведении которого находится соответствующий объект, сотрудники ФСО РО, непосредственно обеспечивающие государственную охрану указанных лиц."],[8,"УКПС п. 3.4","Устав караульно-постовой службы ВС РО · ГЛАВА 3","3.4. Постовой/военнослужащий при виде гражданского должен выполнить ряд действий. Постовой вправе потребовать гражданского покинуть запретную территорию Процесс требования выполняется по стадиям применения силы армии:\n— Потребовать вежливо покинуть территорию, предупредив о применении огнестрельного оружия.\n— Начать отсчёт до трёх.\n— Произвести выстрел в воздух.\n— Надеть наручники на гражданина и схватить его под руку.\n— Вызвать сотрудников подразделения Военной полиции."],[8,"УКПС п. 3.5","Устав караульно-постовой службы ВС РО · ГЛАВА 3","3.5 Постовой/военнослужащий при виде гражданского должен выполнить ряд действий.\n— Вы имеете право сразу задержать гражданина на территории Военной части.\n— Передача его Военную полицию для продолжения процессуальных действий.\n— Если человек находится в транспорте, необходимо вытащить человека из него.\n— Если человек намеренно уезжает и не собирается покидать авто, насильно вытащить из машины, расстрелять автомобиль пробив колеса, привести человека в тяжелое состояние резиновыми пулями.\n— Надеть на человека наручники\n— Оказать первую медицинскую помощь, если того требуют обстоятельства.\n— Передать задержанного Военной полиции для продолжения процессуальных действий."],[8,"УКПС п. 3.6","Устав караульно-постовой службы ВС РО · ГЛАВА 3","3.6. В случае, если на КПП подъезжает лицо не являющийся военнослужащим, постовой обязан проверить документы прибывшего, узнать цель визита и сообщить об этом в рацию."],[8,"УКПС п. 3.7","Устав караульно-постовой службы ВС РО · ГЛАВА 3","3.7. Бдительно охранять и стойко оборонять вверенный пост."],[8,"УКПС п. 3.8","Устав караульно-постовой службы ВС РО · ГЛАВА 3","3.8. Вежливо и тактично общаться со всеми гражданами, приезжающими на КПП."],[8,"УКПС п. 3.9","Устав караульно-постовой службы ВС РО · ГЛАВА 3","3.9. Знать опознавательные знаки и сигналы автотранспорта Вооруженных сил РО.\nНаказание: Выговор"],[8,"УКПС п. 3.10","Устав караульно-постовой службы ВС РО · ГЛАВА 3","3.10. Не допускать проникновения посторонних на территорию Форта;\nНаказание: Выговор"],[8,"УКПС п. 3.12","Устав караульно-постовой службы ВС РО · ГЛАВА 3","3.12. В случае, если на КПП прибывает автомобиль, в котором часть людей - действующие военнослужащие, а часть незнакомцы, постовой обязан приказать покинуть т\\с незнакомцев и пропустить только военнослужащих."],[8,"УКПС п. 3.12","Устав караульно-постовой службы ВС РО · ГЛАВА 3","3.12. Все военнослужащие, в независимости от порядкового звания, заступившие на пост находятся в прямом распоряжении и подчинении, непосредственно, дежурного по КПП."],[8,"УКПС п. 3.13","Устав караульно-постовой службы ВС РО · ГЛАВА 3","3.13. Дежурный по КПП является старший ранг находящийся при исполнении на этом посту.\nПримечание: Курирует работу младших по званию и следит за ними."],[8,"УКПС — РАЗДЕЛ 4","Устав караульно-постовой службы ВС РО","РАЗДЕЛ 4\nПАТРУЛЬ"],[8,"УКПС п. 4.1","Устав караульно-постовой службы ВС РО · РАЗДЕЛ 4","4.1. Патруль - это небольшой вооружённый отряд, назначенный для осмотра местности или поддержания порядка. Патрулирование производится на служебном воздушном либо наземном транспорте ВС РО;"],[8,"УКПС п. 4.2","Устав караульно-постовой службы ВС РО · РАЗДЕЛ 4","4.2. Выходя в патруль, вы обязаны знать законодательную базу России Онлайн.\n*За несоблюдения данного пункта, сотрудник ВС РО может быть уволен."],[8,"УКПС п. 4.3","Устав караульно-постовой службы ВС РО · РАЗДЕЛ 4","4.3. Разрешено выходить в патруль только в том случае, если на обоих КПП находятся минимум по одному постовому."],[8,"УКПС п. 4.4","Устав караульно-постовой службы ВС РО · РАЗДЕЛ 4","4.4. Выезд в патруль должен осуществляться составом минимум из двух военнослужащих.\nИсключение: Сотрудники Военной полиции могут выезжать за дезертирами в составе из 1 военнослужащего."],[8,"УКПС п. 4.5","Устав караульно-постовой службы ВС РО · РАЗДЕЛ 4","4.5. Разрешено выходить в патрулирование только военнослужащим выше звания Сержант [4 + ранг по табелю]\nИсключение: Пеший патруль в сопровождении инструкторов."],[8,"УКПС — РАЗДЕЛ 5","Устав караульно-постовой службы ВС РО","РАЗДЕЛ 5\nОБЯЗАННОСТИ ПОСТОВОГО ПРИ ПРОНИКНОВЕНИИ"],[8,"УКПС п. 5.1","Устав караульно-постовой службы ВС РО · РАЗДЕЛ 5","5.1. Немедленно сообщить о проникновении в рацию. [Код: \"Чёрный]"],[8,"УКПС п. 5.2","Устав караульно-постовой службы ВС РО · РАЗДЕЛ 5","5.2. Занять безопасную позицию."],[8,"УКПС п. 5.3","Устав караульно-постовой службы ВС РО · РАЗДЕЛ 5","5.3. Подготовиться к возможному проникновению со стороны своего поста."],[8,"УКПС п. 5.4","Устав караульно-постовой службы ВС РО · РАЗДЕЛ 5","5.4. При нападении или попытке кражи имущества Военной части, ликвидировать на месте."],[8,"УКПС п. 5.5","Устав караульно-постовой службы ВС РО · РАЗДЕЛ 5","5.5. При проникновении или нападении на другие посты, постовому запрещается покидать доверенный ему пост для нейтрализации нарушителей."],[8,"УКПС п. 5.6","Устав караульно-постовой службы ВС РО · РАЗДЕЛ 5","5.6. Запрещается наводить панику при проникновении."],[8,"УКПС п. 5.7","Устав караульно-постовой службы ВС РО · РАЗДЕЛ 5","5.7. Запрещено пытаться выйти на контакт с нарушителем."],[8,"УКПС п. 5.8","Устав караульно-постовой службы ВС РО · РАЗДЕЛ 5","5.8. Самостоятельно вызывать поддержку МВД/ГИБДД/ФСБ без одобрения комсостава и выше, и/или когда когда высший состав вызвал сам."],[8,"УКПС п. 5.9","Устав караульно-постовой службы ВС РО · РАЗДЕЛ 5","5.9. Самостоятельно вывозить нейтрализованного нарушителя в МВД/ГИБДД/ФСБ без разрешения комсостава, генералитета."],[8,"УКПС п. 5.10","Устав караульно-постовой службы ВС РО · РАЗДЕЛ 5","5.10. После ликвидации проникновения на военную часть постовой обязан:\n— Надеть наручники на проникшего на территорию.\n— В случае, если нарушитель потерял сознания вы должны его перевернуть на живот.\n— Обязан оказать первую медицинскую помощь, задержать нарушителя и ждать прибытия Военной полиции.\n— Если Военная полиция отсутствуют, необходимо запросить помощи у комсостава, генералитета."],[8,"УКПС п. 5.11","Устав караульно-постовой службы ВС РО · РАЗДЕЛ 5","5.11. При приезде лиц из исключения пункта 3.3 УКПС, караульный обязан, оповестить по рации, Высшее-начальство о прибытие данного лица и конкретно описать цель его прибытия."],[8,"УКПС — РАЗДЕЛ VI","Устав караульно-постовой службы ВС РО","РАЗДЕЛ VI\nПОСТОВОМУ ЗАПРЕЩЕНО"],[8,"УКПС п. 6.1","Устав караульно-постовой службы ВС РО · РАЗДЕЛ VI","6.1. Выпускать из рук, отдавать, продавать свое вооружение или амуницию."],[8,"УКПС п. 6.2","Устав караульно-постовой службы ВС РО · РАЗДЕЛ VI","6.2. Покидать пост без видимой на той причины или без разрешения."],[8,"УКПС п. 6.3","Устав караульно-постовой службы ВС РО · РАЗДЕЛ VI","6.3. Пропускать, проводить через КПП на территорию Военной части посторонних лиц без разрешения Комсостава/Генералитета.\nИсключение: Если постовой удостоверился в личности разрешенных лиц из пунтка 3.3 УКПС"],[8,"УКПС п. 6.4","Устав караульно-постовой службы ВС РО · РАЗДЕЛ VI","6.4. Спать на посту.\nИсключение: В случае необходимости \"уйти в себя\" на КПП, военнослужащий обязан сообщить об этом другому военнослужащему с ним на посту и дежурному , после чего уйти в будку. \"Уйти в себя\" можно только на малый промежуток времени, до 5 минут. Военнослужащему запрещено уходить в себя, если он на посту единственный."],[8,"УКПС п. 6.5","Устав караульно-постовой службы ВС РО · РАЗДЕЛ VI","6.5. Отключать рацию во время постовой службы."],[8,"УКПС п. 6.6","Устав караульно-постовой службы ВС РО · РАЗДЕЛ VI","6.6. Вступать в контакт с гражданскими лицами, приехавшими на КПП.\nИсключение: Проверка документов(удостоверения), уточнение цели визита гражданского лица, предупреждения и т.п."],[8,"УКПС п. 6.7","Устав караульно-постовой службы ВС РО · РАЗДЕЛ VI","6.7. Заступать на пост без полного комплекта обмундирования и амуниции, включающей бронежилет, заряженное оружие, боеприпасов и не зная караульный устав."],[8,"УКПС п. 6.8","Устав караульно-постовой службы ВС РО · РАЗДЕЛ VI","6.8. Залезать на будки и автомобили, бегать и прыгать без причины, громко шуметь, слушать музыку, курить."],[8,"УКПС п. 6.9","Устав караульно-постовой службы ВС РО · РАЗДЕЛ VI","6.9. Запрещено выпускать военнослужащих до звания \"Сержат\"\nИсключение: подтверждение уставного одобрения"],[8,"УКПС п. 6.14","Устав караульно-постовой службы ВС РО · РАЗДЕЛ VI","6.14 Военнослужащим запрещено игнорировать все пункты этого устава\nНаказание: Выговор."],[8,"УКПС п. 6.15","Устав караульно-постовой службы ВС РО · РАЗДЕЛ VI","6.15 Намеренное использование своих полномочий \"караульного\" в корыстных целях.\nНаказание: Выговор."],[9,"Пра
