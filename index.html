тета имеет право ознакомится со всеми материалами дела, а также дополнить квалификацию статей дополнительными статьям."],[2,"ПК гл. II ст. 5","Процессуальный кодекс РО · Глава II. Процесс задержания","Статья 5. Уведомление государственного органа о задержании его сотрудника.\nПри задержании государственного служащего правоохранительный орган вправе уведомить государственный орган, в котором служит задержанный, о факте и месте проведения процессуальных действий. Такое уведомление носит информационный характер, не приостанавливает процессуальный срок и не предоставляет руководству задержанного права вмешиваться в рассмотрение доказательств, прокурорское решение или ход расследования."],[2,"ПК гл. II ст. 6","Процессуальный кодекс РО · Глава II. Процесс задержания","Статья 6. Разъяснение процессуальных прав задержанному.\n1. При задержании лицу ясно и разборчиво сообщаются его основные процессуальные права. Допускается следующая формулировка: «Вы имеете право хранить молчание. Всё, что вы скажете, может и будет использовано против Вас в суде. Вы имеете право на один телефонный звонок. Также Вы имеете право на адвоката. Если вам необходим адвокат, он будет для Вас запрошен. Вы понимаете свои права?»\n2. Точное дословное воспроизведение указанной формулировки не требуется, если задержанному фактически разъяснены все перечисленные права в понятной форме.\n3. Если задержанный сообщает, что не понял разъяснение, сотрудник обязан повторно разъяснить соответствующее право или права. Формальное многократное повторение уже понятого разъяснения не требуется.\n4. Право хранить молчание означает в том числе право не давать показания против самого себя, своего супруга и близких родственников в пределах, установленных Конституцией и федеральным законодательством."],[2,"ПК гл. II ст. 7","Процессуальный кодекс РО · Глава II. Процесс задержания","Статья 7. Основания для освобождения подозреваемого. Подозреваемый подлежит освобождению по решению сотрудника проводившего задержание и допрос, если:\nа) Не подтвердилось подозрение в совершении правонарушения;\nб) После разрешения вопроса о штрафе или иной мере ответственности отсутствует предусмотренное законом основание для дальнейшего ограничения свободы лица;\nв) Задержание было произведено с нарушением ст. 1 гл. II настоящего Кодекса;\nг) По истечении процессуального часа с момента начала задержания подозреваемый подлежит освобождению, если в отношении него не принято предусмотренное законом решение о привлечении к ответственности, дальнейшем ограничении свободы или передаче компетентному органу. Повторное задержание по тем же фактическим основаниям допускается при наличии вступившего в силу судебного акта, постановления прокурора о санкционировании ареста либо новых существенных обстоятельств, которые не могли быть учтены при первоначальном задержании\nд) подозреваемый обладает статусом неприкосновенности\nе) отсутствие допустимых и достаточных доказательств виновности лица, невозможность их представления, либо признание таковых недопустимыми.\nИсключение: пункту д) - за исключением случаев, когда незаконные действия несут непосредственную угрозу жизни и здоровья окружающим людям."],[2,"ПК гл. II ст. 7.1","Процессуальный кодекс РО · Глава II. Процесс задержания","Статья 7.1. Течение процессуального часа приостанавливается в следующих случаях:\nа) Проведение допроса подозреваемого;\nб) Ожидание ответа и/или приезда адвоката, конфиденциальный разговор задержанного с адвокатом;\nв) Ожидание ответа и/или приезда сотрудника прокуратуры, разбирательств по задержанию, если задержанный является сотрудником государственного органа;\nг) Проведение необходимой дополнительной проверки обстоятельств задержания, но не более чем на 20 минут;\nд) Фактическое доставление задержанного и ожидание уполномоченного сотрудника Следственного комитета РО или Федеральной службы безопасности РО после направления межведомственного вызова в порядке статьи 2.7.1 настоящей главы, но совокупно не более чем на 20 минут. Необоснованное увеличение времени доставления или ожидания запрещается.\nе) Проведение незамедлительной судебной проверки по требованию задержанного в порядке статьи 9.1 настоящей главы — на все время такой процедуры;"],[2,"ПК гл. II ст. 8","Процессуальный кодекс РО · Глава II. Процесс задержания","Статья 8. Субъекты задержания. В процессе задержания участвуют:\n\nа) Сотрудник либо сотрудники правоохранительных органов при исполнении, которые осуществляют задержание и/или проявляют содействие задержанию при условии гласного волеизъявления инициатора задержания, подтверждающего согласие на участие каждого такого лица в качестве субъекта задержания;\nб) Задержанный, в отношении которого проводятся процессуальные действия;\nв) Адвокат, если он был запрошен задержанным;\nг) Прокурор, прибывший для изучения материалов задержания государственного служащего, оценки доказательств и принятия обязательного решения, либо осуществляющий надзор;\nд) Один сотрудник следственного комитета для наблюдения;\nе) Премьер министр и(или) Вице премьер министр и их охрана;\nё) Один представитель начальства задержанного государственного служащего.\n\nПримечание: Сотрудники адвокатуры ( младшие адвокаты ) являются субъектами задержания, в случае если таковые были заявлены адвокатом, принявшим вызов. Допускается не более трех младших адвокатов при одном адвокате."],[2,"ПК гл. II ст. 8.1","Процессуальный кодекс РО · Глава II. Процесс задержания","Статья 8.1. Лица, не являющиеся участниками задержания, не вправе вмешиваться в процессуальные действия. Сотрудник, производящий задержание, либо участвующий прокурор вправе потребовать от посторонних лиц отойти на расстояние, необходимое для обеспечения безопасности, конфиденциальности общения с адвокатом и сохранности доказательств, либо покинуть помещение, в котором проводится разбирательство, если такое требование законно и исполнимо."],[2,"ПК гл. II ст. 9","Процессуальный кодекс РО · Глава II. Процесс задержания","Статья 9. Права задерживаемого. У задержанного имеются следующие права:\nа) Подозреваемый имеет право на один телефонный разговор, длительностью не более 3 минут в присутствии сотрудника.\nб) Подозреваемый имеет право на адвоката. (Заключается в реализации сотрудником права адвокату беспрепятственно встретиться со своим подзащитным наедине, в условиях, обеспечивающих конфиденциальность, если это потребует сам адвокат). Длительность конфиденциального разговора между адвокатом со своим подзащитным составляет не более 10 минут;\nв) Подозреваемый имеет право хранить молчание и не свидетельствовать против себя, супруга и близких родственников;\nг) Подозреваемый имеет право знать основания задержания, применяемые нормы закона и существо предъявляемых ему требований;\nд) Подозреваемый имеет право заявлять ходатайства и обжаловать действия, бездействие и решения должностных лиц в установленном законом порядке;"],[2,"ПК гл. II ст. 10","Процессуальный кодекс РО · Глава II. Процесс задержания","Статья 10. Обязанности сотрудника выполняющего задержание.\nа) Сотрудник правоохранительных органов обязан вести и хранить видеозапись оснований для задержания и самого задержания в течение 48 часов или до окончания расследования, связанного с задержанием;\nб) Сотрудник обязан разъяснить и предоставить адвокату причины задержания, видеозапись с каждым отдельным эпизодом нарушения, инкриминируемого подозреваемому, а также с ходом процессуальных действий в отношении подозреваемого;\nв) Сотрудник обязан предоставить видеозапись сотруднику прокуратуры, если последний является субъектом задержания;\nг) В случае задержания государственного служащего видеозапись может быть предоставлена уполномоченному представителю государственного органа, в котором он служит, только в объеме, необходимом для законной служебной проверки и не нарушающем тайну расследования;\nд) В случае задержания государственного служащего сотрудник, проводящий задержание, обязан вызвать сотрудника прокуратуры и следственного комитета."],[2,"ПК гл. II ст. 11","Процессуальный кодекс РО · Глава II. Процесс задержания","Статья 11. При задержании во исполнение вступившего в силу судебного акта, постановления прокурора о санкционировании ареста либо ранее вынесенного прокурорского решения повторное рассмотрение оснований задержания прокурором на месте не требуется. Задержанному сохраняются право знать основание задержания, право на адвоката, право хранить молчание и право на обжалование. Если возможность воспользоваться адвокатом была реально предоставлена, но лицо однозначно отказалось от нее либо сознательно не воспользовалось ею в разумный срок, исполнение действующего процессуального акта может быть продолжено."],[2,"ПК — Глава III. Процесс административного ареста","Процессуальный кодекс РО","Глава III. Процесс административного ареста.\n\nАдминистративный арест — предусмотренное законодательством об административных правонарушениях наказание, заключающееся во временном содержании лица в условиях изоляции от общества. Административный арест применяется только тогда, когда соответствующий состав прямо предусматривает такую меру и решение принято уполномоченным должностным лицом или судом."],[2,"ПК гл. III ст. 1","Процессуальный кодекс РО · Глава III. Процесс административного ареста","Статья 1. Порядок административного ареста.\n1. До назначения административного ареста должны быть установлены событие правонарушения, причастность лица и иные обстоятельства, необходимые для законного разрешения материала.\n2. Лицу разъясняются существо установленного правонарушения, применяемая статья, назначенная мера и порядок ее обжалования.\n3. Перед помещением в условия изоляции проводится личный обыск и выемка оружия, опасных предметов, запрещенных предметов и иных вещей, которые не могут находиться при содержащемся под арестом лице.\n4. Лицо помещается в изолятор временного содержания на срок, предусмотренный законодательством об административных правонарушениях и принятым процессуальным решением."],[2,"ПК гл. III ст. 2","Процессуальный кодекс РО · Глава III. Процесс административного ареста","Статья 2. Административный арест государственного служащего.\n1. Если задержанный является действующим государственным служащим и отсутствует ранее вынесенный судебный акт или действующее прокурорское решение, вопрос о его привлечении к ответственности и административном аресте разрешается прокурором в порядке главы II настоящего Кодекса.\n2. Прокурор изучает представленные доказательства и вправе освободить задержанного, изменить или исключить квалификацию, назначить штраф, административный арест либо принять иное предусмотренное законом решение.\n3. Решение прокурора объявляется задержанному и сотруднику, осуществляющему задержание, и подлежит немедленному исполнению, если самим решением или законом не предусмотрено иное.\n4. Дисциплинарная ответственность, отстранение либо увольнение государственного служащего разрешаются отдельно компетентным органом и не являются автоматическим последствием административного ареста."],[2,"ПК гл. III ст. 2.1","Процессуальный кодекс РО · Глава III. Процесс административного ареста","Статья 2.1. Обжалование.\nРешение об административном аресте может быть обжаловано вышестоящему прокурору, если оно принято прокурором, либо в суд в порядке, установленном настоящим Кодексом и законодательством об административных правонарушениях. Подача жалобы не приостанавливает исполнение, если компетентный прокурор или суд не примет иное решение."],[2,"ПК гл. III ст. 2.2","Процессуальный кодекс РО · Глава III. Процесс административного ареста","Статья 2.2. Исполнение ранее вынесенного акта.\nПовторное рассмотрение прокурором на месте не требуется, если лицо задержано для исполнения вступившего в силу судебного акта или ранее вынесенного действующего прокурорского решения, которым уже разрешен вопрос об административной ответственности конкретного лица."],[2,"ПК гл. III ст. 3","Процессуальный кодекс РО · Глава III. Процесс административного ареста","Статья 3. Передача задержанного.\nСотрудник, который законно задержал лицо, но не вправе либо объективно не может самостоятельно исполнить административный арест, обязан передать задержанного уполномоченному сотруднику вместе с материалами и сведениями об основании задержания."],[2,"ПК — Глава IV. Процесс уголовного ареста","Процессуальный кодекс РО","Глава IV. Процесс уголовного ареста.\n\nАрест в рамках уголовного производства — предусмотренная законом мера, связанная с помещением лица в условия изоляции от общества во исполнение решения уполномоченного сотрудника правоохранительного органа, принятого в установленном законом упрощенном порядке, прокурорского или судебного процессуального решения либо иного прямо предусмотренного законом акта. Арест не может применяться при отсутствии законного основания и доказательств, достаточных для соответствующего решения."],[2,"ПК гл. IV ст. 1","Процессуальный кодекс РО · Глава IV. Процесс уголовного ареста","Статья 1. Основания уголовного ареста.\nОснованием для уголовного ареста является:\n1) решение прокурора, принятое по результатам обязательного прокурорского рассмотрения задержания, когда федеральным законодательством прокурору предоставлено право назначить соответствующую меру;\n2) постановление прокурора о санкционировании ареста;\n3) вступивший в силу либо подлежащий немедленному исполнению судебный акт;\n4) решение уполномоченного сотрудника правоохранительного органа, принятое непосредственно при задержании в упрощенном порядке, предусмотренном Уголовным кодексом РО и статьей 2.9 главы II настоящего Кодекса;\n5) иной процессуальный акт, прямо предусмотренный федеральным законодательством."],[2,"ПК гл. IV ст. 2","Процессуальный кодекс РО · Глава IV. Процесс уголовного ареста","Статья 2. Порядок исполнения уголовного ареста.\n1. Перед помещением лица под арест ему разъясняются правовое основание, применяемые статьи закона, срок или предел применяемой меры и порядок ее обжалования.\n2. Лицо подвергается личному обыску и выемке предметов, запрещенных к хранению в условиях изоляции либо подлежащих сохранению как доказательства.\n3. Лицо помещается в изолятор временного содержания или иное установленное законом место содержания на срок, предусмотренный законом или соответствующим процессуальным актом.\n4. Законно принадлежащие лицу предметы, не подлежащие конфискации, уничтожению либо приобщению к делу, сохраняются и возвращаются после отпадения основания их удержания."],[2,"ПК гл. IV ст. 3","Процессуальный кодекс РО · Глава IV. Процесс уголовного ареста","Статья 3. Арест государственного служащего.\n1. Если государственный служащий задержан непосредственно сотрудником правоохранительного органа и отсутствует ранее вынесенный судебный или прокурорский акт, его помещение под арест допускается после обязательного рассмотрения материалов прокурором в порядке главы II настоящего Кодекса.\n2. Прокурор изучает доказательства и вправе принять любое решение, предусмотренное статьей 4.4 главы II настоящего Кодекса.\n3. Организационные и дисциплинарные последствия для государственного служащего разрешаются отдельно в порядке законодательства о государственной службе и не являются обязательной частью решения об аресте.\n4. Увольнение лица после фактического задержания не прекращает начатую специальную прокурорскую процедуру."],[2,"ПК гл. IV ст. 3.1","Процессуальный кодекс РО · Глава IV. Процесс уголовного ареста","Статья 3.1. Исполнение ранее вынесенного акта.\nПовторное прокурорское рассмотрение на месте не требуется, если арест производится во исполнение судебного акта, постановления прокурора о санкционировании ареста либо иного действующего процессуального решения, принятого в отношении конкретного лица. При исполнении такого акта сохраняются право на адвоката, право знать основания ограничения свободы и право на обжалование."],[2,"ПК гл. IV ст. 3.2","Процессуальный кодекс РО · Глава IV. Процесс уголовного ареста","Статья 3.2. Прокурорская санкция на арест.\n1. Генеральный прокурор РО, заместитель Генерального прокурора РО и старший прокурор вправе вынести постановление прокурора о санкционировании ареста.\n2. Такое постановление выносится по результатам изучения материалов проведенного расследования либо по мотивированному ходатайству Следственного комитета РО, Федеральной службы безопасности РО или иного органа предварительного расследования, если соответствующий орган вправе расследовать данный материал.\n3. К ходатайству прилагаются материалы расследования и доказательства, позволяющие проверить событие преступления, правовую квалификацию, причастность лица и необходимость ареста. Само наличие ходатайства не обязывает прокурора санкционировать арест.\n4. Постановление должно содержать сведения, позволяющие идентифицировать лицо, описание существенных обстоятельств, правовую квалификацию, основные доказательства, основание необходимости ареста и разрешенную меру.\n5. Действующая прокурорская санкция является самостоятельным основанием для объявления лица в розыск, его задержания, доставления и помещения под арест в пределах, установленных законом и самим постановлением.\n6. Прокурор, вынесший постановление, вправе отменить или изменить его при отпадении основания либо появлении новых существенных обстоятельств."],[2,"ПК гл. IV ст. 3.3","Процессуальный кодекс РО · Глава IV. Процесс уголовного ареста","Статья 3.3. Обжалование прокурорской санкции на арест.\n1. Постановление старшего прокурора может быть обжаловано вышестоящему прокурору либо в суд.\n2. Постановление заместителя Генерального прокурора может быть обжаловано Генеральному прокурору либо в суд.\n3. Постановление Генерального прокурора может быть обжаловано в суд.\n4. Подача жалобы сама по себе не приостанавливает исполнение постановления, однако вышестоящий прокурор или суд вправе полностью или частично приостановить его исполнение до разрешения жалобы."],[2,"ПК гл. IV ст. 3.4","Процессуальный кодекс РО · Глава IV. Процесс уголовного ареста","Статья 3.4. Лица со специальным процессуальным статусом.\nЕсли лицо обладает неприкосновенностью или иным специальным процессуальным статусом, арест, обыск и иные меры в его отношении осуществляются только после соблюдения специальной процедуры, установленной Конституцией и федеральным законодательством."],[2,"ПК гл. IV ст. 4","Процессуальный кодекс РО · Глава IV. Процесс уголовного ареста","Статья 4. Передача лица для исполнения ареста.\nСотрудник, который законно задержал лицо, но не вправе либо объективно не может самостоятельно исполнить решение об аресте, обязан передать задержанного уполномоченному сотруднику вместе со сведениями об основании задержания и соответствующими материалами."],[2,"ПК гл. V ст. 1","Процессуальный кодекс РО · Глава V. Обыск и допрос","Статья 1. Личный обыск.\n1. Личный обыск без согласия лица допускается при задержании или аресте, во исполнение судебного либо иного предусмотренного законом процессуального акта, а также в иных случаях, прямо установленных настоящим Кодексом.\n2. Обыск должен преследовать законную цель: установление личности, обнаружение оружия и опасных предметов, предметов и документов, имеющих значение для дела, либо предметов, оборот которых запрещен или ограничен законом.\n3. Обыск не может использоваться как средство унижения, давления или получения сведений, очевидно не относящихся к основанию процессуального действия."],[2,"ПК гл. V ст. 1.1","Процессуальный кодекс РО · Глава V. Обыск и допрос","Статья 1.1. Первичный обыск при задержании.\n1. Первичный обыск проводится прежде всего для обеспечения безопасности задержанного и иных участников, установления личности и обнаружения предметов, которые могут быть использованы для нападения, побега, уничтожения доказательств либо продолжения правонарушения.\n2. При обнаружении оружия, специальных средств, взрывчатых веществ, предполагаемых наркотических средств и иных опасных предметов они могут быть временно изъяты. Изъятие отражается в материалах процессуального действия и подлежит видеофиксации, когда она обязательна.\n3. Временное изъятие законно принадлежащего лицу предмета не означает его конфискацию."],[2,"ПК гл. V ст. 1.2","Процессуальный кодекс РО · Глава V. Обыск и допрос","Статья 1.2. Обыск перед помещением под арест.\nПеред помещением лица в условия изоляции проводится полный личный обыск с изъятием оружия, боеприпасов, запрещенных предметов и иных вещей, хранение которых несовместимо с режимом содержания. Правовой режим изъятых предметов определяется отдельным законным основанием."],[2,"ПК гл. V ст. 2","Процессуальный кодекс РО · Глава V. Обыск и допрос","Статья 2. Обыск жилища и иной частной территории.\n1. Обыск жилища, помещения или иной законно занимаемой частной территории проводится на основании судебного разрешения, если федеральным законодательством прямо не предусмотрен иной порядок.\n2. Ходатайство о разрешении обыска должно содержать сведения о расследуемом событии, объекте обыска, искомых предметах, документах или лицах и фактические данные, обосновывающие необходимость вмешательства.\n3. В неотложном случае обыск может быть начат без предварительного судебного разрешения, когда промедление создает реальную угрозу жизни, позволяет подозреваемому скрыться, создает непосредственный риск уничтожения существенных доказательств либо иным образом делает достижение законной цели объективно невозможным.\n4. Лицо, принявшее решение о неотложном обыске, обязано не позднее одного часа с момента начала действия уведомить прокурора и направить материалы для последующей проверки законности судом, если такой контроль предусмотрен федеральным законодательством.\n5. В материалах должны быть отдельно отражены обстоятельства, обосновавшие неотложность."],[2,"ПК гл. V ст. 3","Процессуальный кодекс РО · Глава V. Обыск и допрос","Статья 3. Обыск транспортного средства.\n1. Обыск транспортного средства без предварительного судебного разрешения допускается при наличии достаточных оснований полагать, что в нем находятся предметы, документы или лица, имеющие непосредственное значение для задержания либо расследуемого правонарушения, а также в иных прямо предусмотренных законом случаях.\n2. Такими основаниями, в частности, могут являться:\n1) попытка водителя скрыться от законного требования об остановке с последующей принудительной остановкой;\n2) наличие действующей ориентировки на транспортное средство либо сведений о нахождении в нем разыскиваемого или подлежащего задержанию лица;\n3) обнаружение у водителя или пассажира оружия, боеприпасов, наркотических средств либо иных предметов, если имеются фактические основания связывать их с содержимым транспортного средства;\n4) нахождение транспортного средства на закрытой, охраняемой или режимной территории в обстоятельствах, указывающих на возможное незаконное проникновение;\n5) наличие видимых следов преступления или иных конкретных обстоятельств, образующих достаточное основание для обыска.\n3. Отсутствие регистрационного знака само по себе является основанием для проверки документов и регистрационных сведений, но не влечет автоматически полный обыск транспортного средства без дополнительных законных оснований.\n4. Обыск по возможности проводится в присутствии владельца, водителя или иного лица, у которого транспортное средство находилось, если это не создает угрозу безопасности и не препятствует достижению законной цели."],[2,"ПК гл. V ст. 4","Процессуальный кодекс РО · Глава V. Обыск и допрос","Статья 4. Досмотр при проходе на охраняемый государственный объект.\n1. Доступ гражданина на специально охраняемый государственный объект может быть поставлен в зависимость от прохождения досмотра, если такой режим установлен законом или принятым в соответствии с ним актом.\n2. Лицо должно быть уведомлено о необходимости досмотра до допуска на объект. Если посещение объекта является добровольным, лицо вправе отказаться от досмотра, но в таком случае обязано покинуть территорию, если законом не установлено иное.\n3. Досмотр в целях пропускного режима не предоставляет права производить следственный обыск без самостоятельного законного основания."],[2,"ПК гл. V ст. 5","Процессуальный кодекс РО · Глава V. Обыск и допрос","Статья 5. Военные и иные режимные территории.\n1. На военных объектах, территориях хранения вооружения и иных режимных территориях может устанавливаться специальный пропускной и досмотровый режим.\n2. Военнослужащий или иной уполномоченный сотрудник вправе потребовать предъявить документы, пройти предусмотренный режимом досмотр либо покинуть территорию, если лицо не имеет самостоятельного законного права находиться на ней.\n3. Обнаружение признаков преступления в ходе законного досмотра является основанием для передачи материалов и лица компетентному правоохранительному органу."],[2,"ПК гл. V ст. 6","Процессуальный кодекс РО · Глава V. Обыск и допрос","Статья 6. Вызов и доставление лица на допрос.\n1. Подозреваемый, обвиняемый, потерпевший, свидетель, эксперт, специалист или иное лицо вызывается на допрос либо для дачи объяснений на основании вызова, повестки, постановления или иного процессуального акта органа, уполномоченного вести соответствующее производство.\n2. Вызов должен позволять установить вызывающий орган или должностное лицо, статус вызываемого, место и время явки, а также цель вызова в объеме, допустимом законом.\n3. Лицо, задержанное по законному основанию, может быть доставлено для допроса без отдельного предварительного вызова."],[2,"ПК гл. V ст. 7","Процессуальный кодекс РО · Глава V. Обыск и допрос","Статья 7. Порядок проведения допроса.\n1. Перед началом допроса устанавливается личность допрашиваемого и разъясняется его процессуальный статус.\n2. Лицу разъясняются право не свидетельствовать против себя, супруга и близких родственников, право на адвоката в предусмотренных законом случаях, а также иные относящиеся к его статусу права и обязанности.\n3. Если подозреваемый или обвиняемый заявил о желании воспользоваться адвокатом и право на защитника не было ранее надлежащим образом реализовано либо отказ от него не имеет юридической силы, допрос проводится после предоставления разумной возможности воспользоваться защитой.\n4. Адвокат вправе присутствовать при допросе подзащитного и пользоваться полномочиями, установленными законодательством об адвокатуре и настоящим Кодексом.\n5. Запрещаются пытки, насилие, угрозы, унижение достоинства, принуждение к самооговору, заведомый обман относительно процессуальных прав и иные незаконные способы получения показаний.\n6. После разъяснения прав уполномоченное лицо вправе задавать относящиеся к делу вопросы и совершать иные предусмотренные законом действия."],[2,"ПК гл. V ст. 8","Процессуальный кодекс РО · Глава V. Обыск и допрос","Статья 8. Фиксация и хранение записи допроса.\n1. Допрос подозреваемого или обвиняемого подлежит непрерывной видео- и аудиофиксации, если техническая возможность существует и федеральным законом не предусмотрено исключение.\n2. Запись должна позволять установить существенный ход допроса, разъяснение прав и содержание данных показаний. Умышленный монтаж или сокрытие существенной части обязательной записи запрещаются.\n3. Запись хранится не менее 48 часов с момента окончания допроса. Если допрос связан с уголовным делом, жалобой, прокурорской проверкой или судебным производством, запись сохраняется до окончания соответствующего производства и истечения срока ее законного истребования."],[2,"ПК гл. V ст. 9","Процессуальный кодекс РО · Глава V. Обыск и допрос","Статья 9. Допустимость показаний.\n1. Показания могут использоваться в качестве доказательства, если лицо было надлежащим образом уведомлено о процессуальном статусе и правах, а сведения получены добровольно и в предусмотренном законом порядке.\n2. Само по себе отсутствие признания вины не уменьшает доказательственную силу иных законно полученных доказательств.\n3. Признание лица не может являться единственным достаточным основанием обвинения без проверки и сопоставления с иными материалами дела."],[2,"ПК гл. V ст. 10","Процессуальный кодекс РО · Глава V. Обыск и допрос","Статья 10. Заявление о незаконном давлении.\n1. Лицо, заявляющее о незаконном давлении при допросе, вправе обратиться к руководителю следственного органа, прокурору или в суд.\n2. При наличии оснований соответствующий орган проверяет запись допроса, иные доказательства и действия участвовавших должностных лиц.\n3. Показания, полученные посредством запрещенного воздействия, признаются недопустимыми в установленном законом порядке, а виновные лица могут быть привлечены к ответственности."],[2,"ПК гл. V ст. 11","Процессуальный кодекс РО · Глава V. Обыск и допрос","Статья 11. Обязанность явки.\n1. Лицо, вызванное в установленном законом порядке, обязано явиться в назначенный срок либо заблаговременно сообщить об уважительной причине неявки.\n2. Неявка без уважительной причины может повлечь привод или иную прямо предусмотренную законом меру процессуального принуждения.\n3. Временное отстранение от должности, уголовная или административная ответственность за неявку допускаются только при наличии самостоятельного состава и предусмотренного законом основания и не могут назначаться автоматически за сам факт пропуска вызова."],[2,"ПК гл. V ст. 12","Процессуальный кодекс РО · Глава V. Обыск и допрос","Статья 12. Привод.\n1. Привод состоит в принудительном доставлении лица к следователю, прокурору или в суд и допускается при неявке без уважительной причины либо в другом прямо предусмотренном законом случае.\n2. Решение о приводе принимается следователем по находящемуся в его производстве делу, прокурором в пределах его компетенции либо судом.\n3. Исполнение привода может быть поручено органам внутренних дел или иному уполномоченному органу.\n4. Постановление или поручение должно позволять установить вызываемое лицо, основание привода, место доставления и орган, в распоряжение которого лицо должно быть передано.\n5. В отношении лиц, обладающих неприкосновенностью или иным специальным процессуальным статусом, привод применяется только с соблюдением установленной для них специальной процедуры."],[2,"ПК гл. VI ст. 1","Процессуальный кодекс РО · Глава VI. Принципы процессуального кодекса","Статья 1. Презумпция невиновности.\n1. Подозреваемый и обвиняемый считаются невиновными, пока их виновность не установлена в предусмотренном законом порядке.\n2. Подозреваемый или обвиняемый не обязан доказывать свою невиновность. Бремя доказывания обстоятельств обвинения лежит на стороне, осуществляющей уголовное преследование.\n3. Неустранимые сомнения толкуются в пользу лица, в отношении которого осуществляется производство.\n4. Обвинительное решение не может основываться исключительно на предположениях."],[2,"ПК гл. VI ст. 1.1","Процессуальный кодекс РО · Глава VI. Принципы процессуального кодекса","Статья 1.1. Презумпция Виновности.\nВ случае, если задержание гражданина произведено на основание выданого автоматического розыска системой города, факт такого задержания автоматически признаётся достаточным и полным доказательством виновности задержанного лица.\nВ случае, когда лицо задержано на основании розыска, выданным системой города, бремя доказывания невиновности не лежит на обвиняемом."],[2,"ПК гл. VI ст. 2","Процессуальный кодекс РО · Глава VI. Принципы процессуального кодекса","Статья 2. Законность и допустимость доказательств.\n1. Доказательства должны быть получены уполномоченным лицом, из законного источника и с соблюдением существенных процессуальных гарантий.\n2. Недопустимыми признаются, в частности:\n1) показания подозреваемого или обвиняемого, полученные посредством насилия, угроз, принуждения к самооговору либо без разъяснения права не свидетельствовать против себя в ситуации, когда такое разъяснение являлось обязательным;\n2) показания, основанные исключительно на слухе, догадке или предположении, если лицо не может указать источник своей осведомленности;\n3) предметы, документы и сведения, полученные в результате обыска, ограничения тайны сообщений или иной меры, для которой отсутствовало требуемое судебное разрешение, прокурорская санкция либо иное предусмотренное законом основание;\n4) сфальсифицированные материалы или сведения, происхождение которых невозможно достоверно установить вследствие виновного нарушения порядка фиксации.\n3. Нарушение, не повлиявшее на достоверность доказательства и не лишившее участника существенной процессуальной гарантии, оценивается с учетом характера нарушения и всех обстоятельств дела и не всегда влечет автоматическое исключение всего связанного материала.\n4. Окончательный вопрос о допустимости доказательств при судебном рассмотрении разрешается судом."],[2,"ПК гл. VI ст. 3","Процессуальный кодекс РО · Глава VI. Принципы процессуального кодекса","Статья 3. Оценка доказательств.\n1. Ни одно доказательство не имеет заранее установленной силы.\n2. Доказательства оцениваются по относимости, допустимости, достоверности, а их совокупность — по достаточности для соответствующего процессуального решения.\n3. Признание вины подлежит проверке и не освобождает уполномоченный орган от обязанности исследовать иные обстоятельства дела.\n4. Обвиняющие и оправдывающие доказательства подлежат исследованию на равных основаниях."],[2,"ПК гл. VI ст. 4","Процессуальный кодекс РО · Глава VI. Принципы процессуального кодекса","Статья 4. Приоритет специальной нормы.\nЕсли одна норма регулирует общий порядок, а другая прямо устанавливает специальную процедуру для определенного лица, органа, категории дел или процессуального действия, применяется специальная норма. Общая норма применяется в части, не урегулированной специальной, при условии что специальная норма не противоречит Конституции РО и акту большей юридической силы."],[2,"ПК гл. VII ст. 1","Процессуальный кодекс РО · Глава VII. Фото и видео фиксация","Статья 1. Обязательная видеофиксация.\n1. Уполномоченный государственный служащий либо его напарник обязаны обеспечивать непрерывную видеофиксацию в случаях, когда она необходима для последующей проверки законности существенного процессуального действия.\n2. Обязательной видеофиксации подлежат, если техническая возможность не утрачена по объективной причине:\n1) основания задержания и процесс задержания;\n2) помещение лица под административный или уголовный арест;\n3) личный обыск и обыск транспортного средства без согласия лица;\n4) обыск жилища, частной либо режимной территории;\n5) допрос подозреваемого или обвиняемого;\n6) применение физической силы, специальных средств или оружия, если запись могла быть начата или продолжена без создания дополнительной угрозы;\n7) принудительное изъятие лицензии, разрешения, имущества или иного юридически значимого документа;\n8) исполнение постановления прокурора о санкционировании ареста и иных актов, существенно ограничивающих свободу лица;\n9) иные случаи, прямо предусмотренные федеральным законодательством.\n3. Для выполнения обязанности достаточно непрерывной записи одним из участвующих сотрудников, если на ней объективно фиксируется существенный ход действия и личности основных участников.\n4. Прокурор, прибывший для рассмотрения задержания, не обязан вести отдельную собственную запись, если процесс и объявленное прокурором решение фиксируются сотрудником, осуществляющим задержание, либо иным участником производства."],[2,"ПК гл. VII ст. 2","Процессуальный кодекс РО · Глава VII. Фото и видео фиксация","Статья 2. Требования к записи.\n1. Запись должна позволять установить существенные обстоятельства, на которых основывалось действие сотрудника, разъяснение прав, примененные меры, представленные доказательства и итоговое процессуальное решение.\n2. Умышленное отключение, монтаж, подмена, уничтожение либо сокрытие обязательной части записи запрещаются.\n3. Кратковременный технический сбой сам по себе не делает все действие незаконным, если сотрудник способен подтвердить объективную причину сбоя и иными допустимыми доказательствами подтвердить обстоятельства производства."],[2,"ПК гл. VII ст. 3","Процессуальный кодекс РО · Глава VII. Фото и видео фиксация","Статья 3. Срок хранения видеофиксации.\n1. Обязательная видеозапись хранится не менее 48 часов с момента окончания соответствующего действия.\n2. Течение минимального срока не влечет уничтожение записи, если до его истечения либо до фактического удаления записи:\n1) подана жалоба на действия сотрудника;\n2) возбуждено уголовное, административное или дисциплинарное производство;\n3) подано исковое заявление или иное обращение в суд;\n4) поступил законный запрос прокуратуры, суда, следственного органа или иного компетентного органа;\n5) запись приобщена к материалам дела.\n3. В указанных случаях запись сохраняется до окончания соответствующего производства и истечения срока ее законного истребования."],[2,"ПК гл. VII ст. 4","Процессуальный кодекс РО · Глава VII. Фото и видео фиксация","Статья 4. Истребование и предоставление записи.\n1. Суд, прокуратура, Следственный комитет и иной компетентный орган вправе истребовать запись в связи с находящимся в их производстве делом, проверкой или жалобой.\n2. Адвокат вправе требовать предоставления либо ознакомления с записью в объеме, необходимом для защиты доверителя, после возникновения соответствующего процессуального производства и с учетом государственной, следственной и иной охраняемой законом тайны.\n3. Руководитель государственного органа, получивший законный запрос о записи конкретного сотрудника, обязан обеспечить его передачу или сообщить мотивированную законную причину невозможности предоставления.\n4. Отказ в предоставлении записи может быть обжалован прокурору или в суд."],[2,"ПК гл. VII ст. 5","Процессуальный кодекс РО · Глава VII. Фото и видео фиксация","Статья 5. Последствия отсутствия обязательной записи.\n1. Необоснованное отсутствие обязательной записи учитывается при оценке доказательств и законности действий сотрудника.\n2. Если запись должна была существовать, но сотрудник без законной причины не сохранил или не предоставил ее, бремя объяснения обстоятельств утраты лежит на соответствующем государственном органе или сотруднике.\n3. Умышленное сокрытие или уничтожение записи может повлечь дисциплинарную, административную или уголовную ответственность."],[2,"ПК гл. VIII ст. 1","Процессуальный кодекс РО · Глава VIII. Охрана прав и свобод гражданина","Статья 1. Обязанность разъяснения прав.\nСуд, прокурор, следователь и сотрудники правоохранительных органов обязаны разъяснять подозреваемому, обвиняемому, потерпевшему и иным участникам производства принадлежащие им права, обязанности и ответственность в объеме, необходимом для соответствующей процессуальной стадии, и обеспечивать реальную возможность пользоваться предоставленными законом правами."],[2,"ПК гл. VIII ст. 2","Процессуальный кодекс РО · Глава VIII. Охрана прав и свобод гражданина","Статья 2. Защита участников производства.\nПри наличии достаточных данных о реальной угрозе убийством, насилием, похищением, уничтожением имущества либо иным опасным воздействием в отношении потерпевшего, свидетеля, сотрудничающего лица или их близких компетентные государственные органы обязаны принять доступные и предусмотренные законом меры безопасности."],[2,"ПК гл. VIII ст. 3","Процессуальный кодекс РО · Глава VIII. Охрана прав и свобод гражданина","Статья 3. Немедленное прекращение незаконного ограничения свободы.\nСуд, прокурор, следователь или сотрудник правоохранительного органа, установивший в пределах своей компетенции отсутствие законного основания для дальнейшего удержания лица, обязан принять меры к его немедленному освобождению, если отсутствует другое самостоятельное законное основание ограничения свободы."],[2,"ПК гл. VIII ст. 4","Процессуальный кодекс РО · Глава VIII. Охрана прав и свобод гражданина","Статья 4. Безопасность задержанного и содержащегося под арестом лица.\n1. Задержанное или содержащееся под арестом лицо должно находиться в условиях, исключающих неоправданную угрозу его жизни и здоровью.\n2. Государственные служащие обязаны обеспечить доступ к необходимой медицинской помощи и не вправе использовать ограничение свободы как основание для отказа в экстренной помощи.\n3. Если лицо находится в состоянии, требующем экстренной или стационарной медицинской помощи, помещение под арест или иное действие, несовместимое с оказанием такой помощи, откладывается до момента, когда оно станет медицински допустимым. При необходимости может быть обеспечена охрана лица."],[2,"ПК гл. VIII ст. 5","Процессуальный кодекс РО · Глава VIII. Охрана прав и свобод гражданина","Статья 5. Тайна переписки и сообщений.\nОграничение тайны переписки, телефонных переговоров, электронных сообщений и иных защищенных законом коммуникаций допускается на основании судебного решения либо в другом прямо предусмотренном федеральным законом случае с последующим контролем законности, если такой контроль установлен законом."],[2,"ПК гл. VIII ст. 6","Процессуальный кодекс РО · Глава VIII. Охрана прав и свобод гражданина","Статья 6. Запрет необоснованного затягивания.\n1. Процессуальные действия совершаются без необоснованного промедления.\n2. Запрещается намеренно увеличивать время задержания путем выбора заведомо избыточного маршрута доставки, необоснованного ожидания, последовательной обработки нескольких задержанных одним сотрудником при наличии возможности передать их другим сотрудникам либо иного действия, не имеющего разумной процессуальной цели.\n3. Время, прямо отведенное настоящим Кодексом для адвоката, прокурора, допроса или другого предусмотренного законом действия, не считается необоснованным затягиванием."],[2,"ПК гл. IX ст. 1","Процессуальный кодекс РО · Глава IX. Право на обжалование действий сотрудников правоохранительных органов и предъявленные обвинения","Статья 1. Срок и формы обжалования.\n1. Действие, бездействие или решение сотрудника правоохранительного органа, следователя либо иного должностного лица, затрагивающее права гражданина, может быть обжаловано в прокуратуру, вышестоящему должностному лицу или в суд в пределах их компетенции.\n2. Жалоба на задержание, арест, штраф, обыск, изъятие либо иное оконченное процессуальное действие подается в течение 48 часов с момента, когда лицо узнало или должно было узнать о соответствующем действии или решении, если федеральным законом не установлен иной срок.\n3. Продолжающееся ограничение права может быть обжаловано в течение всего периода его действия.\n4. Пропущенный по уважительной причине срок может быть восстановлен компетентным органом или судом."],[2,"ПК гл. IX ст. 2","Процессуальный кодекс РО · Глава IX. Право на обжалование действий сотрудников правоохранительных органов и предъявленные обвинения","Статья 2. Обжалование в прокуратуру.\n1. Прокуратура проверяет изложенные в жалобе обстоятельства, истребует необходимые материалы и оценивает законность действий или решений в пределах полномочий, установленных Федеральным законом «О прокуратуре РО».\n2. По результатам проверки прокурор вправе отменить или потребовать прекращения незаконного ограничения в пределах своей компетенции, внести акт прокурорского реагирования, направить материал по подследственности, инициировать производство, обратиться в суд либо принять иное предусмотренное законом решение.\n3. Если обжалуется действие Следственного комитета, прокурорский контроль ограничивается проверкой законности и не означает административного руководства расследованием."],[2,"ПК гл. IX ст. 3","Процессуальный кодекс РО · Глава IX. Право на обжалование действий сотрудников правоохранительных органов и предъявленные обвинения","Статья 3. Обжалование в суд.\n1. Гражданин, адвокат или иное лицо, чьи права непосредственно затронуты, вправе обратиться в компетентный суд с жалобой на действие, бездействие или процессуальное решение государственного органа либо должностного лица.\n2. Государственный орган или должностное лицо обязаны представить суду материалы, на которых основывалось оспариваемое ограничение права, в объеме, необходимом для судебной проверки.\n3. Если в жалобе или приложенных материалах содержатся сведения о возможном преступлении или административном правонарушении, суд вправе направить копии соответствующих материалов компетентному государственному органу для проведения проверки. Такая передача сама по себе не прекращает судебное рассмотрение жалобы, если иное не установлено законом.\n4. Суд вправе признать действие или решение незаконным, отменить индивидуальный акт, обязать прекратить ограничение, вернуть имущество, восстановить право и применить иные способы защиты, предусмотренные законодательством."],[2,"ПК гл. IX ст. 4","Процессуальный кодекс РО · Глава IX. Право на обжалование действий сотрудников правоохранительных органов и предъявленные обвинения","Статья 4. Обжалование прокурорских решений.\n1. Решение прокурора при рассмотрении задержания может быть обжаловано вышестоящему прокурору либо в суд.\n2. Постановление прокурора о санкционировании ареста обжалуется в порядке статьи 3.3 главы IV настоящего Кодекса.\n3. Решение Генерального прокурора, для которого не существует вышестоящего прокурора, обжалуется в суд.\n4. Подача жалобы не приостанавливает исполнение обжалуемого решения, если вышестоящий прокурор или суд не примет решение о приостановлении."],[2,"ПК гл. IX ст. 5","Процессуальный кодекс РО · Глава IX. Право на обжалование действий сотрудников правоохранительных органов и предъявленные обвинения","Статья 5. Обжалование решений следственного органа.\n1. Постановление, действие или бездействие следователя может быть обжаловано руководителю следственного подразделения, вышестоящему руководителю следственного органа, прокурору в части законности либо в суд.\n2. Жалоба на следственное решение не предоставляет прокурору права самостоятельно определять следственную версию или заменять следователя при производстве расследования.\n3. Вступивший в силу судебный акт об отмене незаконной меры или иного процессуального решения обязателен для следственного органа."],[2,"ПК гл. IX ст. 6","Процессуальный кодекс РО · Глава IX. Право на обжалование действий сотрудников правоохранительных органов и предъявленные обвинения","Статья 6. Последствия признания действия незаконным.\n1. Незаконно задержанное или удерживаемое лицо подлежит немедленному освобождению, если отсутствует другое самостоятельное законное основание ограничения свободы.\n2. Незаконно изъятое имущество подлежит возврату, если оно не удерживается на другом законном основании.\n3. Признание действия незаконным не препятствует новому законному действию при появлении самостоятельного основания, если такое действие не нарушает запрет повторного привлечения к ответственности и иные установленные законом гарантии."],[2,"ПК гл. X ст. 1","Процессуальный кодекс РО · Глава X. Досудебное соглашение о сотрудничестве (сделка со следствием)","Статья 1. Понятие и назначение досудебного соглашения о сотрудничестве.\n1. Досудебное соглашение о сотрудничестве, также именуемое сделкой со следствием, представляет собой добровольное соглашение подозреваемого или обвиняемого с государством, по которому лицо обязуется оказать существенное содействие раскрытию, расследованию или пресечению преступлений, а государство учитывает надлежащее исполнение соглашения при разрешении вопроса об ответственности в пределах, установленных Уголовным кодексом РО и настоящим Кодексом.\n2. Соглашение не может заключаться посредством угроз, насилия, обмана относительно процессуальных прав либо обещания меры, которую должностное лицо заведомо не вправе предоставить."],[2,"ПК гл. X ст. 2","Процессуальный кодекс РО · Глава X. Досудебное соглашение о сотрудничестве (сделка со следствием)","Статья 2. Предложение заключить соглашение.\n1. Предложить обсуждение соглашения вправе следователь, прокурор либо сотрудник правоохранительного органа, осуществляющий законное задержание, если имеются основания полагать, что лицо располагает существенными сведениями о преступной деятельности других лиц, организованной группе, преступном сообществе, местонахождении разыскиваемых лиц, оружия, имущества или иных значимых обстоятельствах.\n2. Подозреваемый или обвиняемый вправе самостоятельно ходатайствовать о заключении соглашения.\n3. До принятия решения лицу должна быть предоставлена возможность воспользоваться помощью адвоката. Отказ от адвоката допускается в порядке, установленном настоящим Кодексом."],[2,"ПК гл. X ст. 3","Процессуальный кодекс РО · Глава X. Досудебное соглашение о сотрудничестве (сделка со следствием)","Статья 3. Содержание соглашения.\n1. В соглашении определяются:\n1) известная на момент заключения правовая квалификация деяния лица;\n2) конкретные действия, которые лицо обязуется совершить;\n3) сведения или категории сведений, которые предполагается получить;\n4) обязанность лица давать правдивые показания и не скрывать существенные обстоятельства;\n5) возможные правовые последствия надлежащего исполнения соглашения в пределах, предусмотренных законом;\n6) последствия заведомо ложных сведений или существенного неисполнения обязательств.\n2. Содействие может включать сведения о составе и структуре преступной группы, ее участниках, месте нахождения, способах совершения преступлений, имуществе, оружии, каналах связи, юридических лицах, используемых для прикрытия, и иных обстоятельствах, имеющих значение для раскрытия или пресечения преступлений.\n3. Соглашение не может обязывать лицо оговорить заведомо невиновного человека или подтвердить обстоятельство, которое ему фактически неизвестно."],[2,"ПК гл. X ст. 4","Процессуальный кодекс РО · Глава X. Досудебное соглашение о сотрудничестве (сделка со следствием)","Статья 4. Заключение и утверждение соглашения.\n1. Предварительное согласие лица на сотрудничество может быть выражено устно и зафиксировано на видеозаписи либо в материалах производства.\n2. Для возникновения обязанности государства применить специальные последствия сотрудничества соглашение подлежит утверждению прокурором, если федеральным законодательством не установлен иной порядок.\n3. Прокурор перед утверждением проверяет добровольность соглашения, достаточность разъяснения прав, законность обещанных последствий и реальную возможность получения существенного содействия.\n4. Отказ прокурора утвердить соглашение должен быть мотивирован и может быть обжалован вышестоящему прокурору."],[2,"ПК гл. X ст. 5","Процессуальный кодекс РО · Глава X. Досудебное соглашение о сотрудничестве (сделка со следствием)","Статья 5. Исполнение соглашения.\n1. Лицо считается надлежащим образом исполняющим соглашение, если оно добросовестно совершает предусмотренные им действия и сообщает известные ему существенные сведения.\n2. Исполнение соглашения может осуществляться посредством официального допроса, указания местонахождения объектов, участия в опознании, проверке показаний, контролируемом мероприятии или ином законном процессуальном действии.\n3. Полученная информация подлежит самостоятельной проверке. Само соглашение не освобождает органы расследования от обязанности собирать и проверять иные доказательства."],[2,"ПК гл. X ст. 6","Процессуальный кодекс РО · Глава X. Досудебное соглашение о сотрудничестве (сделка со следствием)","Статья 6. Правовые последствия исполнения соглашения.\n1. Надлежащее исполнение соглашения учитывается при квалификации, выборе вида и размера наказания, возможности освобождения от отдельных мер либо ином разрешении уголовного материала только в пределах, прямо допускаемых Уголовным кодексом.\n2. Должностное лицо не вправе обещать полное освобождение от ответственности, если такое последствие не предусмотрено законом.\n3. Факт сотрудничества может учитываться прокурором или судом как предусмотренное законом смягчающее либо иное юридически значимое обстоятельство."],[2,"ПК гл. X ст. 7","Процессуальный кодекс РО · Глава X. Досудебное соглашение о сотрудничестве (сделка со следствием)","Статья 7. Неисполнение соглашения.\n1. При существенном и виновном неисполнении соглашения, предоставлении заведомо ложных сведений либо умышленном сокрытии согласованных существенных обстоятельств специальные преимущества соглашения могут быть отменены в установленном законом порядке.\n2. Неисполнение соглашения не означает автоматического помещения лица под арест. Вопрос о задержании, аресте и иных мерах разрешается на общих законных основаниях.\n3. Признание, сделанное исключительно для обсуждения неутвержденного соглашения, оценивается по общим правилам допустимости доказательств и не может использоваться в обход права на защиту и запрета принуждения к самооговору."],[2,"ПК гл. X ст. 8","Процессуальный кодекс РО · Глава X. Досудебное соглашение о сотрудничестве (сделка со следствием)","Статья 8. Конфиденциальность и безопасность сотрудничающего лица.\n1. Сведения о факте и содержании сотрудничества относятся к охраняемой законом тайне в объеме, необходимом для безопасности лица и интересов расследования.\n2. При наличии реальной угрозы сотрудничающему лицу или его близким могут применяться меры государственной защиты.\n3. Разглашение сведений допускается только в случаях и объеме, предусмотренных федеральным законодательством."],[2,"ПК гл. XI ст. 1","Процессуальный кодекс РО · Глава XI. Устные требования и порядок применения силы","Статья 1. Законодательство об устных законных требованиях и применении силы.\n\n1. Настоящая глава устанавливает основополагающие положения об устных требованиях государственных служащих и применении ими силы, обязательна к соблюдению всеми государственными служащими.\n2. Нормы иных актов применяются постольку, поскольку они не противоречат настоящей главе и не уменьшают установленные ею гарантии граждан, если акт большей юридической силы прямо не устанавливает специальное регулирование.\n3. Если федеральным законом установлены дополнительные права и гарантии граждан при применении силы или предъявлении обязательных требований, настоящая глава применяется с учетом таких дополнительных гарантий.\n4. Положения настоящей главы применяются с учетом Конституции РО и федерального законодательства. Подзаконный или внутренний акт не может уменьшать установленные настоящей главой гарантии граждан.\n5. Письменные требования, приказы, распоряжения, указания и решения суда, прокуратуры, органов предварительного расследования и иных государственных органов регулируются профильным законодательством и настоящей главой в части, не урегулированной специальной нормой."],[2,"ПК гл. XI ст. 2","Процессуальный кодекс РО · Глава XI. Устные требования и порядок применения силы","Статья 2. Общие положения об устном законном требовании.\n\n1. Государственный служащий, находящийся при исполнении служебных обязанностей, в пределах своей компетенции и в границах установленной юрисдикции вправе заявлять устные законные требования (приказы, распоряжения, указания и т.д.) обязательные для исполнения гражданами и иными государственными служащими. Неисполнение законного требования влечет установленную законом ответственность.\n\n2. Требование должно быть однозначным, конкретным, законным, этичным, исполнимым, сформулированным в повелительном (приказном) наклонении и не допускать в своем содержании признаков предложения, исполнение которого возможно по желанию (добровольно).\n\n3. Государственный сотрудник вправе заявлять требования, направленные на:\n\nпроведение процессуальных действий (требование поднять руки, лечь на землю, бросить предмет, снять элемент одежды, отойти на определенное место или занять определенное положение и т.д.);\nобеспечение установленного законом надзора и контроля (потребовать предъявления документов для ознакомления, материальных объектов для осмотра, транспортных средств для обыска и т.д.);\nпресечение правонарушений и преступлений (требование о прекращении действий содержащих признаки правонарушения или преступления, действий которые несут непосредственную угрозу безопасности иных лиц т.д.);\nобеспечение общественного порядка и предотвращение опасности (требование покинуть место происшествия, отойти и/или от места проведения процессуальных действий, разойтись во время массовых мероприятий и т.д.);\nиные законные цели в пределах компетенции и юрисдикции в соответствии с обстановкой и ситуацией.\n\n4. Государственный служащий не обязан одновременно с каждым кратким требованием излагать его полную юридическую мотивировку, если обязанность немедленного разъяснения основания прямо не предусмотрена законом. При задержании, обыске, ограничении свободы и иных случаях, для которых настоящий Кодекс требует сообщить основание, такое разъяснение обязательно.\n\n5. Государственный служащий обязан сообщать основание и мотивировку своего требования суду, прокурору, руководству и иному уполномоченному лицу при проведении суда, расследования или иной проверки, где затрагиваются обстоятельства заявления государственным служащим соответствующего требования."],[2,"ПК гл. XI ст. 3","Процессуальный кодекс РО · Глава XI. Устные требования и порядок применения силы","Статья 3. Иерархия и порядок исполнения устных требований.\n\n1. В случае если сотрудником (сотрудниками) к одному и тому же лицу одновременно или в чрезмерно короткий промежуток времени заявлено несколько взаимоисключающих друг друга устных законных требований то исполнению подлежит требование заявленное последним.\n\n2. В случае если сотрудником заявлено требование не соответствующее части 2 статьи 2 настоящей главы, то лицо которому адресовано требование обязано сообщить о неясности требования и просить уточнить его, а сотрудник обязан уточнить требование и отметить обязанность его исполнения.\n\n3. Неисполнение некорректно заявленного требования не влечет ответственности.\n\n4. Если требование изначально заявлено корректно, а обязанное лицо формально требует разъяснений и уточнений, то обязанное лицо несет ответственность за неисполнение требования несмотря на запросы о разъяснении."],[2,"ПК гл. XI ст. 4","Процессуальный кодекс РО · Глава XI. Устные требования и порядок применения силы","Статья 4. Общие правила и основания применения силы.\n\n1. Любая применяемая уполномоченным государственным сотрудником сила, включая смертельную, должна быть оправданной и применяться только в случае необходимости. Сотрудники обязаны учитывать возможность применения менее опасных методов.\n\n2. Применяемая сила должна быть соразмерна уровню угрозы, которую представляет задерживаемый. Сотрудник должен учитывать весь контекст инцидента, включая поведение подозреваемого, наличие оружия и возможные альтернативы применению силы.\n\n3. Сотрудники обязаны предпринимать действия, чтобы минимизировать вред, причиняемый всем вовлеченным лицам.\n\n4. Несмертельная сила (силовые приемы, тазеры, дубинки и подобные средства неспособные причинить смерть или тяжкие увечья при разумном применении) применяются для задержания лица, представляющего умеренную угрозу или физическое сопротивление.\n\nПримечание: При задержании лица за нарушение Кодекса РО об административных правонарушениях, в случае намерения сотрудника выписать штраф задержанному, применение несмертельной силы в отношении такого задержанного не будет обоснованным за исключением случаев, когда правонарушитель представляет умеренную угрозу или оказывается физическое сопротивление, а равно как своим поведением показывает намерение уклониться от ответственности или отказывается/игнорирует требование устранить(прекратить) административное правонарушение.\n\nПримечание 2: При наличии достаточных оснований полагать, что лицо совершило деяние, подпадающее под признаки уголовного правонарушения или административного правонарушения для произведения административного ареста, сотрудник вправе применить физическое воздействие (надеть наручники), необходимое для временного ограничения свободы, а также использовать силовые приемы, направленные на преодоление сопротивления, обеспечение задержания и предотвращение дальнейших противоправных действий.\n\n1. Смертельная сила (огнестрельное оружие, транспортное средство, иные орудия и средства, объективно способные причинить смерть или тяжкие увечья задержанному) применяется только в случае непосредственной угрозы жизни сотрудника или других людей.\n2. В случае расследования факта применения силы выяснению подлежит:\n\nпропорциональность действий сотрудника;\nстепень и неминуемость угрозы, созданной задержанным и устраняемой сотрудником;\nналичие вариантов альтернативных действий у сотрудника;\nпредшествующие действия сотрудника;\n\n3. Также оценке подлежат действия сотрудника с позиции восприятия им ситуации на момент инцидента, включая доступное время для принятия решения, стрессовые факторы и потенциальные риски."],[2,"ПК гл. XI ст. 5","Процессуальный кодекс РО · Глава XI. Устные требования и порядок применения силы","Статья 5. Особенности применения смертельной силы.\n\n1. Смертельная сила может быть использована только тогда, когда она необходима для защиты человеческой жизни от непосредственной угрозы смерти или тяжкого вреда здоровью. Действия уполномоченного сотрудника должны быть направлены на прекращение такой угрозы и быть соразмерны ее характеру. Смертельная сила является крайней мерой и допускается, когда с учетом конкретной обстановки менее опасные средства явно недостаточны либо их предварительное применение создало бы недопустимую задержку при отражении непосредственной угрозы.\n\n2. Сотрудники государственных органов обязаны избегать ситуаций, которые могут привести к необходимости применения смертельной силы, когда это возможно. По возможности сотрудник должен использовать менее опасные методы (тазеры, переговоры и т. д.), прежде чем прибегать к смертельной силе.\n\n3. Уполномоченный государственный сотрудник имеет право применять смертельную силу для:\n\nзащиты себя или других лиц от неизбежной угрозы смерти или серьезного телесного повреждения;\nпредотвращения побега подозреваемого, если есть основания полагать, что он представляет непосредственную угрозу для жизни других людей.\n\n4. Совершение предупредительных выстрелов, а равно как выстрелов без намерения поразить конкретную законную цель - запрещено.\n\n5. Использование смертельной силы не может быть оправдано только необходимостью задержания или обезвреживания задерживаемого.\n\n6. В случае бегства задерживаемого лица, смертельная сила может быть использована против убегающего только в случае, если подозреваемый представляет угрозу для жизни или может продолжить совершать преступления или правонарушения, угрожающие жизни и здоровью других людей."],[2,"ПК гл. XI ст. 6 (часть 1)","Процессуальный кодекс РО · Глава XI. Устные требования и порядок применения силы","Статья 6. Остановка транспортного средства, принудительное извлечение лиц из транспортного средства.\n\n1. Уполномоченный государственный сотрудник вправе заявить водителю (пилоту, машинисту и т.д.) требование об остановке (посадке) транспортного средства (автомобиля, мотоцикла, лодки, летательного аппарата, иного транспортного средства), а лицо, управляющее транспортным средством обязано подчиниться требованию об остановке и последующим требованиям.\n\n2. Водитель и пассажиры транспортного средства обязаны подчиняться иным требованиям сотрудника в порядке статьи 2 настоящей главы.\n\n3. Сотрудник вправе заявить требование об остановке транспортного средства в случае:\n\nСовершения водителем деяния обладающего признаками правонарушения или преступления;\nНаличия судебного разрешения, предусмотренного законом процессуального акта или иного достаточного законного основания для обыска транспортного средства;\nНаличия у сотрудника сведений о нахождении в автомобиле лица, подлежащего задержанию по основаниям, установленным настоящим Кодексом;\nНедопустимости в соответствии с законом дальнейшего движения транспортного средства;\nОбеспечения безопасности движения колонн или кортежей государственных транспортных средств;\nНаличия иных оснований предусмотренных настоящим Кодексом и другими законами.\n\n4. Требование об остановке транспортного средства подлежит оглашению посредством мегафона.\n\n5. Транспортное средство подлежит принудительной остановке при неповиновении первому требованию посредством мегафона об остановке в случаях, предусмотренных частью 3 настоящей статьи, при условии, что водитель проигнорировал обязанность остановиться и пропустить транспортное средство правоохранительных органов с включенными специальными световыми сигналами, движущееся в попутном направлении или приблизившееся к останавлиемому транспортному средству.\n\n6. Транспортное средство подлежит принудительной остановке при неповиновении 3 (трем) требованиям посредством мегафона об остановке в случаях, предусмотренных частью 3 настоящей статьи, при условии, что сотрудником требующим остановки посредством мегафона озвучена его принадлежность к конкретному государственному органу, либо использовано стандартное служебное голосовое объявление, однозначно позволяющее определить, что требование исходит от уполномоченного государственного органа.\n\n7. Государственные сотрудники вправе без промедления перейти к принудительной остановке транспортного средства в случае если:\n\nИмеются достаточные основания полагать, что в транспортном средстве находится вооруженное лицо, подозреваемое в совершении тяжкого или особо тяжкое преступления, либо лицо, находящееся в розыске за совершение тяжкого или особо тяжкого преступления.\nТранспортное средство ранее скрылось от погони;\nЛицо управляет транспортным средством настолько опасным образом, что создает смертельную угрозу иным участникам дорожного движения;\nПроезд транспортного средства на закрытую и охраняемую территорию;\nПроезд транспортного средства на блокированную территорию;\nПроезд транспортного средства за оцепление.\n\n8. В случае погони государственному сотруднику следует периодически озвучивать посредством мегафона требование об остановке транспортного средства, а также предпринимать все допустимые меры для минимизации вреда, который может наступить в результате погони и применения силы.\n\n9. Для принудительной остановки транспортного средства сотрудник вправе использовать соразмерные средства и методы, необходимые в конкретной обстановке, с учетом требований настоящей главы. Применение каждого средства должно соответствовать самостоятельным основаниям его использования, в том числе:\n\nогнестрельное оружие;\nспециальные средства (тазер);\nслужебные и специальные транспортные средства для тарана и блокирования.\n"],[2,"ПК гл. XI ст. 6 (часть 2)","Процессуальный кодекс РО · Глава XI. Устные требования и порядок применения силы","10. В случае неповиновения лица, находящегося в транспортном средстве, законному требованию о выходе сотрудник вправе применить необходимую и соразмерную физическую силу или специальное средство для извлечения лица, если добровольное исполнение требования не последовало и дальнейшее ожидание создает риск побега, сопротивления или иной существенной опасности. Сам по себе отказ выйти из транспортного средства не является основанием для применения смертельной силы.\n\n11. Вопрос о возмещении вреда, причиненного при преследовании или принудительной остановке транспортного средства, разрешается по общим правилам законодательства с учетом законности действий участников, причинной связи и степени их вины.\n\n12. Законность применения силы при извлечении лица из транспортного средства и вопрос об ответственности за причиненный вред оцениваются отдельно исходя из необходимости, соразмерности, причинной связи и иных обстоятельств конкретного случая."],[2,"ПК гл. XII ст. 1","Процессуальный кодекс РО · Глава XII. Непрерывность процессуальных действий","Статья 1. Защита процессуальных действий сотрудника при задержании.\n\n1. Сотрудник, законно осуществляющий задержание должностного лица, не может быть произвольно задержан другим сотрудником только в связи с несогласием с проводимыми им процессуальными действиями до их фактического завершения. Это правило не препятствует немедленному пресечению самостоятельного очевидного преступления, пытки, незаконного насилия либо иного деяния, создающего непосредственную угрозу жизни или здоровью.\n\n2. Если сотрудник, осуществляющий законное задержание должностного лица, был ограничен в свободе другим сотрудником исключительно с целью сорвать или прекратить законное процессуальное действие без самостоятельного основания, такое вмешательство подлежит прекращению, а первоначальное задержание может быть продолжено. Наличие самостоятельного законного основания для задержания самого сотрудника разрешается отдельно с учетом необходимости обеспечить непрерывность первоначального производства.\n\n3. Сотрудник, допустивший неправомерное вмешательство в задержание, несет ответственность в соответствии с законом за срыв процессуальных действий и возможное воспрепятствование правосудию.\n\n4. Запрещается создание искусственных процессуальных действий с целью уклонения от ответственности, воспрепятствования расследованию или прикрытия незаконных действий. Если сотрудник, осуществляющий задержание, или сразу после его завершения умышленно инициирует новые процессуальные действия в отношении другого лица с целью избежать ответственности на месте за ранее совершенное нарушение, такие действия подлежат немедленному прекращению. Прокуратура, вышестоящее руководство или иные уполномоченные органы вправе вмешаться в пределах своей компетенции для пресечения злоупотреблений и восстановления законного хода производства. Сотрудники, совершившие такие действия, несут ответственность за воспрепятствование осуществлению правосудия в соответствии с законодательством."],[2,"ПК гл. XIII ст. 1","Процессуальный кодекс РО · Глава XIII. Заключительные положения","Статья 1. Соотношение настоящего Кодекса со специальным законодательством.\n1. Настоящий Кодекс устанавливает общие правила процессуальной деятельности государственных органов, задержания, ареста, обыска, допроса, доказывания, обжалования и применения силы.\n2. Специальные полномочия прокуратуры, Следственного комитета, Федеральной службы безопасности, органов внутренних дел, судов и иных государственных органов определяются также регулирующими их деятельность федеральными законами.\n3. Если специальный федеральный закон устанавливает дополнительную процессуальную гарантию, она применяется наряду с настоящим Кодексом. Внутренний или подзаконный акт не вправе уменьшать гарантии, установленные Конституцией и федеральным законодательством."],[2,"ПК гл. XIII ст. 2","Процессуальный кодекс РО · Глава XIII. Заключительные положения","Статья 2. Процессуальные сроки.\n1. Срок, исчисляемый минутами или часами, начинает течь с момента наступления события, с которым настоящий Кодекс связывает начало срока.\n2. Приостановление срока допускается только в прямо предусмотренных настоящим Кодексом случаях.\n3. Должностное лицо обязано по возможности фиксировать момент начала, приостановления, возобновления и окончания процессуального срока, если от него зависит законность дальнейшего ограничения прав лица."],[3,"ТК ст. 1","Трудовой кодекс РО · Глава I. ОСНОВЫ ТРУДОВОГО ЗАКОНОДАТЕЛЬСТВА","Статья 1. Цели трудового законодательства\n\n1. Целями трудового законодательства являются обеспечение свободы труда, установление государственных гарантий трудовых прав, создание справедливых и безопасных условий труда, защита законных интересов работников и работодателей.\n2. Трудовое законодательство должно обеспечивать разумный баланс интересов работника, работодателя и государства."],[3,"ТК ст. 2","Трудовой кодекс РО · Глава I. ОСНОВЫ ТРУДОВОГО ЗАКОНОДАТЕЛЬСТВА","Статья 2. Основные принципы регулирования труда\n\nОсновными принципами регулирования трудовых отношений являются:\n1) свобода труда и свобода выбора рода деятельности;\n2) запрещение принудительного труда;\n3) запрещение дискриминации в сфере труда;\n4) равенство работников перед законом;\n5) право на своевременную и полную оплату труда;\n6) право на отдых и безопасные условия труда;\n7) обязательность исполнения законного трудового договора;\n8) недопустимость произвольного увольнения в обычных трудовых отношениях с учетом специальных кадровых полномочий, установленных федеральным законодательством;\n9) право на защиту трудовых прав и разрешение трудового спора;\n10) сочетание государственного и договорного регулирования труда."],[3,"ТК ст. 3","Трудовой кодекс РО · Глава I. ОСНОВЫ ТРУДОВОГО ЗАКОНОДАТЕЛЬСТВА","Статья 3. Сфера действия настоящего Кодекса\n\n1. Настоящий Кодекс применяется к трудовым отношениям на территории РО независимо от формы собственности работодателя.\n2. Настоящий Кодекс применяется к государственным служащим в части, не урегулированной Федеральным законом «О государственной службе РО», профильными федеральными законами и законодательством о специальном статусе соответствующего должностного лица.\n3. При противоречии общей нормы настоящего Кодекса специальной норме федерального закона, регулирующей государственную, военную, правоохранительную или иную специальную службу, применяется специальная норма.\n4. Положения настоящего Кодекса о приеме на работу, переводе, дисциплинарной ответственности, основаниях увольнения и восстановлении на работе не ограничивают специальные кадровые полномочия Премьер-министра РО, Вице Премьер-министра РО, федеральных министров и иных должностных лиц, которым федеральным законодательством предоставлено право свободного назначения на государственную должность и освобождения от нее.\n5. Назначение на государственную должность и освобождение от государственной должности актом Премьер-министра РО, Вице Премьер-министра РО либо иного уполномоченного федеральным законодательством должностного лица не признается обычным приемом на работу или увольнением по инициативе работодателя, если соответствующая должность замещается в специальном порядке."],[3,"ТК ст. 4","Трудовой кодекс РО · Глава I. ОСНОВЫ ТРУДОВОГО ЗАКОНОДАТЕЛЬСТВА","Статья 4. Источники трудового права\n\n1. Трудовые отношения регулируются Конституцией РО, настоящим Кодексом, федеральными законами, нормативными актами Премьер-министра и Правительства РО, принятыми в пределах их компетенции, а также законными локальными актами работодателя и трудовыми договорами.\n2. Локальный акт работодателя не может ухудшать положение работника по сравнению с настоящим Кодексом и актами большей юридической силы.\n3. Условие трудового договора, уменьшающее установленные законом гарантии работника, применению не подлежит в соответствующей части."],[3,"ТК ст. 5","Трудовой кодекс РО · Глава I. ОСНОВЫ ТРУДОВОГО ЗАКОНОДАТЕЛЬСТВА","Статья 5. Запрещение дискриминации в сфере труда\n\n1. Каждый имеет равные возможности для реализации трудовых прав.\n2. Запрещается необоснованно ограничивать трудовые права или предоставлять преимущества по признакам пола, расы, национальности, происхождения, убеждений, имущественного или должностного положения и иным обстоятельствам, не связанным с деловыми качествами лица или законными требованиями к соответствующей работе.\n3. Не является дискриминацией установление требований, объективно обусловленных характером работы, состоянием здоровья, необходимой квалификацией, допуском к охраняемой законом тайне, требованиями государственной безопасности или специальным статусом должности.\n4. Лицо, считающее себя подвергнутым дискриминации, вправе обратиться к работодателю, в прокуратуру или в суд."],[3,"ТК ст. 6","Трудовой кодекс РО · Глава I. ОСНОВЫ ТРУДОВОГО ЗАКОНОДАТЕЛЬСТВА","Статья 6. Запрещение принудительного труда\n\n1. Принудительным трудом признается выполнение работы под угрозой незаконного наказания, насилия, удержания имущества или иного неправомерного воздействия.\n2. Не является принудительным трудом работа, обязанность выполнения которой прямо предусмотрена федеральным законом в условиях чрезвычайного или военного положения, при устранении непосредственной угрозы жизни и безопасности населения, при исполнении вступившего в силу судебного акта либо в иных прямо установленных законом случаях.\n3. Законная дисциплинарная обязанность военнослужащего или сотрудника специальной службы, установленная федеральным законом, не является принудительным трудом."],[3,"ТК ст. 7","Трудовой кодекс РО · Глава I. ОСНОВЫ ТРУДОВОГО ЗАКОНОДАТЕЛЬСТВА","Статья 7. Локальные акты работодателя\n\n1. Работодатель вправе принимать правила внутреннего трудового распорядка, должностные инструкции, положения об отделах, правила премирования и иные локальные акты.\n2. Работник должен иметь разумную возможность ознакомиться с локальными актами, непосредственно относящимися к его работе.\n3. Локальный акт не может предоставлять работодателю публичные полномочия, которыми он не наделен федеральным законодательством.\n4. При выявлении противоречия локального акта закону применяется закон, а противоречащая норма локального акта не подлежит применению."],[3,"ТК ст. 8","Трудовой кодекс РО · Глава I. ОСНОВЫ ТРУДОВОГО ЗАКОНОДАТЕЛЬСТВА","Статья 8. Исчисление сроков\n\n1. Срок, определенный днями, неделями или месяцами, исчисляется в календарном времени, если настоящим Кодексом прямо не установлено иное.\n2. Если последний день срока приходится на период, когда выполнение необходимого действия объективно невозможно вследствие режима работы организации, срок переносится на ближайший рабочий период.\n3. Специальный федеральный закон может устанавливать иной порядок исчисления сроков для государственной или военной службы."],[3,"ТК ст. 9","Трудовой кодекс РО · Глава I. ОСНОВЫ ТРУДОВОГО ЗАКОНОДАТЕЛЬСТВА","Статья 9. Государственная политика и надзор в сфере труда\n\n1. Правительство РО обеспечивает проведение государственной политики в сфере труда и общую организацию государственного контроля за соблюдением трудового законодательства.\n2. Прокуратура РО осуществляет надзор за исполнением трудового законодательства в формах, предусмотренных федеральным законодательством.\n3. Суд осуществляет защиту трудовых прав и разрешает трудовые споры в пределах своей компетенции.\n4. Государственный контроль не может использоваться для произвольного вмешательства в законную хозяйственную деятельность работодателя."],[3,"ТК ст. 10","Трудовой кодекс РО · Глава II. СТОРОНЫ ТРУДОВЫХ ОТНОШЕНИЙ","Статья 10. Понятие трудовых отношений\n\nТрудовыми отношениями являются отношения, основанные на личном выполнении работником за вознаграждение определенной трудовой функции в интересах, под управлением или контролем работодателя при обеспечении работодателем предусмотренных законом условий труда."],[3,"ТК ст. 11","Трудовой кодекс РО · Глава II. СТОРОНЫ ТРУДОВЫХ ОТНОШЕНИЙ","Статья 11. Работник и работодатель\n\n1. Работником является физическое лицо, вступившее в трудовые отношения с работодателем.\n2. Работодателем является физическое лицо, юридическое лицо, государственный орган, государственная организация либо иной субъект, которому законом предоставлено право принимать работников.\n3. От имени работодателя права и обязанности осуществляет руководитель либо иное уполномоченное им или законом должностное лицо.\n4. Непосредственный руководитель работника обладает полномочиями работодателя только в пределах предоставленной ему кадровой и дисциплинарной компетенции."],[3,"ТК ст. 12","Трудовой кодекс РО · Глава II. СТОРОНЫ ТРУДОВЫХ ОТНОШЕНИЙ","Статья 12. Основные права работника\n\nРаботник имеет право:\n1) на заключение, изменение и прекращение трудового договора в установленном законом порядке;\n2) на предоставление обусловленной работы;\n3) на своевременную и полную оплату труда;\n4) на безопасные условия труда;\n5) на отдых в соответствии с настоящим Кодексом и локальными актами;\n6) на получение необходимой для работы информации и средств;\n7) на уважение чести и достоинства;\n8) на отказ от явно незаконного требования работодателя;\n9) на обжалование незаконного взыскания, отстранения, перевода или увольнения;\n10) на защиту трудовых прав всеми не запрещенными законом способами."],[3,"ТК ст. 13","Трудовой кодекс РО · Глава II. СТОРОНЫ ТРУДОВЫХ ОТНОШЕНИЙ","Статья 13. Основные обязанности работника\n\nРаботник обязан:\n1) добросовестно исполнять трудовые обязанности;\n2) соблюдать законные правила внутреннего трудового распорядка;\n3) соблюдать требования безопасности и охраны труда;\n4) бережно относиться к имуществу работодателя и иных работников;\n5) исполнять законные распоряжения уполномоченного руководителя;\n6) незамедлительно сообщать о ситуации,
